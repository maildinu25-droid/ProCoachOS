const legacyBowlingSkills=["Run-up / Approach","Action & Alignment","Accuracy","Length Control","Consistency","Pace / Revolutions","Swing / Seam / Spin","Variations","Tactical Awareness","Execution Under Pressure"];
let bulkAssessmentDraft={team:"",discipline:null,format:"General",ratings:{},active:"",include:{},order:[]};
function openBulkAssessment(){
 if(!activePlayers().length){alert("Add a player first.");return}
 bulkAssessmentDraft={team:"",discipline:null,format:"General",ratings:{},active:"",include:{},order:[]};
 modal(`<div class="sheetHead"><h2>Bulk Assess Squad</h2><button class="x" onclick="closeM()">×</button></div>
 <p class="muted">Optionally narrow to one team, then pick a skill area (and format focus, if relevant) to rate in one pass. Each player's last rating for this area is pre-filled — adjust rather than start from scratch.</p>
 <label>Team<select onchange="selectBulkTeam(this.value)"><option value="">All Players</option>${db.teams.map(t=>`<option value="${esc(t.name)}">${esc(t.name)}</option>`).join("")}</select></label>
 <div class="skillPick" style="margin-top:12px">${Object.keys(skillSets).map(d=>`<label><input type="radio" name="bulkDiscipline" value="${d}" onchange="selectBulkDiscipline('${d}')"> ${d}</label>`).join("")}</div>
 <div id="bulkFormatPick"></div>
 <div id="bulkAssessmentBody"></div>`);
}
// Which roles are assessed for each skill area by default. Fielding is everyone; players with no role are never auto-ticked (except Fielding).
const BULK_ROLE_FIT={Batting:["Batter","All-rounder","Wicketkeeper","Wicketkeeper-Batter"],Bowling:["Bowler","All-rounder"],Wicketkeeping:["Wicketkeeper","Wicketkeeper-Batter"]};
function bulkRoleFits(d,role){if(d==="Fielding")return true;return !!role&&(BULK_ROLE_FIT[d]||[]).includes(role)}
function bulkSelKey(){return (bulkAssessmentDraft.team||"all")+"|"+bulkAssessmentDraft.discipline}
// Decide who is ticked: last saved choice for this team + area if there is one (new players fall back to role), else by role.
function bulkInitInclude(){
 let d=bulkAssessmentDraft.discipline;if(!d)return;
 let players=bulkPlayers(),mem=(db.settings&&db.settings.bulkSel&&db.settings.bulkSel[bulkSelKey()])||null;
 bulkAssessmentDraft.include={};
 players.forEach(p=>{
  let known=mem&&(mem.on.includes(p.name)||mem.off.includes(p.name));
  bulkAssessmentDraft.include[p.name]=known?mem.on.includes(p.name):bulkRoleFits(d,p.role);
 });
 // Ticked players first, then the rest (dimmed). Order is fixed from here so rows don't jump while ticking.
 bulkAssessmentDraft.order=players.map(p=>p.name).sort((a,b)=>(bulkAssessmentDraft.include[b]?1:0)-(bulkAssessmentDraft.include[a]?1:0));
}
function bulkOrdered(){
 let ps=bulkPlayers(),by={};ps.forEach(p=>by[p.name]=p);
 let names=(bulkAssessmentDraft.order||[]).filter(n=>by[n]);ps.forEach(p=>{if(!names.includes(p.name))names.push(p.name)});
 return names.map(n=>by[n]);
}
function bulkIncluded(){return bulkOrdered().filter(p=>bulkAssessmentDraft.include[p.name])}
function bulkPlayers(){return activePlayers().filter(p=>!isReleased(p)).filter(p=>!bulkAssessmentDraft.team||p.team===bulkAssessmentDraft.team)}
// Full (positional) skill list + which positions are visible. Ratings are stored by position,
// so archived skills must keep their slot (saved as 0 = not assessed) or later skills would shift.
function bulkFullList(){
 let d=bulkAssessmentDraft.discipline,f=bulkAssessmentDraft.format;if(!d)return {names:[],vis:[]};
 let fmt=f&&f!=="General"&&FORMAT_SKILLS[d]&&FORMAT_SKILLS[d][f];
 let names=fmt?allFormatSkillsFor(d,f):allSkillsFor(d);
 let vis=names.map((s,i)=>i).filter(i=>fmt?!isFormatSkillArchived(d,f,names[i]):!isSkillArchived(d,names[i]));
 return {names,vis};
}
function bulkSkillsList(){
 let d=bulkAssessmentDraft.discipline,f=bulkAssessmentDraft.format;
 if(!d)return [];
 if(f&&f!=="General"&&FORMAT_SKILLS[d]&&FORMAT_SKILLS[d][f])return allFormatSkillsFor(d,f).filter(s=>!isFormatSkillArchived(d,f,s));
 return allSkillsFor(d).filter(s=>!isSkillArchived(d,s));
}
function bulkCarryForwardFor(playerName,discipline,format){
 if(format&&format!=="General"&&FORMAT_SKILLS[discipline]&&FORMAT_SKILLS[discipline][format]){
  let prior=db.assessments.filter(a=>a.player===playerName&&a.formatRatings&&a.formatRatings[discipline]&&a.formatRatings[discipline][format]).sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")))[0];
  return prior?prior.formatRatings[discipline][format]:null;
 }
 let prior=db.assessments.filter(a=>a.player===playerName&&a.ratings&&a.ratings[discipline]&&a.ratings[discipline].length).sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")))[0];
 return prior?prior.ratings[discipline]:null;
}
function selectBulkTeam(team){
 bulkAssessmentDraft.team=team;
 if(bulkAssessmentDraft.discipline){bulkInitInclude();computeBulkRatings();}
}
function selectBulkDiscipline(discipline){
 bulkAssessmentDraft.discipline=discipline;
 bulkAssessmentDraft.format="General";
 renderBulkFormatPick();
 bulkInitInclude();
 computeBulkRatings();
}
function renderBulkFormatPick(){
 let box=document.getElementById("bulkFormatPick");
 if(!box)return;
 let d=bulkAssessmentDraft.discipline;
 if(!d||!FORMAT_SKILLS[d]){box.innerHTML="";return}
 let formats=["General",...Object.keys(FORMAT_SKILLS[d])];
 box.innerHTML=`<label style="margin-top:12px;display:block">Format Focus</label><div class="skillPick">${formats.map(f=>`<label><input type="radio" name="bulkFormat" value="${f}" ${bulkAssessmentDraft.format===f?"checked":""} onchange="selectBulkFormat('${f}')"> ${fmtLabel(f)}</label>`).join("")}</div>`;
}
function selectBulkFormat(format){
 bulkAssessmentDraft.format=format;
 computeBulkRatings();
}
function computeBulkRatings(){
 let discipline=bulkAssessmentDraft.discipline,format=bulkAssessmentDraft.format;
 let skills=bulkSkillsList();
 let players=bulkPlayers();
 bulkAssessmentDraft.ratings={};
 players.forEach(p=>{
  let oldVals=bulkCarryForwardFor(p.name,discipline,format);
  let full=bulkFullList();
  bulkAssessmentDraft.ratings[p.name]=full.names.map((s,i)=>full.vis.includes(i)?(oldVals&&Number(oldVals[i])>0?Number(oldVals[i]):5):0);
 });
 renderBulkAssessmentGrid();
}
function stepBulkAssessmentRating(playerName,skillIndex,delta){
 if(!bulkAssessmentDraft.include[playerName])return;
 let current=Number(bulkAssessmentDraft.ratings[playerName][skillIndex])||1;
 let next=Math.max(1,Math.min(10,current+delta));
 bulkAssessmentDraft.ratings[playerName][skillIndex]=next;
 // Update just the one number in place. Re-drawing the whole table threw the scroll position back to the top.
 let row=[...document.querySelectorAll(".bulkTbl tr[data-p]")].find(r=>r.dataset.p===playerName);
 let vi=bulkFullList().vis.indexOf(skillIndex),sp=row&&row.children[vi+1]&&row.children[vi+1].querySelector("span");
 if(sp){sp.textContent=next;bulkSetActive(playerName,false);return}
 bulkAssessmentDraft.active=playerName;
 renderBulkAssessmentGrid();
}
function bulkNowBar(players){
 let inc=players.filter(p=>bulkAssessmentDraft.include[p.name]),a=bulkAssessmentDraft.active,i=inc.findIndex(p=>p.name===a);
 return `<div class="bulkNow"><button type="button" class="btn secondary sm" onclick="bulkMove(-1)" aria-label="Previous player">◀</button><div class="bulkNowName">${i>=0?`<span class="muted">Assessing ${i+1} of ${inc.length}</span><b>${esc(a)}</b>`:`<span class="muted">Tap a row or ▶ to start</span><b>${inc.length} of ${players.length} selected</b>`}</div><button type="button" class="btn secondary sm" onclick="bulkMove(1)" aria-label="Next player">▶</button></div>`;
}
function bulkSetActive(name,scroll){
 if(!bulkAssessmentDraft.include[name])return;
 if(bulkAssessmentDraft.active===name&&!scroll)return;
 bulkAssessmentDraft.active=name;
 document.querySelectorAll(".bulkTbl tr[data-p]").forEach(r=>r.classList.toggle("bulkActive",r.dataset.p===name));
 let inc=bulkIncluded(),i=inc.findIndex(p=>p.name===name),el=document.querySelector(".bulkNow .bulkNowName");
 if(el)el.innerHTML=`<span class="muted">Assessing ${i+1} of ${inc.length}</span><b>${esc(name)}</b>`;
 if(scroll){let r=[...document.querySelectorAll(".bulkTbl tr[data-p]")].find(x=>x.dataset.p===name);if(r)r.scrollIntoView({block:"center",behavior:"smooth"})}
}
function bulkMove(d){
 let ps=bulkIncluded();if(!ps.length)return;
 let i=ps.findIndex(p=>p.name===bulkAssessmentDraft.active);
 i=i<0?(d>0?0:ps.length-1):Math.max(0,Math.min(ps.length-1,i+d));

}
function bulkToolbar(players){
 let cnt=f=>players.filter(f).length,isK=p=>p.role==="Wicketkeeper"||p.role==="Wicketkeeper-Batter";
 let chip=(label,n,fn)=>`<button type="button" class="bulkChip" onclick="${fn}">${label}${n!==null?` <small>${n}</small>`:""}</button>`;
 return `<div class="bulkTools"><span class="muted">Tick:</span>${chip("All",players.length,"bulkTickGroup('all')")}${chip("None",null,"bulkTickGroup('none')")}${chip("Batters",cnt(p=>p.role==="Batter"),"bulkTickGroup('Batter')")}${chip("Bowlers",cnt(p=>p.role==="Bowler"),"bulkTickGroup('Bowler')")}${chip("All-rounders",cnt(p=>p.role==="All-rounder"),"bulkTickGroup('All-rounder')")}${chip("Keepers",cnt(isK),"bulkTickGroup('keepers')")}${chip("No role",cnt(p=>!p.role),"bulkTickGroup('norole')")}</div>`;
}
function bulkRowHtml(p){
 let on=!!bulkAssessmentDraft.include[p.name],safeName=p.name.replace(/'/g,"\\'");
 let nm=`<td><label class="bulkWho"><input type="checkbox" ${on?"checked":""} onclick="event.stopPropagation()" onchange="bulkToggle(this.dataset.p,this.checked)" data-p="${esc(p.name)}" aria-label="Assess ${esc(p.name)}"><span><b>${esc(p.name)}</b>${p.role?"":`<small class="muted"> · no role</small>`}</span></label></td>`;
 return `<tr data-p="${esc(p.name)}" class="${on?"":"bulkOff"} ${on&&bulkAssessmentDraft.active===p.name?"bulkActive":""}" onclick="bulkSetActive(this.dataset.p,false)">${nm}${bulkFullList().vis.map(si=>`<td>${numberStepperHtml(bulkAssessmentDraft.ratings[p.name][si],`stepBulkAssessmentRating('${safeName}',${si},-1)`,`stepBulkAssessmentRating('${safeName}',${si},1)`,16)}</td>`).join("")}</tr>`;

function bulkSaveLabel(){let n=bulkIncluded().length;return n?`Save ${n} Assessment${n===1?"":"s"}`:"Tick at least one player"}
function bulkToggle(name,on){

function bulkTickGroup(g){

 ps.forEach(p=>{
  let hit=g==="all"?true:g==="none"?false:g==="keepers"?(p.role==="Wicketkeeper"||p.role==="Wicketkeeper-Batter"):g==="norole"?!p.role:p.role===g;

function renderBulkAssessmentGrid(){

function saveBulkAssessment(){
 if(!requireWriteAccess())return;
 let discipline=bulkAssessmentDraft.discipline;
 if(!discipline)return;
 let format=bulkAssessmentDraft.format;
 let isFormat=!!(format&&format!=="General"&&FORMAT_SKILLS[discipline]&&FORMAT_SKILLS[discipline][format]);
 let skills=bulkSkillsList();
 let players=bulkIncluded();
 if(!players.length){alert("Tick at least one player to assess.");return}
 let d=today();
 // Remember who was ticked for this team + skill area, so next time starts from the same selection.
 db.settings=db.settings||{};db.settings.bulkSel=db.settings.bulkSel||{};
 let all=bulkPlayers();db.settings.bulkSel[bulkSelKey()]={on:all.filter(p=>bulkAssessmentDraft.include[p.name]).map(p=>p.name),off:all.filter(p=>!bulkAssessmentDraft.include[p.name]).map(p=>p.name)};
 players.forEach(p=>{
  let vals=bulkAssessmentDraft.ratings[p.name];
  if(!vals)return;
  let full=bulkFullList();
  let clamped=full.names.map((s,i)=>full.vis.includes(i)?Math.max(1,Math.min(10,Number(vals[i])||5)):0);
  let rec={id:uid("assess"),player:p.name,date:d,disciplines:[discipline],disciplineNotes:{},priority:"",comments:"",mediaLinks:[]};
  if(isFormat){
   rec.ratings={[discipline]:[]};
   rec.formats=[format];
   rec.formatRatings={[discipline]:{[format]:clamped}};
  } else {
   rec.ratings={[discipline]:clamped};
   rec.formats=["General"];
   rec.formatRatings={};
  }
  db.assessments.push(rec);
 });
 save();
 closeM();
 assessments();
}
function assessments(){document.getElementById("assessments").innerHTML=head("Player Assessments","Choose one or more disciplines. For an all-rounder select Batting + Bowling; Fielding can also be added.")+`<div class="actionRow"><button class="btn primary" onclick="newAssessment()">+ New Assessment</button><button class="btn secondary" onclick="openBulkAssessment()">Bulk Assess Squad</button></div><h2 class="section">Assessment history</h2><div class="card">${db.assessments.length?db.assessments.slice().reverse().map(a=>`<div class="item"><div><b>${esc(a.player)}</b><div class="muted">${esc(fmtDate(a.date))} · ${assessmentAvg(a)==="—"?"Technique only":"Overall "+assessmentAvg(a)+"/10"}</div><div>${assessmentDisciplines(a).map(d=>`<span class="tag">${esc(d)}</span>`).join("")}${assessmentFormatTagsHtml(a)}</div><small>${esc(a.priority||"")}</small>${a.mediaLinks&&a.mediaLinks.length?`<div style="margin-top:6px">${a.mediaLinks.map((link,i)=>`<a href="${esc(link)}" target="_blank" rel="noopener" class="tag" style="cursor:pointer">🎬 Link ${i+1}</a>`).join("")}</div>`:""}</div><div class="toolbar"><button class="btn secondary iconBtn" title="Edit" onclick="editAssessment('${a.id}')">${icon("edit",17)}</button><button class="btn danger iconBtn" title="Delete" onclick="delAssessment('${a.id}')">${icon("trash",17)}</button></div></div>`).join(""):emptyRich("No assessments yet","Rate batting, bowling and fielding to track each player's progress over time.","+ New Assessment","newAssessment()")}</div>`}
function assessmentFormHtml(a,mode){
 a=a||{};
 return `<div class="sheetHead"><h2>${mode==="edit"?"Edit Assessment":"Player Assessment"}</h2><button class="x" onclick="closeM()">×</button></div>
 <form onsubmit="saveAssessment(event)">

// Flags players who played in matches on the same day or consecutive
// calendar days within the last 14 days — a real, computable fatigue
// risk signal from data that already exists (match dates + rosters),
// not a new field the coach has to remember to fill in.
function workloadFlagDetails(){
 let cutoff=new Date(new Date(today()+"T00:00:00Z").getTime()-14*86400000).toISOString().slice(0,10);
 let byPlayer={};
 db.matches.filter(m=>m.date&&m.date>=cutoff).forEach(m=>{
  let names=new Set([...(m.playingXI||[]),...(m.battingReview||[]).map(r=>r.name),...(m.bowlingReview||[]).map(r=>r.name)]);
  names.forEach(name=>{if(!byPlayer[name])byPlayer[name]=new Set();byPlayer[name].add(m.date)});
 });
 let flagged=[];
 Object.entries(byPlayer).forEach(([name,datesSet])=>{
  let dates=[...datesSet].sort();
  for(let i=1;i<dates.length;i++){
   let gap=Math.floor((new Date(dates[i]+"T00:00:00Z")-new Date(dates[i-1]+"T00:00:00Z"))/86400000);
   if(gap<=1){flagged.push({name,dates:[dates[i-1],dates[i]]});break}
  }
 });
 return flagged;
}
function workloadFlagPlayerNames(){return workloadFlagDetails().map(f=>f.name)}
function showWorkloadFlags(){
 let flagged=workloadFlagDetails();
 if(!flagged.length)return;
 modal(`<div class="sheetHead"><h2>Match Workload Flags</h2><button class="x" onclick="closeM()">×</button></div>
 <div class="muted" style="margin-bottom:12px">These players played matches on the same day or consecutive days within the last 14 days — worth a quick check on how they're feeling before the next session.</div>
 <div class="list">${flagged.map(f=>{let p=db.players.find(x=>x.name===f.name);return `<div class="item"${p?` style="cursor:pointer" onclick="closeM();playerView('${p.id}')"`:""}><div><b>${esc(f.name)}</b><div class="muted">Matches on ${esc(fmtDate(f.dates[0]))} and ${esc(fmtDate(f.dates[1]))}</div></div></div>`}).join("")}</div>`);
}
function reassessDuePlayers(){
 let due=db.players.filter(p=>{
  let pa=db.assessments.filter(a=>a.player===p.name);
  if(!pa.length)return false;
  let latestDate=pa.map(a=>a.date).filter(Boolean).sort().slice(-1)[0];
  if(!latestDate)return false;
  let daysSince=Math.floor((new Date(today()+"T00:00:00Z")-new Date(latestDate+"T00:00:00Z"))/86400000);
  return daysSince>=30;
 });
 if(!due.length)return;
 if(due.length===1){newAssessmentForPlayer(due[0].id);return}
 modal(`<div class="sheetHead"><h2>Players Due for Reassessment</h2><button class="x" onclick="closeM()">×</button></div>
 <div class="list">${due.map(p=>`<div class="item" style="cursor:pointer" onclick="newAssessmentForPlayer('${p.id}')"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.role||"Player")}${p.team?" · "+esc(p.team):""}</div></div></div>`).join("")}</div>`);
}
function editAssessment(id){let a=db.assessments.find(x=>x.id===id);if(!a)return;openAssessmentForm(a,"edit")}
function renderAssessmentSkills(){
 let box=document.getElementById("assessmentSkills");
 if(!box)return;
 let sel=[...document.querySelectorAll('input[name="disciplines"]:checked')].map(x=>x.value);
 let selectedPlayerName=document.querySelector('select[name="player"]')?.value;
 // For an edit, carry forward that exact record's own ratings, as before.
 // For a genuinely new assessment, carry forward the same player's most
 // recent past assessment instead of starting every rating from a flat
 // mid-point default — the coach is adjusting from where they left off,
 // not re-rating from scratch every time.
 let existing=editingAssessmentId
  ?db.assessments.find(x=>x.id===editingAssessmentId)
  :(selectedPlayerName?db.assessments.filter(x=>x.player===selectedPlayerName).sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")))[0]:null);
 // Format Focus is a user-controlled multi-select (General + any of
 // T20/ODI/Test can be checked together, or General alone, or a single
 // format alone with no General/core block at all) — nothing is forced on.
 let formats=[...document.querySelectorAll('input[name="formats"]:checked')].map(x=>x.value);
 box.innerHTML=sel.map(d=>{
  let oldVals=(existing&&existing.ratings&&existing.ratings[d])?existing.ratings[d]:null;
  let isLegacyBowling=d==="Bowling"&&oldVals&&oldVals.length===10;
  let skills=allSkillsFor(d);
  let archivedList=(db.archivedSkills&&db.archivedSkills[d])||[];
  // Fielding/Wicketkeeping have no format-specific breakdown, so they
  // always show the core ("General") skill list regardless of the Format
  // Focus checkboxes above. Batting/Bowling respect the user's choice.
  let hasFormatConcept=!!FORMAT_SKILLS[d];
  let showGeneral=!hasFormatConcept||formats.includes("General");
  let activeFormats=hasFormatConcept?formats.filter(f=>f!=="General"&&FORMAT_SKILLS[d][f]&&FORMAT_SKILLS[d][f].length):[];
  let coreRowsHtml=skills.map((s,i)=>{
   let val=5,wasAssessed=true;
   if(oldVals){
    if(isLegacyBowling){
     if(i===3){val=Math.round(((Number(oldVals[3])||5)+(Number(oldVals[4])||5))/2);wasAssessed=!!(oldVals[3]||oldVals[4])}
     else if(i<3){val=oldVals[i]!==undefined?oldVals[i]:5;wasAssessed=!!oldVals[i]}
     else{val=oldVals[i+1]!==undefined?oldVals[i+1]:5;wasAssessed=!!oldVals[i+1]}
    } else {
     val=oldVals[i]!==undefined?oldVals[i]:5;
     wasAssessed=!!oldVals[i];
    }
   }
   let archived=isSkillArchived(d,s);
   // Archived skills are never removed from this list — doing so would
   // shift every later skill's index and corrupt how past assessments
   // are read back. Instead: hide the row, and only auto-force it
   // unrated when this is a genuinely NEW assessment (no prior value to
   // preserve). If editing an assessment that already had a real rating
   // here, that value is kept exactly as-is, just out of view.
   if(archived&&(!oldVals||!editingAssessmentId))wasAssessed=false;
   let rowHtml=sliderRow(s,`${d}_${i}`,val,wasAssessed);
   if(archived)return `<div style="display:none">${rowHtml}</div>`;
   return `<div style="position:relative">${rowHtml}<button type="button" class="btn secondary" style="position:absolute;top:0;right:0;padding:3px 8px;font-size:var(--fs-1)" title="Archive this metric — hides it from future assessments without affecting past data" onclick="archiveSkill('${d}','${esc(s).replace(/'/g,"\\'")}')">Archive</button></div>`;
  }).join("");
  // Format-specific metrics (Batting/Bowling only) render as their own
  // block per selected format below the core skills, in a per-format field
  // namespace (${d}_fmt_${format}_${i}) so multiple formats can be rated
  // side by side without colliding, and carried forward only from the
  // prior assessment's SAME format, since a different format's values
  // don't correspond to this one's list.
  let formatBlocksHtml=activeFormats.map(f=>{
   let formatSkills=allFormatSkillsFor(d,f);
   let archivedFormatList=(db.archivedFormatSkills&&db.archivedFormatSkills[d]&&db.archivedFormatSkills[d][f])||[];
   let oldFormatVals=(existing&&existing.formatRatings&&existing.formatRatings[d]&&existing.formatRatings[d][f])?existing.formatRatings[d][f]:null;
   let rowsHtml=formatSkills.map((s,i)=>{
    let val=oldFormatVals&&oldFormatVals[i]!==undefined?oldFormatVals[i]:5;
    // Same default as the core skills above: a metric is available for
    // marking right away. It only turns off (needing "Assessed today" to
    // be re-ticked) when this exact format was carried forward from a
    // prior assessment and that specific metric wasn't rated there.
    let wasAssessed=oldFormatVals?!!oldFormatVals[i]:true;
    let archived=isFormatSkillArchived(d,f,s);
    if(archived&&(!oldFormatVals||!editingAssessmentId))wasAssessed=false;
    let rowHtml=sliderRow(s,`${d}_fmt_${f}_${i}`,val,wasAssessed);
    if(archived)return `<div style="display:none">${rowHtml}</div>`;
    return `<div style="position:relative">${rowHtml}<button type="button" class="btn secondary" style="position:absolute;top:0;right:0;padding:3px 8px;font-size:var(--fs-1)" title="Archive this metric — hides it from future assessments without affecting past data" onclick="archiveFormatSkill('${d}','${f}','${esc(s).replace(/'/g,"\\'")}')">Archive</button></div>`;
   }).join("");
   let formatCustomAddHtml=`<div class="formgrid" style="margin-top:8px"><input type="text" id="newFormatSkill_${d}_${f}" placeholder="Add a custom ${f} metric for ${d}..." onkeydown="if(event.key==='Enter'){event.preventDefault();addCustomFormatSkill('${d}','${f}')}"><button type="button" class="btn primary" onclick="addCustomFormatSkill('${d}','${f}')">+ Add metric</button></div>${(()=>{let unused=unusedUnarchivedFormatSkills(d,f);return unused.length?`<button type="button" class="btn secondary" style="margin-top:6px" onclick="bulkArchiveUnusedFormat('${d}','${f}')">Archive ${unused.length} never-used metric${unused.length===1?"":"s"}</button>`:""})()}${archivedFormatList.length?`<div style="margin-top:8px"><a href="#" onclick="event.preventDefault();toggleArchivedFormatSkillsPanel('${d}','${f}')" class="muted">Archived metrics (${archivedFormatList.length})</a><div id="archivedFormatSkillsPanel_${d}_${f}" style="display:none;margin-top:6px">${archivedFormatList.map(s=>`<div class="item"><span class="muted">${esc(s)}</span><button type="button" class="btn secondary" onclick="unarchiveFormatSkill('${d}','${f}','${esc(s).replace(/'/g,"\\'")}')">Unarchive</button></div>`).join("")}</div></div>`:""}`;
   return `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)"><div class="muted" style="font-weight:700;text-transform:uppercase;font-size:var(--fs-1);letter-spacing:.3px;margin-bottom:6px">${esc(f)} specifics</div>${rowsHtml}${formatCustomAddHtml}</div>`;
  }).join("");
  let customAddHtml=`<div class="formgrid" style="margin-top:8px"><input type="text" id="newSkill_${d}" placeholder="Add a custom metric for ${d}..." onkeydown="if(event.key==='Enter'){event.preventDefault();addCustomSkill('${d}')}"><button type="button" class="btn primary" onclick="addCustomSkill('${d}')">+ Add metric</button></div>${(()=>{let unused=unusedUnarchivedSkills(d);return unused.length?`<button type="button" class="btn secondary" style="margin-top:6px" onclick="bulkArchiveUnused('${d}')">Archive ${unused.length} never-used metric${unused.length===1?"":"s"}</button>`:""})()}${archivedList.length?`<div style="margin-top:8px"><a href="#" onclick="event.preventDefault();toggleArchivedSkillsPanel('${d}')" class="muted">Archived metrics (${archivedList.length})</a><div id="archivedSkillsPanel_${d}" style="display:none;margin-top:6px">${archivedList.map(s=>`<div class="item"><span class="muted">${esc(s)}</span><button type="button" class="btn secondary" onclick="unarchiveSkill('${d}','${esc(s).replace(/'/g,"\\'")}')">Unarchive</button></div>`).join("")}</div></div>`:""}`;
  let bodyHtml=(showGeneral?coreRowsHtml:"")+formatBlocksHtml+(showGeneral?customAddHtml:"")+(!showGeneral&&!activeFormats.length?`<div class="muted">Pick a Format Focus above (Core skills, T20, ODI or Test) to rate ${esc(d)}.</div>`:"");
  return `<label style="margin-bottom:6px">${d}${showGeneral?" · Rate 1–10":""}</label><div class="card">${bodyHtml}${(editingAssessmentId&&existing&&existing.disciplineNotes&&existing.disciplineNotes[d])?`<label>${d} development notes <span class="muted" style="font-weight:400">(older note — new ones go in Coach comments below)</span><textarea name="${d}_notes">${esc(existing.disciplineNotes[d])}</textarea></label>`:""}</div>`;
 }).join("")||empty("Select at least one skill area.");
 enhanceTextareasWithVoice(box);
 renderAssessmentTech();
 let so=document.querySelector('input[name="skipGame"]');if(so&&so.checked)techOnlyToggle(true);
}
function addCustomSkill(d){
 let input=document.getElementById(`newSkill_${d}`);
 let name=(input.value||"").trim();
 if(!name)return;
 let existingNames=allSkillsFor(d).map(s=>s.toLowerCase());
 if(existingNames.includes(name.toLowerCase())){alert(`"${name}" already exists for ${d}.`);return}
 db.customSkills[d]=db.customSkills[d]||[];
 db.customSkills[d].push(name);
 save();
 renderAssessmentSkills();
}
/* ===== Technique assessment (from the 2024 video analysis forms) ===== */
// Each component lists observations. A string is one observation; ["Heading",[...]] is a group, whose
// items are stored as "Heading — item" so repeated wording in different groups never collides.
const TECH={
 Batting:[
  {n:"Grip",o:["Too high on the handle","Too low on the handle","Hands apart on the handle","Top hand V on splice / towards outer edge","Bottom hand V towards inner edge","Bottom hand loose and turning in pick-up"]},
  {n:"Stance",o:["Narrow stance","Broad stance","Upright stance","Crouched stance","Weight on heels","Weight on toes","Weight on balls of the feet","Closed stance","Open stance","Front foot / back foot weighted","Head out of base"]},
  {n:"Backlift",o:["Backlift initiated by top hand","Backlift initiated by bottom hand","Backlift towards gully / point","Backlift towards fine leg","Backlift away from body","Hands away in downswing"]},
  {n:"Initial movement",o:["Initial movement late","Initial movement early","Initial movement big","Initial movement small","Front foot weighted after initial movement","Back foot weighted after initial movement","Excessive head movement during initial movement"]}
 ],
 Bowling:[
  {n:"Run-up",o:["Angular","Straight","Curved"]},
  {n:"Loading (jump & gather)",o:[["Bowling hand",["Behind head","Close to the body","Away from body"]],["Bowling arm elbow",["Towards target","Away from body","Towards mid-wicket"]],["Foot position at jump",["Towards target","Open","Closed"]],["Jump into crease",["Forward jump","Jump in","Jump out"]]]},
  {n:"Back-foot landing",o:["Side on","Past side on","Semi-open","Front on"]},
  {n:"Hip / shoulder alignment",o:["Aligned","In range","Mixed"]},
  {n:"Front-foot landing",o:["In line with back-foot landing","Opening out","Across","Splayed"]},
  {n:"Alignment",o:["Aligned","Across","Open"]},
  {n:"Release",o:["Vertical","Past vertical","Round arm","Presence of flexion and extension"]},
  {n:"Follow-through",o:["Efficient transfer of weight","Inefficient transfer of weight","Finish of the non-bowling arm","Running into the danger area"]}
 ],
 Wicketkeeping:[
  {n:"Crouch",o:["Feet shoulder-width apart","Feet too wide","Feet narrow","Weight on balls of the feet","Weight on heels","Weight on toes","Weight on one leg","Head steady","Eyes level","Gloves lightly touching the ground"]},
  {n:"Position — spinners",o:["Clear view","Head steady","Inside leg too wide of off stump","Inside leg outside off stump","Inside leg behind off stump","Standing too far","Standing too close","Arm's length from stump"]},
  {n:"Position — pacers",o:["Has clear view","Head steady","Collecting at hip","Collecting at ankle","Collecting at one bounce"]},
  {n:"Footwork — spinners",o:["Moving in a straight line","Moving in a curve","Moving in a K-shape","Stepping with toes","Stepping with balls of the feet","Flexed knees","Knees too straight","Head over gloves","Head at the side","Gloves in line with the ball","Outside foot slightly in line","Outside foot beside the ball"]},
  {n:"Footwork — pacers",o:["Collecting in front","Collecting between inside hip and stump","Collecting outside hip",["While moving",["Optimum stride","Strides too long","Strides too short"]]]},
  {n:"Glovework",o:["Cupped gloves","Hands apart","Fingers pointing forward","Fingers pointing away","Fingers pointing down","Extends the arm","No extension"]}
 ],
 Fielding:[
  {n:"Catching",o:[["Ready position",["Balanced on the balls of the feet","Flat-footed","Hands ready in front"]],["Moving to the ball",["Moves early","Late movement","Poor path to the ball","Head bobbing while running"]],["Hands",["Fingers up for high balls","Fingers down for low balls","Hands apart","Soft hands (gives with the ball)","Hard hands"]],["Eyes and body",["Eyes on the ball into the hands","Head still","Catching away from the body","Body behind the line of the ball"]]]},
  {n:"Ground fielding",o:[["Ready and approach",["Balanced, low ready position","Weight on heels","Straight-line approach","Curved approach","Slow approach"]],["Hands and body",["Hands low and wide, ahead of the feet","Hands too close to the body","Fingers down","Head down over the ball","Eyes on the ball into the hands","Body behind the line of the ball"]],["Pick-up and release",["Clean pick-up","Quick transfer to throw","Long barrier — trailing leg tucked","Long barrier — not getting down in time"]]]},
  {n:"Throwing",o:[["Non-throwing hand",["Strong","Drop"]],["Throwing hand elbow",["Above shoulder level","At shoulder level","Below shoulder level"]],["Stride",["Optimum","Short"]],["Alignment",["Cross","Towards target","Open"]]]}
 ]
};
const TECH_DISC=["Batting","Bowling","Wicketkeeping","Fielding"];
const RBW_OPTS=["Excellent","Satisfactory","Needs attention"];
const TS={G:{l:"Good",c:"#2fa66a"},M:{l:"Monitor",c:"#e0a100"},A:{l:"Attention",c:"#e5484d"}};
let techDraft={},techOpen={},techExtraOpen={},techManage={},techTab="game";
function techObsFull(d,ci){
 let comp=TECH[d][ci],out=[];
 comp.o.forEach(x=>{if(Array.isArray(x))x[1].forEach(it=>out.push({k:x[0]+" — "+it,l:it,g:x[0]}));else out.push({k:x,l:x,g:""})});
 let cu=(db.techCustom&&db.techCustom[d]&&db.techCustom[d][comp.n])||[];
 cu.forEach(n=>out.push({k:n,l:n,g:"",custom:true}));
 return out;
}
function techHidden(d,ci){return(db.techHidden&&db.techHidden[d]&&db.techHidden[d][TECH[d][ci].n])||[]}
function techCount(d,cn){let c=(techDraft[d]||{})[cn];return c&&c.obs?Object.keys(c.obs).filter(k=>c.obs[k]).length:0}
function techSummaryText(d,cn){let c=(techDraft[d]||{})[cn],n=techCount(d,cn),p=[];if(c&&c.grade&&TS[c.grade])p.push(TS[c.grade].l);if(n)p.push(n+" noted");return p.join(" · ")}
function techComp(d,cn){techDraft[d]=techDraft[d]||{};return techDraft[d][cn]=techDraft[d][cn]||{obs:{},comment:"",adjust:"",link:"",imgs:[],frames:[]}}
function techChk(d,ci,oi,on){
 let cn=TECH[d][ci].n,o=techObsFull(d,ci)[oi];if(!o)return;let c=techComp(d,cn);
 if(on)c.obs[o.k]=true;else delete c.obs[o.k];
 let s=document.getElementById(`ts_${d}_${ci}`);if(s)s.textContent=techSummaryText(d,cn);
}
function techGradeSet(d,ci,v){
 let cn=TECH[d][ci].n,c=techComp(d,cn);c.grade=c.grade===v?"":v;
 ["G","M","A"].forEach(x=>{let b=document.getElementById(`tg_${d}_${ci}_${x}`);if(b){b.classList.toggle("on",c.grade===x);b.setAttribute("aria-pressed",c.grade===x?"true":"false")}});
 let s=document.getElementById(`ts_${d}_${ci}`);if(s)s.textContent=techSummaryText(d,cn);
}
function techRowPaint(){}
function techPrev(d,cn,k){
 let pid=editingAssessmentId,sel=document.querySelector('select[name="player"]'),pl=sel&&sel.value;if(!pl)return false;
 let a=db.assessments.filter(a=>a.player===pl&&a.id!==pid&&a.technique&&a.technique[d]&&a.technique[d][cn]).sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")))[0];
 return !!(a&&a.technique[d][cn].obs&&a.technique[d][cn].obs[k]);
}

   if(activeFormats.length&&!skipGame){
    a.formatRatings[d]={};

 });

function sizeFullscreenCanvas(){

 if(!step)return;

// Equipment auto-tally: counts the marker types actually placed across every
// step/shape of the drill being edited and turns that into a suggested
// "Equipment needed" line — e.g. "4 cones, 2 stumps, 1 target". It fills the
// field rather than silently overwriting whatever the coach already typed.
const FIELD_EQUIPMENT_LABELS={cone:"cone",gate:"cone gate",stumps:"stumps",katchet:"katchet board",pugg:"Pugg net",target:"target",ball:"ball",wk:"keeper"};
function tallyFieldEquipment(){
 let counts={};
 let add=(label,n)=>{counts[label]=(counts[label]||0)+n};
 fieldDraft.steps.forEach(step=>{
  ["full","half","square"].forEach(shape=>{
   (step[shape]&&step[shape].items||[]).forEach(it=>{
    if(it.kind!=="marker")return;
    let label=FIELD_EQUIPMENT_LABELS[it.type];
    if(!label)return;
    if(it.type==="gate"){add("cone gate",1);add("cone",2)} // each gate is built from 2 cones
    else add(label,1);
   });
  });
 });
 return counts;
}
function suggestDrillEquipment(){
 let counts=tallyFieldEquipment();
 let parts=Object.keys(counts).map(label=>`${counts[label]} ${label}${counts[label]>1&&!label.endsWith("s")?"s":""}`);
 if(!parts.length){alert("No cones, stumps, boards, nets, targets or gates placed on the diagram yet — add some markers first, or type equipment in manually.");return}
 let input=document.querySelector('.modal.open input[name="equipment"]');
 if(!input)return;
 let suggestion=parts.join(", ");
 if(input.value&&input.value.trim()&&!confirm(`Replace the current Equipment field with "${suggestion}"?`))return;
 input.value=suggestion;
}
// Export Diagram: rasterizes the current step's ground (at a fixed, print-
// quality pixel size) to a standalone PNG the coach can share outside the app
// (WhatsApp, print handout, etc.) — separate from the full drill/session report.
function exportFieldDiagram(){
 let step=fieldDraft.steps[fieldDraft.activeStep];
 if(!step){alert("No diagram to export.");return}
 let shape=curFieldShape(step);
 let items=curFieldItems(step);
 if(!items.length){alert("This step's diagram is empty — add some markers first.");return}
 let vb=shape==="half"?{w:1200,h:720}:{w:1200,h:1200};
 let svgStr=fieldDiagramSvg({shape:shape,items:items},{exportPx:vb});
 let blob=new Blob([svgStr],{type:"image/svg+xml;charset=utf-8"});
 let url=URL.createObjectURL(blob);
 let img=new Image();
 img.onload=()=>{
  let canvas=document.createElement("canvas");
  // Legend band under the ground (only when some ball arrow is tagged).
  let legend=fieldLegendEntries(items),chipH=56,gapPx=14,pad=30,font="bold 32px Poppins,Inter,sans-serif";
  let chips=[],bandH=0;
  if(legend.length){
   let m=document.createElement("canvas").getContext("2d");m.font=font;
   let x=pad,row=0;
   legend.forEach(e=>{
    let text=e.label+" – "+e.tag,w=Math.ceil(m.measureText(text).width)+40;
    if(x+w>vb.w-pad&&x>pad){x=pad;row++}
    chips.push({text,w,x,row,color:e.color});x+=w+gapPx;
   });
   bandH=pad+(row+1)*(chipH+gapPx);
  }
  canvas.width=vb.w;canvas.height=vb.h+bandH;
  let ctx=canvas.getContext("2d");
  ctx.drawImage(img,0,0,vb.w,vb.h);
  if(bandH){
   ctx.fillStyle="#0a1420";ctx.fillRect(0,vb.h,vb.w,bandH);
   ctx.font=font;ctx.textBaseline="middle";ctx.textAlign="center";
   chips.forEach(c=>{
    let y=vb.h+pad/2+c.row*(chipH+gapPx),r=chipH/2;
    ctx.fillStyle=c.color;ctx.beginPath();
    ctx.moveTo(c.x+r,y);ctx.arc(c.x+c.w-r,y+r,r,-Math.PI/2,Math.PI/2);ctx.arc(c.x+r,y+r,r,Math.PI/2,Math.PI*1.5);ctx.closePath();ctx.fill();
    ctx.fillStyle="#f4f1e8";ctx.fillText(c.text,c.x+c.w/2,y+r+1);
   });
  }
  URL.revokeObjectURL(url);
  canvas.toBlob(pngBlob=>{
   if(!pngBlob){alert("Couldn't export the diagram image.");return}
   let pngUrl=URL.createObjectURL(pngBlob);
   let nameInput=document.querySelector('.modal.open input[name="name"]');
   let base=(nameInput&&nameInput.value.trim())||"drill-diagram";
   let fname=(base+"-"+(step.label||("step"+(fieldDraft.activeStep+1)))).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"")||"drill-diagram";
   let a=document.createElement("a");
   a.href=pngUrl;a.download=fname+".png";
   document.body.appendChild(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(pngUrl),2000);
  },"image/png");
 };
 img.onerror=()=>{URL.revokeObjectURL(url);alert("Couldn't export the diagram image.")};
 img.src=url;
}

/* ===== Match Scorer → Match Centre bridge =====
   The scorer keeps its own IndexedDB ("procoachos_scorer"); finished matches carry a ready-made
   "export" record. Nothing is written into the coach profile until the coach taps Import. */
function scorerDbAll(){return new Promise(res=>{try{const r=indexedDB.open("procoachos_scorer",1);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains("matches"))d.createObjectStore("matches",{keyPath:"id"})};r.onsuccess=()=>{try{const d=r.result;const q=d.transaction("matches","readonly").objectStore("matches").getAll();q.onsuccess=()=>{d.close();res(q.result||[])};q.onerror=()=>{d.close();res([])}}catch(e){res([])}};r.onerror=()=>res([])}catch(e){res([])}})}
function scorerDbPut(rec){return new Promise(res=>{try{const r=indexedDB.open("procoachos_scorer",1);r.onsuccess=()=>{try{const d=r.result;const t=d.transaction("matches","readwrite");t.objectStore("matches").put(rec);t.oncomplete=()=>{d.close();res(true)};t.onerror=()=>{d.close();res(false)}}catch(e){res(false)}};r.onerror=()=>res(false)}catch(e){res(false)}})}
async function pendingScoredMatches(){const all=await scorerDbAll();return all.filter(x=>x&&x.status==="completed"&&x.export&&!x.imported)}

 const box=document.getElementById("scorerImportBox");if(!box)return;

function openMatchForm(existing,mode){

}

 let t=db.tournaments.find(x=>x.id===tournamentId);if(!t)return;
 let f=(t.fixtures||[]).find(x=>x.id===fixtureId);if(!f)return;
 let squadNames=(t.squadPlayerIds||[]).map(id=>{let p=db.players.find(x=>x.id===id);return p?p.name:null}).filter(Boolean);

function copyLastPlayingXI(){

 if(!matches.length){alert("No previous match with a Playing XI found.");return}

function saveMatch(e){
 e.preventDefault();
 if(!requireWriteAccess())return;
 let fd=new FormData(e.target);
 let m=Object.fromEntries(fd);
 let teamSelect=fd.get("teamSelect");
 m.team=teamSelect==="__custom__"?(fd.get("teamCustom")||""):(teamSelect||"");
 delete m.teamSelect;delete m.teamCustom;
 m.battingReview=matchDraft.batting.filter(r=>r.name&&String(r.name).trim());
 m.bowlingReview=matchDraft.bowling.filter(r=>r.name&&String(r.name).trim());
 m.playingXI=fd.getAll("playingXI");
 m.battingRatings=collectRatings(fd,"batRating",BATTING_METRICS);
 m.bowlingRatings=collectRatings(fd,"bowlRating",BOWLING_METRICS);
 m.fieldingRatings=collectRatings(fd,"fieldRating",FIELDING_METRICS);
 m.rating=Math.round(avgRatingObj(m.fieldingRatings))||0;
 BATTING_METRICS.forEach((_,i)=>delete m[`batRating_${i}`]);
 BOWLING_METRICS.forEach((_,i)=>delete m[`bowlRating_${i}`]);
 FIELDING_METRICS.forEach((_,i)=>delete m[`fieldRating_${i}`]);
 if(editingMatchId){let idx=db.matches.findIndex(x=>x.id===editingMatchId);if(idx>-1){m.id=editingMatchId;db.matches[idx]=m}}
 else{m.id=uid("m");db.matches.push(m)}
 editingMatchId=null;closeM();save();
}
function delMatch(id){if(confirm("Delete this match? This cannot be undone.")){db.matches=db.matches.filter(x=>x.id!==id);save()}}

function scorerInningsHtml(m){

 const nm=p=>esc(p.name)+(p.c?" (c)":"")+(p.w?" †":"");
 const info=(m.teamsInfo||[]).filter(t=>t.captain||t.keeper).map(t=>`<b>${esc(t.name)}</b>${t.captain?" · Captain: "+esc(t.captain):""}${t.keeper?" · WK: "+esc(t.keeper):""}`).join("<br>");
 return `<h2>Scorecard</h2>${info?`<div class="card muted" style="margin-bottom:10px;line-height:1.6">${info}</div>`:""}`+(m.scorerInnings||[]).map(inn=>{
  const bat=inn.bat.map(b=>`<tr><td>${nm(b)}</td><td class="muted">${esc(b.how)}</td><td><b>${b.runs}</b></td><td>${b.balls}</td><td>${b.fours}</td><td>${b.sixes}</td><td>${b.balls?(b.runs*100/b.balls).toFixed(1):"-"}</td></tr>`).join("");
  const bowl=inn.bowl.map(b=>`<tr><td>${nm(b)}</td><td>${esc(b.overs)}</td><td>${b.maidens}</td><td>${b.runs}</td><td><b>${b.wkts}</b></td><td>${b.econ.toFixed(2)}</td></tr>`).join("");
  const e=inn.extras||{};
  return `<div class="card" style="margin-top:12px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline"><b>${esc(inn.team)} — ${ord(inn.no)} innings${inn.followOn?" (following on)":""}</b><b>${inn.runs}/${inn.wkts}${inn.declared?" d":""} <span class="muted" style="font-weight:400">(${esc(inn.overs)} ov)</span></b></div>
  <table class="reportTable" style="margin-top:8px"><tr><th>Batter</th><th>How out</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>${bat}</table>
  ${inn.dnb&&inn.dnb.length?`<p class="muted" style="margin:6px 0">Did not bat: ${inn.dnb.map(nm).join(", ")}</p>`:""}
  <p style="margin:6px 0">Extras <b>${e.total||0}</b> <span class="muted">(b ${e.b||0}, lb ${e.lb||0}, w ${e.wd||0}, nb ${e.nb||0}${e.pen?", pen "+e.pen:""})</span>${inn.penalty?` · Pairs penalty −${inn.penalty}`:""}</p>
  ${inn.fow&&inn.fow.length?`<p class="muted" style="margin:6px 0"><b>Fall of wickets:</b> ${inn.fow.map(f=>`${f.n}-${f.runs} (${esc(f.name)}, ${esc(f.over)})`).join(", ")}</p>`:""}
  ${bowl?`<table class="reportTable" style="margin-top:8px"><tr><th>Bowler (${esc(inn.opp)})</th><th>O</th><th>M</th><th>R</th><th>W</th><th>Econ</th></tr>${bowl}</table>`:""}</div>`}).join("");
}

function isoAddDays(isoStr,days){let d=new Date(isoStr+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10)}
function isoDiffDays(isoA,isoB){let a=new Date(isoA+"T00:00:00Z"),b=new Date(isoB+"T00:00:00Z");return Math.round((b-a)/86400000)}
function autoSplitPhases(seasonId){
 let s=db.seasons.find(x=>x.id===seasonId);if(!s)return;
 if(!s.startDate||!s.endDate){alert("Set a start and end date for this season first (Edit).");return}
 if(s.phases&&s.phases.length){
  if(!confirm("This season already has phases. Auto-split will add 4 default phases alongside them — you can edit or delete any afterward. Continue?"))return;
 }
 let totalDays=isoDiffDays(s.startDate,s.endDate)+1;
 if(totalDays<4){alert("This season's date range is too short to auto-split into phases.");return}
 let splits=[
  {name:"Pre-season",focus:"Conditioning and foundational skill work",share:0.15},
  {name:"In-season",focus:"Regular training and match rhythm",share:0.55},
  {name:"Peak / Tournament period",focus:"Competition-focused preparation",share:0.20},
  {name:"Off-season review",focus:"Review, recovery and planning for next season",share:0.10}
 ];
 let cursor=s.startDate,newPhases=[];
 splits.forEach((sp,i)=>{
  let remaining=splits.length-i;
  let daysLeft=isoDiffDays(cursor,s.endDate)+1;
  let days;
  if(i===splits.length-1){days=daysLeft}
  else{let ideal=Math.round(totalDays*sp.share);let maxAllowed=daysLeft-(remaining-1);days=Math.max(1,Math.min(ideal,maxAllowed))}
  let phaseStart=cursor,phaseEnd=isoAddDays(phaseStart,days-1);
  newPhases.push({id:uid("phase"),name:sp.name,startDate:phaseStart,endDate:phaseEnd,focus:sp.focus,sessionTarget:""});
  cursor=isoAddDays(phaseEnd,1);
 });
 if(!Array.isArray(s.phases))s.phases=[];
 s.phases=s.phases.concat(newPhases);
 save();
}

function skillTrendsHtml(roster,assessments){
 let disciplines=Object.keys(skillSets);
 let rows=roster.map(p=>{
  let declining=[],stagnant=[],improving=[];
  disciplines.forEach(d=>{
   let skills=allSkillsFor(d);
   skills.forEach((s,i)=>{
    let series=assessments.filter(a=>a.player===p.name&&assessmentDisciplines(a).includes(d)&&a.ratings&&Array.isArray(a.ratings[d]))
     .map(a=>({date:a.date,value:Number(a.ratings[d][i])}))
     .filter(pt=>Number.isFinite(pt.value)&&pt.value>0)
     .sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));
    if(series.length<2)return;
    let first=series[0].value,latest=series[series.length-1].value;
    let last3=series.slice(-3);
    let isStagnant=last3.length>=3&&last3.every(pt=>pt.value===last3[0].value);
    if(isStagnant){stagnant.push(`${d}: ${s}`)}
    else if(latest<first){declining.push(`${d}: ${s} (${first}→${latest})`)}
    else if(latest>first){improving.push(`${d}: ${s} (${first}→${latest})`)}
   });
  });
  return{p,declining,stagnant,improving};
 }).filter(r=>r.declining.length||r.stagnant.length||r.improving.length);
 if(!rows.length)return "";
 return `<h2>Skill Trends</h2>
 ${rows.map(({p,declining,stagnant,improving})=>`<div class="card">
 <b>${esc(p.name)}</b>
 ${declining.length?`<p style="color:var(--red);margin-top:6px"><b>Declining:</b> ${esc(declining.join(", "))}</p>`:""}
 ${stagnant.length?`<p style="color:var(--gold);margin-top:6px"><b>Stagnant (3+ assessments, no change):</b> ${esc(stagnant.join(", "))}</p>`:""}
 ${improving.length?`<p class="muted" style="margin-top:6px"><b>Improving:</b> ${esc(improving.join(", "))}</p>`:""}
 </div>`).join("")}`;
}

 if(s.focus)lines.push(`Focus: ${s.focus}`);

// Opens WhatsApp (app on mobile, WhatsApp Web on desktop) with the message
// already typed in — the coach still picks who to send it to, but skips
// the copy/switch-app/paste dance the plain "Copy" buttons still require.
// A 10-digit number is assumed to be an Indian mobile and given the +91
// prefix wa.me needs; anything else is left as-is (or omitted entirely,
// which opens WhatsApp's own contact/group picker instead of one chat).
function normalizePhoneForWhatsApp(phone){
 let digits=String(phone||"").replace(/\D/g,"");
 if(!digits)return "";
 if(digits.length===10)digits="91"+digits;
 return digits;
}

 window.open(`https://wa.me/${digits}?text=${encodeURIComponent(text)}`,"_blank");
}

// Returns every searchable piece of text for a reflection, correctly
// pulling from the new fields (betterReasons/betterDetail/learnings) or
// falling back to the old ones (better/players/change) for reflections
// saved before that schema change — so search never silently misses a
// reflection just because of which field its text happens to live in.
function reflectionSearchableText(r){
 return[
  r.session,r.well,r.next,
  (r.betterReasons&&r.betterReasons.length)?r.betterReasons.join(" "):"",
  r.betterDetail!==undefined?r.betterDetail:r.better,
  r.learnings!==undefined?r.learnings:[r.players,r.change].filter(Boolean).join(" "),
  (r.wentWellThemes&&r.wentWellThemes.length)?r.wentWellThemes.join(" "):"",
  (r.takeawayThemes&&r.takeawayThemes.length)?r.takeawayThemes.join(" "):"",
  (r.nextFocusThemes&&r.nextFocusThemes.length)?r.nextFocusThemes.join(" "):""
 ];
}
function reflectionWentWellText(r){return[(r.wentWellThemes||[]).join(", "),r.well].filter(Boolean).join(" — ")}
function reflectionTakeawayText(r){return[(r.takeawayThemes||[]).join(", "),r.learnings!==undefined?r.learnings:[r.players,r.change].filter(Boolean).join(" ")].filter(Boolean).join(" — ")}
function reflectionNextFocusText(r){return[(r.nextFocusThemes||[]).join(", "),r.next].filter(Boolean).join(" — ")}

// --- Uninvoiced sessions picker -------------------------------------------
// Line items created from a session carry a sessionId so we can tell which
// sessions have already been billed. invoicedSessionIds() scans every saved
// invoice (not just the one being edited) so a session can never be double-
// billed by accident. The sessionId sticks to the row even if the coach
// edits its description/qty/rate afterwards — it still represents that
// session having been billed.
function invoicedSessionIds(excludeInvoiceId){
 let set=new Set();
 db.invoices.forEach(inv=>{
  if(excludeInvoiceId&&inv.id===excludeInvoiceId)return;
  (inv.items||[]).forEach(it=>{if(it.sessionId)set.add(it.sessionId)});
 });
 return set;
}
function uninvoicedSessionsForPlayer(player){

 // Sessions already added to the current draft shouldn't be offered again.
 let inDraft=new Set(invoiceDraft.filter(it=>it.sessionId).map(it=>it.sessionId));
 return playerSessions(player).filter(s=>!invoiced.has(s.id)&&!inDraft.has(s.id));
}

// Auto-generated, readable paragraph pulled entirely from structured match

function matchNarrative(m){

 let parts=[`${teamLabel} played ${oppLabel}${m.venue?" at "+m.venue:""} on ${fmtDate(m.date)}${m.format?` in a ${m.format} match`:""}.`];
 if(m.toss==="Won")parts.push(`${teamLabel} won the toss and chose to ${(m.tossDecision||"bat").toLowerCase()} first.`);
 else if(m.toss==="Lost")parts.push(`${oppLabel} won the toss.`);
 if(m.scoreLine)parts.push(`Scores: ${m.scoreLine}.`);
 let topBat=(m.battingReview||[]).filter(r=>r.name).slice().sort((a,b)=>(Number(b.runs)||0)-(Number(a.runs)||0))[0];
 if(topBat&&Number(topBat.runs)>0)parts.push(`${topBat.name} top-scored with ${topBat.runs}${topBat.balls?` off ${topBat.balls} balls`:""}${topBat.dismissal&&topBat.dismissal!=="Not out"?` (${topBat.dismissal})`:topBat.dismissal==="Not out"?" (not out)":""}.`);
 let topBowl=(m.bowlingReview||[]).filter(r=>r.name).slice().sort((a,b)=>(Number(b.wickets)||0)-(Number(a.wickets)||0))[0];
 if(topBowl&&Number(topBowl.wickets)>0)parts.push(`${topBowl.name} was the pick of the bowlers, taking ${topBowl.wickets} wicket${Number(topBowl.wickets)===1?"":"s"}${topBowl.overs?` in ${topBowl.overs} overs`:""}${topBowl.runs!==undefined&&topBowl.runs!==""?` for ${topBowl.runs} runs`:""}.`);
 if(m.result)parts.push(`Result: ${m.result}.`);
 return parts.join(" ");
}

// surfaces recurring concerns across many reflections without asking the
// coach to tag anything manually.
const REFLECTION_THEMES=[
 {theme:"Attendance / availability",keywords:["attendance","absent","missed","turnout","availability","no-show","no show"]},
 {theme:"Communication",keywords:["communicat","listen","instruction","explain"]},
 {theme:"Discipline / focus",keywords:["focus","distract","discipline","concentrat"]},
 {theme:"Fitness / conditioning",keywords:["fitness","tired","fatigue","stamina","conditioning"]},
 {theme:"Batting technique",keywords:["footwork","bat swing","shot selection","batting technique","balance at the crease"]},
 {theme:"Bowling technique",keywords:["run-up","run up","bowling action","line and length","no-ball","wide"]},
 {theme:"Confidence / mindset",keywords:["confidence","nervous","pressure","anxious","mindset"]},
 {theme:"Session time management",keywords:["ran out of time","time management","pacing","rushed","overran"]},
 {theme:"Weather / conditions",keywords:["rain","weather","wet","heat","conditions"]},
 {theme:"Team dynamics",keywords:["team spirit","dynamics","conflict","argument","clique"]}
];
function detectReflectionThemes(text){
 let lower=String(text||"").toLowerCase();
 return REFLECTION_THEMES.filter(t=>t.keywords.some(k=>lower.includes(k))).map(t=>t.theme);
}
function reflectionThemeCounts(){
 let counts={};
 db.reflections.forEach(r=>{
  let tags=(r.autoTags&&r.autoTags.length)?r.autoTags:detectReflectionThemes(reflectionSearchableText(r).join(" "));
  tags.forEach(t=>{counts[t]=(counts[t]||0)+1});
 });
 return Object.entries(counts).sort((a,b)=>b[1]-a[1]);
}
function recurringThemesCardHtml(){
 let counts=reflectionThemeCounts().filter(([,c])=>c>=2);
 if(!counts.length)return "";

}

// Sessions/matches don't carry a playerId list the way assessments do, so
// team/season scoping matches them by team name (session.squad / match.team)
// directly when possible, and falls back to "attended/played by someone in
// the scoped roster" for scopes (player/group/tournament) that don't map to
// a single team name — same fallback buildTeamReport already relies on.
function sessionsInScope(scope,from,to){
 if(scope.type==="team")return activeSessions().filter(s=>s.squad===scope.value&&inRange(s.date,from,to));
 if(scope.type==="season"){
  let season=db.seasons.find(x=>x.id===scope.value);
  return season&&season.team?activeSessions().filter(s=>s.squad===season.team&&inRange(s.date,from,to)):[];
 }
 if(scope.type==="all")return activeSessions().filter(s=>inRange(s.date,from,to));
 let names=new Set(playersInScope(scope).map(p=>p.name));
 return activeSessions().filter(s=>inRange(s.date,from,to)&&(s.attendees||[]).some(n=>names.has(n)));
}
function matchesInScope(scope,roster,from,to){
 if(scope.type==="team")return db.matches.filter(m=>m.team===scope.value&&inRange(m.date,from,to));
 if(scope.type==="season"){
  let season=db.seasons.find(x=>x.id===scope.value);
  return season&&season.team?db.matches.filter(m=>m.team===season.team&&inRange(m.date,from,to)):[];
 }
 if(scope.type==="all")return db.matches.filter(m=>inRange(m.date,from,to));
 let seen=new Set(),out=[];
 roster.forEach(p=>{playerMatches(p).forEach(m=>{if(inRange(m.date,from,to)&&!seen.has(m.id)){seen.add(m.id);out.push(m)}})});
 return out.sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));
}

 }
 if(document.getElementById("crbAttendance").checked){

 }
 if(document.getElementById("crbReflections").checked){
  let teamFilter=scope.type==="team"?scope.value:(scope.type==="season"?(db.seasons.find(x=>x.id===scope.value)||{}).team||null:null);
  let list=db.reflections.filter(r=>{
   if(!inRange(r.date,from,to))return false;
   if(!teamFilter)return true;
   let s=r.sessionId?db.sessions.find(x=>x.id===r.sessionId):null;
   let m=r.matchId?db.matches.find(x=>x.id===r.matchId):null;
   if(s)return s.squad===teamFilter;
   if(m)return m.team===teamFilter;
   return false;
  });
  sections.push(`<h2>Reflections (${list.length})</h2>${list.length?list.map(r=>`<div class="item"><div><b>${esc(r.session||"Reflection")}</b><div class="muted">${esc(fmtDate(r.date))} · Rating ${esc(r.rating)}/5</div><small>${esc(reflectionWentWellText(r))}</small></div></div>`).join(""):empty(teamFilter?"No reflections linked to this team's sessions/matches in range.":"No reflections in range.")}`);
 }
 if(document.getElementById("crbPlayers").checked){
  let list=roster.slice().sort((a,b)=>String(a.name||"").localeCompare(String(b.name||"")));
  sections.push(`<h2>Player Roster (${list.length})</h2>${list.length?list.map(p=>`<div class="item"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.role||"Player")}${p.team?" · "+esc(p.team):""}</div></div></div>`).join(""):empty("No players in this scope.")}`);
 }
 if(!sections.length){alert("Pick at least one section to include.");return}
 reportShell(esc(title),`${esc(scopeLabel(scope))} · ${rangeLabel(from,to)}`,sections.join(""));
}

 let p=db.players.find(x=>x.id===document.getElementById("certPlayer").value);
 if(!p)return;
 let template=document.getElementById("certTemplate").value;
 let achievement=template==="Custom"?(document.getElementById("certCustomText").value||"Achievement").trim():template;
 let date=document.getElementById("certDate").value||today();
 let signedBy=(document.getElementById("certSignedBy").value||"").trim();
 if(signedBy&&signedBy!==db.settings.coachName){db.settings.coachName=signedBy;save()}
 let body=`<div class="certBox"><div class="certBoxInner">
 <span class="certCorner ctl"></span><span class="certCorner ctr"></span><span class="certCorner cbl"></span><span class="certCorner cbr"></span>
 <div class="certSeal">${certificateEmoji(template)}</div>
 <div class="certTitle">Certificate of Achievement</div>
 <div class="certOrnament">✦ ✦ ✦</div>
 <div class="certSub">This certifies that</div>
 <div class="certNameWrap"><div class="certName">${esc(p.name)}</div><svg class="certNameFlourish" viewBox="0 0 300 16" preserveAspectRatio="none"><path d="M2 8 Q75 1 150 8 T298 8" fill="none" stroke="#c9a13b" stroke-width="2"/></svg></div>
 <div class="certSub">has been awarded, in recognition of outstanding commitment and performance</div>
 <div class="certAwardBadge"><span class="certAwardOrnament">✦</span>${esc(achievement)}<span class="certAwardOrnament">✦</span></div>
 <div class="certFooterRow">
 <div class="certFooterCol"><div class="certFooterVal">${esc(fmtDate(date))}</div><div class="certFooterLine"></div><div class="certFooterLabel">Date</div></div>
 <div class="certFooterCol"><div class="certFooterVal">${signedBy?esc(signedBy):""}</div><div class="certFooterLine"></div><div class="certFooterLabel">Coach's Signature</div></div>
 </div>
 </div></div>`;
 setPrintTitle(`Certificate — ${p.name}`);
 modal(`<div class="sheetHead noPrint"><h2>Certificate</h2><button class="x" onclick="closeM()">×</button></div><div class="report">${body}<div class="reportActions noPrint"><button class="btn primary" onclick="printCertificate()">Print / Save PDF</button></div></div>`);
}
// Certificates read better landscape than the portrait layout every other
// printed report uses, so a scoped @page rule is injected only for this
// print and removed again on the shared afterprint listener below.
function printCertificate(){
 let style=document.createElement("style");
 style.id="certPrintStyle";
 style.textContent="@page{size:landscape;margin:10mm}";
 document.head.appendChild(style);
 printReport();
}
window.addEventListener("afterprint",()=>{let s=document.getElementById("certPrintStyle");if(s)s.remove()});
function monthKey(d){return String(d||"").slice(0,7)}
function fmtMonthKey(mk){if(!mk||!/^\d{4}-\d{2}/.test(mk))return mk||"";let[y,m]=mk.split("-");let names=["January","February","March","April","May","June","July","August","September","October","November","December"];return `${names[Number(m)-1]||m} ${y}`}
function monthlyReport(){
 modal(`<div class="sheetHead"><h2>Monthly Coaching Report</h2><button class="x" onclick="closeM()">×</button></div>
 <label>Select month<input type="month" id="monthlyReportMonth" value="${today().slice(0,7)}"></label>
 <button class="btn primary" style="margin-top:15px" onclick="buildMonthlyReport()">Generate Report</button>`);
}
function buildMonthlyReport(){
 let mk=(document.getElementById("monthlyReportMonth").value||today().slice(0,7));
 let ss=activeSessions().filter(x=>monthKey(x.date)===mk),aa=db.assessments.filter(x=>monthKey(x.date)===mk),rr=db.reflections.filter(x=>monthKey(x.date)===mk),mm=db.matches.filter(x=>monthKey(x.date)===mk),hrs=ss.reduce((a,s)=>a+(+s.duration||0),0)/60;
 reportShell("Monthly Coaching Report",fmtMonthKey(mk),`<div class="grid g4"><div class="card stat"><span>Sessions</span><b>${ss.length}</b></div><div class="card stat"><span>Hours</span><b>${hrs.toFixed(1)}</b></div><div class="card stat"><span>Assessments</span><b>${aa.length}</b></div><div class="card stat"><span>Reflections</span><b>${rr.length}</b></div></div><h2>Sessions</h2>${ss.length?ss.map(s=>`<div class="card"><b>${esc(fmtDate(s.date))} · ${esc(s.title||"—")}</b> <span class="tag">${esc(sessionTypeLabel(s.sessionType))}</span><p>${esc(s.objectives||"")}</p></div>`).join(""):empty("No sessions in this month.")}<h2>Assessments</h2>${aa.length?aa.map(a=>`<div class="card"><b>${esc(a.player)} · ${assessmentAvg(a)}/10</b><p>${esc(a.priority||"")}</p></div>`).join(""):empty("No assessments in this month.")}<h2>Match actions</h2>${mm.length?mm.map(m=>`<div class="card"><b>${esc(m.team)} vs ${esc(m.opp)}</b><p>${esc(m.actions||m.notes||"")}</p></div>`).join(""):empty("No match notes in this month.")}`)}

 if(!activePlayers().length){alert("Add a player first.");return}
 modal(`<div class="sheetHead"><h2>Player Development Report</h2><button class="x" onclick="closeM()">×</button></div>
 <label>Select player<select id="reportPlayer">${db.players.map((p,i)=>`<option value="${i}">${esc(p.name)}</option>`).join("")}</select></label>

function buildPlayerReport(){
 let p=db.players[+document.getElementById("reportPlayer").value];
 let{from,to}=reportRangeValues();
 let aa=db.assessments.filter(a=>a.player===p.name&&inRange(a.date,from,to)).sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));
 let latest=aa.slice(-1)[0];
 let disciplineTrend={};
 aa.forEach(a=>{
  assessmentDisciplines(a).forEach(d=>{
   let score=Number(disciplineAvg(a,d));
   if(!Number.isFinite(score))return;
   if(!disciplineTrend[d])disciplineTrend[d]={first:score,last:score,count:1};
   else{disciplineTrend[d].last=score;disciplineTrend[d].count++}
  });
 });
 let matches=playerMatches(p).filter(m=>inRange(m.date,from,to)).slice().sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));
 let battingEntries=matches.map(m=>(m.battingReview||[]).find(r=>r.name===p.name)).filter(Boolean);
 let bowlingEntries=matches.map(m=>(m.bowlingReview||[]).find(r=>r.name===p.name)).filter(Boolean);
 let totalRuns=battingEntries.reduce((s,r)=>s+(+r.runs||0),0);
 let totalWickets=bowlingEntries.reduce((s,r)=>s+(+r.wickets||0),0);
 let backToBackCount=0;
 for(let i=1;i<matches.length;i++){
  let prev=new Date(matches[i-1].date+"T00:00:00Z"),cur=new Date(matches[i].date+"T00:00:00Z");
  let gapDays=Math.round((cur-prev)/86400000);
  if(gapDays<=1)backToBackCount++;
 }
 let matchTrendHtml="";
 if(battingEntries.length>=2||bowlingEntries.length>=2){
  let half=arr=>{let mid=Math.ceil(arr.length/2);return{early:arr.slice(0,mid),late:arr.slice(mid)}};
  let avgOf=arr=>arr.length?arr.reduce((s,v)=>s+v,0)/arr.length:0;
  let rows=[];
  if(battingEntries.length>=2){
   let{early,late}=half(battingEntries);
   let earlyAvg=avgOf(early.map(r=>+r.runs||0)),lateAvg=avgOf(late.map(r=>+r.runs||0));
   rows.push({label:"Runs per innings",first:earlyAvg,last:lateAvg});
  }
  if(bowlingEntries.length>=2){
   let{early,late}=half(bowlingEntries);
   let earlyAvg=avgOf(early.map(r=>+r.wickets||0)),lateAvg=avgOf(late.map(r=>+r.wickets||0));
   rows.push({label:"Wickets per match",first:earlyAvg,last:lateAvg});
  }
  matchTrendHtml=`<h2>Match Performance Trend</h2><div class="card"><p class="muted" style="margin-bottom:8px">Earlier matches in this range vs more recent ones.</p>${rows.map(r=>{let diff=(r.last-r.first).toFixed(1);let sign=r.last>=r.first?"+":"";let color=r.last>=r.first?"var(--g)":"var(--red)";return `<div style="margin-bottom:6px"><b>${esc(r.label)}:</b> ${r.first.toFixed(1)} → ${r.last.toFixed(1)} <span style="color:${color};font-weight:700">(${sign}${diff})</span></div>`}).join("")}</div>`;
 }
 let teamSessions=(p.team&&p.available!=="no")?activeSessions().filter(s=>s.squad===p.team&&s.sessionType!=="player"&&inRange(s.date,from,to)):[];
 let attended=teamSessions.filter(s=>(s.attendees||[]).includes(p.name)).length;
 let attendanceRate=teamSessions.length?Math.round(attended/teamSessions.length*100):null;
 let goalProgressHtml="";
 if(p.goalTargetDate&&p.goalSetDate){
  let targetDate=new Date(p.goalTargetDate+"T00:00:00Z");
  let todayDate=new Date(today()+"T00:00:00Z");
  let daysLeft=Math.round((targetDate-todayDate)/86400000);
  let goalAssessments=db.assessments.filter(a=>a.player===p.name&&a.date>=p.goalSetDate).sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));
  let goalTrend={};
  goalAssessments.forEach(a=>{
   assessmentDisciplines(a).forEach(d=>{
    let score=Number(disciplineAvg(a,d));
    if(!Number.isFinite(score))return;
    if(!goalTrend[d]){goalTrend[d]={first:score,last:score,count:1}}
    else{goalTrend[d].last=score;goalTrend[d].count++}
   });
  });
  let progressRows=Object.entries(goalTrend).filter(([,t])=>t.count>=2);
  goalProgressHtml=`<h2>Goal Progress</h2><div class="card"><p>${esc(p.focus||"Goal")}</p><p class="muted" style="margin-top:4px">Set ${esc(fmtDate(p.goalSetDate))} · Target ${esc(fmtDate(p.goalTargetDate))} · ${daysLeft>=0?`${daysLeft} day${daysLeft!==1?"s":""} remaining`:`${Math.abs(daysLeft)} day${Math.abs(daysLeft)!==1?"s":""} overdue`}</p>${progressRows.length?progressRows.map(([d,t])=>{let diff=(t.last-t.first).toFixed(1);let sign=t.last>=t.first?"+":"";let color=t.last>=t.first?"var(--g)":"var(--red)";return `<div style="margin-top:8px"><b>${esc(d)}:</b> ${t.first.toFixed(1)} → ${t.last.toFixed(1)} <span style="color:${color};font-weight:700">(${sign}${diff})</span></div>`}).join(""):`<p class="muted" style="margin-top:8px">Log at least 2 assessments since this goal was set to see progress.</p>`}</div>`;
 }
 reportShell("Player Development Report",`${p.name} · ${p.role||"Player"}${(from||to)?" · "+rangeLabel(from,to):""}`,
 `<div class="grid g4">
 <div class="card stat"><span>Assessments</span><b>${aa.length}</b></div>
 <div class="card stat"><span>Latest Overall</span><b>${latest?(assessmentAvg(latest)==="—"?"Technique only":assessmentAvg(latest)+"/10"):"—"}</b></div>
 <div class="card stat"><span>Matches</span><b>${matches.length}</b></div>
 <div class="card stat"><span>Attendance</span><b>${attendanceRate!==null?attendanceRate+"%":"—"}</b></div>
 </div>
 <div class="grid g2" style="margin-top:15px"><div class="card"><b>Squad</b><div>${esc(p.group||"—")}</div></div><div class="card"><b>Current goal</b><div>${esc(p.focus||"—")}</div></div></div>
 ${goalProgressHtml}
 <h2>Profile</h2><div class="card"><b>Strengths</b><p>${esc(p.strengths||"—")}</p><b>Development areas</b><p>${esc(p.areas||"—")}</p></div>
 ${Object.entries(disciplineTrend).some(([,t])=>t.count>=2)?`<h2>Development Trend</h2><div class="card">${Object.entries(disciplineTrend).filter(([,t])=>t.count>=2).map(([d,t])=>{let diff=(t.last-t.first).toFixed(1);let sign=t.last>=t.first?"+":"";let color=t.last>=t.first?"var(--g)":"var(--red)";return `<div style="margin-bottom:6px"><b>${esc(d)}:</b> ${t.first.toFixed(1)} → ${t.last.toFixed(1)} <span style="color:${color};font-weight:700">(${sign}${diff})</span></div>`}).join("")}</div>`:""}
 ${playerProgressPrintHtml(aa)}
 ${matches.length?`<h2>Match Performance</h2><div class="card"><p>${battingEntries.length?`Batting: ${totalRuns} run${totalRuns!==1?"s":""} across ${battingEntries.length} innings`:""}${battingEntries.length&&bowlingEntries.length?" · ":""}${bowlingEntries.length?`Bowling: ${totalWickets} wicket${totalWickets!==1?"s":""} across ${bowlingEntries.length} match${bowlingEntries.length!==1?"es":""}`:""}${!battingEntries.length&&!bowlingEntries.length?`Played in ${matches.length} match${matches.length!==1?"es":""}, no batting or bowling entries logged.`:""}</p>${backToBackCount>0?`<p style="margin-top:8px;color:var(--gold)"><b>⚠ Workload note:</b> ${backToBackCount} match${backToBackCount!==1?"es":""} played with a day or less rest before the next one.</p>`:""}</div>`:""}
 ${matchTrendHtml}
 <h2>Assessment History</h2>${aa.length?aa.slice().reverse().map(a=>`<div class="card"><b>${esc(fmtDate(a.date))} · ${assessmentAvg(a)==="—"?"Technique only":"Overall "+assessmentAvg(a)+"/10"}</b><div>${assessmentDisciplines(a).map(d=>`<span class="tag">${d}${disciplineAvg(a,d)==="—"?"":" "+disciplineAvg(a,d)+"/10"}</span>`).join("")}</div><p><b>Priority:</b> ${esc(a.priority||"—")}</p>${assessmentDetailHTML(a)}${techAssessHtml(a)}</div>`).join(""):empty("No assessments for this player.")}`)}
function seasonReport(){scopeAndRangeModal("Season / Full Report","buildSeasonReport")}
function buildSeasonReport(){
 let scope=scopeValues();
 let{from,to}=reportRangeValues();
 let roster=playersInScope(scope);
 let rosterNames=new Set(roster.map(p=>p.name));
 let sessions=activeSessions().filter(s=>inRange(s.date,from,to));
 let reflections=db.reflections.filter(r=>inRange(r.date,from,to));
 let matches=db.matches.filter(m=>inRange(m.date,from,to));
 let hrs=sessions.reduce((a,s)=>a+(+s.duration||0),0)/60;
 let wins=matches.filter(m=>matchResultOutcome(m)==="Win").length;
 let losses=matches.filter(m=>matchResultOutcome(m)==="Loss").length;
 let draws=matches.filter(m=>matchResultOutcome(m)==="Draw").length;
 let categoryCounts=OBJECTIVE_CATEGORIES.map(c=>({name:c,count:sessions.filter(s=>(s.objectiveTags||[]).includes(c)).length})).sort((a,b)=>b.count-a.count).filter(c=>c.count>0);
 let attendanceRates=roster.map(p=>{
  if(p.available==="no")return null;
  let teamSessions=p.team?sessions.filter(s=>s.squad===p.team):[];
  if(!teamSessions.length)return null;
  let attended=teamSessions.filter(s=>(s.attendees||[]).includes(p.name)).length;
  return attended/teamSessions.length*100;
 }).filter(r=>r!==null);
 let avgAttendance=attendanceRates.length?Math.round(attendanceRates.reduce((a,b)=>a+b,0)/attendanceRates.length):null;
 let mostImproved=roster.map(p=>{
  let aa=db.assessments.filter(a=>a.player===p.name&&inRange(a.date,from,to)).sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));
  if(aa.length<2)return null;
  let first=Number(assessmentAvg(aa[0])),last=Number(assessmentAvg(aa[aa.length-1]));
  if(!Number.isFinite(first)||!Number.isFinite(last))return null;
  return{name:p.name,diff:last-first,first,last};
 }).filter(Boolean).filter(x=>x.diff>0).sort((a,b)=>b.diff-a.diff).slice(0,5);
 reportShell(`Season / Full Report — ${esc(scopeLabel(scope))}`,rangeLabel(from,to),
 `<div class="grid g4"><div class="card stat"><span>Sessions</span><b>${sessions.length}</b></div><div class="card stat"><span>Hours</span><b>${hrs.toFixed(1)}</b></div><div class="card stat"><span>Players</span><b>${roster.length}</b></div><div class="card stat"><span>Matches</span><b>${matches.length}</b></div></div>
 ${matches.length?`<div class="grid g3" style="margin-top:12px"><div class="card stat"><span>Wins</span><b>${wins}</b></div><div class="card stat"><span>Losses</span><b>${losses}</b></div><div class="card stat"><span>Draws</span><b>${draws}</b></div></div>`:""}
 ${avgAttendance!==null?`<div class="card" style="margin-top:12px"><span class="muted">Average Attendance</span><div style="font-size:22px;font-weight:800">${avgAttendance}%</div></div>`:""}
 ${categoryCounts.length?`<h2>Coaching Focus This Period</h2><div class="card">${categoryCounts.map(c=>`<div style="display:flex;justify-content:space-between;padding:4px 0"><span>${esc(c.name)}</span><b>${c.count} session${c.count!==1?"s":""}</b></div>`).join("")}</div>`:""}
 ${mostImproved.length?`<h2>Most Improved</h2><div class="card">${mostImproved.map(m=>`<div style="display:flex;justify-content:space-between;padding:4px 0"><span>${esc(m.name)}</span><b style="color:var(--g)">${m.first.toFixed(1)} → ${m.last.toFixed(1)} (+${m.diff.toFixed(1)})</b></div>`).join("")}</div>`:""}
 <h2>Players</h2>${roster.map(p=>`<div class="card"><b>${esc(p.name)} · ${esc(p.role||"")}</b><p>${esc(p.focus||"")}</p></div>`).join("")||empty("No players in this scope.")}
 <h2>Coach Reflections Summary</h2><div class="card"><p>${reflections.length} reflection${reflections.length!==1?"s":""} logged this period.</p></div>`)}

 <table class="reportTable"><tr><th>Date</th><th>Title</th><th>Type</th><th>Focus</th><th>Categories</th><th>Objectives</th></tr>${sessions.slice().sort((a,b)=>sessionDateTimeKey(a).localeCompare(sessionDateTimeKey(b))).map(s=>`<tr><td>${esc(fmtDate(s.date))}</td><td>${esc(s.title||"—")}</td><td>${esc(sessionTypeLabel(s.sessionType))}</td><td>${esc(s.focus)}</td><td>${(s.objectiveTags||[]).map(t=>esc(t)).join(", ")||"—"}</td><td>${esc(s.objectives)}</td></tr>`).join("")}</table>`:empty("No sessions documented."));

function coachReport(){reportRangeModal("Coach Development Report","buildCoachReport")}
function buildCoachReport(){
 let{from,to}=reportRangeValues();
 let reflections=db.reflections.filter(r=>inRange(r.date,from,to));
 let objectiveRatingAgg={};
 reflections.forEach(r=>{
  if(!r.objectiveRatings)return;
  Object.entries(r.objectiveRatings).forEach(([cat,val])=>{
   let num=Number(val);
   if(!Number.isFinite(num))return;
   if(!objectiveRatingAgg[cat])objectiveRatingAgg[cat]={sum:0,count:0};
   objectiveRatingAgg[cat].sum+=num;objectiveRatingAgg[cat].count++;
  });
 });
 let objectiveRatingRows=Object.entries(objectiveRatingAgg).map(([cat,d])=>({cat,avg:d.sum/d.count,count:d.count})).sort((a,b)=>b.avg-a.avg);
 reportShell("Coach Development Report",rangeLabel(from,to),
 `${objectiveRatingRows.length?`<h2 style="margin-top:0">Objective Achievement — Term Average</h2><div class="card">${objectiveRatingRows.map(r=>`<div style="display:flex;justify-content:space-between;padding:4px 0"><span>${esc(r.cat)} <span class="muted" style="font-size:var(--fs-2)">(${r.count} reflection${r.count!==1?"s":""})</span></span><b>${r.avg.toFixed(1)}/5</b></div>`).join("")}</div>`:""}
 ${reflections.length?reflections.map(r=>{
  let reasonsPart=(r.betterReasons&&r.betterReasons.length)?r.betterReasons.join(", "):"";
  let detailPart=r.betterDetail!==undefined?r.betterDetail:(r.betterReasons===undefined?(r.better||""):"");
  let betterText=[reasonsPart,detailPart].filter(Boolean).join(" — ")||"—";
  let learningsText=reflectionTakeawayText(r)||"—";
  let wentWellText=reflectionWentWellText(r)||"—";
  let nextFocusText=reflectionNextFocusText(r)||"—";
  let objectiveRatingsHtml=(r.objectiveRatings&&Object.keys(r.objectiveRatings).length)?`<p><b>Achieved Objectives:</b> ${Object.entries(r.objectiveRatings).map(([cat,val])=>`${esc(cat)} ${esc(val)}/5`).join(", ")}</p>`:"";
  return `<div class="card"><b>${esc(fmtDate(r.date))} · ${esc(r.session||"Coaching Reflection")}</b><p><b>Rating:</b> ${esc(r.rating)}/5</p><p><b>What went well:</b> ${esc(wentWellText)}</p><p><b>What could improve:</b> ${esc(betterText)}</p><p><b>Key takeaway:</b> ${esc(learningsText)}</p>${objectiveRatingsHtml}<p><b>Next focus:</b> ${esc(nextFocusText)}</p></div>`;

function handleRestoreFile(input){
 let file=input.files&&input.files[0];if(!file)return;
 let reader=new FileReader();
 reader.onload=()=>{
  let parsed;
  try{parsed=JSON.parse(reader.result)}catch(e){alert("Could not read this file — it may not be a valid backup.");input.value="";return}
  if(!parsed||typeof parsed!=="object"){alert("This doesn't look like a valid ProCoach OS backup file.");input.value="";return}
  if(!confirm("Restore this backup? This will replace all current data for this profile. This cannot be undone.")){input.value="";return}
  let licenseFromBackup=parsed._license;
  delete parsed._license;
  let scorerFromBackup=Array.isArray(parsed._scorerMatches)?parsed._scorerMatches:[];
  delete parsed._scorerMatches;
  let videoFromBackup=Array.isArray(parsed._videoMoments)?parsed._videoMoments:[];
  delete parsed._videoMoments;
  ["sessions","reflections","players","assessments","matches","drills","events"].forEach(k=>{parsed[k]=Array.isArray(parsed[k])?parsed[k]:[]});
  parsed.matches.forEach(m=>{if(!m.id)m.id=uid("m")});
  parsed.drills.forEach(d=>{if(!d.id)d.id=uid("drill")});
  db=parsed;
  if(licenseFromBackup&&typeof licenseFromBackup==="object"){
   // Restore the license too, so a fresh device doesn't need the key
   // re-entered by hand. Any staleness (e.g. a plan change since this
   // backup was taken) self-corrects via revalidateLicenseIfNeeded() the
   // next time the app opens, since the server stays the source of truth.
   saveLicenseState(licenseFromBackup);
  }
  idbSet(DB_KEY,db).catch(err=>console.warn("IndexedDB save failed",err)).then(async()=>{
   for(const sm of scorerFromBackup){if(sm&&typeof sm.id==="string")await scorerDbPut(sm)}
   let vmAdded=0;try{vmAdded=await vmImport(videoFromBackup)}catch(e){}
   try{localStorage.setItem(DB_KEY,JSON.stringify(db))}catch(e){}
   alert("Backup restored successfully."+(scorerFromBackup.length?" Includes "+scorerFromBackup.length+" scored match"+(scorerFromBackup.length===1?"":"es")+".":"")+(vmAdded?" Added "+vmAdded+" video frame"+(vmAdded===1?"":"s")+".":""));
   location.reload();
  });
 };
 reader.readAsText(file);
}

let pushNotificationState="checking"; // "checking" | "unsupported" | "denied" | "off" | "on"
function urlBase64ToUint8Array(base64String){
 let padding="=".repeat((4-base64String.length%4)%4);
 let base64=(base64String+padding).replace(/-/g,"+").replace(/_/g,"/");
 let raw=atob(base64),arr=new Uint8Array(raw.length);
 for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
 return arr;
}
async function refreshPushNotificationState(){
 if(!("serviceWorker" in navigator)||!("PushManager" in window)){
  // On iOS specifically, this is also true whenever the app hasn't been
  // added to the Home Screen yet — the Push API genuinely doesn't exist in
  // a regular Safari tab there, not just non-functional.
  pushNotificationState="unsupported";
 } else if(Notification.permission==="denied"){
  pushNotificationState="denied";
 } else {
  try{
   let reg=await navigator.serviceWorker.ready;
   let sub=await reg.pushManager.getSubscription();
   pushNotificationState=sub?"on":"off";
  }catch(e){
   pushNotificationState="off";
  }
 }
 booking();
}
async function enablePushNotifications(){
 if(!requireWriteAccess())return;
 try{
  let permission=await Notification.requestPermission();
  if(permission!=="granted"){pushNotificationState="denied";booking();return}
  let reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)});
  let t=bookingTokens();
  await fetch(`${BOOKING_API}/api/booking/push-subscribe?t=${t.management}`,{
   method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(sub)
  });
  pushNotificationState="on";
  booking();
 }catch(e){
  alert("Couldn't enable notifications right now. Check your connection and try again.");
  refreshPushNotificationState();
 }
}
async function disablePushNotifications(){
 if(!requireWriteAccess())return;
 try{
  let reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(sub){
   let t=bookingTokens();
   await fetch(`${BOOKING_API}/api/booking/push-unsubscribe?t=${t.management}`,{
    method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({endpoint:sub.endpoint})
   });
   await sub.unsubscribe();
  }
  pushNotificationState="off";
