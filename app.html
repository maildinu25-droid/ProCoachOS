/* ===== Licensing / Trial =====

 expires with no key entered, becomes "expired" — a soft lock: existing
 data stays fully viewable and exportable (JSON Backup always works,
 regardless of tier), but nothing new can be added or edited until a paid
 plan is activated. Entering a valid key moves straight to "basic" (Teams

 unlocked, no caps) — both are paid tiers; there is no free continuation.

 validateLicenseKey() calls the real Dodo license backend (Cloudflare

 failure is treated distinctly from a genuinely invalid key (returns

 transient connectivity hiccup shouldn't punish a genuine new coach. Honest

 using a fresh email address impossible to stop. And submitEmailGate() sends a real welcome
 email via a Cloudflare Worker (coachbook-email-worker.js) -> Resend, but
 that send is fail-open by design: the trial starts regardless of whether
 the email succeeds, failures are only logged quietly (console.error), never
 shown to the user. What's still NOT verified: the email address itself is
 real/deliverable — only its format is checked.

// Silently re-checks a paid license against the server, at most once a day.
// Never downgrades on a network failure (fails open, retries next time) —
// only a definitive "no longer valid" answer from the server (subscription

const LICENSE_REVALIDATE_INTERVAL_MS=24*60*60*1000;
async function revalidateLicenseIfNeeded(){
 let lic=getLicenseState();
 if(lic.status!=="basic"&&lic.status!=="premium")return;
 if(!lic.licenseKey)return;
 let now=Date.now();
 let last=lic.lastRevalidatedAt||0;
 if(now-last<LICENSE_REVALIDATE_INTERVAL_MS)return;
 let{tier,networkError}=await validateLicenseKey(lic.licenseKey);
 if(networkError)return; // couldn't check — try again next time, don't touch access
 if(tier){
  lic.status=tier;lic.lastRevalidatedAt=now;
  saveLicenseState(lic);
  return;
 }
 // A definitive answer came back and this key/device is no longer valid
 // (cancelled, payment failed, or removed from this device) — lock it.
 lic.status="expired";lic.lastRevalidatedAt=now;
 saveLicenseState(lic);
 renderAll();
}
const TRIAL_STATUS_API="https://procoachos-dodo.maildinu25.workers.dev/api/trial/status";

// an in-progress TRIAL (which otherwise has no ongoing server check at all —
// only at signup and on a new-device restore). This is what lets an admin's
// suspend/grant action actually take effect for a coach who is mid-trial on
// their own device right now, without them doing anything:
//  - if the admin suspended this trial email -> lock the app, same as an
//    expired trial (a network error never does this — only a definitive
//    "suspended" answer from the server does).
//  - if the admin (or a real Dodo payment) has granted this email a license
//    since the trial started -> the app quietly upgrades itself to that

  let response=await fetch(TRIAL_STATUS_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:lic.email})});
  try{result=await response.json()}catch(_){}

 }

  lic.status="expired";lic.lastTrialStatusCheckedAt=now;

/* ===== Session timer ===== */
let timerDraft=null,timerRun=null,timerTick=null,timerWake=null,timerAudio=null,timerPaintedIdx=-1;
const TIMER_KEY="coachbook_timer";
function timerBuildSteps(s){
 let dur=parseInt(s.duration,10)||60,steps=[];
 let md=(s.mainDrillIds||[]).map(id=>db.drills.find(d=>d.id===id)).filter(Boolean),gd=(s.gameDrillIds||[]).map(id=>db.drills.find(d=>d.id===id)).filter(Boolean);
 const dm=d=>{let m=parseInt(d.duration,10);return m>0?m:null};
 if(s.warmup)steps.push({n:"Warm-up",m:Math.min(20,Math.max(5,Math.round(dur*0.15)))});
 if(md.length)md.forEach(d=>steps.push({n:d.name,m:dm(d)}));else if(s.main)steps.push({n:"Main skill block",m:null});
 if(gd.length)gd.forEach(d=>steps.push({n:d.name,m:dm(d)}));else if(s.game)steps.push({n:"Game block",m:null});
 if(!steps.length&&Array.isArray(s.netPlan)&&s.netPlan.length)s.netPlan.forEach((set,i)=>steps.push({n:"Net set "+(i+1)+(set.focus?" — "+set.focus:""),m:null}));
 let fixed=steps.reduce((a,x)=>a+(x.m||0),0),open=steps.filter(x=>!x.m);
 if(open.length){let each=Math.max(5,Math.round(Math.max(0,dur-fixed)/open.length));open.forEach(x=>x.m=each)}
 if(!steps.length)steps.push({n:s.focus||"Session",m:dur});
 return steps;
}
function timerSetup(id){
 let s=db.sessions.find(x=>x.id===id);if(!s)return;
 if(timerRun&&!timerRun.done){timerShow();return}
 timerDraft={id,title:sessionLabel(s),planned:parseInt(s.duration,10)||0,steps:timerBuildSteps(s)};
 timerSetupRender();
}
function timerSetupRender(){
 let d=timerDraft,total=d.steps.reduce((a,x)=>a+(+x.m||0),0);
 modal(`<div class="sheetHead"><h2>Session timer</h2><button class="x" onclick="closeM()">×</button></div>
 <p class="muted">${esc(d.title)} — adjust the blocks, then start. The screen stays on, and you get a beep and vibration at each change.</p>
 <div class="list">${d.steps.map((x,i)=>`<div class="item tmRow"><input value="${esc(x.n)}" onchange="timerDraft.steps[${i}].n=this.value" aria-label="Block name"><div class="tmStep"><button type="button" class="btn secondary iconBtn" onclick="timerAdj(${i},-1)">−</button><b>${x.m}</b><span class="muted">min</span><button type="button" class="btn secondary iconBtn" onclick="timerAdj(${i},1)">+</button></div><button type="button" class="btn danger iconBtn" onclick="timerDel(${i})" title="Remove">${icon("trash",16)}</button></div>`).join("")}</div>
 <button type="button" class="btn secondary" style="margin-top:10px" onclick="timerDraft.steps.push({n:'New block',m:10});timerSetupRender()">+ Add block</button>
 <div class="muted" style="margin:12px 0">Total ${total} min${d.planned?` · session planned for ${d.planned} min`:""}</div>
 <button type="button" class="btn primary" style="width:100%" onclick="timerStart()" ${d.steps.length?"":"disabled"}>▶ Start session</button>`);
}
function timerAdj(i,dir){let x=timerDraft.steps[i];x.m=Math.max(1,Math.min(180,(+x.m||0)+dir*(dir>0&&x.m>=20?5:dir<0&&x.m>20?5:1)));timerSetupRender()}
function timerDel(i){timerDraft.steps.splice(i,1);timerSetupRender()}
function timerSave(){try{localStorage.setItem(TIMER_KEY,JSON.stringify(timerRun))}catch(e){}}
function timerStart(){
 if(!timerDraft||!timerDraft.steps.length)return;
 try{timerAudio=timerAudio||new (window.AudioContext||window.webkitAudioContext)();if(timerAudio.state==="suspended")timerAudio.resume()}catch(e){}
 let st=timerDraft.steps.map(x=>({n:String(x.n||"Block").trim()||"Block",m:Math.max(1,+x.m||1)}));
 timerRun={title:timerDraft.title,steps:st,idx:0,endAt:Date.now()+st[0].m*60000,paused:false,remaining:0,startedAt:Date.now(),done:false};
 closeM();timerSave();timerWakeOn();timerBegin();
}
function timerBegin(){timerPaintedIdx=-1;timerShow();clearInterval(timerTick);timerTick=setInterval(timerStep,250);timerStep()}
function timerShow(){let el=document.getElementById("timerOverlay");if(el)el.classList.add("open");timerPaint(true)}
function timerStep(){
 let r=timerRun;if(!r||r.done||r.paused){timerClock();return}
 let guard=0;
 while(!r.done&&!r.paused&&Date.now()>=r.endAt&&guard++<50){
  let late=Date.now()-r.endAt;
  if(r.idx>=r.steps.length-1){timerFinish();return}
  r.idx++;r.endAt=r.endAt+r.steps[r.idx].m*60000;timerSave();
  if(late<5000)timerAlert();
 }
 timerPaint(false);timerClock();
}
function timerRemaining(){let r=timerRun;return r.paused?r.remaining:Math.max(0,r.endAt-Date.now())}
function timerClock(){
 let r=timerRun;if(!r||r.done)return;
 let ms=timerRemaining(),sec=Math.ceil(ms/1000),c=document.getElementById("tmClock"),f=document.getElementById("tmFill");
 if(c)c.textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
 let total=r.steps[r.idx].m*60000;if(f)f.style.width=Math.max(0,Math.min(100,100-ms/total*100))+"%";
}
function timerPaint(force){
 let el=document.getElementById("timerOverlay"),r=timerRun;if(!el||!r)return;
 if(r.done){el.innerHTML=`<div class="tmWrap"><div class="tmDone"><div style="font-size:54px">✅</div><h1>Session complete</h1><p class="muted">${esc(r.title)} · ${Math.max(1,Math.round((r.finishedAt-r.startedAt)/60000))} min</p><button class="btn primary" onclick="timerClose()">Close</button></div></div>`;timerPaintedIdx=-2;return}
 if(!force&&timerPaintedIdx===r.idx&&el.dataset.paused===String(r.paused))return;
 timerPaintedIdx=r.idx;el.dataset.paused=String(r.paused);
 let nx=r.steps[r.idx+1];
 el.innerHTML=`<div class="tmWrap"><div class="tmTop"><span class="muted">${esc(r.title)}</span><button class="btn secondary" onclick="timerEnd()">End</button></div>
 <div class="tmMid"><div class="tmSteps muted">Block ${r.idx+1} of ${r.steps.length}</div><h1 class="tmName">${esc(r.steps[r.idx].n)}</h1><div class="tmClock${r.paused?" paused":""}" id="tmClock">00:00</div><div class="tmBar"><div id="tmFill"></div></div><div class="tmNext muted">${nx?"Next: "+esc(nx.n)+" · "+nx.m+" min":"Last block"}</div></div>
 <div class="tmBtns"><button class="btn secondary" onclick="timerPrev()" aria-label="Previous block">⏮</button><button class="btn primary tmBig" onclick="timerPause()">${r.paused?"▶ Resume":"⏸ Pause"}</button><button class="btn secondary" onclick="timerAddMin()">+1 min</button><button class="btn secondary" onclick="timerSkip()" aria-label="Next block">⏭</button></div></div>`;
 timerClock();
}
function timerPause(){let r=timerRun;if(!r||r.done)return;if(r.paused){r.endAt=Date.now()+r.remaining;r.paused=false}else{r.remaining=Math.max(0,r.endAt-Date.now());r.paused=true}timerSave();timerPaint(true)}
function timerAddMin(){let r=timerRun;if(!r||r.done)return;if(r.paused)r.remaining+=60000;else r.endAt+=60000;timerSave();timerClock()}
function timerSkip(){let r=timerRun;if(!r||r.done)return;if(r.idx>=r.steps.length-1){timerFinish();return}r.idx++;r.endAt=Date.now()+r.steps[r.idx].m*60000;r.paused=false;timerSave();timerPaint(true)}
function timerPrev(){let r=timerRun;if(!r||r.done)return;if(r.idx>0)r.idx--;r.endAt=Date.now()+r.steps[r.idx].m*60000;r.paused=false;timerSave();timerPaint(true)}
function timerFinish(){let r=timerRun;if(!r)return;r.done=true;r.finishedAt=Date.now();clearInterval(timerTick);try{localStorage.removeItem(TIMER_KEY)}catch(e){}timerWakeOff();timerAlert();timerPaint(true)}
function timerEnd(){if(!confirm("End the session timer?"))return;timerClose()}
function timerClose(){clearInterval(timerTick);timerRun=null;try{localStorage.removeItem(TIMER_KEY)}catch(e){}timerWakeOff();let el=document.getElementById("timerOverlay");if(el){el.classList.remove("open");el.innerHTML=""}}
function timerAlert(){
 try{if(navigator.vibrate)navigator.vibrate([350,120,350,120,350])}catch(e){}
 try{let a=timerAudio;if(!a)return;if(a.state==="suspended")a.resume();[0,0.28,0.56].forEach(t=>{let o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.value=880;g.gain.setValueAtTime(0.0001,a.currentTime+t);g.gain.exponentialRampToValueAtTime(0.5,a.currentTime+t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+t+0.22);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+0.25)})}catch(e){}
}
async function timerWakeOn(){try{if("wakeLock" in navigator){timerWake=await navigator.wakeLock.request("screen")}}catch(e){}}
function timerWakeOff(){try{if(timerWake){timerWake.release();timerWake=null}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&timerRun&&!timerRun.done){timerWakeOn();timerStep()}});
function timerResume(){
 try{let raw=localStorage.getItem(TIMER_KEY);if(!raw)return;let r=JSON.parse(raw);
  if(!r||!Array.isArray(r.steps)||!r.steps.length||r.done)return;
  if(!r.paused&&Date.now()-r.endAt>6*3600*1000){localStorage.removeItem(TIMER_KEY);return}
  timerRun=r;timerBegin();timerWakeOn();
 }catch(e){}
}
/* ===== end session timer ===== */

/* ===== App lock ===== */
const LOCK_KEY="procoach_lock_v1",LOCK_FAIL_KEY="procoach_lock_fail";
let lkEntry="",lkHiddenAt=0,lkBusy=false;
function lockCfg(){try{return JSON.parse(localStorage.getItem(LOCK_KEY))}catch(e){return null}}
function lockSave(c){localStorage.setItem(LOCK_KEY,JSON.stringify(c))}
function lkB64(buf){let b=new Uint8Array(buf),s="";for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)}
function lkUnB64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
function lkRand(n){let a=new Uint8Array(n);crypto.getRandomValues(a);return a}
async function lockHash(secret,saltB64){
 let key=await crypto.subtle.importKey("raw",new TextEncoder().encode(secret),"PBKDF2",false,["deriveBits"]);
 let bits=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:lkUnB64(saltB64),iterations:120000},key,256);
 return lkB64(bits);
}
function lockSupported(){return !!(window.crypto&&crypto.subtle)}
function lockFail(){try{return JSON.parse(localStorage.getItem(LOCK_FAIL_KEY))||{n:0,until:0}}catch(e){return{n:0,until:0}}}
function lockPadBuild(){
 let pad=document.getElementById("lkPad");if(!pad||pad.dataset.built)return;pad.dataset.built="1";
 pad.innerHTML=["1","2","3","4","5","6","7","8","9","","0","⌫"].map(k=>k===""?`<span></span>`:`<button type="button" class="lkKey" onclick="lockKey('${k}')" aria-label="${k==="⌫"?"Delete":k}">${k}</button>`).join("");
}
function lockDots(){let c=lockCfg(),n=c?c.len:4,el=document.getElementById("lkDots");if(el)el.innerHTML=Array.from({length:n},(_,i)=>`<span class="${i<lkEntry.length?"on":""}"></span>`).join("")}
function lockMsg(t,bad){let m=document.getElementById("lkMsg");if(m){m.textContent=t;m.classList.toggle("bad",!!bad)}}
function lockShow(){
 let c=lockCfg();if(!c)return;
 document.documentElement.classList.add("appLocked");lkEntry="";lockPadBuild();lockDots();lockMsg("Enter PIN");
 let rf=document.getElementById("lkRecover");if(rf)rf.style.display="none";let pd=document.getElementById("lkPadWrap");if(pd)pd.style.display="";
 let bb=document.getElementById("lkBio");if(bb)bb.style.display=c.bio?"":"none";
 if(c.bio)setTimeout(lockBioTry,350);
}
function lockUnlock(){document.documentElement.classList.remove("appLocked");lkEntry="";try{localStorage.removeItem(LOCK_FAIL_KEY)}catch(e){}}
async function lockKey(k){
 if(lkBusy)return;let c=lockCfg();if(!c)return;
 let f=lockFail();if(Date.now()<f.until){lockMsg("Too many tries. Wait "+Math.ceil((f.until-Date.now())/1000)+"s",true);return}
 if(k==="⌫"){lkEntry=lkEntry.slice(0,-1);lockDots();return}
 if(lkEntry.length>=c.len)return;lkEntry+=k;lockDots();
 if(lkEntry.length<c.len)return;
 lkBusy=true;let ok=false;try{ok=(await lockHash(lkEntry,c.salt))===c.hash}catch(e){}lkBusy=false;
 if(ok){lockUnlock();return}
 let n=f.n+1,until=n>=5?Date.now()+30000*Math.pow(2,Math.min(4,n-5)):0;
 try{localStorage.setItem(LOCK_FAIL_KEY,JSON.stringify({n,until}))}catch(e){}
 lkEntry="";lockDots();lockMsg(until?"Too many tries. Wait "+Math.ceil((until-Date.now())/1000)+"s":"Wrong PIN",true);
 let box=document.querySelector(".lkBox");if(box){box.classList.remove("shake");void box.offsetWidth;box.classList.add("shake")}
}
function lockForgot(){let pd=document.getElementById("lkPadWrap"),rf=document.getElementById("lkRecover");if(pd)pd.style.display="none";if(rf){rf.style.display="block";let i=document.getElementById("lkCode");if(i){i.value="";i.focus()}}lockMsg("Enter your recovery code")}
function lockForgotCancel(){lockShow()}
async function lockRecover(){
 let c=lockCfg();if(!c||!c.recHash)return;let v=(document.getElementById("lkCode").value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
 let ok=false;try{ok=(await lockHash(v,c.recSalt))===c.recHash}catch(e){}
 if(!ok){lockMsg("That code doesn't match",true);return}
 localStorage.removeItem(LOCK_KEY);lockUnlock();alert("App lock removed. You can set a new PIN under Account & Backup → App lock.");if(typeof accountPage==="function")try{accountPage()}catch(e){}
}
async function lockBioTry(){
 let c=lockCfg();if(!c||!c.bio||!document.documentElement.classList.contains("appLocked"))return;
 try{await navigator.credentials.get({publicKey:{challenge:lkRand(32),allowCredentials:[{id:lkUnB64(c.bio),type:"public-key"}],userVerification:"required",timeout:60000}});lockUnlock()}catch(e){}
}
document.addEventListener("visibilitychange",()=>{
 let c=lockCfg();if(!c)return;
 if(document.hidden){lkHiddenAt=Date.now();return}
 if(timerRun&&!timerRun.done)return;
 if(lkHiddenAt&&Date.now()-lkHiddenAt>=(c.autoMin||0)*60000)lockShow();
});
function lockCardHtml(){
 let c=lockCfg();
 if(!lockSupported())return `<div class="card"><div class="muted">App lock needs a secure (https) connection and isn't available here.</div></div>`;
 if(!c)return `<div class="card"><div class="licRow"><div><b>App lock</b><div class="muted">Ask for a PIN to open the app. Good for a shared or lost phone — it keeps casual snoopers out of your players' details.</div></div></div><button class="btn primary" style="margin-top:12px" onclick="lockSetupSheet()">Turn on app lock</button></div>`;
 return `<div class="card"><div class="licRow"><div><b>App lock</b> <span class="tag">On</span><div class="muted">PIN · ${c.bio?"fingerprint / Face ID on":"PIN only"}</div></div><button class="btn secondary" onclick="lockShow()">Lock now</button></div>
 <div class="formgrid" style="margin-top:12px"><label class="full">Lock the app<select onchange="lockSetAuto(this.value)">${[[0,"As soon as I leave it"],[1,"After 1 minute away"],[5,"After 5 minutes away"],[15,"After 15 minutes away"]].map(([m,l])=>`<option value="${m}" ${(c.autoMin||0)===m?"selected":""}>${l}</option>`).join("")}</select></label></div>
 <div class="actionRow" style="margin-top:10px"><button class="btn secondary" onclick="lockChangeSheet()">Change PIN</button><button class="btn secondary" onclick="lockBioToggle()">${c.bio?"Turn off fingerprint":"Use fingerprint / Face ID"}</button></div>
 <div class="actionRow" style="margin-top:8px"><button class="btn secondary" onclick="lockNewCodeSheet()">New recovery code</button><button class="linkDanger" onclick="lockOffSheet()">Turn off app lock</button></div></div>`;
}
function lockSetAuto(v){let c=lockCfg();if(!c)return;c.autoMin=+v;lockSave(c)}
function lockPinFields(ids){return ids.map(([id,l])=>`<label class="full">${l}<input id="${id}" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="4–6 digits"></label>`).join("")}
function lockSetupSheet(){
 modal(`<div class="sheetHead"><h2>Turn on app lock</h2><button class="x" onclick="closeM()">×</button></div><p class="muted">Choose a 4–6 digit PIN. You'll get a recovery code next — keep it safe, because there's no other way back in if you forget the PIN.</p><div class="formgrid">${lockPinFields([["lkP1","New PIN"],["lkP2","Repeat PIN"]])}</div><div id="lkErr" class="muted" style="color:var(--red);margin-top:8px"></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="lockSetupDo()">Continue</button>`);
}
function lockErr(t){let e=document.getElementById("lkErr");if(e)e.textContent=t}
function lockCode(){const A="ABCDEFGHJKMNPQRSTUVWXYZ23456789";let r=lkRand(12),s="";for(let i=0;i<12;i++)s+=A[r[i]%A.length];return s}
async function lockMakeCfg(pin,old){
 let salt=lkB64(lkRand(16)),code=lockCode(),rs=lkB64(lkRand(16));
 let cfg={v:1,len:pin.length,salt,hash:await lockHash(pin,salt),recSalt:rs,recHash:await lockHash(code,rs),autoMin:old?old.autoMin:1,bio:old?old.bio:null};
 return {cfg,code};
}
function lockShowCode(code,title){
 modal(`<div class="sheetHead"><h2>${title}</h2></div><p class="muted">Write this down or save it somewhere safe. It's the only way to reset the lock if you forget your PIN. It won't be shown again.</p><div class="card" style="text-align:center;font-size:24px;font-weight:800;letter-spacing:2px;font-family:'Sora',sans-serif">${code.slice(0,4)}-${code.slice(4,8)}-${code.slice(8,12)}</div><label style="display:flex;gap:10px;align-items:center;margin:14px 0"><input type="checkbox" id="lkSaved" style="width:20px;height:20px"> I've saved my recovery code</label><button class="btn primary" style="width:100%" onclick="if(!document.getElementById('lkSaved').checked){alert('Please save the code first, then tick the box.');return}closeM();accountPage()">Done</button>`);
}
async function lockSetupDo(){
 let a=document.getElementById("lkP1").value,b=document.getElementById("lkP2").value;
 if(!/^\d{4,6}$/.test(a)){lockErr("PIN must be 4 to 6 digits.");return}
 if(a!==b){lockErr("The two PINs don't match.");return}
 let {cfg,code}=await lockMakeCfg(a,null);lockSave(cfg);lockShowCode(code,"Your recovery code");
}
async function lockCheckPin(pin){let c=lockCfg();if(!c)return false;try{return (await lockHash(pin,c.salt))===c.hash}catch(e){return false}}
function lockChangeSheet(){modal(`<div class="sheetHead"><h2>Change PIN</h2><button class="x" onclick="closeM()">×</button></div><div class="formgrid">${lockPinFields([["lkP0","Current PIN"],["lkP1","New PIN"],["lkP2","Repeat new PIN"]])}</div><div id="lkErr" class="muted" style="color:var(--red);margin-top:8px"></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="lockChangeDo()">Change PIN</button>`)}
async function lockChangeDo(){
 let o=document.getElementById("lkP0").value,a=document.getElementById("lkP1").value,b=document.getElementById("lkP2").value;
 if(!(await lockCheckPin(o))){lockErr("Current PIN is wrong.");return}
 if(!/^\d{4,6}$/.test(a)){lockErr("New PIN must be 4 to 6 digits.");return}
 if(a!==b){lockErr("The new PINs don't match.");return}
 let c=lockCfg(),salt=lkB64(lkRand(16));c.salt=salt;c.len=a.length;c.hash=await lockHash(a,salt);lockSave(c);closeM();accountPage();alert("PIN changed.");
}
function lockNewCodeSheet(){modal(`<div class="sheetHead"><h2>New recovery code</h2><button class="x" onclick="closeM()">×</button></div><p class="muted">The old code stops working.</p><div class="formgrid">${lockPinFields([["lkP0","Enter your PIN"]])}</div><div id="lkErr" class="muted" style="color:var(--red);margin-top:8px"></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="lockNewCodeDo()">Create new code</button>`)}
async function lockNewCodeDo(){
 if(!(await lockCheckPin(document.getElementById("lkP0").value))){lockErr("PIN is wrong.");return}
 let c=lockCfg(),code=lockCode(),rs=lkB64(lkRand(16));c.recSalt=rs;c.recHash=await lockHash(code,rs);lockSave(c);lockShowCode(code,"Your new recovery code");
}
function lockOffSheet(){modal(`<div class="sheetHead"><h2>Turn off app lock</h2><button class="x" onclick="closeM()">×</button></div><div class="formgrid">${lockPinFields([["lkP0","Enter your PIN"]])}</div><div id="lkErr" class="muted" style="color:var(--red);margin-top:8px"></div><button class="btn danger" style="width:100%;margin-top:12px" onclick="lockOffDo()">Turn off</button>`)}
async function lockOffDo(){if(!(await lockCheckPin(document.getElementById("lkP0").value))){lockErr("PIN is wrong.");return}localStorage.removeItem(LOCK_KEY);closeM();accountPage()}
async function lockBioToggle(){
 let c=lockCfg();if(!c)return;
 if(c.bio){c.bio=null;lockSave(c);accountPage();return}
 try{
  if(!window.PublicKeyCredential||!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())){alert("This device doesn't offer fingerprint or Face ID for web apps.");return}

    }else if(s.t==="line"||s.t==="arrow"){

      if(s.t==="arrow"){var ang=Math.atan2(q[1]-p[1],q[0]-p[0]),hl=lw*6;ctx.beginPath();ctx.moveTo(q[0],q[1]);ctx.lineTo(q[0]-hl*Math.cos(ang-.45),q[1]-hl*Math.sin(ang-.45));ctx.lineTo(q[0]-hl*Math.cos(ang+.45),q[1]-hl*Math.sin(ang+.45));ctx.closePath();ctx.fill()}

function coachingActivityScore(){
 // Four parts, each 0-100, averaged. Parts that cannot apply yet (e.g. no sessions to reflect on) are left out rather than scored as zero.
 let players=activePlayers(),names=new Set(players.map(p=>p.name));
 // 1. Assessment quality: average rating (1-5 scale, x20) across assessments of players still on the roster.
 let ratings=db.assessments.filter(a=>names.has(a.player)).map(a=>Number(assessmentAvg(a))).filter(Number.isFinite);
 let teamAvg=ratings.length?ratings.reduce((a,b)=>a+b,0)/ratings.length:0;
 // 2. Session consistency: last 4 calendar weeks (this week + 3 before). Each week scores held sessions + matches
 //    against your weekly goal (1 if none set). A week still in progress is only counted once it has met the goal.
 let goal=Math.max(1,Number(db.settings&&db.settings.weeklySessionGoal)||1);
 let t0=today();
 let weekScores=[];
 for(let w=0;w<4;w++){
  let ws=weekStart(w),we=weekEnd(w);
  let n=activeSessions().filter(s=>s.date>=ws&&s.date<=we&&s.date<=t0).length+db.matches.filter(m=>m.date>=ws&&m.date<=we&&m.date<=t0).length;
  let sc=Math.min(1,n/goal);
  if(w===0&&sc<1)continue; // current week not finished yet — no penalty
  weekScores.push(sc);
 }
 let sessionConsistency=weekScores.length?weekScores.reduce((a,b)=>a+b,0)/weekScores.length*100:0;
 // 3. Assessment coverage: share of active players with at least one assessment.
 let coverage=players.length?players.filter(p=>db.assessments.some(a=>a.player===p.name)).length/players.length*100:0;
 // 4. Reflection consistency: of sessions and matches held in the last 30 days, how many have a reflection.
 let cut=new Date();cut.setDate(cut.getDate()-30);let cutKey=localISO(cut);
 let held=activeSessions().filter(s=>s.date>=cutKey&&s.date<=t0).map(s=>({k:"sessionId",id:s.id})).concat(db.matches.filter(m=>m.date>=cutKey&&m.date<=t0).map(m=>({k:"matchId",id:m.id})));
 let reflected=held.filter(h=>db.reflections.some(r=>r[h.k]===h.id)).length;
 let reflectionConsistency=held.length?reflected/held.length*100:null;
 let parts=[teamAvg*20,sessionConsistency,coverage];
 if(reflectionConsistency!==null)parts.push(reflectionConsistency);
 let composite=Math.round(parts.reduce((a,b)=>a+b,0)/parts.length);
 return{composite,teamAvg,sessionConsistency,coverage,reflectionConsistency:reflectionConsistency===null?0:reflectionConsistency,goal};
}

 // in standalone Home Screen mode, where there's no pull-to-refresh or URL

}

// --- Net Plan builder (Sets -> Nets, each with batters/bowlers/duration) ---
// Mirrors how the coach already plans nets on paper: a Set is a rotation
// round, each Set has one or more Nets running in parallel, each Net has
// its own batter/bowler counts and duration. Kept as its own draft object
// (like sessionDrillLinks) so edits re-render instantly without a form submit.
// Names are picked from the full player roster (not just marked attendance)
// since session plans are usually built before the coach knows who'll show
// up — attendance is confirmed later, separately, on the day.
// Only when the session is a Team/Squad session does a specific team apply —
// for a 1-on-1 or Custom Group session there's no single team to scope to,
// so the full active roster is offered, same as Attendance does.
function currentNetPlanTeamFilter(){
 let typeSelect=document.getElementById("sessionTypeSelect");
 if(!typeSelect||typeSelect.value!=="team")return "";
 let teamSelect=document.querySelector('select[name="squadTeam"]');
 return teamSelect?teamSelect.value:"";
}
function rosterPlayerNames(){
 let teamFilter=currentNetPlanTeamFilter();
 let stIds=sessionStageIds();
 let players=(teamFilter?activePlayers().filter(p=>p.team===teamFilter):activePlayers()).filter(p=>!isReleased(p)&&(!stIds.length||stIds.includes(stageOf(p).id)));
 return players.map(p=>p.name);
}
// Two different reasons a name can be "taken" elsewhere in today's plan:
// 1) Nets within the same Set run side by side, so a player can only be in
//    one of them at a time — as a batter OR a bowler. Any other net/role
//    within this same Set blocks the name here.
// 2) Across different Sets (different time slots) there's no clash of time,
//    but picking the same player to BAT in set after set crowds out the
//    rest of the squad — so an existing batting slot elsewhere in the
//    session also blocks batting here, to keep batting reps spread around.
//    Bowling is the opposite: it's normal (and often necessary, with a
//    small pool of bowlers) for the same bowler to bowl across several
//    Sets/nets in one session, so bowling is never blocked across Sets —
//    only within the same Set, same as any other role clash.
function namesTakenElsewhere(si,ni,field){
 let taken=new Set();
 sessionNetPlanDraft.forEach((set,setIdx)=>{
  set.nets.forEach((net,netIdx)=>{
   if(setIdx===si){
    ["battersNames","bowlersNames"].forEach(f=>{
     if(netIdx===ni&&f===field)return;
     (net[f]||[]).forEach(n=>taken.add(n));
    });
   } else if(field==="battersNames"){
    (net.battersNames||[]).forEach(n=>taken.add(n));
   }
  });
 });
 return [...taken];
}
// Sets run one after another; nets within a set run side by side. So the
// useful count isn't "nets summed across every set" (that double-counts
// "Net 1" reused set after set) — it's the sets, plus the most nets
// running at once in any single set (i.e. how many net stations you need).
function netPlanCountLabel(netPlan){
 if(!netPlan||!netPlan.length)return "";
 let setCount=netPlan.length;
 let maxNets=Math.max(...netPlan.map(s=>s.nets.length));
 return `${setCount} set${setCount===1?"":"s"} · up to ${maxNets} net${maxNets===1?"":"s"} at a time`;
}
// A count box can hold a plain number ("4") or a range ("4-5") — cap
// selectable names at the largest number mentioned, or leave it uncapped
// if the box is empty/non-numeric.
function parseNetCap(value){
 let nums=String(value==null?"":value).match(/\d+/g);
 return nums&&nums.length?Math.max(...nums.map(Number)):Infinity;
}
// Renders selected names one-per-row (never a single comma-joined line) so
// a long list wraps vertically instead of forcing the flex row wider than
// the screen — a nowrap+ellipsis span inside a flex container without an
// explicit min-width still overflows its parent in most browsers.
function netPlanSelectedNamesHtml(names){
 if(!names.length)return `<div class="muted" style="font-size:var(--fs-3)">+ Add names</div>`;
 return names.map(n=>`<div style="font-size:var(--fs-3);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n)}</div>`).join("");
}
// How many Sets (not nets) a player is already down to bowl in, anywhere in
// this session's net plan — shown as a small badge next to their name in the
// bowler picker so the coach can spot workload before adding another Set.
function bowlerSetCountInPlan(name){
 return sessionNetPlanDraft.filter(set=>set.nets.some(net=>(net.bowlersNames||[]).includes(name))).length;
}
function netPlanNameFieldHtml(si,ni,field,label,net){
 let key=`${si}-${ni}-${field}`;
 let selected=net[field]||[];
 let cap=parseNetCap(field==="battersNames"?net.batters:net.bowlers);
 let capLabel=isFinite(cap)?` · max ${cap}`:"";
 let expanded=netPlanExpandedKeys.has(key);
 let names=rosterPlayerNames();
 let atCap=isFinite(cap)&&selected.length>=cap;
 let takenElsewhere=namesTakenElsewhere(si,ni,field);
 let optionsHtml=names.length?`<div class="netNamePickGrid" id="netPlayerOptions-${key}">${names.map(n=>{
  let isChecked=selected.includes(n);
  let isTaken=!isChecked&&takenElsewhere.includes(n);
  let disabled=(!isChecked&&(atCap||isTaken))?"disabled":"";
  let title=isTaken?` title="Already selected elsewhere in today's net plan"`:"";
  let bowlCount=field==="bowlersNames"?bowlerSetCountInPlan(n):0;
  let bowlBadge=bowlCount>0?`<span class="bowlCountBadge tag" style="padding:1px 6px;font-size:10px;flex-shrink:0;white-space:nowrap" title="${bowlCount} set${bowlCount===1?"":"s"} already bowled in this plan">${bowlCount}</span>`:"";
  // The name itself truncates with its own ellipsis (not the whole label),
  // so a long name never pushes the bowl-count badge out of view — the
  // badge has flex-shrink:0 and always stays visible at the row's end.
  return `<label class="${disabled?"isDisabled":""}"${title}><input type="checkbox" data-si="${si}" data-ni="${ni}" data-field="${field}" value="${esc(n)}" ${isChecked?"checked":""} ${disabled} onchange="handleNetPlanPlayerToggle(this)"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">${esc(n)}</span>${bowlBadge}</label>`;
 }).join("")}</div>`:`<div class="muted" style="font-size:var(--fs-2);margin-top:4px">${currentNetPlanTeamFilter()?"No players in this team yet.":"No players in roster yet."}</div>`;
 return `<div style="min-width:0">
  <div class="muted" style="font-size:var(--fs-3);font-weight:600;text-transform:uppercase;letter-spacing:.3px;display:flex;justify-content:space-between;align-items:center;gap:4px;cursor:pointer" onclick="toggleNetPlayerAssign('${key}')">
   <span id="netPlayerLabel-${key}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(label)}${capLabel}</span>
   <span class="chev" style="flex-shrink:0">${icon("chevronRight",12)}</span>
  </div>
  <div id="netPlayerSummary-${key}" style="margin-top:2px">${netPlanSelectedNamesHtml(selected)}</div>
  ${expanded?optionsHtml:""}
 </div>`;
}

 }
 return sessionNetPlanDraft.map((set,si)=>`
  <div class="card" style="margin-bottom:10px;padding:14px">

      <label style="margin:0">Bowlers <span class="muted" style="font-weight:400">(e.g. 4-5)</span><input value="${esc(net.bowlers||"")}" onchange="updateNetPlanField(${si},${ni},'bowlers',this.value)"></label>

      <button type="button" class="btn danger" style="padding:11px 12px" onclick="removeNetFromSet(${si},${ni})" title="Remove this net">×</button>

// Deliberately never calls renderNetPlanBuilder() — rebuilding the whole
// builder's innerHTML would recreate every scrollable name-picker grid from
// scratch and reset its scroll position to the top, which is exactly the
// annoyance we're avoiding. Instead this patches just the checkboxes/labels
// that need to change, in place, across every picker currently open.
function handleNetPlanPlayerToggle(el){
 let si=+el.dataset.si,ni=+el.dataset.ni,field=el.dataset.field,name=el.value,checked=el.checked;
 let net=sessionNetPlanDraft[si]&&sessionNetPlanDraft[si].nets[ni];
 if(!net)return;
 net[field]=net[field]||[];
 let cap=parseNetCap(field==="battersNames"?net.batters:net.bowlers);
 if(checked){
  if(isFinite(cap)&&net[field].length>=cap)return; // at capacity — the disabled attribute already blocks this, this is just a safety net
  if(!net[field].includes(name))net[field].push(name);
 } else {
  net[field]=net[field].filter(n=>n!==name);
 }
 // This list's own summary line, and its own greying — recomputed from
 // scratch for every unchecked box (capacity reached AND/OR taken
 // elsewhere), never just capacity alone: overwriting based on capacity
 // only would blindly re-enable a name that's greyed out for being taken
 // in another net/set, the moment anyone else in *this* list is toggled.
 let label=document.getElementById(`netPlayerSummary-${si}-${ni}-${field}`);
 if(label)label.innerHTML=netPlanSelectedNamesHtml(net[field]);
 let grid=document.getElementById(`netPlayerOptions-${si}-${ni}-${field}`);
 if(grid){
  let atCapNow=isFinite(cap)&&net[field].length>=cap;
  let takenNow=namesTakenElsewhere(si,ni,field);
  grid.querySelectorAll('input[type="checkbox"]').forEach(cb=>{
   if(cb.checked)return;
   let isTakenNow=takenNow.includes(cb.value);
   let dis=atCapNow||isTakenNow;
   cb.disabled=dis;
   let lbl=cb.closest("label");
   if(lbl){
    lbl.classList.toggle("isDisabled",dis);
    if(isTakenNow)lbl.title="Already selected elsewhere in today's net plan";else lbl.removeAttribute("title");
   }
  });
 }
 // This name's greying in every OTHER net/role picker, wherever it's
 // currently expanded (same Set: any role; other Sets: same role only —
 // see namesTakenElsewhere). Skipped entirely for pickers not on screen,
 // since they'll compute the correct state fresh whenever they're opened.
 sessionNetPlanDraft.forEach((set,setIdx)=>{
  set.nets.forEach((net2,netIdx)=>{
   if(setIdx===si&&netIdx===ni)return; // this exact net already handled above
   ["battersNames","bowlersNames"].forEach(f2=>{
    // Same-set: any role clashes (parallel nets). Other sets: only batting
    // clashes with batting elsewhere — bowlers are expected to repeat
    // across Sets, so bowling is never cross-set-blocked.
    let clashes=setIdx===si?true:(field==="battersNames"&&f2==="battersNames");
    if(!clashes)return;
    let grid2=document.getElementById(`netPlayerOptions-${setIdx}-${netIdx}-${f2}`);
    if(!grid2)return; // not currently expanded — nothing to patch
    let cb2=[...grid2.querySelectorAll('input[type="checkbox"]')].find(b=>b.value===name);
    if(!cb2||cb2.checked)return;
    let lbl2=cb2.closest("label");
    if(checked){
     cb2.disabled=true;
     if(lbl2){lbl2.classList.add("isDisabled");lbl2.title="Already selected elsewhere in today's net plan"}
    } else {
     let cap2=parseNetCap(f2==="battersNames"?net2.batters:net2.bowlers);
     let atCap2=isFinite(cap2)&&(net2[f2]||[]).length>=cap2;
     cb2.disabled=atCap2;
     if(lbl2){lbl2.classList.toggle("isDisabled",atCap2);if(!atCap2)lbl2.removeAttribute("title")}
    }
   });
  });
 });
 if(field==="bowlersNames")refreshBowlerCountBadges();
}
// Updates the "sets bowled so far" badge on every bowler picker currently
// expanded on screen, without rebuilding any of them (which would reset
// their scroll position). Only bowling toggles call this — batting never
// changes a bowl count.
function refreshBowlerCountBadges(){
 sessionNetPlanDraft.forEach((set,si2)=>{
  set.nets.forEach((net2,ni2)=>{
   let grid=document.getElementById(`netPlayerOptions-${si2}-${ni2}-bowlersNames`);
   if(!grid)return;
   grid.querySelectorAll("label").forEach(lbl=>{
    let cb=lbl.querySelector('input[type="checkbox"]');
    if(!cb)return;
    let count=bowlerSetCountInPlan(cb.value);
    let badge=lbl.querySelector(".bowlCountBadge");
    if(count>0){
     if(!badge){
      badge=document.createElement("span");
      badge.className="bowlCountBadge tag";
      badge.style.cssText="padding:1px 6px;font-size:10px;margin-left:4px;vertical-align:middle";
      lbl.appendChild(badge);
     }
     badge.textContent=count;
     badge.title=`${count} set${count===1?"":"s"} already bowled in this plan`;
    } else if(badge){
     badge.remove();
    }
   });
  });
 });
}
function addNetPlanSet(){
 let lastSet=sessionNetPlanDraft[sessionNetPlanDraft.length-1];
 let template=lastSet&&lastSet.nets.length?lastSet.nets[0]:{batters:2,bowlers:"4",duration:30};
 sessionNetPlanDraft.push({focus:"",nets:[{...template,battersNames:[],bowlersNames:[],focus:""}]});
 renderNetPlanBuilder();
}
function removeNetPlanSet(si){sessionNetPlanDraft.splice(si,1);renderNetPlanBuilder()}
function addNetToSet(si){
 let set=sessionNetPlanDraft[si];if(!set)return;
 let template=set.nets[set.nets.length-1]||{batters:2,bowlers:"4",duration:30};

function updateNetPlanField(si,ni,field,value){
 let net=sessionNetPlanDraft[si]&&sessionNetPlanDraft[si].nets[ni];
 if(!net)return;
 net[field]=(field==="batters"||field==="duration")?(value===""?"":Number(value)):value;
 if(field==="batters"||field==="bowlers"){
  // Count just changed — if it's now smaller than an existing name
  // selection, trim the excess names rather than leave an invalid state,
  // then re-render so the picker's cap/disabled state is current.
  // (Expanded/collapsed panels are unaffected — that state lives in
  // netPlanExpandedKeys, not in the DOM being rebuilt.)
  let namesField=field==="batters"?"battersNames":"bowlersNames";
  let cap=parseNetCap(net[field]);
  let trimmed=false;
  if(isFinite(cap)&&net[namesField]&&net[namesField].length>cap){
   net[namesField]=net[namesField].slice(0,cap);trimmed=true;

  // Rebuilding the whole builder here destroys whichever field the coach is tapping
  // next (this runs on blur), which dismisses the phone keyboard mid-typing. So only
  // rebuild when names were trimmed or that player picker is open; otherwise just
  // refresh the "· max N" label in place.
  let key=`${si}-${ni}-${namesField}`;
  if(trimmed||netPlanExpandedKeys.has(key)){renderNetPlanBuilder();}
  else{
   let lab=document.getElementById("netPlayerLabel-"+key);
   if(lab)lab.textContent=(field==="batters"?"Batters":"Bowlers")+(isFinite(cap)?" · max "+cap:"");

function findSessionConflict(s,excludeId){
 if(!s.date||!s.time)return null;
 let toMinutes=t=>{let[h,m]=String(t).split(":").map(Number);return h*60+(m||0)};
 let startA=toMinutes(s.time),endA=startA+(Number(s.duration)||60);
 return activeSessions().find(other=>{
  if(other.id===excludeId||other.date!==s.date||!other.time)return false;
  let startB=toMinutes(other.time),endB=startB+(Number(other.duration)||60);
  return startA<endB&&startB<endA;
 })||null;
}
function saveSession(e){
 e.preventDefault();

 let fd=new FormData(e.target);

 if(conflict&&!confirm(`This overlaps with "${sessionLabel(conflict)}" at ${conflict.time} on the same day. Save anyway?`))return;
 let sessionType=fd.get("sessionType")||"team";
 s.sessionType=sessionType;
 if(sessionType==="team"){
  s.squad=fd.get("squadTeam")||"";

 } else if(sessionType==="player"){
  let pid=fd.get("sessionPlayerId");

  s.sessionPlayerId=pid||"";
  s.squad=p?`1-on-1: ${p.name}`:"1-on-1 session";

 } else {
  s.squad=fd.get("squadCustom")||"";
  s.attendees=fd.getAll("attendees");
 }
 s.stageFilter=sessionType==="player"?[]:fd.getAll("stageFilter");

 s.cueTags=fd.getAll("cueTags");s.successTags=fd.getAll("successTags");
 delete s.squadTeam;delete s.squadCustom;
 s.mainDrillIds=[...sessionDrillLinks.main];
 s.gameDrillIds=[...sessionDrillLinks.game];
 s.attachment=sessionAttachment;
 s.netPlan=JSON.parse(JSON.stringify(sessionNetPlanDraft));
 if(editingSessionId){
  let idx=db.sessions.findIndex(x=>x.id===editingSessionId);
  if(idx>-1){let old=db.sessions[idx];s.id=editingSessionId;["campId","campRowId","campSnap","campNames"].forEach(k=>{if(old[k]!==undefined)s[k]=old[k]});db.sessions[idx]=s}

  let repeatChecked=repeatEl&&repeatEl.checked;
  let weeks=repeatChecked?Math.max(2,Math.min(26,+document.getElementById("sessionRepeatWeeks").value||2)):1;
  let baseDate=s.date;
  for(let i=0;i<weeks;i++){
   let copy={...s,attendees:[...(s.attendees||[])],objectiveTags:[...(s.objectiveTags||[])],cueTags:[...(s.cueTags||[])],successTags:[...(s.successTags||[])],mainDrillIds:[...(s.mainDrillIds||[])],gameDrillIds:[...(s.gameDrillIds||[])],netPlan:JSON.parse(JSON.stringify(s.netPlan||[]))};
   copy.id=uid("sess");

   }

 }
 editingSessionId=null;
 sessionDrillLinks={main:[],game:[]};sessionAttachment=null;sessionNetPlanDraft=[];
 closeM();save();
}

// "what could be better" reason chips are shown. The other block's fields

function setReflectionType(type){
 let input=document.getElementById("reflectionTypeInput");if(input)input.value=type;
 let sessBtn=document.getElementById("reflTypeSessionBtn"),matchBtn=document.getElementById("reflTypeMatchBtn");
 if(sessBtn)sessBtn.className="btn "+(type!=="match"?"primary":"secondary");

 if(sessReasons){sessReasons.style.display=type==="match"?"none":"";if(type==="match")sessReasons.querySelectorAll("input[type=checkbox]").forEach(cb=>cb.checked=false)}
 if(matchReasons){matchReasons.style.display=type==="match"?"":"none";if(type!=="match")matchReasons.querySelectorAll("input[type=checkbox]").forEach(cb=>cb.checked=false)}
 let wwSess=document.getElementById("reflWentWellSession"),wwMatch=document.getElementById("reflWentWellMatch");
 if(wwSess){wwSess.style.display=type==="match"?"none":"";if(type==="match")wwSess.querySelectorAll("input[type=checkbox]").forEach(cb=>cb.checked=false)}
 if(wwMatch){wwMatch.style.display=type==="match"?"":"none";if(type!=="match")wwMatch.querySelectorAll("input[type=checkbox]").forEach(cb=>cb.checked=false)}

// Nudges the coach to reflect on anything past-dated that hasn't been
// reflected on yet — practice sessions AND matches together, newest first.
function reflectPendingSessions(){
 let overdueSessions=activeSessions().filter(s=>s.date<today()&&!db.reflections.some(r=>r.sessionId===s.id)).map(s=>({kind:"session",id:s.id,date:s.date,sortKey:sessionDateTimeKey(s),label:sessionLabel(s)}));
 let overdueMatches=db.matches.filter(m=>m.date<today()&&!db.reflections.some(r=>r.matchId===m.id)).map(m=>({kind:"match",id:m.id,date:m.date,sortKey:m.date||"",label:matchLabel(m)}));
 let overdue=overdueSessions.concat(overdueMatches).sort((a,b)=>String(b.sortKey).localeCompare(String(a.sortKey)));
 if(!overdue.length)return;
 function openItem(item){item.kind==="match"?newReflectionForMatch(item.id):newReflectionForSession(item.id)}
 if(overdue.length===1){openItem(overdue[0]);return}
 modal(`<div class="sheetHead"><h2>Sessions &amp; Matches Awaiting Reflection</h2><button class="x" onclick="closeM()">×</button></div>
 <div class="list">${overdue.map((item,i)=>`<div class="item" style="cursor:pointer" onclick='reflectPendingOpen(${i})'><div><b>${esc(item.label)}</b><div class="muted">${esc(fmtDate(item.date))} · ${item.kind==="match"?"Match":"Session"}</div></div></div>`).join("")}</div>`);
 window._reflectPendingQueue=overdue;
}
function reflectPendingOpen(i){let item=(window._reflectPendingQueue||[])[i];if(!item)return;item.kind==="match"?newReflectionForMatch(item.id):newReflectionForSession(item.id)}
function editReflection(id){let x=db.reflections.find(r=>r.id===id);if(!x)return;editingReflectionId=id;modal(reflectionFormHtml(x,"edit"));renderReflectionObjectiveRatings(x.type==="match"?"":(x.sessionId||""));initReflectionSectionCounts()}
function initReflectionSectionCounts(){["wentWell","betterReasons","takeaway","nextFocus"].forEach(id=>updateFormSectionCount(id,"selected"))}
function saveReflection(e){
 e.preventDefault();
 if(!requireWriteAccess())return;
 let fd=new FormData(e.target);
 let x=Object.fromEntries(fd);
 x.type=x.type==="match"?"match":"session";
 x.momentIds=(x.momentIds||"").split(",").filter(Boolean);if(!x.momentIds.length)delete x.momentIds;
 x.betterReasons=fd.getAll("betterReasons");
 x.wentWellThemes=fd.getAll("wentWellThemes");
 x.takeawayThemes=fd.getAll("takeawayThemes");
 x.nextFocusThemes=fd.getAll("nextFocusThemes");
 let objectiveRatings={};
 if(x.type==="session"){
  OBJECTIVE_CATEGORIES.forEach((cat,idx)=>{
   let val=fd.get(`objRating_${idx}`);
   if(val){objectiveRatings[cat]=val}
  });
 }
 OBJECTIVE_CATEGORIES.forEach((cat,idx)=>{delete x[`objRating_${idx}`]});
 if(Object.keys(objectiveRatings).length)x.objectiveRatings=objectiveRatings;
 // Only the fields belonging to the chosen type are kept — the other
 // type's link/ratings are dropped even if they were left in the DOM
 // (e.g. switching type back and forth before saving).
 if(x.type==="match"){
  delete x.sessionId;delete x.objectiveRatings;
 } else {
  delete x.matchId;delete x.tacticalDecisions;delete x.playerManagement;
 }
 if(!x.sessionId)delete x.sessionId;
 if(!x.matchId)delete x.matchId;
 x.autoTags=detectReflectionThemes(reflectionSearchableText(x).join(" "));
 if(editingReflectionId){let idx=db.reflections.findIndex(r=>r.id===editingReflectionId);if(idx>-1){x.id=editingReflectionId;db.reflections[idx]=x}}
 else{x.id=uid("refl");db.reflections.push(x)}
 editingReflectionId=null;closeM();save();
}

const PLAYER_ROLES=["Batter","Bowler","All-rounder","Wicketkeeper","Wicketkeeper-Batter"];
function multiLineChartSvg(series){
 series=series.filter(s=>s.points&&s.points.length);
 if(!series.length)return "";
 let allDates=series.flatMap(s=>s.points.map(pt=>new Date(pt.date).getTime())).filter(Number.isFinite);
 let minD=Math.min(...allDates),maxD=Math.max(...allDates),span=(maxD-minD)||1;
 function xFor(d){return allDates.length>1?((new Date(d).getTime()-minD)/span)*100:50}
 function yFor(v){return 100-(((v-1)/9)*88)-6}
 let lines=series.map(s=>{
  let pts=s.points.map(pt=>`${xFor(pt.date).toFixed(1)},${yFor(pt.value).toFixed(1)}`).join(" ");
  let dots=s.points.map(pt=>`<circle cx="${xFor(pt.date).toFixed(1)}" cy="${yFor(pt.value).toFixed(1)}" r="1.6" fill="${s.color}"/>`).join("");
  let line=s.points.length>1?`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" vector-effect="non-scaling-stroke"/>`:"";
  return line+dots;
 }).join("");
 let legend=series.map(s=>`<span style="display:inline-flex;align-items:center;gap:4px;margin-right:12px"><span style="width:8px;height:8px;border-radius:50%;background:${s.color};display:inline-block"></span>${esc(s.name)}</span>`).join("");
 let dateLabel=allDates.length?`<div class="muted" style="display:flex;justify-content:space-between;font-size:var(--fs-1);margin-top:2px"><span>${esc(fmtDate(new Date(minD).toISOString().slice(0,10)))}</span>${allDates.length>1?`<span>${esc(fmtDate(new Date(maxD).toISOString().slice(0,10)))}</span>`:""}</div>`:"";
 return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="140" style="display:block">${lines}</svg>${dateLabel}<div class="muted" style="margin-top:6px;font-size:var(--fs-1)">${legend}</div>`;
}
const PROGRESS_CHART_COLORS=["var(--g)","var(--blue)","var(--gold)","var(--blue2)","var(--red)"];
// Hues spaced far apart (blue, orange, green, red, purple, cyan, yellow, magenta, lime, slate, brown, teal, navy, olive) so neighbouring skills never look alike.
const SKILL_CHART_COLORS=["#2563eb","#f97316","#16a34a","#dc2626","#9333ea","#06b6d4","#eab308","#db2777","#84cc16","#475569","#92400e","#0d9488","#1e3a8a","#a3a300"];
function assessmentSeriesFromList(assessments,mode,discipline,skill,colorOverride){
 if(mode==="overall"){
  let points=assessments.map(a=>({date:a.date,value:Number(assessmentAvg(a))})).filter(pt=>Number.isFinite(pt.value)&&pt.value>0);
  return[{name:"Overall",color:colorOverride||PROGRESS_CHART_COLORS[0],points}];
 }
 if(mode==="discipline"){
  let allDisciplines=[...new Set(assessments.flatMap(a=>assessmentDisciplines(a)))];
  return allDisciplines.map((d,i)=>{
   let points=assessments.filter(a=>assessmentDisciplines(a).includes(d)).map(a=>({date:a.date,value:Number(disciplineAvg(a,d))})).filter(pt=>Number.isFinite(pt.value)&&pt.value>0);
   return{name:d,color:PROGRESS_CHART_COLORS[i%PROGRESS_CHART_COLORS.length],points};
  }).filter(s=>s.points.length);
 }
 if(mode==="skill"){
  if(!discipline||!skill)return[];
  let skillIdx=allSkillsFor(discipline).indexOf(skill);
  if(skillIdx===-1)return[];
  let points=assessments.filter(a=>assessmentDisciplines(a).includes(discipline)&&a.ratings&&Array.isArray(a.ratings[discipline])).map(a=>({date:a.date,value:Number(a.ratings[discipline][skillIdx])})).filter(pt=>Number.isFinite(pt.value)&&pt.value>0);
  return[{name:skill,color:colorOverride||PROGRESS_CHART_COLORS[1],points}];
 }
 return[];
}
function playerAssessmentSeries(p,mode,discipline,skill){
 return assessmentSeriesFromList(playerAssessments(p),mode,discipline,skill);
}
let playerProgressState={mode:"overall",discipline:"Batting",skill:""};
function playerProgressChartHtml(p){

 let allDisciplines=[...new Set(assessments.flatMap(a=>assessmentDisciplines(a)))];
 if(!allDisciplines.includes(playerProgressState.discipline))playerProgressState.discipline=allDisciplines[0]||"Batting";

   <label class="progressSkillPicker" style="${playerProgressState.mode==="skill"?"":"display:none"}">Discipline<select onchange="playerProgressState.discipline=this.value;playerProgressState.skill='';renderPlayerProgressChart('${p.id}')">${allDisciplines.map(d=>`<option ${playerProgressState.discipline===d?"selected":""}>${esc(d)}</option>`).join("")}</select></label>
   <label class="progressSkillPicker" style="${playerProgressState.mode==="skill"?"":"display:none"}">Skill<select onchange="playerProgressState.skill=this.value;renderPlayerProgressChart('${p.id}')">${skillOptions.map(s=>`<option ${playerProgressState.skill===s?"selected":""}>${esc(s)}</option>`).join("")}</select></label>

  <div id="playerProgressChartBox">${playerProgressChartInner(p)}</div>
 </div>`;

function playerProgressPrintHtml(assessments){
 if(assessments.length<2)return "";
 let html=`<h2 class="section">Progress over time</h2>`;
 let overallSeries=assessmentSeriesFromList(assessments,"overall");
 if(overallSeries[0]&&overallSeries[0].points.length>=2){
  html+=`<div class="card"><b>Overall</b>${multiLineChartSvg(overallSeries)}</div>`;
 }
 let discSeries=assessmentSeriesFromList(assessments,"discipline").filter(s=>s.points.length>=2);
 if(discSeries.length){
  html+=`<div class="card" style="margin-top:8px"><b>By discipline</b>${multiLineChartSvg(discSeries)}</div>`;
 }
 let allDisciplines=[...new Set(assessments.flatMap(a=>assessmentDisciplines(a)))];
 allDisciplines.forEach(d=>{
  let skills=allSkillsFor(d);
  let skillSeries=skills.map((s,i)=>assessmentSeriesFromList(assessments,"skill",d,s,SKILL_CHART_COLORS[i%SKILL_CHART_COLORS.length])[0]).filter(s=>s&&s.points.length>=2);
  if(skillSeries.length){
   html+=`<div class="card" style="margin-top:8px"><b>${esc(d)} — by skill</b>${multiLineChartSvg(skillSeries)}</div>`;
  }
 });
 return html;
}

function playingStyleLabel(p){
 let parts=[];
 if(roleNeedsBatting(p.role||"Batter")&&p.battingHand)parts.push(p.battingHand);
 if(roleNeedsBowling(p.role||"")&&p.bowlingArm&&p.bowlingType){
  let bowlDesc=p.bowlingType==="Spin"&&p.spinType?`${p.bowlingArm} ${p.spinType}`:`${p.bowlingArm} ${p.bowlingType}`;
  parts.push(bowlDesc);
 }
 return parts.join(" · ")
}

function savePlayersBulk(e){
 e.preventDefault();
 if(!requireWriteAccess())return;
 let fd=new FormData(e.target);
 let lines=(fd.get("names")||"").split("\n").map(n=>n.trim()).filter(Boolean);
 if(!lines.length){alert("Enter at least one player name.");return}
 let team=fd.get("team")||"";
 let added=lines.map(line=>{
  let[namePart,rolePart]=line.split(",").map(x=>x?x.trim():"");
  let role=rolePart?(PLAYER_ROLES.find(r=>r.toLowerCase()===rolePart.toLowerCase())||""):"";
  return{id:uid("plyr"),name:namePart,team,role,group:"",age:"",strengths:"",areas:"",focus:"",notes:""};
 }).filter(p=>p.name);
 let existingNames=db.players.map(x=>x.name.trim().toLowerCase());
 let dupes=[...new Set(added.filter(p=>existingNames.includes(p.name.trim().toLowerCase())).map(p=>p.name))];
 if(dupes.length&&!confirm(`These names already exist in your roster: ${dupes.join(", ")}. Add them as new, separate players anyway?`))return;
 added.forEach(p=>db.players.push(p));
 closeM();save();
 alert(`${added.length} player${added.length!==1?"s":""} added.`);
}
function cascadePlayerRename(oldName,newName){
 if(!oldName||oldName===newName)return;
 db.assessments.forEach(a=>{if(a.player===oldName)a.player=newName});
 db.sessions.forEach(s=>{if(Array.isArray(s.attendees)){s.attendees=s.attendees.map(n=>n===oldName?newName:n)}});
 db.matches.forEach(m=>{
  (m.battingReview||[]).forEach(r=>{if(r.name===oldName)r.name=newName});
  (m.bowlingReview||[]).forEach(r=>{if(r.name===oldName)r.name=newName});
  if(Array.isArray(m.playingXI)){m.playingXI=m.playingXI.map(n=>n===oldName?newName:n)}
 });
 (db.camps||[]).forEach(c=>{(c.batches||[]).forEach(b=>{b.names=(b.names||[]).map(n=>n===oldName?newName:n)});Object.keys(c.attendance||{}).forEach(d=>{c.attendance[d]=(c.attendance[d]||[]).map(n=>n===oldName?newName:n)})});
}
function savePlayer(e){
 e.preventDefault();
 if(!requireWriteAccess())return;
 let p=Object.fromEntries(new FormData(e.target));
 if(editingPlayerId){
  let idx=db.players.findIndex(x=>x.id===editingPlayerId);
  if(idx>-1){
   let oldName=db.players[idx].name;
   let oldGoalSetDate=db.players[idx].goalSetDate;
   p.id=editingPlayerId;
   if(p.goalTargetDate)p.goalSetDate=oldGoalSetDate||today();
   db.players[idx]=p;
   if(oldName&&oldName!==p.name)cascadePlayerRename(oldName,p.name);
  }
 }
 else{
  if(p.goalTargetDate)p.goalSetDate=today();
  let dupe=db.players.find(x=>x.name&&p.name&&x.name.trim().toLowerCase()===p.name.trim().toLowerCase());
  if(dupe&&!confirm(`A player named "${dupe.name}" already exists${dupe.team?" ("+dupe.team+")":""}. Add "${p.name}" as a new, separate player anyway?`))return;
  p.id=uid("plyr");db.players.push(p);
 }
 editingPlayerId=null;closeM();save();
}

function restorePlayer(id){let p=db.players.find(x=>x.id===id);if(p){delete p.deletedAt;save();accountPage()}}
function permanentlyDeletePlayer(id){if(confirm("Permanently delete this player? This cannot be undone.")){db.players=db.players.filter(x=>x.id!==id);save();accountPage()}}

/* ===== Squad stages (Camp 1 → Camp 2 → Tournament → Released) ===== */
const DEFAULT_STAGES=[{id:"st1",name:"Camp 1"},{id:"st2",name:"Camp 2"},{id:"st3",name:"Tournament squad"},{id:"stR",name:"Released",released:true}];
let stageFilter="";
function stagesList(){let s=db.settings;if(!Array.isArray(s.stages)||!s.stages.length)s.stages=JSON.parse(JSON.stringify(DEFAULT_STAGES));if(!s.stages.some(x=>x.released))s.stages.push({id:"stR",name:"Released",released:true});return s.stages}
function stageOf(p){let L=stagesList();return L.find(s=>s.id===p.stage)||L[0]}
function isReleased(p){return !!stageOf(p).released}
function stagesInUse(){let first=stagesList()[0].id;return db.players.some(p=>!p.deletedAt&&p.stage&&p.stage!==first)}
function stageBadge(p){if(!stagesInUse())return "";let st=stageOf(p);return ` <span class="tag" style="${st.released?"background:var(--redTint);color:var(--red)":""}">${esc(st.name)}</span>`}
let squadTeam="";
function stagePlayers(id,team){return activePlayers().filter(p=>stageOf(p).id===id&&(!team||p.team===team)).sort((a,b)=>String(a.name||"").localeCompare(String(b.name||"")))}
function stageChipsHtml(){
 if(!stagesInUse())return "";
 let L=stagesList(),all=activePlayers().filter(p=>!playerTeamFilter||p.team===playerTeamFilter).length;
 const chip=(id,label,n)=>`<button type="button" class="stageChip${stageFilter===id?" on":""}" onclick="stageFilter='${id}';players()">${esc(label)} <b>${n}</b></button>`;
 return `<div class="stageChips noPrint">${chip("","All",all)}${L.map(s=>chip(s.id,s.name,stagePlayers(s.id,playerTeamFilter).length)).join("")}${stageFilter?`<button type="button" class="stageChip" onclick="stageListReport('${stageFilter}',playerTeamFilter)">${icon("print",14)} Print</button>`:""}</div>`;
}
function stageLogHtml(p){
 let L=stagesList(),nm=id=>(L.find(s=>s.id===id)||{name:"?"}).name,log=Array.isArray(p.stageLog)?p.stageLog:[];
 return log.length?log.map((e,i)=>`<div class="item"><div><b>${esc(nm(e.from))} → ${esc(nm(e.to))}</b><div class="muted">${esc(fmtDate(e.date))}${e.reason?" · "+esc(e.reason):""}</div></div><div class="toolbar"><button class="btn danger iconBtn" title="Delete this move" onclick="deleteStageLogEntry('${p.id}',${i})">${icon("trash",16)}</button></div></div>`).join(""):`<div class="muted">Still in ${esc(stageOf(p).name)} — no moves yet.</div>`;
}
function playerStageHtml(p){

 return `<h2 class="section">Selection</h2><div class="card"><label>Stage<select onchange="setPlayerStage('${p.id}',this.value)">${L.map(s=>`<option value="${s.id}" ${stageOf(p).id===s.id?"selected":""}>${esc(s.name)}</option>`).join("")}</select></label>
 <label style="margin-top:10px">Selection note (private)<textarea rows="2" onchange="setPlayerStageNote('${p.id}',this.value)" placeholder="Why selected / released, areas to revisit...">${esc(p.stageNote||"")}</textarea></label>
 <div style="margin-top:10px">${stageLogHtml(p)}</div></div>`;
}
function setPlayerStage(id,to){
 if(!requireWriteAccess())return;
 let p=db.players.find(x=>x.id===id);if(!p||stageOf(p).id===to)return;
 if(!Array.isArray(p.stageLog))p.stageLog=[];
 p.stageLog.push({date:today(),from:stageOf(p).id,to,reason:""});p.stage=to;db.settings.lastSelection=null;save();playerView(id);
}
function deleteStageLogEntry(id,i){
 if(!requireWriteAccess())return;
 let p=db.players.find(x=>x.id===id);if(!p||!Array.isArray(p.stageLog)||!p.stageLog[i])return;
 let L=stagesList(),nm=x=>(L.find(s=>s.id===x)||{name:"?"}).name,e=p.stageLog[i],isLast=i===p.stageLog.length-1;
 if(!confirm(`Delete the move "${nm(e.from)} → ${nm(e.to)}"?`+(isLast?`\n\n${p.name} goes back to ${nm(e.from)}.`:"\n\nTheir current stage stays the same."))) return;
 p.stageLog.splice(i,1);if(isLast&&L.some(s=>s.id===e.from))p.stage=e.from;
 db.settings.lastSelection=null;save();playerView(id);
}
function setPlayerStageNote(id,v){let p=db.players.find(x=>x.id===id);if(!p)return;p.stageNote=v;save()}
function squadSelectSheet(fromId,team){
 if(team!==undefined)squadTeam=team;
 let teams=playerTeams();if(squadTeam&&!teams.includes(squadTeam))squadTeam="";
 let L=stagesList(),open=L.filter(s=>!s.released);
 if(!fromId||!L.find(s=>s.id===fromId))fromId=(open.find(s=>stagePlayers(s.id,squadTeam).length)||open[0]).id;
 let fi=L.findIndex(s=>s.id===fromId),toDefault=(L[fi+1]&&!L[fi+1].released)?L[fi+1].id:(open[fi+1]||L[fi]).id;
 let rel=L.find(s=>s.released),players=stagePlayers(fromId,squadTeam),last=db.settings.lastSelection;
 modal(`<div class="sheetHead"><h2>Select squad</h2><button class="x" onclick="closeM()">×</button></div>
 <p class="muted">Tick the players who move on. Nobody is deleted — everyone keeps all sessions, assessments and match history.${squadTeam?` Showing <b>${esc(squadTeam)}</b> only.`:""}</p>
${(()=>{let lt=db.tournaments.filter(t=>t.syncStage&&L.some(x=>x.id===t.syncStage));return lt.length?`<p class="muted" style="font-size:var(--fs-3)">Linked tournaments update automatically: ${lt.map(t=>esc(t.name)+" ← "+esc(L.find(x=>x.id===t.syncStage).name)).join(", ")}.</p>`:""})()}
 <div class="formgrid">${teams.length>1?`<label class="full">Team<select id="ssTeam" onchange="squadSelectSheet(document.getElementById('ssFrom').value,this.value)"><option value="">All teams</option>${teams.map(t=>`<option value="${esc(t)}" ${t===squadTeam?"selected":""}>${esc(t)}</option>`).join("")}</select></label>`:""}<label>Choose from<select id="ssFrom" onchange="squadSelectSheet(this.value)">${open.map(s=>`<option value="${s.id}" ${s.id===fromId?"selected":""}>${esc(s.name)} (${stagePlayers(s.id,squadTeam).length})</option>`).join("")}</select></label>
 <label>Ticked players move to<select id="ssTo">${L.filter(s=>s.id!==fromId&&!s.released).map(s=>`<option value="${s.id}" ${s.id===toDefault?"selected":""}>${esc(s.name)}</option>`).join("")}</select></label>
 <label class="full">Players not ticked<select id="ssMode"><option value="release">Move to ${esc(rel.name)}</option><option value="stay">Leave in ${esc(L[fi].name)}</option></select></label></div>
 <div style="display:flex;gap:8px;margin:10px 0"><button class="btn secondary" onclick="document.querySelectorAll('.ssChk').forEach(c=>c.checked=true)">Tick all</button><button class="btn secondary" onclick="document.querySelectorAll('.ssChk').forEach(c=>c.checked=false)">Clear</button><span class="muted" style="align-self:center" id="ssCount"></span></div>
 <div class="list">${players.length?players.map(p=>`<div class="item ssRow"><input type="checkbox" class="ssChk" data-id="${p.id}" checked onchange="ssUpdateCount()"><div class="ssMain"><div class="ssName"><b>${esc(p.name)}</b> <span class="muted">${esc(p.role||"Player")}</span></div><input class="ssNote" data-id="${p.id}" placeholder="Note (optional)"></div></div>`).join(""):empty("No players in this stage.")}</div>
 <div style="display:grid;gap:8px;margin-top:14px"><button class="btn primary" onclick="applySquadSelection('${fromId}')">Apply selection</button>
 <div class="actionRow"><button class="btn secondary" onclick="stageListReport('${fromId}',squadTeam)">Print this list</button><button class="btn secondary" onclick="stagesSettingsSheet()">Edit stages</button></div>
 ${last?`<button class="btn danger" onclick="undoSquadSelection()">Undo last selection (${esc(fmtDate(last.date))}, ${last.moves.length} moved)</button>`:""}</div>`);
 ssUpdateCount();
}
function ssUpdateCount(){let n=document.querySelectorAll('.ssChk:checked').length,t=document.querySelectorAll('.ssChk').length,e=document.getElementById('ssCount');if(e)e.textContent=n+" of "+t+" ticked"}
function applySquadSelection(fromId){
 if(!requireWriteAccess())return;
 let L=stagesList(),to=document.getElementById("ssTo").value,mode=document.getElementById("ssMode").value,rel=L.find(s=>s.released).id;
 let checked=new Set([...document.querySelectorAll('.ssChk:checked')].map(c=>c.dataset.id)),notes={};document.querySelectorAll('.ssNote').forEach(i=>notes[i.dataset.id]=i.value.trim());
 let ps=stagePlayers(fromId,squadTeam),promote=ps.filter(p=>checked.has(p.id)).length,drop=mode==="release"?ps.length-promote:0;
 if(!ps.length)return;
 if(!confirm((squadTeam?squadTeam+": ":"")+`Move ${promote} player${promote===1?"":"s"} to ${L.find(s=>s.id===to).name}`+(drop?` and ${drop} to ${L.find(s=>s.id===rel).name}`:"")+"?\n\nNo data is deleted. You can undo this right after."))return;
 let moves=[];
 ps.forEach(p=>{let target=checked.has(p.id)?to:(mode==="release"?rel:fromId);if(target===fromId)return;
  if(!Array.isArray(p.stageLog))p.stageLog=[];p.stageLog.push({date:today(),from:fromId,to:target,reason:notes[p.id]||""});p.stage=target;moves.push({id:p.id,from:fromId})});
 db.settings.lastSelection=moves.length?{date:today(),moves}:null;save();closeM();players();
}
function undoSquadSelection(){
 let last=db.settings.lastSelection;if(!last||!confirm("Undo the last squad selection? Those players go back to where they were."))return;
 last.moves.forEach(m=>{let p=db.players.find(x=>x.id===m.id);if(p){p.stage=m.from;if(Array.isArray(p.stageLog))p.stageLog.pop()}});
 db.settings.lastSelection=null;save();closeM();players();
}
function stageListReport(id,team){
 let st=stagesList().find(s=>s.id===id)||stagesList()[0],ps=stagePlayers(st.id,team||"");
 reportShell(esc(st.name)+(team?" · "+esc(team):""),`${ps.length} players · ${esc(fmtDate(today()))}`,ps.length?ps.map((p,i)=>`<div class="card"><b>${i+1}. ${esc(p.name)}</b> <span class="tag">${esc(p.role||"Player")}</span>${playingStyleLabel(p)?`<p class="muted">${esc(playingStyleLabel(p))}</p>`:""}</div>`).join(""):empty("No players in this stage."));
}
function stagesSettingsSheet(){
 let L=stagesList();
 modal(`<div class="sheetHead"><h2>Edit stages</h2><button class="x" onclick="squadSelectSheet()">×</button></div>
 <p class="muted">Rename, reorder or add stages (up to 8). The last one is where released players go. A stage can only be removed when it has no players.</p>
 <div class="list">${L.map((s,i)=>`<div class="item" style="align-items:center"><input value="${esc(s.name)}" onchange="renameStage('${s.id}',this.value)" style="flex:1 1 auto;min-width:0"><div class="toolbar">${s.released?"":`<button class="btn secondary iconBtn" ${i===0?"disabled":""} onclick="moveStage('${s.id}',-1)">↑</button><button class="btn secondary iconBtn" ${(i>=L.length-2)?"disabled":""} onclick="moveStage('${s.id}',1)">↓</button><button class="btn danger iconBtn" onclick="removeStage('${s.id}')">${icon("trash",16)}</button>`}</div></div>`).join("")}</div>
 <button class="btn primary" style="margin-top:12px" onclick="addStage()" ${L.length>=8?"disabled":""}>+ Add stage</button>`);
}
function renameStage(id,v){v=v.trim();if(!v)return;let s=stagesList().find(x=>x.id===id);if(s){s.name=v;save();stagesSettingsSheet()}}
function moveStage(id,d){let L=stagesList(),i=L.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=L.length-1||L[i].released)return;[L[i],L[j]]=[L[j],L[i]];save();stagesSettingsSheet()}
function removeStage(id){let L=stagesList(),s=L.find(x=>x.id===id);if(!s||s.released)return;if(L.filter(x=>!x.released).length<2){alert("Keep at least one stage.");return}if(stagePlayers(id).length){alert("Move the players out of this stage first.");return}if(!confirm("Remove stage \""+s.name+"\"?"))return;db.settings.stages=L.filter(x=>x.id!==id);save();stagesSettingsSheet()}
function addStage(){let L=stagesList();if(L.length>=8)return;let n=L.filter(x=>!x.released).length+1;L.splice(L.length-1,0,{id:uid("st"),name:"Stage "+n});save();stagesSettingsSheet()}

function players(){
 let list=db.players.filter(p=>!p.deletedAt).sort((a,b)=>String(a.name||"").localeCompare(String(b.name||"")));
 if(playerQuery){let q=playerQuery.toLowerCase();list=list.filter(p=>[p.name,p.team,p.group,p.strengths,p.areas,p.focus,p.notes].some(v=>String(v||"").toLowerCase().includes(q)))}
 if(playerRoleFilter)list=list.filter(p=>p.role===playerRoleFilter);
 if(playerTeamFilter)list=list.filter(p=>p.team===playerTeamFilter);
 if(stageFilter&&!stagesList().some(x=>x.id===stageFilter))stageFilter="";

function computePlayerMatchPatterns(p){
 let matches=playerMatches(p);
 let battingEntries=matches.map(m=>{let r=(m.battingReview||[]).find(x=>x.name===p.name);return r?{...r,date:m.date}:null}).filter(Boolean);
 let bowlingEntries=matches.map(m=>{let r=(m.bowlingReview||[]).find(x=>x.name===p.name);return r?{...r,date:m.date}:null}).filter(Boolean);
 let flags=[];

 if(battingEntries.length>=3){
  let recentDismissals=battingEntries.slice(0,3).map(r=>r.dismissal).filter(d=>d&&d!=="Not out");
  if(recentDismissals.length===3&&recentDismissals[0]===recentDismissals[1]&&recentDismissals[1]===recentDismissals[2]){
   flags.push({text:`Out ${recentDismissals[0].toLowerCase()} in each of the last 3 innings — worth a technical look.`,tone:"watch"});
  }
 }
 if(battingEntries.length>=4){
  let allRuns=battingEntries.map(r=>Number(r.runs)||0);
  let overallAvg=allRuns.reduce((a,b)=>a+b,0)/allRuns.length;
  let recentArr=allRuns.slice(0,3);
  let recentAvg=recentArr.reduce((a,b)=>a+b,0)/recentArr.length;
  if(overallAvg>=5&&recentAvg<overallAvg*0.5){
   flags.push({text:`Averaging ${recentAvg.toFixed(1)} across the last 3 innings, well below their overall average of ${overallAvg.toFixed(1)}.`,tone:"watch"});
  } else if(overallAvg>=5&&recentAvg>overallAvg*1.5){
   flags.push({text:`Averaging ${recentAvg.toFixed(1)} across the last 3 innings, well above their overall average of ${overallAvg.toFixed(1)}.`,tone:"good"});
  }
 }
 if(bowlingEntries.length>=3){
  let recentWickets=bowlingEntries.slice(0,3);
  if(recentWickets.every(r=>Number(r.wickets||0)===0)){
   flags.push({text:`No wickets in the last 3 bowling spells.`,tone:"watch"});
  }
 }
 if(bowlingEntries.length>=3){
  let econOf=r=>{let overs=Number(r.overs)||0,runs=Number(r.runs)||0;return overs>0?runs/overs:null};
  let allEcon=bowlingEntries.map(econOf).filter(e=>e!==null);
  if(allEcon.length>=3){
   let overallEcon=allEcon.reduce((a,b)=>a+b,0)/allEcon.length;
   let recentArr=allEcon.slice(0,3);
   let recentEcon=recentArr.reduce((a,b)=>a+b,0)/recentArr.length;
   if(overallEcon>0&&recentEcon>overallEcon*1.4){
    flags.push({text:`Economy has crept up to ${recentEcon.toFixed(1)} in recent spells, up from their usual ${overallEcon.toFixed(1)}.`,tone:"watch"});
   } else if(overallEcon>0&&recentEcon<overallEcon*0.7){
    flags.push({text:`Economy has improved to ${recentEcon.toFixed(1)} in recent spells, down from their usual ${overallEcon.toFixed(1)}.`,tone:"good"});
   }
  }
 }
 return flags;
}

// Format-specific metrics, layered ON TOP of the core skillSets above (never
// replacing them) for Batting/Bowling only — Fielding/Wicketkeeping barely
// change by format, so they stay core-only. Kept in their own namespace
// (a.formatRatings, keyed by a.format) rather than appended into the same
// a.ratings[d] array that skill-trend charts and the archive system index
// into by position — mixing formats into one positionally-indexed array
// would silently corrupt those features whenever a player's assessments
// span more than one format. Custom skills (db.customSkills) remain the
// third, fully open-ended layer, untouched by any of this.
const FORMAT_SKILLS={
 Batting:{

 },

  ODI:["Opening-overs Control","Middle-overs Containment","Powerplay Wicket-taking","Death-overs Execution","Older-ball Effectiveness","Control Under Restrictions"],
  Test:["Opening-spell Discipline","Older-ball Effectiveness","Pace & Intensity Retention","Building Pressure","Bowling to the Situation","Role Control Across Ends"]

function hasAnyGameRating(a){let r=a.ratings||{};if(Object.values(r).some(v=>Array.isArray(v)&&v.some(x=>Number(x)>0)))return true;let f=a.formatRatings||{};return Object.values(f).some(o=>o&&typeof o==='object'&&Object.values(o).some(v=>Array.isArray(v)&&v.some(x=>Number(x)>0)))}
function allSkillsFor(d){return skillSets[d].concat((db.customSkills&&db.customSkills[d])||[])}
function isSkillArchived(d,skillName){return((db.archivedSkills&&db.archivedSkills[d])||[]).includes(skillName)}
function skillEverUsed(d,skillIdx){
 return db.assessments.some(a=>a.ratings&&Array.isArray(a.ratings[d])&&Number(a.ratings[d][skillIdx])>0);
}
function unusedUnarchivedSkills(d){
 let skills=allSkillsFor(d);
 return skills.map((s,i)=>({name:s,idx:i})).filter(x=>!isSkillArchived(d,x.name)&&!skillEverUsed(d,x.idx));
}
function bulkArchiveUnused(d){
 if(!requireWriteAccess())return;
 let unused=unusedUnarchivedSkills(d);
 if(!unused.length)return;
 if(!confirm(`Archive ${unused.length} metric${unused.length===1?"":"s"} in ${d} that ${unused.length===1?"has":"have"} never been rated? You can unarchive any of them later.`))return;
 db.archivedSkills[d]=db.archivedSkills[d]||[];
 unused.forEach(x=>{if(!db.archivedSkills[d].includes(x.name))db.archivedSkills[d].push(x.name)});
 save();
 renderAssessmentSkills();
}
function archiveSkill(d,skillName){

 db.archivedSkills[d]=db.archivedSkills[d]||[];
 if(!db.archivedSkills[d].includes(skillName))db.archivedSkills[d].push(skillName);

 renderAssessmentSkills();
}
function unarchiveSkill(d,skillName){
 if(!requireWriteAccess())return;
 db.archivedSkills[d]=(db.archivedSkills[d]||[]).filter(s=>s!==skillName);

function toggleArchivedSkillsPanel(d){

}
// Format-specific metrics (Batting/Bowling, under a chosen Format Focus) get
// the same custom-metric + archive mechanics as the core skills above, kept
// in their own namespaced stores so they never collide with core skill
// indices or with another format's metric list for the same discipline.
function allFormatSkillsFor(d,f){return((FORMAT_SKILLS[d]&&FORMAT_SKILLS[d][f])||[]).concat((db.customFormatSkills&&db.customFormatSkills[d]&&db.customFormatSkills[d][f])||[])}
function isFormatSkillArchived(d,f,skillName){return((db.archivedFormatSkills&&db.archivedFormatSkills[d]&&db.archivedFormatSkills[d][f])||[]).includes(skillName)}
function formatSkillEverUsed(d,f,skillIdx){
 return db.assessments.some(a=>a.formatRatings&&a.formatRatings[d]&&Array.isArray(a.formatRatings[d][f])&&Number(a.formatRatings[d][f][skillIdx])>0);
}
function unusedUnarchivedFormatSkills(d,f){
 let skills=allFormatSkillsFor(d,f);
 return skills.map((s,i)=>({name:s,idx:i})).filter(x=>!isFormatSkillArchived(d,f,x.name)&&!formatSkillEverUsed(d,f,x.idx));
}
function bulkArchiveUnusedFormat(d,f){
 if(!requireWriteAccess())return;
 let unused=unusedUnarchivedFormatSkills(d,f);
 if(!unused.length)return;
 if(!confirm(`Archive ${unused.length} metric${unused.length===1?"":"s"} in ${d} (${f}) that ${unused.length===1?"has":"have"} never been rated? You can unarchive any of them later.`))return;
 db.archivedFormatSkills=db.archivedFormatSkills||{};
 db.archivedFormatSkills[d]=db.archivedFormatSkills[d]||{};
 db.archivedFormatSkills[d][f]=db.archivedFormatSkills[d][f]||[];
 unused.forEach(x=>{if(!db.archivedFormatSkills[d][f].includes(x.name))db.archivedFormatSkills[d][f].push(x.name)});
 save();
 renderAssessmentSkills();
}
function archiveFormatSkill(d,f,skillName){
 if(!requireWriteAccess())return;
 db.archivedFormatSkills=db.archivedFormatSkills||{};
 db.archivedFormatSkills[d]=db.archivedFormatSkills[d]||{};
 db.archivedFormatSkills[d][f]=db.archivedFormatSkills[d][f]||[];
 if(!db.archivedFormatSkills[d][f].includes(skillName))db.archivedFormatSkills[d][f].push(skillName);
 save();
 renderAssessmentSkills();
}
function unarchiveFormatSkill(d,f,skillName){
 if(!requireWriteAccess())return;
 if(db.archivedFormatSkills&&db.archivedFormatSkills[d]&&db.archivedFormatSkills[d][f])db.archivedFormatSkills[d][f]=db.archivedFormatSkills[d][f].filter(s=>s!==skillName);

}
function toggleArchivedFormatSkillsPanel(d,f){
 let panel=document.getElementById(`archivedFormatSkillsPanel_${d}_${f}`);
 if(panel)panel.style.display=panel.style.display==="none"?"":"none";
}
function addCustomFormatSkill(d,f){
 if(!requireWriteAccess())return;
 let input=document.getElementById(`newFormatSkill_${d}_${f}`);
 let name=(input.value||"").trim();

 db.customFormatSkills[d]=db.customFormatSkills[d]||{};
 db.customFormatSkills[d][f]=db.customFormatSkills[d][f]||[];
 db.customFormatSkills[d][f].push(name);

// Bowling used to have "Length Control" and "Consistency" as two separate skills
