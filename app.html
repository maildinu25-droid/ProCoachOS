function icsEscape(str){return String(str||"").replace(/\\/g,"\\\\").replace(/,/g,"\\,").replace(/;/g,"\\;").replace(/\n/g,"\\n")}
function icsTimedDate(dateStr,timeStr,addMinutes){
 let d=new Date(`${dateStr}T${timeStr||"00:00"}:00`);
 if(addMinutes)d.setMinutes(d.getMinutes()+addMinutes);
 let pad=n=>String(n).padStart(2,"0");
 return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
}
function exportCalendarICS(){
 let lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ProCoach OS//Calendar Export//EN","CALSCALE:GREGORIAN"];
 activeSessions().filter(s=>s.date).forEach(s=>{
  let durMin=Number(s.duration)||60;
  lines.push("BEGIN:VEVENT");
  lines.push(`UID:session-${s.id}@procoachos.in`);
  lines.push(`DTSTAMP:${icsTimedDate(today(),"00:00")}`);
  lines.push(`DTSTART:${icsTimedDate(s.date,s.time)}`);
  lines.push(`DTEND:${icsTimedDate(s.date,s.time,durMin)}`);
  lines.push(`SUMMARY:${icsEscape(sessionLabel(s))}`);
  if(s.venue)lines.push(`LOCATION:${icsEscape(s.venue)}`);
  lines.push("END:VEVENT");
 });
 db.matches.filter(m=>m.date).forEach(m=>{
  let dateCompact=m.date.replace(/-/g,"");
  let nextDay=new Date(m.date+"T00:00:00");nextDay.setDate(nextDay.getDate()+1);
  let pad=n=>String(n).padStart(2,"0");
  let nextDayCompact=`${nextDay.getFullYear()}${pad(nextDay.getMonth()+1)}${pad(nextDay.getDate())}`;
  lines.push("BEGIN:VEVENT");
  lines.push(`UID:match-${m.id}@procoachos.in`);
  lines.push(`DTSTAMP:${icsTimedDate(today(),"00:00")}`);
  lines.push(`DTSTART;VALUE=DATE:${dateCompact}`);
  lines.push(`DTEND;VALUE=DATE:${nextDayCompact}`);
  lines.push(`SUMMARY:${icsEscape("Match vs "+(m.opp||"Opposition"))}`);
  if(m.venue)lines.push(`LOCATION:${icsEscape(m.venue)}`);
  lines.push("END:VEVENT");
 });
 lines.push("END:VCALENDAR");
 let blob=new Blob([lines.join("\r\n")],{type:"text/calendar"});
 let url=URL.createObjectURL(blob);
 let a=document.createElement("a");a.href=url;a.download="ProCoach-OS-Calendar-"+today()+".ics";
 document.body.appendChild(a);a.click();document.body.removeChild(a);
 URL.revokeObjectURL(url);
}

 merged cell for the whole squad. Groups = camp.batches (named lists of players). Attendance is
 per day. Schedules can be imported from an Excel sheet or pasted cells. Stored on db.camps. */

 {id:"bat",label:"Batting / nets",c:"#2563eb"},{id:"bowl",label:"Bowling",c:"#f97316"},
 {id:"fld",label:"Fielding / catching",c:"#16a34a"},{id:"wk",label:"Wicketkeeping",c:"#0d9488"},
 {id:"fit",label:"Fitness / S&C / physio",c:"#9333ea"},{id:"mat",label:"Match / simulation",c:"#dc2626"},

function campGuessType(t){
 t=String(t||"").toLowerCase();
 if(/match|game|simulation/.test(t))return"mat";
 if(/\brest\b|recover|break|lunch|meal/.test(t))return"brk";

 if(/s\s*&\s*c|fitness|physio|warm|gym|strength|conditioning/.test(t))return"fit";
 if(/field|catch/.test(t))return"fld";
 if(/centre wicket|center wicket|\bnets?\b|batting/.test(t))return"bat";

function campParseDate(v){
 if(v===null||v===undefined||v==="")return null;
 if(v instanceof Date&&!isNaN(v))return{y:v.getFullYear(),m:v.getMonth()+1,d:v.getDate()};
 if(typeof v==="number"){if(v>20000){let d=new Date(Date.UTC(1899,11,30)+Math.floor(v)*86400000);return{y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate()}}return null}
 let m=String(v).trim().match(/(\d{1,4})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{2,4})/);if(!m)return null;
 let a=+m[1],b=+m[2],c=+m[3],y,mo,d;
 if(m[1].length===4){y=a;mo=b;d=c}else{d=a;mo=b;y=c<100?2000+c:c}
 if(mo<1||mo>12||d<1||d>31)return null;return{y,m:mo,d};
}
function campHM(mins){mins=((mins%1440)+1440)%1440;return String(Math.floor(mins/60)).padStart(2,"0")+":"+String(mins%60).padStart(2,"0")}
function campParseTimes(v){
 if(v===null||v===undefined||String(v).trim()==="")return{start:"",end:""};
 if(typeof v==="number"){let f=v-Math.floor(v);return{start:campHM(Math.round(f*1440)),end:""}}
 let s=String(v).trim().replace(/[–—]/g,"-"),parts=s.split(/\s+to\s+|\s*-\s*/i).map(x=>x.trim()).filter(Boolean);
 const rx=/^(\d{1,2})(?::?(\d{2}))?(?::\d{2})?\s*(a\.?m\.?|p\.?m\.?)?$/i;
 const pr=p=>{let m=p.match(rx);if(!m)return null;return{h:+m[1],mi:m[2]?+m[2]:0,ap:m[3]?m[3].toLowerCase()[0]:""}};
 const mins=(o,ap)=>{let h=o.h;if(ap==="p"&&h<12)h+=12;if(ap==="a"&&h===12)h=0;return h*60+o.mi};
 let a=pr(parts[0]||""),b=parts[1]?pr(parts[1]):null;if(!a||a.h>24)return{start:"",end:""};
 let ae=mins(b||a,b&&b.ap?b.ap:"");
 let aa=a.ap||(b&&b.ap)||"",st=mins(a,aa);
 if(b&&!a.ap&&b.ap==="p"&&st>ae)st=mins(a,"a");
 let en=b?mins(b,b.ap||""):null;
 return{start:campHM(st),end:en===null?"":campHM(en)};
}
function campParseAoa(aoa,merges){
 aoa=(aoa||[]).map(r=>(r||[]).map(x=>(x===undefined||x===null)?"":x));
 let hr=-1;for(let i=0;i<Math.min(aoa.length,10);i++){let j=aoa[i].map(x=>String(x).toLowerCase());if(j.some(x=>/\btime\b/.test(x))&&j.some(x=>/date|day|group|batch/.test(x))){hr=i;break}}
 let head=hr>=0?aoa[hr]:[],find=re=>head.findIndex(x=>re.test(String(x).trim().toLowerCase()));
 let dateCol=hr>=0?find(/^date/):0,timeCol=hr>=0?find(/time/):2,dayCol=hr>=0?find(/^day/):1;if(dateCol<0)dateCol=0;if(timeCol<0)timeCol=2;
 let first=Math.max(timeCol,dateCol,dayCol)+1,maxCols=Math.max(0,...aoa.map(r=>r.length)),gcols=[];
 for(let c=first;c<maxCols;c++){let nm=String(head[c]||"").trim(),has=aoa.slice(hr+1).some(r=>String(r[c]).trim());if(nm||has)gcols.push({c,name:nm||("Group "+(gcols.length+1))})}
 let rows=[],dates=[],last=null,warnings=[];
 for(let i=hr+1;i<aoa.length;i++){
  let r=aoa[i],dv=campParseDate(r[dateCol]);if(dv){last=dv;dates.push(dv)}
  let cells=gcols.map(g=>String(r[g.c]).trim());if(!cells.some(x=>x))continue;
  if(!last){warnings.push("Row "+(i+1)+" has no date and was skipped.");continue}
  let t=campParseTimes(r[timeCol]);if(String(r[timeCol]).trim()&&!t.start)warnings.push("Row "+(i+1)+": couldn't read the time \""+String(r[timeCol]).trim()+"\".");
  let whole=false;
  if(gcols.length>1){
   if(cells.filter(x=>x).length===1&&cells[0])whole=true;
   (merges||[]).forEach(m=>{if(m.s.r<=i&&m.e.r>=i&&m.s.c<=gcols[0].c&&m.e.c>=gcols[gcols.length-1].c)whole=true});
  }
  rows.push({dv:last,start:t.start,end:t.end,whole,texts:cells});
 }
 if(dates.length){let y0=dates[0].y,off=0,prev=null;dates.forEach(d=>{if(prev&&(d.m<prev.m||(d.m===prev.m&&d.d<prev.d)))off++;prev=d;let y=y0+off;d.iso=y+"-"+String(d.m).padStart(2,"0")+"-"+String(d.d).padStart(2,"0")})}
 rows=rows.filter(r=>r.dv.iso);
 return{groups:gcols.map(g=>g.name),rows,dates:dates.map(d=>d.iso).filter(Boolean),warnings};
}

 return lines.map(l=>{if(tab)return l.split("\t");let out=[],cur="",q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===","&&!q){out.push(cur);cur=""}else cur+=ch}out.push(cur);return out});

}
function campShowImport(pr){
 campImportParsed=pr;let box=document.getElementById("campImportPrev");if(!box)return;
 if(!pr.rows.length){box.innerHTML=`<div class="card"><b>Nothing to import</b><p class="muted">No dated rows with activities were found. Expected columns: Date, Day, Time, then one column per group.</p></div>`;return}
 let days=[...new Set(pr.dates)],teams=playerTeams();
 box.innerHTML=`<div class="card"><b>Found ${pr.rows.length} row${pr.rows.length===1?"":"s"} over ${days.length} day${days.length===1?"":"s"}</b><div class="muted">${esc(fmtDate(days[0]))} → ${esc(fmtDate(days[days.length-1]))} · ${pr.groups.length} group${pr.groups.length===1?"":"s"}: ${pr.groups.map(esc).join(", ")}</div>
 <div style="margin-top:8px;font-size:12.5px">${pr.rows.slice(0,4).map(r=>`<div>${esc(fmtDate(r.dv.iso))} · ${esc(campRowTime(r))}: ${r.whole?esc(r.texts.find(Boolean)||"")+" <span class=muted>(whole squad)</span>":r.texts.map(esc).join(" | ")}</div>`).join("")}${pr.rows.length>4?`<div class="muted">…and ${pr.rows.length-4} more</div>`:""}</div>
 ${pr.warnings.length?`<div class="muted" style="margin-top:8px;font-size:12px">${pr.warnings.slice(0,4).map(esc).join("<br>")}</div>`:""}</div>
 <label class="full" style="margin-top:10px">Camp name<input id="campImpName" value="${esc(campImportMeta.name||"Imported camp")}"></label>
 <label class="full">Team <span class="muted" style="font-weight:400">(optional — splits its players into the groups)</span><select id="campImpTeam"><option value="">None</option>${teams.map(t=>`<option>${esc(t)}</option>`).join("")}</select></label>
 <button class="btn primary full" style="margin-top:10px" onclick="campCreateFromImport()">Create camp</button>`;
}
function campCreateFromImport(){
 if(!requireWriteAccess()||!campImportParsed)return;let pr=campImportParsed;
 let name=(document.getElementById("campImpName").value||"").trim()||"Imported camp",team=document.getElementById("campImpTeam").value;
 let all=pr.dates.slice().sort();
 let c={id:uid("camp"),name,kind:"Camp",venue:"",startDate:all[0],endDate:all[all.length-1],team,stageIds:[],coaches:"",equipment:"",notes:"",batches:[],rows:[],themes:{},attendance:{},createdAt:today()};
 let n=pr.groups.length;
 if(n>1){
  if(team&&n<=4){campAutoSplit(c,n);c.batches.forEach((b,i)=>b.name=pr.groups[i])}
  else c.batches=pr.groups.map(g=>({id:uid("bt"),name:g,names:[]}));
 }
 let groups=campGroups(c);
 pr.rows.forEach(r=>{
  let row={id:uid("rw"),date:r.dv.iso,start:r.start,end:r.end,whole:!!(r.whole&&n>1),cells:{}};
  const mk=t=>({text:t,type:campGuessType(t),note:"",drillIds:[]});
  if(row.whole){row.cells["*"]=mk(r.texts.find(Boolean))}
  else r.texts.forEach((t,i)=>{if(t&&groups[i])row.cells[groups[i].id]=mk(t)});
  if(Object.keys(row.cells).length)c.rows.push(row);
 });
 if(!Array.isArray(db.camps))db.camps=[];db.camps.push(c);campOpenId=c.id;closeM();save();
}
/* --- links: sessions, net plans, attendance, season phases --- */
function campPhaseOf(c){
 if(!c.phaseId)return null;let s=(db.seasons||[]).find(x=>x.id===c.seasonId);if(!s)return null;
 let ph=(s.phases||[]).find(x=>x.id===c.phaseId);return ph?{season:s,phase:ph}:null;
}
function campPhaseOptions(c){
 let out=[];(db.seasons||[]).forEach(s=>(s.phases||[]).forEach(ph=>{if(ph.id)out.push(`<option value="${s.id}|${ph.id}" ${(c.seasonId===s.id&&c.phaseId===ph.id)?"selected":""}>${esc(s.name)} · ${esc(ph.name)}${ph.startDate?" ("+esc(fmtDate(ph.startDate))+" → "+esc(fmtDate(ph.endDate)||"?")+")":""}</option>`)}));
 return out.join("");
}
function campPhaseLinesHtml(phaseId){
 let list=(db.camps||[]).filter(c=>c.phaseId===phaseId);if(!list.length)return "";
 return list.map(c=>{let n=db.sessions.filter(s=>s.campId===c.id&&!s.deletedAt).length;return `<div class="muted" style="margin-top:4px;font-size:var(--fs-3)">Camp: <b>${esc(c.name)}</b> · ${campDays(c).length} day${campDays(c).length===1?"":"s"}${n?` · ${n} session${n===1?"":"s"} created`:""}</div>`}).join("");
}
function campVenues(c){let v=Array.isArray(c.venues)?c.venues:(c.venue?[c.venue]:[]);return v.filter(Boolean)}
function campMainVenue(c){return campVenues(c)[0]||""}
function campRowVenue(c,r){return (r&&r.venue)||campMainVenue(c)}
function campParseVenues(str){return [...new Set(String(str||"").split(/[,\n;]/).map(x=>x.trim()).filter(Boolean))]}
function campKnownVenues(){return [...new Set([...activeSessions().map(s=>s.venue),...db.matches.map(m=>m.venue)].filter(Boolean).flatMap(v=>String(v).split(" / ")))]}
function campVenueChip(btn){let i=document.getElementById("campVenuesInput");if(!i)return;let cur=campParseVenues(i.value),v=btn.dataset.v;if(!cur.includes(v))cur.push(v);i.value=cur.join(", ")}
function campRowDuration(r){if(r.start&&r.end){let a=r.start.split(":"),b=r.end.split(":"),m=(+b[0]*60+ +b[1])-(+a[0]*60+ +a[1]);if(m>0)return m}return 90}
function campAllNames(c){let n=[];(c.batches||[]).forEach(b=>(b.names||[]).forEach(x=>{if(!n.includes(x))n.push(x)}));if(!n.length)campPool(c).forEach(p=>n.push(p.name));return n}
function campRoleOf(name){let p=db.players.find(x=>x.name===name&&!x.deletedAt);return p?p.role:""}
function campNetsFor(names,text,dur){
 if(!names.length)return [];let batters=[],bowlers=[],flip=0;
 names.slice().sort().forEach(n=>{let r=campRoleOf(n);if(r==="Bowler")bowlers.push(n);else if(r==="All-rounder"){(flip++%2===0?bowlers:batters).push(n)}else batters.push(n)});
 if(!batters.length){batters=bowlers;bowlers=[]}
 let k=Math.max(1,Math.ceil(batters.length/2)),nets=Array.from({length:k},()=>({batters:0,bowlers:"",duration:dur,battersNames:[],bowlersNames:[],focus:text||""}));
 batters.forEach((n,i)=>nets[i%k].battersNames.push(n));bowlers.forEach((n,i)=>nets[i%k].bowlersNames.push(n));
 nets.forEach(n=>{n.batters=n.battersNames.length;n.bowlers=n.bowlersNames.length?String(n.bowlersNames.length):""});
 return nets.filter(n=>n.batters||n.bowlersNames.length);
}
function campBuildSession(c,r){
 let groups=campGroups(c),multi=groups.length>1,whole=!!(r.whole&&multi),days=campDays(c),di=days.indexOf(r.date);
 let parts=whole?[{g:{name:"Whole squad",names:campAllNames(c)},cell:r.cells&&r.cells["*"]}]:groups.map(g=>({g:{name:g.name,names:multi?(g.names||[]):campAllNames(c)},cell:r.cells&&r.cells[g.id]})).filter(x=>x.cell);
 parts=parts.filter(x=>x.cell&&x.cell.text);if(!parts.length)return null;
 let names=[];parts.forEach(x=>x.g.names.forEach(n=>{if(!names.includes(n))names.push(n)}));
 let dur=campRowDuration(r),ph=campPhaseOf(c);
 let main=parts.map(x=>(multi&&!whole?x.g.name+": ":"")+x.cell.text).join("\n");
 let notes=parts.filter(x=>x.cell.note).map(x=>(multi&&!whole?x.g.name+": ":"")+x.cell.note);
 let objectives=["Camp: "+c.name+(di>-1?" · Day "+(di+1):"")].concat(ph&&ph.phase.focus?["Phase focus ("+ph.phase.name+"): "+ph.phase.focus]:[],notes).join("\n");
 let drills=[...new Set(parts.flatMap(x=>x.cell.drillIds||[]).filter(id=>db.drills.find(d=>d.id===id)))];
 let nets=[];parts.forEach(x=>{if(x.cell.type==="bat")campNetsFor(x.g.names,multi&&!whole?x.g.name+": "+x.cell.text:x.cell.text,dur).forEach(n=>nets.push(n))});
 return {date:r.date,time:r.start||"",title:c.name+(di>-1?" · D"+(di+1):"")+(r.start?" · "+campFmtT(r.start):""),sessionType:c.team?"team":"custom",squad:c.team||c.name,duration:String(dur),focus:"",venue:campRowVenue(c,r),attendees:names,objectiveTags:[],objectives,warmup:"",main,game:"",cueTags:[],successTags:[],mainDrillIds:drills,gameDrillIds:[],netPlan:nets.length?[{focus:"",nets}]:[],campId:c.id,campRowId:r.id,campNames:names.slice()};
}
function campSnap(s){return JSON.stringify([s.date,s.time,s.title,s.duration,s.main,s.objectives,s.mainDrillIds,s.netPlan,s.venue,s.squad])}
function campSessionStats(c){let rows=(c.rows||[]).filter(r=>Object.keys(r.cells||{}).length),have=rows.filter(r=>r.sessionId&&db.sessions.find(s=>s.id===r.sessionId&&!s.deletedAt)).length;return{rows:rows.length,have}}
function campSyncSessions(id){
 if(!requireWriteAccess())return;let c=campById(id);if(!c)return;
 let rows=(c.rows||[]).slice().sort((a,b)=>(a.date+(a.start||"")).localeCompare(b.date+(b.start||"")));
 let st=campSessionStats(c);
 if(!rows.length){alert("Add something to the schedule first.");return}
 if(!st.have&&!confirm("Create a session for each schedule row? That is up to "+st.rows+" sessions in your Session Plans and Calendar, with the group's players as attendees and nets planned for batting blocks. You can edit them like any session."))return;
 let created=0,updated=0,skipped=0,newDates=new Set();
 rows.forEach(r=>{
  let s=campBuildSession(c,r),ex=r.sessionId&&db.sessions.find(x=>x.id===r.sessionId&&!x.deletedAt);
  if(!s){return}
  if(!ex){s.id=uid("sess");s.campSnap=campSnap(s);db.sessions.push(s);r.sessionId=s.id;created++;newDates.add(r.date);return}
  if(ex.campSnap!==campSnap(ex)){skipped++;return}
  if(campSnap(s)===ex.campSnap)return;
  ["date","time","title","duration","main","objectives","mainDrillIds","netPlan","venue","squad","sessionType"].forEach(k=>ex[k]=s[k]);
  ex.campNames=s.campNames;ex.campSnap=campSnap(ex);updated++;
 });
 save();
 modal(`<div class="sheetHead"><h2>Sessions updated</h2><button class="x" onclick="closeM()">×</button></div>
 <div class="card"><p><b>${created}</b> created · <b>${updated}</b> updated${skipped?` · <b>${skipped}</b> skipped because you edited them`:""}</p><p class="muted">Each schedule row is now a session in Session Plans and the Calendar. Take attendance inside each session.</p></div>
 <div class="toolbar" style="margin-top:12px"><button class="btn primary" onclick="closeM();go('sessions')">View sessions</button><button class="btn secondary" onclick="closeM()">Close</button></div>`);
}
function campOpenSession(){
 if(!campCellCtx)return;let c=campById(campCellCtx.id);if(!c)return;let r=c.rows.find(x=>x.id===campCellCtx.rowId);if(!r||!r.sessionId)return;
 closeM();go('sessions');editSession(r.sessionId);
}

 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("sw.js").catch(()=>{});
 });
