// Silently re-checks a paid license against the server, at most once a day.
// Never downgrades on a network failure (fails open, retries next time) —
// only a definitive "no longer valid" answer from the server (subscription
// cancelled, payment failed, device removed) actually locks the app.
const LICENSE_REVALIDATE_INTERVAL_MS=24*60*60*1000;
async function revalidateLicenseIfNeeded(){
 let lic=getLicenseState();
 if(lic.status!=="basic"&&lic.status!=="premium")return;
 if(!lic.licenseKey)return;
 let now=Date.now();
 let last=lic.lastRevalidatedAt||0;
 if(now-last<LICENSE_REVALIDATE_INTERVAL_MS)return;
 let{tier,networkError}=await validateLicenseKey(lic.licenseKey);
 if(networkError)return; // couldn't check — try again next time, don't touch access
 if(tier){
  lic.status=tier;lic.lastRevalidatedAt=now;
  saveLicenseState(lic);
  return;
 }
 // A definitive answer came back and this key/device is no longer valid
 // (cancelled, payment failed, or removed from this device) — lock it.
 lic.status="expired";lic.lastRevalidatedAt=now;
 saveLicenseState(lic);
 renderAll();
}
const TRIAL_STATUS_API="https://procoachos-dodo.maildinu25.workers.dev/api/trial/status";
// Mirrors revalidateLicenseIfNeeded()'s once-a-day, fail-open pattern, but for
// an in-progress TRIAL (which otherwise has no ongoing server check at all —
// only at signup and on a new-device restore). This is what lets an admin's
// suspend/grant action actually take effect for a coach who is mid-trial on
// their own device right now, without them doing anything:
//  - if the admin suspended this trial email -> lock the app, same as an
//    expired trial (a network error never does this — only a definitive
//    "suspended" answer from the server does).
//  - if the admin (or a real Dodo payment) has granted this email a license
//    since the trial started -> the app quietly upgrades itself to that
//    license, no manual key entry needed.
//  - otherwise -> nothing changes, just records that a check happened today.
const TRIAL_STATUS_CHECK_INTERVAL_MS=24*60*60*1000;
async function checkTrialStatusIfNeeded(){
 let lic=getLicenseState();
 if(lic.status!=="trial")return;
 if(!lic.email)return;
 let now=Date.now();
 let last=lic.lastTrialStatusCheckedAt||0;
 if(now-last<TRIAL_STATUS_CHECK_INTERVAL_MS)return;
 let result=null;
 try{
  let response=await fetch(TRIAL_STATUS_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:lic.email})});
  try{result=await response.json()}catch(_){}
  if(!response.ok||!result)return; // couldn't get a definitive answer — try again next time
 }catch(err){
  console.error("Trial status check failed:",err&&err.message?err.message:err);
  return; // network error — fail open, don't touch access
 }
 if(result.status==="suspended"){
  lic.status="expired";lic.lastTrialStatusCheckedAt=now;
  saveLicenseState(lic);
  renderAll();
  return;
 }
 if(result.status==="licensed"&&(result.tier==="basic"||result.tier==="premium")&&result.licenseKey){
  lic.status=result.tier;lic.licenseKey=result.licenseKey;lic.lastRevalidatedAt=now;lic.lastTrialStatusCheckedAt=now;
  saveLicenseState(lic);
  renderAll();
  return;
 }
 // still a plain trial, nothing to change — just record that we checked
 lic.lastTrialStatusCheckedAt=now;
 saveLicenseState(lic);
}

 let out=[];

 let pctChange=(cur,prev)=>prev?Math.round((cur-prev)/prev*100):null;
 let rC=pctChange(ratingTrend[ratingTrend.length-1],ratingTrend[ratingTrend.length-2]);
 if(rC!==null&&ratingTrend[ratingTrend.length-1]>0)out.push({icon:icon("star",14),text:`Your average reflection rating has ${rC>=0?"increased":"decreased"} by ${Math.abs(rC)}% vs last month.`});
 let hC=pctChange(hrsTrend[hrsTrend.length-1],hrsTrend[hrsTrend.length-2]);

 let streak=reflectionStreak();

 let unassessed=db.players.filter(p=>!db.assessments.some(a=>a.player===p.name)).length;
 if(unassessed>0)out.push({icon:icon("assessments",14),text:`${unassessed} player${unassessed!==1?"s":""} still ${unassessed!==1?"have":"has"} no assessment on file.`});

 return out.slice(0,5);

function forceRefreshApp(){
 // A plain location.reload() isn't reliable here — iOS Safari (especially
 // in standalone Home Screen mode, where there's no pull-to-refresh or URL
 // bar at all) can still serve an already-cached copy on a normal reload.
 // Appending a fresh, unique query param forces every caching layer
 // (browser HTTP cache, any CDN in front of GitHub Pages) to treat this as
 // a genuinely new request and fetch the real, current file from origin.
 let params=new URLSearchParams(location.search);
 params.set("_r",Date.now());
 location.href=location.pathname+"?"+params.toString()+location.hash;
}

// --- Net Plan builder (Sets -> Nets, each with batters/bowlers/duration) ---
// Mirrors how the coach already plans nets on paper: a Set is a rotation
// round, each Set has one or more Nets running in parallel, each Net has
// its own batter/bowler counts and duration. Kept as its own draft object
// (like sessionDrillLinks) so edits re-render instantly without a form submit.
// Names are picked from the full player roster (not just marked attendance)
// since session plans are usually built before the coach knows who'll show
// up — attendance is confirmed later, separately, on the day.
// Only when the session is a Team/Squad session does a specific team apply —
// for a 1-on-1 or Custom Group session there's no single team to scope to,
// so the full active roster is offered, same as Attendance does.
function currentNetPlanTeamFilter(){
 let typeSelect=document.getElementById("sessionTypeSelect");
 if(!typeSelect||typeSelect.value!=="team")return "";
 let teamSelect=document.querySelector('select[name="squadTeam"]');
 return teamSelect?teamSelect.value:"";
}
function rosterPlayerNames(){
 let teamFilter=currentNetPlanTeamFilter();
 let players=teamFilter?activePlayers().filter(p=>p.team===teamFilter):activePlayers();
 return players.map(p=>p.name);
}
// Two different reasons a name can be "taken" elsewhere in today's plan:
// 1) Nets within the same Set run side by side, so a player can only be in
//    one of them at a time — as a batter OR a bowler. Any other net/role
//    within this same Set blocks the name here.
// 2) Across different Sets (different time slots) there's no clash of time,
//    but picking the same player to BAT in set after set crowds out the
//    rest of the squad — so an existing batting slot elsewhere in the
//    session also blocks batting here, to keep batting reps spread around.
//    Bowling is the opposite: it's normal (and often necessary, with a
//    small pool of bowlers) for the same bowler to bowl across several
//    Sets/nets in one session, so bowling is never blocked across Sets —
//    only within the same Set, same as any other role clash.
function namesTakenElsewhere(si,ni,field){
 let taken=new Set();
 sessionNetPlanDraft.forEach((set,setIdx)=>{
  set.nets.forEach((net,netIdx)=>{
   if(setIdx===si){
    ["battersNames","bowlersNames"].forEach(f=>{
     if(netIdx===ni&&f===field)return;
     (net[f]||[]).forEach(n=>taken.add(n));
    });
   } else if(field==="battersNames"){
    (net.battersNames||[]).forEach(n=>taken.add(n));
   }
  });
 });
 return [...taken];
}
// Sets run one after another; nets within a set run side by side. So the
// useful count isn't "nets summed across every set" (that double-counts
// "Net 1" reused set after set) — it's the sets, plus the most nets
// running at once in any single set (i.e. how many net stations you need).
function netPlanCountLabel(netPlan){
 if(!netPlan||!netPlan.length)return "";
 let setCount=netPlan.length;
 let maxNets=Math.max(...netPlan.map(s=>s.nets.length));
 return `${setCount} set${setCount===1?"":"s"} · up to ${maxNets} net${maxNets===1?"":"s"} at a time`;
}
// A count box can hold a plain number ("4") or a range ("4-5") — cap
// selectable names at the largest number mentioned, or leave it uncapped
// if the box is empty/non-numeric.
function parseNetCap(value){
 let nums=String(value==null?"":value).match(/\d+/g);
 return nums&&nums.length?Math.max(...nums.map(Number)):Infinity;
}
// Renders selected names one-per-row (never a single comma-joined line) so
// a long list wraps vertically instead of forcing the flex row wider than
// the screen — a nowrap+ellipsis span inside a flex container without an
// explicit min-width still overflows its parent in most browsers.
function netPlanSelectedNamesHtml(names){
 if(!names.length)return `<div class="muted" style="font-size:var(--fs-3)">+ Add names</div>`;
 return names.map(n=>`<div style="font-size:var(--fs-3);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n)}</div>`).join("");
}
// How many Sets (not nets) a player is already down to bowl in, anywhere in
// this session's net plan — shown as a small badge next to their name in the
// bowler picker so the coach can spot workload before adding another Set.
function bowlerSetCountInPlan(name){
 return sessionNetPlanDraft.filter(set=>set.nets.some(net=>(net.bowlersNames||[]).includes(name))).length;
}
function netPlanNameFieldHtml(si,ni,field,label,net){
 let key=`${si}-${ni}-${field}`;
 let selected=net[field]||[];
 let cap=parseNetCap(field==="battersNames"?net.batters:net.bowlers);
 let capLabel=isFinite(cap)?` · max ${cap}`:"";
 let expanded=netPlanExpandedKeys.has(key);
 let names=rosterPlayerNames();
 let atCap=isFinite(cap)&&selected.length>=cap;
 let takenElsewhere=namesTakenElsewhere(si,ni,field);
 let optionsHtml=names.length?`<div class="netNamePickGrid" id="netPlayerOptions-${key}">${names.map(n=>{
  let isChecked=selected.includes(n);
  let isTaken=!isChecked&&takenElsewhere.includes(n);
  let disabled=(!isChecked&&(atCap||isTaken))?"disabled":"";
  let title=isTaken?` title="Already selected elsewhere in today's net plan"`:"";
  let bowlCount=field==="bowlersNames"?bowlerSetCountInPlan(n):0;
  let bowlBadge=bowlCount>0?`<span class="bowlCountBadge tag" style="padding:1px 6px;font-size:10px;flex-shrink:0;white-space:nowrap" title="${bowlCount} set${bowlCount===1?"":"s"} already bowled in this plan">${bowlCount}</span>`:"";
  // The name itself truncates with its own ellipsis (not the whole label),

  return `<label class="${disabled?"isDisabled":""}"${title}><input type="checkbox" data-si="${si}" data-ni="${ni}" data-field="${field}" value="${esc(n)}" ${isChecked?"checked":""} ${disabled} onchange="handleNetPlanPlayerToggle(this)"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">${esc(n)}</span>${bowlBadge}</label>`;
 }).join("")}</div>`:`<div class="muted" style="font-size:var(--fs-2);margin-top:4px">${currentNetPlanTeamFilter()?"No players in this team yet.":"No players in roster yet."}</div>`;
 return `<div style="min-width:0">
  <div class="muted" style="font-size:var(--fs-3);font-weight:600;text-transform:uppercase;letter-spacing:.3px;display:flex;justify-content:space-between;align-items:center;gap:4px;cursor:pointer" onclick="toggleNetPlayerAssign('${key}')">
   <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(label)}${capLabel}</span>
   <span class="chev" style="flex-shrink:0">${icon("chevronRight",12)}</span>
  </div>
  <div id="netPlayerSummary-${key}" style="margin-top:2px">${netPlanSelectedNamesHtml(selected)}</div>
  ${expanded?optionsHtml:""}
 </div>`;
}
function netPlanBuilderHtml(){
 if(!sessionNetPlanDraft.length){

   <input type="text" placeholder="Set focus (optional) — e.g. Short-pitch bowling" value="${esc(set.focus||"")}" style="margin-bottom:10px;font-size:var(--fs-3)" onchange="updateSetFocus(${si},this.value)">

      <label style="margin:0">Duration (mins)<input type="number" min="0" value="${net.duration!=null?esc(net.duration):""}" onchange="updateNetPlanField(${si},${ni},'duration',this.value)"></label>
      <button type="button" class="btn danger" style="padding:11px 12px" onclick="removeNetFromSet(${si},${ni})" title="Remove this net">×</button>
     </div>
     <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px">
      ${netPlanNameFieldHtml(si,ni,"battersNames","Batters",net)}
      ${netPlanNameFieldHtml(si,ni,"bowlersNames","Bowlers",net)}
     </div>
     <input type="text" placeholder="Net focus (optional) — e.g. Yorkers" value="${esc(net.focus||"")}" style="font-size:var(--fs-2);padding:7px 9px" onchange="updateNetPlanField(${si},${ni},'focus',this.value)">
    </div>`).join("")}
   <button type="button" class="btn secondary" style="padding:6px 10px;font-size:var(--fs-2)" onclick="addNetToSet(${si})">+ Add Net</button>
  </div>`).join("")+`<button type="button" class="btn secondary" onclick="addNetPlanSet()">+ Add Set</button>`;
}
function renderNetPlanBuilder(){
 let box=document.getElementById("netPlanBuilderBody");
 if(box)box.innerHTML=netPlanBuilderHtml();
 let countEl=document.getElementById("formSecCount-netPlan");
 if(countEl){
  countEl.textContent=sessionNetPlanDraft.length?`(${netPlanCountLabel(sessionNetPlanDraft)})`:"";
 }
}
function toggleNetPlayerAssign(key){
 if(netPlanExpandedKeys.has(key))netPlanExpandedKeys.delete(key);else netPlanExpandedKeys.add(key);

// Deliberately never calls renderNetPlanBuilder() — rebuilding the whole
// builder's innerHTML would recreate every scrollable name-picker grid from
// scratch and reset its scroll position to the top, which is exactly the
// annoyance we're avoiding. Instead this patches just the checkboxes/labels
// that need to change, in place, across every picker currently open.
function handleNetPlanPlayerToggle(el){
 let si=+el.dataset.si,ni=+el.dataset.ni,field=el.dataset.field,name=el.value,checked=el.checked;
 let net=sessionNetPlanDraft[si]&&sessionNetPlanDraft[si].nets[ni];
 if(!net)return;
 net[field]=net[field]||[];
 let cap=parseNetCap(field==="battersNames"?net.batters:net.bowlers);
 if(checked){
  if(isFinite(cap)&&net[field].length>=cap)return; // at capacity — the disabled attribute already blocks this, this is just a safety net
  if(!net[field].includes(name))net[field].push(name);
 } else {
  net[field]=net[field].filter(n=>n!==name);
 }
 // This list's own summary line, and its own greying — recomputed from
 // scratch for every unchecked box (capacity reached AND/OR taken
 // elsewhere), never just capacity alone: overwriting based on capacity
 // only would blindly re-enable a name that's greyed out for being taken
 // in another net/set, the moment anyone else in *this* list is toggled.
 let label=document.getElementById(`netPlayerSummary-${si}-${ni}-${field}`);
 if(label)label.innerHTML=netPlanSelectedNamesHtml(net[field]);
 let grid=document.getElementById(`netPlayerOptions-${si}-${ni}-${field}`);
 if(grid){
  let atCapNow=isFinite(cap)&&net[field].length>=cap;
  let takenNow=namesTakenElsewhere(si,ni,field);
  grid.querySelectorAll('input[type="checkbox"]').forEach(cb=>{
   if(cb.checked)return;
   let isTakenNow=takenNow.includes(cb.value);
   let dis=atCapNow||isTakenNow;
   cb.disabled=dis;
   let lbl=cb.closest("label");
   if(lbl){
    lbl.classList.toggle("isDisabled",dis);
    if(isTakenNow)lbl.title="Already selected elsewhere in today's net plan";else lbl.removeAttribute("title");
   }
  });
 }
 // This name's greying in every OTHER net/role picker, wherever it's
 // currently expanded (same Set: any role; other Sets: same role only —
 // see namesTakenElsewhere). Skipped entirely for pickers not on screen,
 // since they'll compute the correct state fresh whenever they're opened.
 sessionNetPlanDraft.forEach((set,setIdx)=>{
  set.nets.forEach((net2,netIdx)=>{
   if(setIdx===si&&netIdx===ni)return; // this exact net already handled above
   ["battersNames","bowlersNames"].forEach(f2=>{
    // Same-set: any role clashes (parallel nets). Other sets: only batting
    // clashes with batting elsewhere — bowlers are expected to repeat
    // across Sets, so bowling is never cross-set-blocked.
    let clashes=setIdx===si?true:(field==="battersNames"&&f2==="battersNames");
    if(!clashes)return;
    let grid2=document.getElementById(`netPlayerOptions-${setIdx}-${netIdx}-${f2}`);
    if(!grid2)return; // not currently expanded — nothing to patch
    let cb2=[...grid2.querySelectorAll('input[type="checkbox"]')].find(b=>b.value===name);
    if(!cb2||cb2.checked)return;
    let lbl2=cb2.closest("label");
    if(checked){
     cb2.disabled=true;
     if(lbl2){lbl2.classList.add("isDisabled");lbl2.title="Already selected elsewhere in today's net plan"}
    } else {
     let cap2=parseNetCap(f2==="battersNames"?net2.batters:net2.bowlers);
     let atCap2=isFinite(cap2)&&(net2[f2]||[]).length>=cap2;
     cb2.disabled=atCap2;
     if(lbl2){lbl2.classList.toggle("isDisabled",atCap2);if(!atCap2)lbl2.removeAttribute("title")}
    }
   });
  });
 });
 if(field==="bowlersNames")refreshBowlerCountBadges();
}
// Updates the "sets bowled so far" badge on every bowler picker currently
// expanded on screen, without rebuilding any of them (which would reset
// their scroll position). Only bowling toggles call this — batting never
// changes a bowl count.
function refreshBowlerCountBadges(){
 sessionNetPlanDraft.forEach((set,si2)=>{
  set.nets.forEach((net2,ni2)=>{
   let grid=document.getElementById(`netPlayerOptions-${si2}-${ni2}-bowlersNames`);
   if(!grid)return;
   grid.querySelectorAll("label").forEach(lbl=>{
    let cb=lbl.querySelector('input[type="checkbox"]');
    if(!cb)return;
    let count=bowlerSetCountInPlan(cb.value);
    let badge=lbl.querySelector(".bowlCountBadge");
    if(count>0){
     if(!badge){
      badge=document.createElement("span");
      badge.className="bowlCountBadge tag";
      badge.style.cssText="padding:1px 6px;font-size:10px;margin-left:4px;vertical-align:middle";
      lbl.appendChild(badge);
     }
     badge.textContent=count;
     badge.title=`${count} set${count===1?"":"s"} already bowled in this plan`;
    } else if(badge){
     badge.remove();
    }
   });
  });
 });
}
function addNetPlanSet(){
 let lastSet=sessionNetPlanDraft[sessionNetPlanDraft.length-1];
 let template=lastSet&&lastSet.nets.length?lastSet.nets[0]:{batters:2,bowlers:"4",duration:30};
 sessionNetPlanDraft.push({focus:"",nets:[{...template,battersNames:[],bowlersNames:[],focus:""}]});
 renderNetPlanBuilder();
}
function removeNetPlanSet(si){sessionNetPlanDraft.splice(si,1);renderNetPlanBuilder()}
function addNetToSet(si){
 let set=sessionNetPlanDraft[si];if(!set)return;
 let template=set.nets[set.nets.length-1]||{batters:2,bowlers:"4",duration:30};
 set.nets.push({...template,battersNames:[],bowlersNames:[],focus:""});
 renderNetPlanBuilder();
}
function removeNetFromSet(si,ni){
 let set=sessionNetPlanDraft[si];if(!set)return;
 set.nets.splice(ni,1);
 if(!set.nets.length)sessionNetPlanDraft.splice(si,1);
 renderNetPlanBuilder();
}
function updateSetFocus(si,value){
 let set=sessionNetPlanDraft[si];
 if(!set)return;
 set.focus=value;
}
function updateNetPlanField(si,ni,field,value){
 let net=sessionNetPlanDraft[si]&&sessionNetPlanDraft[si].nets[ni];
 if(!net)return;
 net[field]=(field==="batters"||field==="duration")?(value===""?"":Number(value)):value;
 if(field==="batters"||field==="bowlers"){
  // Count just changed — if it's now smaller than an existing name
  // selection, trim the excess names rather than leave an invalid state,
  // then re-render so the picker's cap/disabled state is current.
  // (Expanded/collapsed panels are unaffected — that state lives in
  // netPlanExpandedKeys, not in the DOM being rebuilt.)
  let namesField=field==="batters"?"battersNames":"bowlersNames";
  let cap=parseNetCap(net[field]);
  if(isFinite(cap)&&net[namesField]&&net[namesField].length>cap){
   net[namesField]=net[namesField].slice(0,cap);
  }
  renderNetPlanBuilder();
 }
}
function netPlanSummaryText(netPlan){
 if(!netPlan||!netPlan.length)return "";
 return netPlan.map((set,si)=>{
  let setHeader=`Set ${si+1}${set.focus?` (Focus: ${set.focus})`:""}: `;
  let netsText=set.nets.map((n,ni)=>{
   let battersPart=`${n.batters||"?"} batter${n.batters===1?"":"s"}${(n.battersNames&&n.battersNames.length)?` (${n.battersNames.join(", ")})`:""}`;
   let bowlersPart=`${n.bowlers||"?"} bowler${n.bowlers==="1"?"":"s"}${(n.bowlersNames&&n.bowlersNames.length)?` (${n.bowlersNames.join(", ")})`:""}`;
   let focusPart=n.focus?` [Focus: ${n.focus}]`:"";
   return `Net ${ni+1} — ${battersPart} & ${bowlersPart}${n.duration?`, ${n.duration} mins`:""}${focusPart}`;
  }).join("; ");
  return setHeader+netsText;
 }).join("\n");
}
function netPlanPrintHtml(netPlan){
 if(!netPlan||!netPlan.length)return "";
 return `<h2>Net Plan</h2>${netPlan.map((set,si)=>`
  <div class="card" style="margin-bottom:12px">

function findSessionConflict(s,excludeId){
 if(!s.date||!s.time)return null;
 let toMinutes=t=>{let[h,m]=String(t).split(":").map(Number);return h*60+(m||0)};
 let startA=toMinutes(s.time),endA=startA+(Number(s.duration)||60);
 return activeSessions().find(other=>{
  if(other.id===excludeId||other.date!==s.date||!other.time)return false;
  let startB=toMinutes(other.time),endB=startB+(Number(other.duration)||60);
  return startA<endB&&startB<endA;
 })||null;
}
function saveSession(e){
 e.preventDefault();
 if(!requireWriteAccess())return;
 let fd=new FormData(e.target);
 let s=Object.fromEntries(fd);
 let conflict=findSessionConflict(s,editingSessionId);
 if(conflict&&!confirm(`This overlaps with "${sessionLabel(conflict)}" at ${conflict.time} on the same day. Save anyway?`))return;
 let sessionType=fd.get("sessionType")||"team";
 s.sessionType=sessionType;
 if(sessionType==="team"){
  s.squad=fd.get("squadTeam")||"";
  s.attendees=fd.getAll("attendees");
 } else if(sessionType==="player"){
  let pid=fd.get("sessionPlayerId");
  let p=db.players.find(x=>x.id===pid);
  s.sessionPlayerId=pid||"";
  s.squad=p?`1-on-1: ${p.name}`:"1-on-1 session";
  s.attendees=p?[p.name]:[];
 } else {
  s.squad=fd.get("squadCustom")||"";
  s.attendees=fd.getAll("attendees");
 }
 s.objectiveTags=fd.getAll("objectiveTags");
 delete s.squadTeam;delete s.squadCustom;
 s.mainDrillIds=[...sessionDrillLinks.main];
 s.gameDrillIds=[...sessionDrillLinks.game];
 s.attachment=sessionAttachment;
 s.netPlan=JSON.parse(JSON.stringify(sessionNetPlanDraft));
 if(editingSessionId){
  let idx=db.sessions.findIndex(x=>x.id===editingSessionId);
  if(idx>-1){s.id=editingSessionId;db.sessions[idx]=s}
 } else {
  let repeatEl=document.getElementById("sessionRepeatCheck");
  let repeatChecked=repeatEl&&repeatEl.checked;
  let weeks=repeatChecked?Math.max(2,Math.min(26,+document.getElementById("sessionRepeatWeeks").value||2)):1;
  let baseDate=s.date;
  for(let i=0;i<weeks;i++){
   let copy={...s,attendees:[...(s.attendees||[])],objectiveTags:[...(s.objectiveTags||[])],mainDrillIds:[...(s.mainDrillIds||[])],gameDrillIds:[...(s.gameDrillIds||[])],netPlan:JSON.parse(JSON.stringify(s.netPlan||[]))};
   copy.id=uid("sess");
   if(i>0){
    let d=new Date(baseDate+"T00:00:00Z");
    d.setUTCDate(d.getUTCDate()+7*i);
    copy.date=d.toISOString().slice(0,10);
   }
   db.sessions.push(copy);
  }
 }
 editingSessionId=null;
 sessionDrillLinks={main:[],game:[]};sessionAttachment=null;sessionNetPlanDraft=[];
 closeM();save();
}

 newReflection({date:m.date,session:matchLabel(m),matchId:m.id,type:"match"});
}
// Nudges the coach to reflect on anything past-dated that hasn't been
// reflected on yet — practice sessions AND matches together, newest first.
function reflectPendingSessions(){
 let overdueSessions=activeSessions().filter(s=>s.date<today()&&!db.reflections.some(r=>r.sessionId===s.id)).map(s=>({kind:"session",id:s.id,date:s.date,sortKey:sessionDateTimeKey(s),label:sessionLabel(s)}));
 let overdueMatches=db.matches.filter(m=>m.date<today()&&!db.reflections.some(r=>r.matchId===m.id)).map(m=>({kind:"match",id:m.id,date:m.date,sortKey:m.date||"",label:matchLabel(m)}));
 let overdue=overdueSessions.concat(overdueMatches).sort((a,b)=>String(b.sortKey).localeCompare(String(a.sortKey)));
 if(!overdue.length)return;
 function openItem(item){item.kind==="match"?newReflectionForMatch(item.id):newReflectionForSession(item.id)}
 if(overdue.length===1){openItem(overdue[0]);return}
 modal(`<div class="sheetHead"><h2>Sessions &amp; Matches Awaiting Reflection</h2><button class="x" onclick="closeM()">×</button></div>
 <div class="list">${overdue.map((item,i)=>`<div class="item" style="cursor:pointer" onclick='reflectPendingOpen(${i})'><div><b>${esc(item.label)}</b><div class="muted">${esc(fmtDate(item.date))} · ${item.kind==="match"?"Match":"Session"}</div></div></div>`).join("")}</div>`);
 window._reflectPendingQueue=overdue;
}
function reflectPendingOpen(i){let item=(window._reflectPendingQueue||[])[i];if(!item)return;item.kind==="match"?newReflectionForMatch(item.id):newReflectionForSession(item.id)}
function editReflection(id){let x=db.reflections.find(r=>r.id===id);if(!x)return;editingReflectionId=id;modal(reflectionFormHtml(x,"edit"));renderReflectionObjectiveRatings(x.type==="match"?"":(x.sessionId||""));initReflectionSectionCounts()}
function initReflectionSectionCounts(){["wentWell","betterReasons","takeaway","nextFocus"].forEach(id=>updateFormSectionCount(id,"selected"))}
function saveReflection(e){
 e.preventDefault();
 if(!requireWriteAccess())return;
 let fd=new FormData(e.target);
 let x=Object.fromEntries(fd);
 x.type=x.type==="match"?"match":"session";
 x.betterReasons=fd.getAll("betterReasons");
 x.wentWellThemes=fd.getAll("wentWellThemes");
 x.takeawayThemes=fd.getAll("takeawayThemes");
 x.nextFocusThemes=fd.getAll("nextFocusThemes");
 let objectiveRatings={};
 if(x.type==="session"){
  OBJECTIVE_CATEGORIES.forEach((cat,idx)=>{
   let val=fd.get(`objRating_${idx}`);
   if(val){objectiveRatings[cat]=val}
  });
 }
 OBJECTIVE_CATEGORIES.forEach((cat,idx)=>{delete x[`objRating_${idx}`]});
 if(Object.keys(objectiveRatings).length)x.objectiveRatings=objectiveRatings;
 // Only the fields belonging to the chosen type are kept — the other
 // type's link/ratings are dropped even if they were left in the DOM
 // (e.g. switching type back and forth before saving).
 if(x.type==="match"){
  delete x.sessionId;delete x.objectiveRatings;
 } else {
  delete x.matchId;delete x.tacticalDecisions;delete x.playerManagement;
 }
 if(!x.sessionId)delete x.sessionId;
 if(!x.matchId)delete x.matchId;
 x.autoTags=detectReflectionThemes(reflectionSearchableText(x).join(" "));
 if(editingReflectionId){let idx=db.reflections.findIndex(r=>r.id===editingReflectionId);if(idx>-1){x.id=editingReflectionId;db.reflections[idx]=x}}
 else{x.id=uid("refl");db.reflections.push(x)}
 editingReflectionId=null;closeM();save();
}
function delReflection(id){if(confirm("Delete this reflection?")){db.reflections=db.reflections.filter(r=>r.id!==id);save()}}

const PLAYER_ROLES=["Batter","Bowler","All-rounder","Wicketkeeper","Wicketkeeper-Batter"];
function multiLineChartSvg(series){
 series=series.filter(s=>s.points&&s.points.length);
 if(!series.length)return "";
 let allDates=series.flatMap(s=>s.points.map(pt=>new Date(pt.date).getTime())).filter(Number.isFinite);
 let minD=Math.min(...allDates),maxD=Math.max(...allDates),span=(maxD-minD)||1;
 function xFor(d){return allDates.length>1?((new Date(d).getTime()-minD)/span)*100:50}
 function yFor(v){return 100-(((v-1)/9)*88)-6}
 let lines=series.map(s=>{
  let pts=s.points.map(pt=>`${xFor(pt.date).toFixed(1)},${yFor(pt.value).toFixed(1)}`).join(" ");
  let dots=s.points.map(pt=>`<circle cx="${xFor(pt.date).toFixed(1)}" cy="${yFor(pt.value).toFixed(1)}" r="1.6" fill="${s.color}"/>`).join("");
  let line=s.points.length>1?`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" vector-effect="non-scaling-stroke"/>`:"";
  return line+dots;
 }).join("");
 let legend=series.map(s=>`<span style="display:inline-flex;align-items:center;gap:4px;margin-right:12px"><span style="width:8px;height:8px;border-radius:50%;background:${s.color};display:inline-block"></span>${esc(s.name)}</span>`).join("");
 let dateLabel=allDates.length?`<div class="muted" style="display:flex;justify-content:space-between;font-size:var(--fs-1);margin-top:2px"><span>${esc(fmtDate(new Date(minD).toISOString().slice(0,10)))}</span>${allDates.length>1?`<span>${esc(fmtDate(new Date(maxD).toISOString().slice(0,10)))}</span>`:""}</div>`:"";
 return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="140" style="display:block">${lines}</svg>${dateLabel}<div class="muted" style="margin-top:6px;font-size:var(--fs-1)">${legend}</div>`;
}
const PROGRESS_CHART_COLORS=["var(--g)","var(--blue)","var(--gold)","var(--blue2)","var(--red)"];
const SKILL_CHART_COLORS=["var(--g)","var(--blue)","var(--gold)","var(--blue2)","var(--red)","#a78bfa","#f472b6","#2dd4bf","#fb923c","#94a3b8"];
function assessmentSeriesFromList(assessments,mode,discipline,skill,colorOverride){
 if(mode==="overall"){
  let points=assessments.map(a=>({date:a.date,value:Number(assessmentAvg(a))})).filter(pt=>Number.isFinite(pt.value)&&pt.value>0);
  return[{name:"Overall",color:colorOverride||PROGRESS_CHART_COLORS[0],points}];
 }
 if(mode==="discipline"){
  let allDisciplines=[...new Set(assessments.flatMap(a=>assessmentDisciplines(a)))];
  return allDisciplines.map((d,i)=>{
   let points=assessments.filter(a=>assessmentDisciplines(a).includes(d)).map(a=>({date:a.date,value:Number(disciplineAvg(a,d))})).filter(pt=>Number.isFinite(pt.value)&&pt.value>0);
   return{name:d,color:PROGRESS_CHART_COLORS[i%PROGRESS_CHART_COLORS.length],points};
  }).filter(s=>s.points.length);
 }
 if(mode==="skill"){
  if(!discipline||!skill)return[];
  let skillIdx=allSkillsFor(discipline).indexOf(skill);
  if(skillIdx===-1)return[];
  let points=assessments.filter(a=>assessmentDisciplines(a).includes(discipline)&&a.ratings&&Array.isArray(a.ratings[discipline])).map(a=>({date:a.date,value:Number(a.ratings[discipline][skillIdx])})).filter(pt=>Number.isFinite(pt.value)&&pt.value>0);
  return[{name:skill,color:colorOverride||PROGRESS_CHART_COLORS[1],points}];
 }
 return[];
}
function playerAssessmentSeries(p,mode,discipline,skill){
 return assessmentSeriesFromList(playerAssessments(p),mode,discipline,skill);
}
let playerProgressState={mode:"overall",discipline:"Batting",skill:""};
function playerProgressChartHtml(p){
 let assessments=playerAssessments(p);
 if(assessments.length<2)return `<h2 class="section">Progress over time</h2><div class="card muted">Needs at least 2 assessments (with real ratings) to show a trend.</div>`;
 let allDisciplines=[...new Set(assessments.flatMap(a=>assessmentDisciplines(a)))];
 if(!allDisciplines.includes(playerProgressState.discipline))playerProgressState.discipline=allDisciplines[0]||"Batting";
 let skillOptions=allSkillsFor(playerProgressState.discipline);
 if(!skillOptions.includes(playerProgressState.skill))playerProgressState.skill=skillOptions[0]||"";
 return `<h2 class="section">Progress over time</h2>
 <div class="card">
  <div class="formgrid" style="margin-bottom:8px">
   <label>View<select onchange="playerProgressState.mode=this.value;renderPlayerProgressChart('${p.id}')">
    <option value="overall" ${playerProgressState.mode==="overall"?"selected":""}>Overall</option>
    <option value="discipline" ${playerProgressState.mode==="discipline"?"selected":""}>By discipline</option>
    <option value="skill" ${playerProgressState.mode==="skill"?"selected":""}>By specific skill</option>
   </select></label>
   <label class="progressSkillPicker" style="${playerProgressState.mode==="skill"?"":"display:none"}">Discipline<select onchange="playerProgressState.discipline=this.value;playerProgressState.skill='';renderPlayerProgressChart('${p.id}')">${allDisciplines.map(d=>`<option ${playerProgressState.discipline===d?"selected":""}>${esc(d)}</option>`).join("")}</select></label>
   <label class="progressSkillPicker" style="${playerProgressState.mode==="skill"?"":"display:none"}">Skill<select onchange="playerProgressState.skill=this.value;renderPlayerProgressChart('${p.id}')">${skillOptions.map(s=>`<option ${playerProgressState.skill===s?"selected":""}>${esc(s)}</option>`).join("")}</select></label>
  </div>
  <div id="playerProgressChartBox">${playerProgressChartInner(p)}</div>
 </div>`;
}
function playerProgressChartInner(p){
 let series=playerAssessmentSeries(p,playerProgressState.mode,playerProgressState.discipline,playerProgressState.skill);
 let chart=multiLineChartSvg(series);
 return chart||`<div class="muted">Not enough rated data yet for this view.</div>`;
}
function renderPlayerProgressChart(playerId){
 let p=db.players.find(x=>x.id===playerId);
 if(!p)return;
 document.querySelectorAll(".progressSkillPicker").forEach(el=>el.style.display=playerProgressState.mode==="skill"?"":"none");
 let box=document.getElementById("playerProgressChartBox");
 if(box)box.innerHTML=playerProgressChartInner(p);
}
function playerProgressPrintHtml(assessments){
 if(assessments.length<2)return "";
 let html=`<h2 class="section">Progress over time</h2>`;
 let overallSeries=assessmentSeriesFromList(assessments,"overall");
 if(overallSeries[0]&&overallSeries[0].points.length>=2){
  html+=`<div class="card"><b>Overall</b>${multiLineChartSvg(overallSeries)}</div>`;
 }
 let discSeries=assessmentSeriesFromList(assessments,"discipline").filter(s=>s.points.length>=2);
 if(discSeries.length){
  html+=`<div class="card" style="margin-top:8px"><b>By discipline</b>${multiLineChartSvg(discSeries)}</div>`;
 }
 let allDisciplines=[...new Set(assessments.flatMap(a=>assessmentDisciplines(a)))];
 allDisciplines.forEach(d=>{
  let skills=allSkillsFor(d);
  let skillSeries=skills.map((s,i)=>assessmentSeriesFromList(assessments,"skill",d,s,SKILL_CHART_COLORS[i%SKILL_CHART_COLORS.length])[0]).filter(s=>s&&s.points.length>=2);
  if(skillSeries.length){
   html+=`<div class="card" style="margin-top:8px"><b>${esc(d)} — by skill</b>${multiLineChartSvg(skillSeries)}</div>`;
  }
 });
 return html;
}

function cascadePlayerRename(oldName,newName){
 if(!oldName||oldName===newName)return;
 db.assessments.forEach(a=>{if(a.player===oldName)a.player=newName});
 db.sessions.forEach(s=>{if(Array.isArray(s.attendees)){s.attendees=s.attendees.map(n=>n===oldName?newName:n)}});
 db.matches.forEach(m=>{
  (m.battingReview||[]).forEach(r=>{if(r.name===oldName)r.name=newName});
  (m.bowlingReview||[]).forEach(r=>{if(r.name===oldName)r.name=newName});
  if(Array.isArray(m.playingXI)){m.playingXI=m.playingXI.map(n=>n===oldName?newName:n)}
 });
}
function savePlayer(e){
 e.preventDefault();
 if(!requireWriteAccess())return;
 let p=Object.fromEntries(new FormData(e.target));
 if(editingPlayerId){
  let idx=db.players.findIndex(x=>x.id===editingPlayerId);
  if(idx>-1){
   let oldName=db.players[idx].name;
   let oldGoalSetDate=db.players[idx].goalSetDate;
   p.id=editingPlayerId;
   if(p.goalTargetDate)p.goalSetDate=oldGoalSetDate||today();
   db.players[idx]=p;
   if(oldName&&oldName!==p.name)cascadePlayerRename(oldName,p.name);
  }
 }
 else{
  if(p.goalTargetDate)p.goalSetDate=today();
  let dupe=db.players.find(x=>x.name&&p.name&&x.name.trim().toLowerCase()===p.name.trim().toLowerCase());
  if(dupe&&!confirm(`A player named "${dupe.name}" already exists${dupe.team?" ("+dupe.team+")":""}. Add "${p.name}" as a new, separate player anyway?`))return;
  p.id=uid("plyr");db.players.push(p);
 }
 editingPlayerId=null;closeM();save();
}

function players(){

function computePlayerMatchPatterns(p){
 let matches=playerMatches(p);
 let battingEntries=matches.map(m=>{let r=(m.battingReview||[]).find(x=>x.name===p.name);return r?{...r,date:m.date}:null}).filter(Boolean);
 let bowlingEntries=matches.map(m=>{let r=(m.bowlingReview||[]).find(x=>x.name===p.name);return r?{...r,date:m.date}:null}).filter(Boolean);
 let flags=[];

 if(battingEntries.length>=3){
  let recentDismissals=battingEntries.slice(0,3).map(r=>r.dismissal).filter(d=>d&&d!=="Not out");
  if(recentDismissals.length===3&&recentDismissals[0]===recentDismissals[1]&&recentDismissals[1]===recentDismissals[2]){
   flags.push({text:`Out ${recentDismissals[0].toLowerCase()} in each of the last 3 innings — worth a technical look.`,tone:"watch"});
  }
 }
 if(battingEntries.length>=4){
  let allRuns=battingEntries.map(r=>Number(r.runs)||0);
  let overallAvg=allRuns.reduce((a,b)=>a+b,0)/allRuns.length;
  let recentArr=allRuns.slice(0,3);
  let recentAvg=recentArr.reduce((a,b)=>a+b,0)/recentArr.length;
  if(overallAvg>=5&&recentAvg<overallAvg*0.5){
   flags.push({text:`Averaging ${recentAvg.toFixed(1)} across the last 3 innings, well below their overall average of ${overallAvg.toFixed(1)}.`,tone:"watch"});
  } else if(overallAvg>=5&&recentAvg>overallAvg*1.5){
   flags.push({text:`Averaging ${recentAvg.toFixed(1)} across the last 3 innings, well above their overall average of ${overallAvg.toFixed(1)}.`,tone:"good"});
  }
 }
 if(bowlingEntries.length>=3){
  let recentWickets=bowlingEntries.slice(0,3);
  if(recentWickets.every(r=>Number(r.wickets||0)===0)){
   flags.push({text:`No wickets in the last 3 bowling spells.`,tone:"watch"});
  }
 }
 if(bowlingEntries.length>=3){
  let econOf=r=>{let overs=Number(r.overs)||0,runs=Number(r.runs)||0;return overs>0?runs/overs:null};
  let allEcon=bowlingEntries.map(econOf).filter(e=>e!==null);
  if(allEcon.length>=3){
   let overallEcon=allEcon.reduce((a,b)=>a+b,0)/allEcon.length;
   let recentArr=allEcon.slice(0,3);
   let recentEcon=recentArr.reduce((a,b)=>a+b,0)/recentArr.length;
   if(overallEcon>0&&recentEcon>overallEcon*1.4){
    flags.push({text:`Economy has crept up to ${recentEcon.toFixed(1)} in recent spells, up from their usual ${overallEcon.toFixed(1)}.`,tone:"watch"});
   } else if(overallEcon>0&&recentEcon<overallEcon*0.7){
    flags.push({text:`Economy has improved to ${recentEcon.toFixed(1)} in recent spells, down from their usual ${overallEcon.toFixed(1)}.`,tone:"good"});
   }
  }
 }
 return flags;
}

// A deliberately curated, parent/player-facing summary — strengths,
// active goals, a plain-language trend, and next focus only. No coach
// notes, no raw per-session assessment scores, and nothing about any
// other player. Meant to actually be shared, not an internal report.
function parentSummaryReport(id){
 let p=db.players.find(x=>x.id===id);if(!p)return;
 let aa=playerAssessments(p);
 let disciplineTrend={};
 aa.forEach(a=>{
  assessmentDisciplines(a).forEach(d=>{
   let score=Number(disciplineAvg(a,d));
   if(!Number.isFinite(score))return;
   if(!disciplineTrend[d])disciplineTrend[d]={first:score,last:score,count:1};
   else{disciplineTrend[d].last=score;disciplineTrend[d].count++}
  });
 });
 let trendLines=Object.entries(disciplineTrend).filter(([,t])=>t.count>=2).map(([d,t])=>{
  let verb=t.last>t.first?"improved":t.last<t.first?"needs continued focus":"stayed steady";
  return `${d} has ${verb}${t.last!==t.first?` (${t.first.toFixed(1)} → ${t.last.toFixed(1)} out of 10)`:""}.`;
 });
 let teamSessions=p.team?activeSessions().filter(s=>s.squad===p.team&&p.available!=="no"):[];
 let attended=teamSessions.filter(s=>(s.attendees||[]).includes(p.name)).length;
 let attendanceRate=teamSessions.length?Math.round(attended/teamSessions.length*100):null;
 let activeGoals=(p.goals||[]).filter(g=>!g.achieved);
 reportShell(`${esc(p.name)} — Progress Summary`,`${esc(p.role||"Player")}${p.team?" · "+esc(p.team):""}`,
 `<div class="card"><b>Strengths</b><p>${esc(p.strengths||"Building foundations across the board.")}</p></div>

 ${trendLines.length?`<h2>Recent Progress</h2><div class="card">${trendLines.map(l=>`<p>${esc(l)}</p>`).join("")}</div>`:""}
 ${playerProgressPrintHtml(aa)}
 ${attendanceRate!==null?`<h2>Attendance</h2><div class="card"><p>${attended} of ${teamSessions.length} sessions attended (${attendanceRate}%).</p></div>`:""}
 ${p.focus?`<h2>Next Focus</h2><div class="card"><p>${esc(p.focus)}</p></div>`:""}`);
}

// Format-specific metrics, layered ON TOP of the core skillSets above (never
// replacing them) for Batting/Bowling only — Fielding/Wicketkeeping barely
// change by format, so they stay core-only. Kept in their own namespace
// (a.formatRatings, keyed by a.format) rather than appended into the same
// a.ratings[d] array that skill-trend charts and the archive system index
// into by position — mixing formats into one positionally-indexed array
// would silently corrupt those features whenever a player's assessments
// span more than one format. Custom skills (db.customSkills) remain the
// third, fully open-ended layer, untouched by any of this.
const FORMAT_SKILLS={
 Batting:{
  T20:["Intent vs New Ball","Hitting Spin (Middle Overs)","Range Hitting","Match-up Reading","Dot-ball Recovery","Powerplay Adaptation"],
  ODI:["Phase Awareness","Running & Rotation","Rebuilding After Wicket","Finishing (Overs 40-50)","Strike Rotation Control","Anchoring"],
  Test:["Shot Discipline","Converting Starts","Moving Ball & Bouncers","Spin Defense","Crease Occupation","Pressure Handling"]
 },

function workloadFlagDetails(){

 db.matches.filter(m=>m.date&&m.date>=cutoff).forEach(m=>{
  let names=new Set([...(m.playingXI||[]),...(m.battingReview||[]).map(r=>r.name),...(m.bowlingReview||[]).map(r=>r.name)]);
  names.forEach(name=>{if(!byPlayer[name])byPlayer[name]=new Set();byPlayer[name].add(m.date)});
 });
 let flagged=[];
 Object.entries(byPlayer).forEach(([name,datesSet])=>{
  let dates=[...datesSet].sort();
  for(let i=1;i<dates.length;i++){
   let gap=Math.floor((new Date(dates[i]+"T00:00:00Z")-new Date(dates[i-1]+"T00:00:00Z"))/86400000);

 });

}

  ["full","half","square"].forEach(shape=>{
   (step[shape]&&step[shape].items||[]).forEach(it=>{
    if(it.kind!=="marker")return;
    let label=FIELD_EQUIPMENT_LABELS[it.type];
    if(!label)return;
    if(it.type==="gate"){add("cone gate",1);add("cone",2)} // each gate is built from 2 cones
    else add(label,1);
   });
  });
 });
 return counts;
}

// Export Diagram: rasterizes the current step's ground (at a fixed, print-
// quality pixel size) to a standalone PNG the coach can share outside the app
// (WhatsApp, print handout, etc.) — separate from the full drill/session report.
function exportFieldDiagram(){
 let step=fieldDraft.steps[fieldDraft.activeStep];
 if(!step){alert("No diagram to export.");return}
 let shape=curFieldShape(step);
 let items=curFieldItems(step);
 if(!items.length){alert("This step's diagram is empty — add some markers first.");return}
 let vb=shape==="half"?{w:1200,h:720}:{w:1200,h:1200};
 let svgStr=fieldDiagramSvg({shape:shape,items:items},{exportPx:vb});
 let blob=new Blob([svgStr],{type:"image/svg+xml;charset=utf-8"});
 let url=URL.createObjectURL(blob);
 let img=new Image();
 img.onload=()=>{
  let canvas=document.createElement("canvas");
  canvas.width=vb.w;canvas.height=vb.h;
  let ctx=canvas.getContext("2d");
  ctx.drawImage(img,0,0,vb.w,vb.h);
  URL.revokeObjectURL(url);
  canvas.toBlob(pngBlob=>{
   if(!pngBlob){alert("Couldn't export the diagram image.");return}
   let pngUrl=URL.createObjectURL(pngBlob);
   let nameInput=document.querySelector('.modal.open input[name="name"]');
   let base=(nameInput&&nameInput.value.trim())||"drill-diagram";
   let fname=(base+"-"+(step.label||("step"+(fieldDraft.activeStep+1)))).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"")||"drill-diagram";
   let a=document.createElement("a");
   a.href=pngUrl;a.download=fname+".png";
   document.body.appendChild(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(pngUrl),2000);
  },"image/png");
 };
 img.onerror=()=>{URL.revokeObjectURL(url);alert("Couldn't export the diagram image.")};
 img.src=url;
}

function openMatchForm(existing,mode){
 matchDraft={batting:existing&&existing.battingReview?JSON.parse(JSON.stringify(existing.battingReview)):[],bowling:existing&&existing.bowlingReview?JSON.parse(JSON.stringify(existing.bowlingReview)):[]};
 battingNotesOpen=new WeakSet();bowlingNotesOpen=new WeakSet();
 editingMatchId=mode==="edit"?existing.id:null;
 modal(matchFormHtml(existing,mode));
 renderBattingRows();renderBowlingRows();
}
function newMatch(){openMatchForm(null,"new")}
function logMatchFromFixture(tournamentId,fixtureId){
 let t=db.tournaments.find(x=>x.id===tournamentId);if(!t)return;
 let f=(t.fixtures||[]).find(x=>x.id===fixtureId);if(!f)return;
 let squadNames=(t.squadPlayerIds||[]).map(id=>{let p=db.players.find(x=>x.id===id);return p?p.name:null}).filter(Boolean);
 openMatchForm({date:f.date||today(),opp:f.opponent||"",venue:f.venue||"",tournamentId:t.id,playingXI:squadNames},"new");
}
function copyLastPlayingXI(){
 let matches=db.matches.filter(m=>m.id!==editingMatchId&&m.playingXI&&m.playingXI.length).slice().sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
 if(!matches.length){alert("No previous match with a Playing XI found.");return}
 let lastXI=matches[0].playingXI;
 document.querySelectorAll('input[name="playingXI"]').forEach(cb=>{cb.checked=lastXI.includes(cb.value)});
 renderBattingRows();renderBowlingRows();
}
function editMatch(id){let m=db.matches.find(x=>x.id===id);if(!m)return;openMatchForm(m,"edit")}
function duplicateMatch(id){let src=db.matches.find(x=>x.id===id);if(!src)return;let m=JSON.parse(JSON.stringify(src));delete m.id;m.date=today();openMatchForm(m,"duplicate")}
function toggleMatchTeamCustom(val){
 let wrap=document.getElementById("matchTeamCustomWrap");
 if(wrap)wrap.style.display=val==="__custom__"?"":"none";
}
function saveMatch(e){
 e.preventDefault();
 if(!requireWriteAccess())return;
 let fd=new FormData(e.target);
 let m=Object.fromEntries(fd);
 let teamSelect=fd.get("teamSelect");
 m.team=teamSelect==="__custom__"?(fd.get("teamCustom")||""):(teamSelect||"");
 delete m.teamSelect;delete m.teamCustom;
 m.battingReview=matchDraft.batting.filter(r=>r.name&&String(r.name).trim());
 m.bowlingReview=matchDraft.bowling.filter(r=>r.name&&String(r.name).trim());
 m.playingXI=fd.getAll("playingXI");
 m.battingRatings=collectRatings(fd,"batRating",BATTING_METRICS);
 m.bowlingRatings=collectRatings(fd,"bowlRating",BOWLING_METRICS);
 m.fieldingRatings=collectRatings(fd,"fieldRating",FIELDING_METRICS);
 m.rating=Math.round(avgRatingObj(m.fieldingRatings))||0;
 BATTING_METRICS.forEach((_,i)=>delete m[`batRating_${i}`]);
 BOWLING_METRICS.forEach((_,i)=>delete m[`bowlRating_${i}`]);
 FIELDING_METRICS.forEach((_,i)=>delete m[`fieldRating_${i}`]);
 if(editingMatchId){let idx=db.matches.findIndex(x=>x.id===editingMatchId);if(idx>-1){m.id=editingMatchId;db.matches[idx]=m}}
 else{m.id=uid("m");db.matches.push(m)}
 editingMatchId=null;closeM();save();
}
function delMatch(id){if(confirm("Delete this match? This cannot be undone.")){db.matches=db.matches.filter(x=>x.id!==id);save()}}

 ${m.bowlingRatings?`<div class="card" style="margin-top:10px"><b>Bowling Assessment · ${avgRatingObj(m.bowlingRatings).toFixed(1)}/10 avg</b>${metricRows(m.bowlingRatings)}${m.bowlingAssessmentNotes?`<p style="margin-top:8px">${esc(m.bowlingAssessmentNotes)}</p>`:""}</div>`:""}
 <h2>Fielding Review</h2><div class="card">${(m.taken||m.missed||m.runouts||m.misfields)?`<p>Chances taken ${esc(m.taken||0)} · Missed ${esc(m.missed||0)} · Run outs ${esc(m.runouts||0)} · Misfields ${esc(m.misfields||0)}</p>`:""}${m.fieldingRatings?`<b>Fielding Assessment · ${avgRatingObj(m.fieldingRatings).toFixed(1)}/10 avg</b>${metricRows(m.fieldingRatings)}`:""}<p style="margin-top:8px">${esc(m.notes||"—")}</p></div>

let editingOrgId=null;
function orgEntityFormHtml(kind,e,mode){
 e=e||{};
 let title=kind==="team"?"Team":kind==="tournament"?"Tournament":"Season";
 let showDates=kind!=="team";
 return `<div class="sheetHead"><h2>${mode==="edit"?"Edit":"New"} ${title}</h2><button class="x" onclick="closeM()">×</button></div>
 <form onsubmit="saveOrgEntity(event,'${kind}')">
 <div class="formgrid">
 <label class="full">${title} name<input name="name" value="${esc(e.name||"")}" required></label>
 ${kind==="team"?`<label class="full">Category / Age group<input name="category" value="${esc(e.category||"")}" placeholder="e.g. U17, Senior, 1st XI"></label>`:""}
 ${kind==="season"?`<label class="full">Team <span class="muted" style="font-weight:400">(optional, but recommended — scopes session/match counts to this team only)</span><select name="team"><option value="">No specific team</option>${db.teams.map(t=>`<option value="${esc(t.name)}" ${e.team===t.name?"selected":""}>${esc(t.name)}</option>`).join("")}</select></label>`:""}
 ${showDates?`<label>Start date<input type="date" name="startDate" value="${esc(e.startDate||"")}"></label><label>End date<input type="date" name="endDate" value="${esc(e.endDate||"")}"></label>`:""}
 <label class="full">Notes<textarea name="notes">${esc(e.notes||"")}</textarea></label>
 </div>
 <button class="btn primary">Save ${title}</button>
 </form>`;
}
function newOrgEntity(kind){
 if(!requireWriteAccess())return;
 if(kind==="team"&&!checkBasicCap(db.teams.length,BASIC_TEAM_CAP,"Team"))return;
 if((kind==="tournament"||kind==="season")&&!requirePremium(kind==="tournament"?"Tournament Planning":"Season Planning"))return;
 editingOrgId=null;modal(orgEntityFormHtml(kind,null,"new"));
}
function editOrgEntity(kind,id){
 if((kind==="tournament"||kind==="season")&&!requirePremium(kind==="tournament"?"Tournament Planning":"Season Planning"))return;
 let list=db[kind+"s"];let e=list.find(x=>x.id===id);if(!e)return;editingOrgId=id;modal(orgEntityFormHtml(kind,e,"edit"));
}
function cascadeTeamRename(oldName,newName){
 db.players.forEach(p=>{if(p.team===oldName)p.team=newName});
 db.sessions.forEach(s=>{if(s.squad===oldName)s.squad=newName});
 db.matches.forEach(m=>{if(m.team===oldName)m.team=newName});
 db.seasons.forEach(s=>{if(s.team===oldName)s.team=newName});
}
function saveOrgEntity(e,kind){
 e.preventDefault();
 if(!requireWriteAccess())return;
 let obj=Object.fromEntries(new FormData(e.target));
 let listKey=kind+"s";
 if(editingOrgId){
  let idx=db[listKey].findIndex(x=>x.id===editingOrgId);
  if(idx>-1){
   let oldName=db[listKey][idx].name;
   obj.id=editingOrgId;
   db[listKey][idx]=obj;
   if(kind==="team"&&oldName!==obj.name)cascadeTeamRename(oldName,obj.name);
  }
 } else {
  obj.id=uid(kind.slice(0,5));
  db[listKey].push(obj);
 }
 editingOrgId=null;closeM();save();
}
function delOrgEntity(kind,id){
 let listKey=kind+"s";
 let e=db[listKey].find(x=>x.id===id);if(!e)return;
 if(!confirm(`Remove "${e.name}" from your ${kind} list? Records that already reference it keep the name as text.`))return;
 db[listKey]=db[listKey].filter(x=>x.id!==id);
 save();
}

function isoAddDays(isoStr,days){let d=new Date(isoStr+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10)}
function isoDiffDays(isoA,isoB){let a=new Date(isoA+"T00:00:00Z"),b=new Date(isoB+"T00:00:00Z");return Math.round((b-a)/86400000)}
function autoSplitPhases(seasonId){
 let s=db.seasons.find(x=>x.id===seasonId);if(!s)return;
 if(!s.startDate||!s.endDate){alert("Set a start and end date for this season first (Edit).");return}
 if(s.phases&&s.phases.length){
  if(!confirm("This season already has phases. Auto-split will add 4 default phases alongside them — you can edit or delete any afterward. Continue?"))return;
 }
 let totalDays=isoDiffDays(s.startDate,s.endDate)+1;
 if(totalDays<4){alert("This season's date range is too short to auto-split into phases.");return}
 let splits=[
  {name:"Pre-season",focus:"Conditioning and foundational skill work",share:0.15},
  {name:"In-season",focus:"Regular training and match rhythm",share:0.55},
  {name:"Peak / Tournament period",focus:"Competition-focused preparation",share:0.20},
  {name:"Off-season review",focus:"Review, recovery and planning for next season",share:0.10}
 ];
 let cursor=s.startDate,newPhases=[];
 splits.forEach((sp,i)=>{
  let remaining=splits.length-i;
  let daysLeft=isoDiffDays(cursor,s.endDate)+1;
  let days;
  if(i===splits.length-1){days=daysLeft}
  else{let ideal=Math.round(totalDays*sp.share);let maxAllowed=daysLeft-(remaining-1);days=Math.max(1,Math.min(ideal,maxAllowed))}
  let phaseStart=cursor,phaseEnd=isoAddDays(phaseStart,days-1);
  newPhases.push({id:uid("phase"),name:sp.name,startDate:phaseStart,endDate:phaseEnd,focus:sp.focus,sessionTarget:""});
  cursor=isoAddDays(phaseEnd,1);
 });
 if(!Array.isArray(s.phases))s.phases=[];
 s.phases=s.phases.concat(newPhases);
 save();
}

function skillTrendsHtml(roster,assessments){
 let disciplines=Object.keys(skillSets);
 let rows=roster.map(p=>{
  let declining=[],stagnant=[],improving=[];
  disciplines.forEach(d=>{
   let skills=allSkillsFor(d);
   skills.forEach((s,i)=>{
    let series=assessments.filter(a=>a.player===p.name&&assessmentDisciplines(a).includes(d)&&a.ratings&&Array.isArray(a.ratings[d]))
     .map(a=>({date:a.date,value:Number(a.ratings[d][i])}))
     .filter(pt=>Number.isFinite(pt.value)&&pt.value>0)
     .sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));
    if(series.length<2)return;
    let first=series[0].value,latest=series[series.length-1].value;
    let last3=series.slice(-3);
    let isStagnant=last3.length>=3&&last3.every(pt=>pt.value===last3[0].value);
    if(isStagnant){stagnant.push(`${d}: ${s}`)}
    else if(latest<first){declining.push(`${d}: ${s} (${first}→${latest})`)}
    else if(latest>first){improving.push(`${d}: ${s} (${first}→${latest})`)}
   });
  });
  return{p,declining,stagnant,improving};
 }).filter(r=>r.declining.length||r.stagnant.length||r.improving.length);
 if(!rows.length)return "";
 return `<h2>Skill Trends</h2>
 ${rows.map(({p,declining,stagnant,improving})=>`<div class="card">
 <b>${esc(p.name)}</b>
 ${declining.length?`<p style="color:var(--red);margin-top:6px"><b>Declining:</b> ${esc(declining.join(", "))}</p>`:""}
 ${stagnant.length?`<p style="color:var(--gold);margin-top:6px"><b>Stagnant (3+ assessments, no change):</b> ${esc(stagnant.join(", "))}</p>`:""}
 ${improving.length?`<p class="muted" style="margin-top:6px"><b>Improving:</b> ${esc(improving.join(", "))}</p>`:""}
 </div>`).join("")}`;
}

// already typed in — the coach still picks who to send it to, but skips
// the copy/switch-app/paste dance the plain "Copy" buttons still require.
// A 10-digit number is assumed to be an Indian mobile and given the +91
// prefix wa.me needs; anything else is left as-is (or omitted entirely,
// which opens WhatsApp's own contact/group picker instead of one chat).
function normalizePhoneForWhatsApp(phone){
 let digits=String(phone||"").replace(/\D/g,"");
 if(!digits)return "";
 if(digits.length===10)digits="91"+digits;
 return digits;
}
function shareViaWhatsApp(text,phone){
 let digits=normalizePhoneForWhatsApp(phone);
 window.open(`https://wa.me/${digits}?text=${encodeURIComponent(text)}`,"_blank");
}

// Returns every searchable piece of text for a reflection, correctly
// pulling from the new fields (betterReasons/betterDetail/learnings) or
// falling back to the old ones (better/players/change) for reflections
// saved before that schema change — so search never silently misses a
// reflection just because of which field its text happens to live in.
function reflectionSearchableText(r){
 return[
  r.session,r.well,r.next,
  (r.betterReasons&&r.betterReasons.length)?r.betterReasons.join(" "):"",
  r.betterDetail!==undefined?r.betterDetail:r.better,
  r.learnings!==undefined?r.learnings:[r.players,r.change].filter(Boolean).join(" "),
  (r.wentWellThemes&&r.wentWellThemes.length)?r.wentWellThemes.join(" "):"",
  (r.takeawayThemes&&r.takeawayThemes.length)?r.takeawayThemes.join(" "):"",
  (r.nextFocusThemes&&r.nextFocusThemes.length)?r.nextFocusThemes.join(" "):""
 ];
}
function reflectionWentWellText(r){return[(r.wentWellThemes||[]).join(", "),r.well].filter(Boolean).join(" — ")}
function reflectionTakeawayText(r){return[(r.takeawayThemes||[]).join(", "),r.learnings!==undefined?r.learnings:[r.players,r.change].filter(Boolean).join(" ")].filter(Boolean).join(" — ")}
function reflectionNextFocusText(r){return[(r.nextFocusThemes||[]).join(", "),r.next].filter(Boolean).join(" — ")}
function venueOptions(){let venues=[...new Set([...activeSessions().map(s=>s.venue),...db.matches.map(m=>m.venue)].filter(Boolean))];return venues.map(v=>`<option value="${esc(v)}">`).join("")}

// Auto-generated, readable paragraph pulled entirely from structured match

 if(m.toss==="Won")parts.push(`${teamLabel} won the toss and chose to ${(m.tossDecision||"bat").toLowerCase()} first.`);
 else if(m.toss==="Lost")parts.push(`${oppLabel} won the toss.`);
 let topBat=(m.battingReview||[]).filter(r=>r.name).slice().sort((a,b)=>(Number(b.runs)||0)-(Number(a.runs)||0))[0];
 if(topBat&&Number(topBat.runs)>0)parts.push(`${topBat.name} top-scored with ${topBat.runs}${topBat.balls?` off ${topBat.balls} balls`:""}${topBat.dismissal&&topBat.dismissal!=="Not out"?` (${topBat.dismissal})`:topBat.dismissal==="Not out"?" (not out)":""}.`);
 let topBowl=(m.bowlingReview||[]).filter(r=>r.name).slice().sort((a,b)=>(Number(b.wickets)||0)-(Number(a.wickets)||0))[0];
 if(topBowl&&Number(topBowl.wickets)>0)parts.push(`${topBowl.name} was the pick of the bowlers, taking ${topBowl.wickets} wicket${Number(topBowl.wickets)===1?"":"s"}${topBowl.overs?` in ${topBowl.overs} overs`:""}${topBowl.runs!==undefined&&topBowl.runs!==""?` for ${topBowl.runs} runs`:""}.`);
 if(m.result)parts.push(`Result: ${m.result}.`);
 return parts.join(" ");
}

// Lightweight keyword-based theme detection over a reflection's free text —
// surfaces recurring concerns across many reflections without asking the
// coach to tag anything manually.
const REFLECTION_THEMES=[
 {theme:"Attendance / availability",keywords:["attendance","absent","missed","turnout","availability","no-show","no show"]},
 {theme:"Communication",keywords:["communicat","listen","instruction","explain"]},
 {theme:"Discipline / focus",keywords:["focus","distract","discipline","concentrat"]},
 {theme:"Fitness / conditioning",keywords:["fitness","tired","fatigue","stamina","conditioning"]},
 {theme:"Batting technique",keywords:["footwork","bat swing","shot selection","batting technique","balance at the crease"]},
 {theme:"Bowling technique",keywords:["run-up","run up","bowling action","line and length","no-ball","wide"]},
 {theme:"Confidence / mindset",keywords:["confidence","nervous","pressure","anxious","mindset"]},
 {theme:"Session time management",keywords:["ran out of time","time management","pacing","rushed","overran"]},
 {theme:"Weather / conditions",keywords:["rain","weather","wet","heat","conditions"]},
 {theme:"Team dynamics",keywords:["team spirit","dynamics","conflict","argument","clique"]}
];
function detectReflectionThemes(text){
 let lower=String(text||"").toLowerCase();
 return REFLECTION_THEMES.filter(t=>t.keywords.some(k=>lower.includes(k))).map(t=>t.theme);
}
function reflectionThemeCounts(){
 let counts={};
 db.reflections.forEach(r=>{
  let tags=(r.autoTags&&r.autoTags.length)?r.autoTags:detectReflectionThemes(reflectionSearchableText(r).join(" "));
  tags.forEach(t=>{counts[t]=(counts[t]||0)+1});
 });
 return Object.entries(counts).sort((a,b)=>b[1]-a[1]);
}
function recurringThemesCardHtml(){
 let counts=reflectionThemeCounts().filter(([,c])=>c>=2);
 if(!counts.length)return "";
 return `<h2 class="section">Recurring Themes</h2><div class="card"><div class="muted" style="margin-bottom:8px">Detected automatically from what you've written across your reflections — a theme appearing repeatedly is often worth addressing directly.</div>${counts.map(([theme,c])=>`<div class="item"><div><b>${esc(theme)}</b></div><span class="tag">${c} mention${c===1?"":"s"}</span></div>`).join("")}</div>`;
}

// Sessions/matches don't carry a playerId list the way assessments do, so
// team/season scoping matches them by team name (session.squad / match.team)
// directly when possible, and falls back to "attended/played by someone in
// the scoped roster" for scopes (player/group/tournament) that don't map to
// a single team name — same fallback buildTeamReport already relies on.
function sessionsInScope(scope,from,to){
 if(scope.type==="team")return activeSessions().filter(s=>s.squad===scope.value&&inRange(s.date,from,to));
 if(scope.type==="season"){
  let season=db.seasons.find(x=>x.id===scope.value);
  return season&&season.team?activeSessions().filter(s=>s.squad===season.team&&inRange(s.date,from,to)):[];
 }
 if(scope.type==="all")return activeSessions().filter(s=>inRange(s.date,from,to));
 let names=new Set(playersInScope(scope).map(p=>p.name));
 return activeSessions().filter(s=>inRange(s.date,from,to)&&(s.attendees||[]).some(n=>names.has(n)));
}
function matchesInScope(scope,roster,from,to){
 if(scope.type==="team")return db.matches.filter(m=>m.team===scope.value&&inRange(m.date,from,to));
 if(scope.type==="season"){
  let season=db.seasons.find(x=>x.id===scope.value);
  return season&&season.team?db.matches.filter(m=>m.team===season.team&&inRange(m.date,from,to)):[];
 }
 if(scope.type==="all")return db.matches.filter(m=>inRange(m.date,from,to));
 let seen=new Set(),out=[];
 roster.forEach(p=>{playerMatches(p).forEach(m=>{if(inRange(m.date,from,to)&&!seen.has(m.id)){seen.add(m.id);out.push(m)}})});
 return out.sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));
}

 let sections=[];
 if(document.getElementById("crbSessions").checked){
  let list=sessionsInScope(scope,from,to);

function coachReport(){reportRangeModal("Coach Development Report","buildCoachReport")}
function buildCoachReport(){
 let{from,to}=reportRangeValues();
 let reflections=db.reflections.filter(r=>inRange(r.date,from,to));
 let objectiveRatingAgg={};
 reflections.forEach(r=>{
  if(!r.objectiveRatings)return;
  Object.entries(r.objectiveRatings).forEach(([cat,val])=>{
   let num=Number(val);
   if(!Number.isFinite(num))return;
   if(!objectiveRatingAgg[cat])objectiveRatingAgg[cat]={sum:0,count:0};
   objectiveRatingAgg[cat].sum+=num;objectiveRatingAgg[cat].count++;
  });
 });
 let objectiveRatingRows=Object.entries(objectiveRatingAgg).map(([cat,d])=>({cat,avg:d.sum/d.count,count:d.count})).sort((a,b)=>b.avg-a.avg);
 reportShell("Coach Development Report",rangeLabel(from,to),
 `${objectiveRatingRows.length?`<h2 style="margin-top:0">Objective Achievement — Term Average</h2><div class="card">${objectiveRatingRows.map(r=>`<div style="display:flex;justify-content:space-between;padding:4px 0"><span>${esc(r.cat)} <span class="muted" style="font-size:var(--fs-2)">(${r.count} reflection${r.count!==1?"s":""})</span></span><b>${r.avg.toFixed(1)}/5</b></div>`).join("")}</div>`:""}
 ${reflections.length?reflections.map(r=>{
  let reasonsPart=(r.betterReasons&&r.betterReasons.length)?r.betterReasons.join(", "):"";
  let detailPart=r.betterDetail!==undefined?r.betterDetail:(r.betterReasons===undefined?(r.better||""):"");
  let betterText=[reasonsPart,detailPart].filter(Boolean).join(" — ")||"—";
  let learningsText=reflectionTakeawayText(r)||"—";
  let wentWellText=reflectionWentWellText(r)||"—";
  let nextFocusText=reflectionNextFocusText(r)||"—";
  let objectiveRatingsHtml=(r.objectiveRatings&&Object.keys(r.objectiveRatings).length)?`<p><b>Achieved Objectives:</b> ${Object.entries(r.objectiveRatings).map(([cat,val])=>`${esc(cat)} ${esc(val)}/5`).join(", ")}</p>`:"";
  return `<div class="card"><b>${esc(fmtDate(r.date))} · ${esc(r.session||"Coaching Reflection")}</b><p><b>Rating:</b> ${esc(r.rating)}/5</p><p><b>What went well:</b> ${esc(wentWellText)}</p><p><b>What could improve:</b> ${esc(betterText)}</p><p><b>Key takeaway:</b> ${esc(learningsText)}</p>${objectiveRatingsHtml}<p><b>Next focus:</b> ${esc(nextFocusText)}</p></div>`;
 }).join(""):empty("No reflections documented.")}`);
}

function calendar(){

 }

function handleRestoreFile(input){
 let file=input.files&&input.files[0];if(!file)return;
 let reader=new FileReader();
 reader.onload=()=>{
  let parsed;
  try{parsed=JSON.parse(reader.result)}catch(e){alert("Could not read this file — it may not be a valid backup.");input.value="";return}
  if(!parsed||typeof parsed!=="object"){alert("This doesn't look like a valid ProCoach OS backup file.");input.value="";return}
  if(!confirm("Restore this backup? This will replace all current data for this profile. This cannot be undone.")){input.value="";return}
  let licenseFromBackup=parsed._license;
  delete parsed._license;
  ["sessions","reflections","players","assessments","matches","drills","events"].forEach(k=>{parsed[k]=Array.isArray(parsed[k])?parsed[k]:[]});
  parsed.matches.forEach(m=>{if(!m.id)m.id=uid("m")});
  parsed.drills.forEach(d=>{if(!d.id)d.id=uid("drill")});
  db=parsed;
  if(licenseFromBackup&&typeof licenseFromBackup==="object"){
   // Restore the license too, so a fresh device doesn't need the key
   // re-entered by hand. Any staleness (e.g. a plan change since this
   // backup was taken) self-corrects via revalidateLicenseIfNeeded() the
   // next time the app opens, since the server stays the source of truth.
   saveLicenseState(licenseFromBackup);
  }
  idbSet(DB_KEY,db).catch(err=>console.warn("IndexedDB save failed",err)).then(()=>{
   try{localStorage.setItem(DB_KEY,JSON.stringify(db))}catch(e){}
   alert("Backup restored successfully.");
   location.reload();
  });
 };

function icsEscape(str){return String(str||"").replace(/\\/g,"\\\\").replace(/,/g,"\\,").replace(/;/g,"\\;").replace(/\n/g,"\\n")}
function icsTimedDate(dateStr,timeStr,addMinutes){
 let d=new Date(`${dateStr}T${timeStr||"00:00"}:00`);
 if(addMinutes)d.setMinutes(d.getMinutes()+addMinutes);
 let pad=n=>String(n).padStart(2,"0");
 return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
}
function exportCalendarICS(){
 let lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ProCoach OS//Calendar Export//EN","CALSCALE:GREGORIAN"];
 activeSessions().filter(s=>s.date).forEach(s=>{
  let durMin=Number(s.duration)||60;
  lines.push("BEGIN:VEVENT");
  lines.push(`UID:session-${s.id}@procoachos.in`);
  lines.push(`DTSTAMP:${icsTimedDate(today(),"00:00")}`);
  lines.push(`DTSTART:${icsTimedDate(s.date,s.time)}`);
  lines.push(`DTEND:${icsTimedDate(s.date,s.time,durMin)}`);
  lines.push(`SUMMARY:${icsEscape(sessionLabel(s))}`);
  if(s.venue)lines.push(`LOCATION:${icsEscape(s.venue)}`);
  lines.push("END:VEVENT");
 });
 db.matches.filter(m=>m.date).forEach(m=>{
  let dateCompact=m.date.replace(/-/g,"");
  let nextDay=new Date(m.date+"T00:00:00");nextDay.setDate(nextDay.getDate()+1);
  let pad=n=>String(n).padStart(2,"0");
  let nextDayCompact=`${nextDay.getFullYear()}${pad(nextDay.getMonth()+1)}${pad(nextDay.getDate())}`;
  lines.push("BEGIN:VEVENT");
  lines.push(`UID:match-${m.id}@procoachos.in`);
  lines.push(`DTSTAMP:${icsTimedDate(today(),"00:00")}`);
  lines.push(`DTSTART;VALUE=DATE:${dateCompact}`);
  lines.push(`DTEND;VALUE=DATE:${nextDayCompact}`);
  lines.push(`SUMMARY:${icsEscape("Match vs "+(m.opp||"Opposition"))}`);
  if(m.venue)lines.push(`LOCATION:${icsEscape(m.venue)}`);
  lines.push("END:VEVENT");
 });
 lines.push("END:VCALENDAR");
 let blob=new Blob([lines.join("\r\n")],{type:"text/calendar"});
 let url=URL.createObjectURL(blob);
 let a=document.createElement("a");a.href=url;a.download="ProCoach-OS-Calendar-"+today()+".ics";
 document.body.appendChild(a);a.click();document.body.removeChild(a);
 URL.revokeObjectURL(url);
}
