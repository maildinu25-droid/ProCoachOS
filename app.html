/* ===== Licensing / Trial =====
 App-wide, not tied to any single coach profile — one license unlocks its
 tier for every profile on this device. Trial length is set by TRIAL_DAYS
 below; change that one number to adjust it.

 Before anything else, the app requires an email to start the trial —
 needsEmailGate()/showEmailGate()/submitEmailGate() below. This is checked

 Four states: "trial" (14 days, everything unlocked, no caps) -> once it
 expires with no key entered, becomes "expired" — a soft lock: existing

 failure is treated distinctly from a genuinely invalid key (returns

 is wrong). submitEmailGate() also checks the real Dodo backend
 (checkTrialEmailUsed() -> /api/trial/check) before creating a trial — a
 definitive "already used" answer blocks it with a clear message; a
 network failure fails OPEN (lets the trial start, logs quietly) since a
 transient connectivity hiccup shouldn't punish a genuine new coach. Honest
 limit, unchanged from before: this is enforced by email address only —
 raises the bar against casual reuse, doesn't make a determined person
 using a fresh email address impossible to stop. And submitEmailGate() sends a real welcome
 email via a Cloudflare Worker (coachbook-email-worker.js) -> Resend, but
 that send is fail-open by design: the trial starts regardless of whether

 shown to the user. What's still NOT verified: the email address itself is
 real/deliverable — only its format is checked.
*/

 try{

  let result=null;try{result=await response.json()}catch(_){}

 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){alert("Enter a valid email address.");return}

 if(submitBtn){submitBtn.disabled=true;submitBtn.textContent="Checking..."}

 }
 if(submitBtn){submitBtn.textContent="Sending Code..."}
 let sendResult=null;
 try{

 }catch(err){

async function resendEmailGateCode(){

 try{

 e.preventDefault();
 let input=document.getElementById("emailGateCodeInput");

 if(!verifyResult||verifyResult.verified!==true){

  alert(reason);

 }
 if(submitBtn){submitBtn.textContent="Starting Trial..."}
 let profileName="Coach";
 try{if(typeof getActiveProfile==="function"){let profile=getActiveProfile();if(profile&&profile.name)profileName=profile.name}}catch(_){}
 // Send the welcome email, but never block the trial on it — a failed
 // send (bad connection, Worker down, Resend hiccup) should never stop
 // someone from actually using the app. Failures are logged quietly,
 // not shown to the user.
 try{
  let response=await fetch(EMAIL_GATE_API,{method:"POST",headers:{"Content-Type":"application/json","Accept":"*/*"},body:JSON.stringify({email:email,name:profileName})});
  let result=null;try{result=await response.json()}catch(_){}
  if(!response.ok||!result||result.success!==true){console.error("Welcome email failed to send:",result&&result.error?result.error:response.status)}
 }catch(err){console.error("Welcome email failed to send:",err&&err.message?err.message:err)}
 let lic={status:"trial",trialStartedAt:today(),licenseKey:"",trialEndedNoticeShown:false,email:email};
 saveLicenseState(lic);
 pendingVerificationEmail="";
 let overlay=document.getElementById("emailGateOverlay");if(overlay)overlay.remove();
 nav();renderAll();applyTheme(document.documentElement.classList.contains("light")?"light":"dark");checkPlanTransition();
}
function daysLeftFromStart(trialStartedAt){
 let started=new Date((trialStartedAt||today())+"T00:00:00Z");
 let now=new Date();
 let daysElapsed=Math.floor((now-started)/86400000);
 return Math.max(0,TRIAL_DAYS-daysElapsed);
}
function getLicenseState(){
 let raw=null;try{raw=JSON.parse(localStorage.getItem(LICENSE_KEY))}catch(e){}
 if(!raw||typeof raw!=="object"){raw={status:"trial",trialStartedAt:today(),licenseKey:"",trialEndedNoticeShown:false,email:""}}
 if(raw.status==="trial"&&daysLeftFromStart(raw.trialStartedAt)<=0){raw.status="expired"}
 try{localStorage.setItem(LICENSE_KEY,JSON.stringify(raw))}catch(e){}
 return raw;
}
function saveLicenseState(state){try{localStorage.setItem(LICENSE_KEY,JSON.stringify(state))}catch(e){}}
function trialDaysLeft(){let lic=getLicenseState();return lic.status==="trial"?daysLeftFromStart(lic.trialStartedAt):0}
function isPremium(){let lic=getLicenseState();return lic.status==="premium"||lic.status==="trial"}
function isBasic(){return getLicenseState().status==="basic"}
function isLocked(){return getLicenseState().status==="expired"}

 <div class="card"><p>To keep adding and editing sessions, players, matches and everything else, choose a paid plan — <b>Basic</b> (Teams and Coach Profiles capped at ${BASIC_TEAM_CAP} each; Reports, Bulk Add, Tournament & Season Planning and Excel Export reserved for Premium) or <b>Premium</b> (everything unlocked, no caps).</p>

const LICENSE_VALIDATE_API="https://procoachos-dodo.maildinu25.workers.dev/api/licenses/validate";
function getDeviceId(){
 let id=null;
 try{id=localStorage.getItem("coachbook_device_id")}catch(e){}
 if(!id){
  id="dev_"+Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,"0")).join("");
  try{localStorage.setItem("coachbook_device_id",id)}catch(e){}
 }
 return id;
}
async function validateLicenseKey(key){
 key=String(key||"").trim();
 if(!key)return{tier:null,networkError:false,deviceLimitReached:false};
 try{
  let response=await fetch(LICENSE_VALIDATE_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key,deviceId:getDeviceId()})});
  let result=null;try{result=await response.json()}catch(_){}
  if(response.ok&&result&&result.valid&&(result.tier==="basic"||result.tier==="premium")){
   return{tier:result.tier,networkError:false,deviceLimitReached:false};
  }
  if(result&&result.error==="device_limit_reached"){
   return{tier:null,networkError:false,deviceLimitReached:true};
  }
  if(response.status>=500){
   // The server itself errored (a real bug on our end) — this is NOT
   // the same as "this key is genuinely invalid", and showing it that
   // way would be actively misleading. Surface it as a network-style
   // failure so the person isn't told their real key is wrong.
   console.error("License server returned an error:",response.status,result&&result.error?result.error:"");
   return{tier:null,networkError:true,deviceLimitReached:false};
  }
  return{tier:null,networkError:false,deviceLimitReached:false};
 }catch(err){
  console.error("License validation request failed:",err&&err.message?err.message:err);
  return{tier:null,networkError:true,deviceLimitReached:false};
 }
}
async function activateLicense(){
 let input=document.getElementById("licenseKeyInput");
 let key=input?input.value.trim():"";
 if(!key){alert("Enter a license key.");return}
 let submitBtn=document.querySelector('button[onclick="activateLicense()"]');
 if(submitBtn){submitBtn.disabled=true;submitBtn.textContent="Checking..."}
 let{tier,networkError,deviceLimitReached}=await validateLicenseKey(key);
 if(networkError){
  if(submitBtn){submitBtn.disabled=false;submitBtn.textContent="Activate"}
  alert("Couldn't reach the license server. Check your connection and try again.");
  return;
 }
 if(deviceLimitReached){
  if(submitBtn){submitBtn.disabled=false;submitBtn.textContent="Activate"}
  alert("This license key is already active on the maximum number of devices. Remove it from another device first, or contact support if you need a higher limit.");
  return;
 }
 if(!tier){
  if(submitBtn){submitBtn.disabled=false;submitBtn.textContent="Activate"}
  alert("That license key doesn't look valid. Please check and try again.");
  return;
 }
 let lic=getLicenseState();
 lic.status=tier;lic.licenseKey=key;lic.lastRevalidatedAt=Date.now();
 saveLicenseState(lic);
 alert(`License activated — ${tier==="premium"?"Premium":"Basic"} features unlocked.`);
 accountPage();
}
// Silently re-checks a paid license against the server, at most once a day.
// Never downgrades on a network failure (fails open, retries next time) —
// only a definitive "no longer valid" answer from the server (subscription
// cancelled, payment failed, device removed) actually locks the app.
const LICENSE_REVALIDATE_INTERVAL_MS=24*60*60*1000;
async function revalidateLicenseIfNeeded(){
 let lic=getLicenseState();
 if(lic.status!=="basic"&&lic.status!=="premium")return;
 if(!lic.licenseKey)return;

function saveSession(e){
 e.preventDefault();
 if(!requireWriteAccess())return;
 let fd=new FormData(e.target);
 let s=Object.fromEntries(fd);
 let sessionType=fd.get("sessionType")||"team";
 s.sessionType=sessionType;
 if(sessionType==="team"){
  s.squad=fd.get("squadTeam")||"";
  s.attendees=fd.getAll("attendees");
 } else if(sessionType==="player"){
  let pid=fd.get("sessionPlayerId");
  let p=db.players.find(x=>x.id===pid);
  s.sessionPlayerId=pid||"";
  s.squad=p?`1-on-1: ${p.name}`:"1-on-1 session";
  s.attendees=p?[p.name]:[];
 } else {
  s.squad=fd.get("squadCustom")||"";
  s.attendees=fd.getAll("attendees");
 }
 s.objectiveTags=fd.getAll("objectiveTags");
 delete s.squadTeam;delete s.squadCustom;
 s.mainDrillIds=[...sessionDrillLinks.main];
 s.gameDrillIds=[...sessionDrillLinks.game];
 s.attachment=sessionAttachment;
 if(editingSessionId){
  let idx=db.sessions.findIndex(x=>x.id===editingSessionId);
  if(idx>-1){s.id=editingSessionId;db.sessions[idx]=s}
 } else {
  let repeatEl=document.getElementById("sessionRepeatCheck");
  let repeatChecked=repeatEl&&repeatEl.checked;
  let weeks=repeatChecked?Math.max(2,Math.min(26,+document.getElementById("sessionRepeatWeeks").value||2)):1;
  let baseDate=s.date;
  for(let i=0;i<weeks;i++){
   let copy={...s,attendees:[...(s.attendees||[])],objectiveTags:[...(s.objectiveTags||[])],mainDrillIds:[...(s.mainDrillIds||[])],gameDrillIds:[...(s.gameDrillIds||[])]};
   copy.id=uid("sess");
   if(i>0){
    let d=new Date(baseDate+"T00:00:00Z");
    d.setUTCDate(d.getUTCDate()+7*i);
    copy.date=d.toISOString().slice(0,10);
   }
   db.sessions.push(copy);
  }
 }
 editingSessionId=null;
 sessionDrillLinks={main:[],game:[]};sessionAttachment=null;
 closeM();save();
}
function applySessionTemplate(templateId){

 if(!t)return;
 let form=document.querySelector('form[onsubmit*="saveSession"]');
 if(!form)return;
 let setVal=(name,val)=>{let el=form.querySelector(`[name="${name}"]`);if(el)el.value=val||""};
 setVal("duration",t.duration);setVal("focus",t.focus);setVal("venue",t.venue);
 setVal("objectives",t.objectives);setVal("warmup",t.warmup);setVal("main",t.main);
 setVal("game",t.game);setVal("cues",t.cues);setVal("success",t.success);
 form.querySelectorAll('input[name="objectiveTags"]').forEach(cb=>{cb.checked=(t.objectiveTags||[]).includes(cb.value)});
 updateFormSectionCount("objectiveTags","selected");
 sessionDrillLinks.main=[...(t.mainDrillIds||[])];
 sessionDrillLinks.game=[...(t.gameDrillIds||[])];
 renderDrillLinks("main");renderDrillLinks("game");
}
function saveAsTemplate(){
 let form=document.querySelector('form[onsubmit*="saveSession"]');
 if(!form)return;
 let name=prompt('Name this template (e.g. "Standard Tuesday Batting Session"):');
 if(!name||!name.trim())return;
 let fd=new FormData(form);
 let t={
  id:uid("tmpl"),name:name.trim(),
  duration:fd.get("duration")||"",focus:fd.get("focus")||"",venue:fd.get("venue")||"",
  objectives:fd.get("objectives")||"",objectiveTags:fd.getAll("objectiveTags"),
  warmup:fd.get("warmup")||"",main:fd.get("main")||"",game:fd.get("game")||"",
  cues:fd.get("cues")||"",success:fd.get("success")||"",
  mainDrillIds:[...sessionDrillLinks.main],gameDrillIds:[...sessionDrillLinks.game]
 };
 db.sessionTemplates.push(t);save();
 alert(`Template "${t.name}" saved — it'll show up next time you start a new session.`);
}

function savePlayersBulk(e){
 e.preventDefault();
 if(!requireWriteAccess())return;
 let fd=new FormData(e.target);
 let lines=(fd.get("names")||"").split("\n").map(n=>n.trim()).filter(Boolean);
 if(!lines.length){alert("Enter at least one player name.");return}
 let team=fd.get("team")||"";
 let added=lines.map(line=>{
  let[namePart,rolePart]=line.split(",").map(x=>x?x.trim():"");
  let role=rolePart?(PLAYER_ROLES.find(r=>r.toLowerCase()===rolePart.toLowerCase())||""):"";
  return{id:uid("plyr"),name:namePart,team,role,group:"",age:"",strengths:"",areas:"",focus:"",notes:""};
 }).filter(p=>p.name);
 let existingNames=db.players.map(x=>x.name.trim().toLowerCase());
 let dupes=[...new Set(added.filter(p=>existingNames.includes(p.name.trim().toLowerCase())).map(p=>p.name))];
 if(dupes.length&&!confirm(`These names already exist in your roster: ${dupes.join(", ")}. Add them as new, separate players anyway?`))return;
 added.forEach(p=>db.players.push(p));
 closeM();save();
 alert(`${added.length} player${added.length!==1?"s":""} added.`);
}
function cascadePlayerRename(oldName,newName){
 if(!oldName||oldName===newName)return;
 db.assessments.forEach(a=>{if(a.player===oldName)a.player=newName});
 db.sessions.forEach(s=>{if(Array.isArray(s.attendees)){s.attendees=s.attendees.map(n=>n===oldName?newName:n)}});
 db.matches.forEach(m=>{
  (m.battingReview||[]).forEach(r=>{if(r.name===oldName)r.name=newName});
  (m.bowlingReview||[]).forEach(r=>{if(r.name===oldName)r.name=newName});
  if(Array.isArray(m.playingXI)){m.playingXI=m.playingXI.map(n=>n===oldName?newName:n)}
 });
}
function savePlayer(e){
 e.preventDefault();
 if(!requireWriteAccess())return;
 let p=Object.fromEntries(new FormData(e.target));
 if(editingPlayerId){
  let idx=db.players.findIndex(x=>x.id===editingPlayerId);
  if(idx>-1){
   let oldName=db.players[idx].name;
   let oldGoalSetDate=db.players[idx].goalSetDate;
   p.id=editingPlayerId;
   if(p.goalTargetDate)p.goalSetDate=oldGoalSetDate||today();
   db.players[idx]=p;
   if(oldName&&oldName!==p.name)cascadePlayerRename(oldName,p.name);
  }
 }
 else{
  if(p.goalTargetDate)p.goalSetDate=today();
  let dupe=db.players.find(x=>x.name&&p.name&&x.name.trim().toLowerCase()===p.name.trim().toLowerCase());
  if(dupe&&!confirm(`A player named "${dupe.name}" already exists${dupe.team?" ("+dupe.team+")":""}. Add "${p.name}" as a new, separate player anyway?`))return;
  p.id=uid("plyr");db.players.push(p);
 }
 editingPlayerId=null;closeM();save();

 aa.forEach(a=>{

   if(!disciplineTrend[d])disciplineTrend[d]={first:score,last:score,count:1};

  });
 });
 let trendLines=Object.entries(disciplineTrend).filter(([,t])=>t.count>=2).map(([d,t])=>{

 });

// Flags players who played in matches on the same day or consecutive
// calendar days within the last 14 days — a real, computable fatigue
// risk signal from data that already exists (match dates + rosters),
// not a new field the coach has to remember to fill in.
function workloadFlagDetails(){
 let cutoff=new Date(new Date(today()+"T00:00:00Z").getTime()-14*86400000).toISOString().slice(0,10);
 let byPlayer={};
 db.matches.filter(m=>m.date&&m.date>=cutoff).forEach(m=>{
  let names=new Set([...(m.playingXI||[]),...(m.battingReview||[]).map(r=>r.name),...(m.bowlingReview||[]).map(r=>r.name)]);
  names.forEach(name=>{if(!byPlayer[name])byPlayer[name]=new Set();byPlayer[name].add(m.date)});
 });
 let flagged=[];
 Object.entries(byPlayer).forEach(([name,datesSet])=>{
  let dates=[...datesSet].sort();
  for(let i=1;i<dates.length;i++){
   let gap=Math.floor((new Date(dates[i]+"T00:00:00Z")-new Date(dates[i-1]+"T00:00:00Z"))/86400000);
   if(gap<=1){flagged.push({name,dates:[dates[i-1],dates[i]]});break}
  }
 });
 return flagged;
}
function workloadFlagPlayerNames(){return workloadFlagDetails().map(f=>f.name)}

 modal(`<div class="sheetHead"><h2>Match Workload Flags</h2><button class="x" onclick="closeM()">×</button></div>
 <div class="muted" style="margin-bottom:12px">These players played matches on the same day or consecutive days within the last 14 days — worth a quick check on how they're feeling before the next session.</div>

}

function openMatchForm(existing,mode){
 matchDraft={batting:existing&&existing.battingReview?JSON.parse(JSON.stringify(existing.battingReview)):[],bowling:existing&&existing.bowlingReview?JSON.parse(JSON.stringify(existing.bowlingReview)):[]};
 editingMatchId=mode==="edit"?existing.id:null;
 modal(matchFormHtml(existing,mode));
 renderBattingRows();renderBowlingRows();
}
function newMatch(){openMatchForm(null,"new")}
function logMatchFromFixture(tournamentId,fixtureId){
 let t=db.tournaments.find(x=>x.id===tournamentId);if(!t)return;
 let f=(t.fixtures||[]).find(x=>x.id===fixtureId);if(!f)return;
 let squadNames=(t.squadPlayerIds||[]).map(id=>{let p=db.players.find(x=>x.id===id);return p?p.name:null}).filter(Boolean);
 openMatchForm({date:f.date||today(),opp:f.opponent||"",venue:f.venue||"",tournamentId:t.id,playingXI:squadNames},"new");
}
function copyLastPlayingXI(){
 let matches=db.matches.filter(m=>m.id!==editingMatchId&&m.playingXI&&m.playingXI.length).slice().sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
 if(!matches.length){alert("No previous match with a Playing XI found.");return}
 let lastXI=matches[0].playingXI;
 document.querySelectorAll('input[name="playingXI"]').forEach(cb=>{cb.checked=lastXI.includes(cb.value)});
}
function editMatch(id){let m=db.matches.find(x=>x.id===id);if(!m)return;openMatchForm(m,"edit")}
function duplicateMatch(id){let src=db.matches.find(x=>x.id===id);if(!src)return;let m=JSON.parse(JSON.stringify(src));delete m.id;m.date=today();openMatchForm(m,"duplicate")}
function toggleMatchTeamCustom(val){
 let wrap=document.getElementById("matchTeamCustomWrap");
 if(wrap)wrap.style.display=val==="__custom__"?"":"none";
}
function saveMatch(e){
 e.preventDefault();
 if(!requireWriteAccess())return;
 let fd=new FormData(e.target);
 let m=Object.fromEntries(fd);
 let teamSelect=fd.get("teamSelect");
 m.team=teamSelect==="__custom__"?(fd.get("teamCustom")||""):(teamSelect||"");
 delete m.teamSelect;delete m.teamCustom;
 m.battingReview=matchDraft.batting.filter(r=>r.name&&String(r.name).trim());
 m.bowlingReview=matchDraft.bowling.filter(r=>r.name&&String(r.name).trim());
 m.playingXI=fd.getAll("playingXI");
 m.battingRatings=collectRatings(fd,"batRating",BATTING_METRICS);
 m.bowlingRatings=collectRatings(fd,"bowlRating",BOWLING_METRICS);
 m.fieldingRatings=collectRatings(fd,"fieldRating",FIELDING_METRICS);
 m.rating=Math.round(avgRatingObj(m.fieldingRatings))||0;
 BATTING_METRICS.forEach((_,i)=>delete m[`batRating_${i}`]);
 BOWLING_METRICS.forEach((_,i)=>delete m[`bowlRating_${i}`]);
 FIELDING_METRICS.forEach((_,i)=>delete m[`fieldRating_${i}`]);
 if(editingMatchId){let idx=db.matches.findIndex(x=>x.id===editingMatchId);if(idx>-1){m.id=editingMatchId;db.matches[idx]=m}}
 else{m.id=uid("m");db.matches.push(m)}
 editingMatchId=null;closeM();save();
}
function delMatch(id){if(confirm("Delete this match? This cannot be undone.")){db.matches=db.matches.filter(x=>x.id!==id);save()}}

 let metricRows=obj=>Object.entries(obj||{}).map(([k,v])=>`<div class="item"><div>${esc(k)}</div><b>${esc(v)}/10</b></div>`).join("");
 let body=`${tournament?`<div class="tag" style="margin-bottom:10px">🏆 ${esc(tournament.name)}</div>`:""}<div class="grid g4">
 <div class="card stat"><span>Format</span><b style="font-size:var(--fs-5)">${esc(m.format||"—")}</b></div>

 <div class="card stat"><span>Toss</span><b style="font-size:var(--fs-5)">${esc(m.toss||"—")}${m.tossDecision?" · "+esc(m.tossDecision):""}</b></div>
 <div class="card stat"><span>Result</span><b style="font-size:var(--fs-5)">${esc(m.result||"—")}</b></div>

 <h2>Bowling Review</h2>${bowlingRows?`<table class="reportTable"><tr><th>Bowler</th><th>Overs</th><th>Runs</th><th>Wickets</th><th>Notes</th></tr>${bowlingRows}</table>`:empty("No bowling entries recorded.")}
 ${m.bowlingRatings?`<div class="card" style="margin-top:10px"><b>Bowling Assessment · ${avgRatingObj(m.bowlingRatings).toFixed(1)}/10 avg</b>${metricRows(m.bowlingRatings)}${m.bowlingAssessmentNotes?`<p style="margin-top:8px">${esc(m.bowlingAssessmentNotes)}</p>`:""}</div>`:""}
 <h2>Fielding Review</h2><div class="card">${(m.taken||m.missed||m.runouts||m.misfields)?`<p>Chances taken ${esc(m.taken||0)} · Missed ${esc(m.missed||0)} · Run outs ${esc(m.runouts||0)} · Misfields ${esc(m.misfields||0)}</p>`:""}${m.fieldingRatings?`<b>Fielding Assessment · ${avgRatingObj(m.fieldingRatings).toFixed(1)}/10 avg</b>${metricRows(m.fieldingRatings)}`:""}<p style="margin-top:8px">${esc(m.notes||"—")}</p></div>
 <h2>Team Review</h2><div class="card"><p><b>Rating:</b> ${esc(m.teamRating||"—")}/10</p><p>${esc(m.teamNotes||"—")}</p></div>
 <h2>Key Learnings &amp; Training Actions</h2><div class="card"><p>${esc(m.actions||"—")}</p></div>`;
 reportShell(`${esc(m.team||"Team")} vs ${esc(m.opp||"Opposition")}`,`${esc(fmtDate(m.date))} · Automatic Match Report`,body);

let editingOrgId=null;
function orgEntityFormHtml(kind,e,mode){
 e=e||{};
 let title=kind==="team"?"Team":kind==="tournament"?"Tournament":"Season";
 let showDates=kind!=="team";
 return `<div class="sheetHead"><h2>${mode==="edit"?"Edit":"New"} ${title}</h2><button class="x" onclick="closeM()">×</button></div>
 <form onsubmit="saveOrgEntity(event,'${kind}')">
 <div class="formgrid">
 <label class="full">${title} name<input name="name" value="${esc(e.name||"")}" required></label>
 ${kind==="team"?`<label class="full">Category / Age group<input name="category" value="${esc(e.category||"")}" placeholder="e.g. U17, Senior, 1st XI"></label>`:""}
 ${kind==="season"?`<label class="full">Team <span class="muted" style="font-weight:400">(optional, but recommended — scopes session/match counts to this team only)</span><select name="team"><option value="">No specific team</option>${db.teams.map(t=>`<option value="${esc(t.name)}" ${e.team===t.name?"selected":""}>${esc(t.name)}</option>`).join("")}</select></label>`:""}
 ${showDates?`<label>Start date<input type="date" name="startDate" value="${esc(e.startDate||"")}"></label><label>End date<input type="date" name="endDate" value="${esc(e.endDate||"")}"></label>`:""}
 <label class="full">Notes<textarea name="notes">${esc(e.notes||"")}</textarea></label>
 </div>
 <button class="btn primary">Save ${title}</button>
 </form>`;
}
function newOrgEntity(kind){
 if(!requireWriteAccess())return;
 if(kind==="team"&&!checkBasicCap(db.teams.length,BASIC_TEAM_CAP,"Team"))return;
 if((kind==="tournament"||kind==="season")&&!requirePremium(kind==="tournament"?"Tournament Planning":"Season Planning"))return;
 editingOrgId=null;modal(orgEntityFormHtml(kind,null,"new"));
}
function editOrgEntity(kind,id){
 if((kind==="tournament"||kind==="season")&&!requirePremium(kind==="tournament"?"Tournament Planning":"Season Planning"))return;
 let list=db[kind+"s"];let e=list.find(x=>x.id===id);if(!e)return;editingOrgId=id;modal(orgEntityFormHtml(kind,e,"edit"));
}
function cascadeTeamRename(oldName,newName){
 db.players.forEach(p=>{if(p.team===oldName)p.team=newName});
 db.sessions.forEach(s=>{if(s.squad===oldName)s.squad=newName});
 db.matches.forEach(m=>{if(m.team===oldName)m.team=newName});
 db.seasons.forEach(s=>{if(s.team===oldName)s.team=newName});
}
function saveOrgEntity(e,kind){
 e.preventDefault();
 if(!requireWriteAccess())return;
 let obj=Object.fromEntries(new FormData(e.target));
 let listKey=kind+"s";
 if(editingOrgId){
  let idx=db[listKey].findIndex(x=>x.id===editingOrgId);
  if(idx>-1){
   let oldName=db[listKey][idx].name;
   obj.id=editingOrgId;
   db[listKey][idx]=obj;
   if(kind==="team"&&oldName!==obj.name)cascadeTeamRename(oldName,obj.name);
  }
 } else {
  obj.id=uid(kind.slice(0,5));
  db[listKey].push(obj);
 }
 editingOrgId=null;closeM();save();
}
function delOrgEntity(kind,id){
 let listKey=kind+"s";
 let e=db[listKey].find(x=>x.id===id);if(!e)return;
 if(!confirm(`Remove "${e.name}" from your ${kind} list? Records that already reference it keep the name as text.`))return;
 db[listKey]=db[listKey].filter(x=>x.id!==id);
 save();
}

function isoAddDays(isoStr,days){let d=new Date(isoStr+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10)}
function isoDiffDays(isoA,isoB){let a=new Date(isoA+"T00:00:00Z"),b=new Date(isoB+"T00:00:00Z");return Math.round((b-a)/86400000)}
function autoSplitPhases(seasonId){
 let s=db.seasons.find(x=>x.id===seasonId);if(!s)return;
 if(!s.startDate||!s.endDate){alert("Set a start and end date for this season first (Edit).");return}
 if(s.phases&&s.phases.length){
  if(!confirm("This season already has phases. Auto-split will add 4 default phases alongside them — you can edit or delete any afterward. Continue?"))return;
 }
 let totalDays=isoDiffDays(s.startDate,s.endDate)+1;
 if(totalDays<4){alert("This season's date range is too short to auto-split into phases.");return}
 let splits=[
  {name:"Pre-season",focus:"Conditioning and foundational skill work",share:0.15},
  {name:"In-season",focus:"Regular training and match rhythm",share:0.55},
  {name:"Peak / Tournament period",focus:"Competition-focused preparation",share:0.20},
  {name:"Off-season review",focus:"Review, recovery and planning for next season",share:0.10}
 ];
 let cursor=s.startDate,newPhases=[];
 splits.forEach((sp,i)=>{
  let remaining=splits.length-i;
  let daysLeft=isoDiffDays(cursor,s.endDate)+1;
  let days;
  if(i===splits.length-1){days=daysLeft}
  else{let ideal=Math.round(totalDays*sp.share);let maxAllowed=daysLeft-(remaining-1);days=Math.max(1,Math.min(ideal,maxAllowed))}
  let phaseStart=cursor,phaseEnd=isoAddDays(phaseStart,days-1);
  newPhases.push({id:uid("phase"),name:sp.name,startDate:phaseStart,endDate:phaseEnd,focus:sp.focus,sessionTarget:""});
  cursor=isoAddDays(phaseEnd,1);
 });
 if(!Array.isArray(s.phases))s.phases=[];
 s.phases=s.phases.concat(newPhases);
 save();
}

function buildPlayerReport(){

 let latest=aa.slice(-1)[0];
 let disciplineTrend={};
 aa.forEach(a=>{
  assessmentDisciplines(a).forEach(d=>{
   let score=Number(disciplineAvg(a,d));
   if(!Number.isFinite(score))return;
   if(!disciplineTrend[d])disciplineTrend[d]={first:score,last:score,count:1};
   else{disciplineTrend[d].last=score;disciplineTrend[d].count++}
  });
 });
 let matches=playerMatches(p).filter(m=>inRange(m.date,from,to)).slice().sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));
 let battingEntries=matches.map(m=>(m.battingReview||[]).find(r=>r.name===p.name)).filter(Boolean);
 let bowlingEntries=matches.map(m=>(m.bowlingReview||[]).find(r=>r.name===p.name)).filter(Boolean);
 let totalRuns=battingEntries.reduce((s,r)=>s+(+r.runs||0),0);
 let totalWickets=bowlingEntries.reduce((s,r)=>s+(+r.wickets||0),0);
 let backToBackCount=0;
 for(let i=1;i<matches.length;i++){
  let prev=new Date(matches[i-1].date+"T00:00:00Z"),cur=new Date(matches[i].date+"T00:00:00Z");
  let gapDays=Math.round((cur-prev)/86400000);
  if(gapDays<=1)backToBackCount++;
 }
 let matchTrendHtml="";
 if(battingEntries.length>=2||bowlingEntries.length>=2){
  let half=arr=>{let mid=Math.ceil(arr.length/2);return{early:arr.slice(0,mid),late:arr.slice(mid)}};
  let avgOf=arr=>arr.length?arr.reduce((s,v)=>s+v,0)/arr.length:0;
  let rows=[];
  if(battingEntries.length>=2){
   let{early,late}=half(battingEntries);
   let earlyAvg=avgOf(early.map(r=>+r.runs||0)),lateAvg=avgOf(late.map(r=>+r.runs||0));
   rows.push({label:"Runs per innings",first:earlyAvg,last:lateAvg});
  }
  if(bowlingEntries.length>=2){
   let{early,late}=half(bowlingEntries);
   let earlyAvg=avgOf(early.map(r=>+r.wickets||0)),lateAvg=avgOf(late.map(r=>+r.wickets||0));
   rows.push({label:"Wickets per match",first:earlyAvg,last:lateAvg});
  }
  matchTrendHtml=`<h2>Match Performance Trend</h2><div class="card"><p class="muted" style="margin-bottom:8px">Earlier matches in this range vs more recent ones.</p>${rows.map(r=>{let diff=(r.last-r.first).toFixed(1);let sign=r.last>=r.first?"+":"";let color=r.last>=r.first?"var(--g)":"var(--red)";return `<div style="margin-bottom:6px"><b>${esc(r.label)}:</b> ${r.first.toFixed(1)} → ${r.last.toFixed(1)} <span style="color:${color};font-weight:700">(${sign}${diff})</span></div>`}).join("")}</div>`;
 }
 let teamSessions=(p.team&&p.available!=="no")?db.sessions.filter(s=>s.squad===p.team&&s.sessionType!=="player"&&inRange(s.date,from,to)):[];
 let attended=teamSessions.filter(s=>(s.attendees||[]).includes(p.name)).length;
 let attendanceRate=teamSessions.length?Math.round(attended/teamSessions.length*100):null;
 let goalProgressHtml="";
 if(p.goalTargetDate&&p.goalSetDate){
  let targetDate=new Date(p.goalTargetDate+"T00:00:00Z");
  let todayDate=new Date(today()+"T00:00:00Z");
  let daysLeft=Math.round((targetDate-todayDate)/86400000);
  let goalAssessments=db.assessments.filter(a=>a.player===p.name&&a.date>=p.goalSetDate).sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));
  let goalTrend={};
  goalAssessments.forEach(a=>{
   assessmentDisciplines(a).forEach(d=>{
    let score=Number(disciplineAvg(a,d));
    if(!Number.isFinite(score))return;
    if(!goalTrend[d]){goalTrend[d]={first:score,last:score,count:1}}
    else{goalTrend[d].last=score;goalTrend[d].count++}
   });
  });
  let progressRows=Object.entries(goalTrend).filter(([,t])=>t.count>=2);
  goalProgressHtml=`<h2>Goal Progress</h2><div class="card"><p>${esc(p.focus||"Goal")}</p><p class="muted" style="margin-top:4px">Set ${esc(fmtDate(p.goalSetDate))} · Target ${esc(fmtDate(p.goalTargetDate))} · ${daysLeft>=0?`${daysLeft} day${daysLeft!==1?"s":""} remaining`:`${Math.abs(daysLeft)} day${Math.abs(daysLeft)!==1?"s":""} overdue`}</p>${progressRows.length?progressRows.map(([d,t])=>{let diff=(t.last-t.first).toFixed(1);let sign=t.last>=t.first?"+":"";let color=t.last>=t.first?"var(--g)":"var(--red)";return `<div style="margin-top:8px"><b>${esc(d)}:</b> ${t.first.toFixed(1)} → ${t.last.toFixed(1)} <span style="color:${color};font-weight:700">(${sign}${diff})</span></div>`}).join(""):`<p class="muted" style="margin-top:8px">Log at least 2 assessments since this goal was set to see progress.</p>`}</div>`;
 }
 reportShell("Player Development Report",`${p.name} · ${p.role||"Player"}${(from||to)?" · "+rangeLabel(from,to):""}`,
 `<div class="grid g4">
 <div class="card stat"><span>Assessments</span><b>${aa.length}</b></div>
 <div class="card stat"><span>Latest Overall</span><b>${latest?assessmentAvg(latest)+"/10":"—"}</b></div>
 <div class="card stat"><span>Matches</span><b>${matches.length}</b></div>
 <div class="card stat"><span>Attendance</span><b>${attendanceRate!==null?attendanceRate+"%":"—"}</b></div>
 </div>
 <div class="grid g2" style="margin-top:15px"><div class="card"><b>Squad</b><div>${esc(p.group||"—")}</div></div><div class="card"><b>Current goal</b><div>${esc(p.focus||"—")}</div></div></div>
 ${goalProgressHtml}
 <h2>Profile</h2><div class="card"><b>Strengths</b><p>${esc(p.strengths||"—")}</p><b>Development areas</b><p>${esc(p.areas||"—")}</p></div>
 ${Object.entries(disciplineTrend).some(([,t])=>t.count>=2)?`<h2>Development Trend</h2><div class="card">${Object.entries(disciplineTrend).filter(([,t])=>t.count>=2).map(([d,t])=>{let diff=(t.last-t.first).toFixed(1);let sign=t.last>=t.first?"+":"";let color=t.last>=t.first?"var(--g)":"var(--red)";return `<div style="margin-bottom:6px"><b>${esc(d)}:</b> ${t.first.toFixed(1)} → ${t.last.toFixed(1)} <span style="color:${color};font-weight:700">(${sign}${diff})</span></div>`}).join("")}</div>`:""}
 ${matches.length?`<h2>Match Performance</h2><div class="card"><p>${battingEntries.length?`Batting: ${totalRuns} run${totalRuns!==1?"s":""} across ${battingEntries.length} innings`:""}${battingEntries.length&&bowlingEntries.length?" · ":""}${bowlingEntries.length?`Bowling: ${totalWickets} wicket${totalWickets!==1?"s":""} across ${bowlingEntries.length} match${bowlingEntries.length!==1?"es":""}`:""}${!battingEntries.length&&!bowlingEntries.length?`Played in ${matches.length} match${matches.length!==1?"es":""}, no batting or bowling entries logged.`:""}</p>${backToBackCount>0?`<p style="margin-top:8px;color:var(--gold)"><b>⚠ Workload note:</b> ${backToBackCount} match${backToBackCount!==1?"es":""} played with a day or less rest before the next one.</p>`:""}</div>`:""}
 ${matchTrendHtml}
 <h2>Assessment History</h2>${aa.length?aa.slice().reverse().map(a=>`<div class="card"><b>${esc(fmtDate(a.date))} · Overall ${assessmentAvg(a)}/10</b><div>${assessmentDisciplines(a).map(d=>`<span class="tag">${d} ${disciplineAvg(a,d)}/10</span>`).join("")}</div><p><b>Priority:</b> ${esc(a.priority||"—")}</p>${assessmentDetailHTML(a)}</div>`).join(""):empty("No assessments for this player.")}`)}

 }).filter(r=>r!==null);

 }).filter(Boolean).filter(x=>x.diff>0).sort((a,b)=>b.diff-a.diff).slice(0,5);
 reportShell(`Season / Full Report — ${esc(scopeLabel(scope))}`,rangeLabel(from,to),

 ${categoryCounts.length?`<h2>Coaching Focus This Period</h2><div class="card">${categoryCounts.map(c=>`<div style="display:flex;justify-content:space-between;padding:4px 0"><span>${esc(c.name)}</span><b>${c.count} session${c.count!==1?"s":""}</b></div>`).join("")}</div>`:""}

 <h2>Players</h2>${roster.map(p=>`<div class="card"><b>${esc(p.name)} · ${esc(p.role||"")}</b><p>${esc(p.focus||"")}</p></div>`).join("")||empty("No players in this scope.")}

function coachReport(){reportRangeModal("Coach Development Report","buildCoachReport")}
function buildCoachReport(){
 let{from,to}=reportRangeValues();
 let reflections=db.reflections.filter(r=>inRange(r.date,from,to));
 let objectiveRatingAgg={};
 reflections.forEach(r=>{
  if(!r.objectiveRatings)return;
  Object.entries(r.objectiveRatings).forEach(([cat,val])=>{
   let num=Number(val);
   if(!Number.isFinite(num))return;
   if(!objectiveRatingAgg[cat])objectiveRatingAgg[cat]={sum:0,count:0};
   objectiveRatingAgg[cat].sum+=num;objectiveRatingAgg[cat].count++;
  });
 });
 let objectiveRatingRows=Object.entries(objectiveRatingAgg).map(([cat,d])=>({cat,avg:d.sum/d.count,count:d.count})).sort((a,b)=>b.avg-a.avg);
 reportShell("Coach Development Report",rangeLabel(from,to),
 `${objectiveRatingRows.length?`<h2 style="margin-top:0">Objective Achievement — Term Average</h2><div class="card">${objectiveRatingRows.map(r=>`<div style="display:flex;justify-content:space-between;padding:4px 0"><span>${esc(r.cat)} <span class="muted" style="font-size:var(--fs-2)">(${r.count} reflection${r.count!==1?"s":""})</span></span><b>${r.avg.toFixed(1)}/5</b></div>`).join("")}</div>`:""}
 ${reflections.length?reflections.map(r=>{
  let reasonsPart=(r.betterReasons&&r.betterReasons.length)?r.betterReasons.join(", "):"";
  let detailPart=r.betterDetail!==undefined?r.betterDetail:(r.betterReasons===undefined?(r.better||""):"");
  let betterText=[reasonsPart,detailPart].filter(Boolean).join(" — ")||"—";
  let learningsRaw=r.learnings!==undefined?r.learnings:[r.players,r.change].filter(Boolean).join(" ");
  let learningsText=learningsRaw||"—";
  let extraRatings=[r.sessionFlow?`Session Flow ${esc(r.sessionFlow)}/5`:"",r.playerEngagement?`Player Engagement ${esc(r.playerEngagement)}/5`:""].filter(Boolean).join(" · ");
  let objectiveRatingsHtml=(r.objectiveRatings&&Object.keys(r.objectiveRatings).length)?`<p><b>Achieved Objectives:</b> ${Object.entries(r.objectiveRatings).map(([cat,val])=>`${esc(cat)} ${esc(val)}/5`).join(", ")}</p>`:"";
  return `<div class="card"><b>${esc(fmtDate(r.date))} · ${esc(r.session||"Coaching Reflection")}</b><p><b>Rating:</b> ${esc(r.rating)}/5 · Communication ${esc(r.communication||"—")}/5${extraRatings?" · "+extraRatings:""}</p><p><b>What went well:</b> ${esc(r.well||"—")}</p><p><b>What could improve:</b> ${esc(betterText)}</p><p><b>Learning & change next time:</b> ${esc(learningsText)}</p>${objectiveRatingsHtml}<p><b>Next focus:</b> ${esc(r.next||"—")}</p></div>`;
 }).join(""):empty("No reflections documented.")}`);
}

function calendar(){
 let first=new Date(calYear,calMonth,1);
 let startDow=first.getDay();
 let daysInMonth=new Date(calYear,calMonth+1,0).getDate();
 let monthLabel=first.toLocaleDateString(undefined,{month:"long",year:"numeric"});
 let cells="";
 for(let i=0;i<startDow;i++)cells+=`<div class="calCell calEmpty"></div>`;
 for(let d=1;d<=daysInMonth;d++){
  let ds=`${calYear}-${String(calMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  let items=calItemsForDate(ds);
  let dots="";
  if(items.sessions.length)dots+=`<span class="calDot calDotS" title="${items.sessions.length} session(s)"></span>`;
  if(items.matches.length)dots+=`<span class="calDot calDotM" title="${items.matches.length} match(es)"></span>`;
  if(items.events.length)dots+=`<span class="calDot calDotE" title="${items.events.length} reminder(s)/event(s)"></span>`;
  cells+=`<div class="calCell${ds===today()?" calToday":""}" onclick="openCalDay('${ds}')"><div class="calDayNum">${d}</div><div class="calDots">${dots}</div></div>`;
 }
 let upcoming=db.events.slice().filter(e=>e.date>=today()).sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));
 if(calEventQuery){let q=calEventQuery.toLowerCase();upcoming=upcoming.filter(e=>[e.title,e.notes].some(v=>String(v||"").toLowerCase().includes(q)))}
 document.getElementById("calendar").innerHTML=head("Calendar","Training sessions, matches, reminders and events in one place.")

 <h2 class="section">${monthLabel}</h2>
 <div class="card"><div class="calGrid calHead">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div class="calCell calHeadCell">${d}</div>`).join("")}</div><div class="calGrid">${cells}</div><div class="calLegend"><span class="calDot calDotS"></span> Session<span class="calDot calDotM"></span> Match<span class="calDot calDotE"></span> Reminder / Event</div></div>

 <div class="card">${upcoming.length?upcoming.map(e=>`<div class="item"><div><b>${esc(e.title)}</b><div class="muted">${esc(e.date)}${e.time?" · "+esc(e.time):""} · ${esc(e.type||"Event")}</div><small>${esc(e.notes||"")}</small></div><div class="toolbar"><button class="btn secondary" onclick="editCalEvent('${e.id}')">Edit</button><button class="btn danger" onclick="delCalEvent('${e.id}')">×</button></div></div>`).join(""):empty("No upcoming reminders or events.")}</div>`;
 let sEl=document.getElementById("calSearch");if(sEl&&calSearchFocused){sEl.focus();const v=sEl.value;sEl.setSelectionRange(v.length,v.length)}
}

function calEventFormHtml(ev,mode){ev=ev||{};return `<div class="sheetHead"><h2>${mode==="edit"?"Edit Reminder / Event":"New Reminder / Event"}</h2><button class="x" onclick="closeM()">×</button></div><form class="formgrid" onsubmit="saveCalEvent(event)"><label>Date<input type="date" name="date" value="${esc(ev.date||today())}" required></label><label>Time (optional)<input type="time" name="time" value="${esc(ev.time||"")}"></label><label>Type<select name="type"><option ${ev.type==="Reminder"?"selected":""}>Reminder</option><option ${ev.type==="Event"?"selected":""}>Event</option></select></label><label class="full">Title<input name="title" value="${esc(ev.title||"")}" required></label><label class="full">Notes<textarea name="notes">${esc(ev.notes||"")}</textarea></label><button class="btn primary">Save</button></form>`}

function exportBackup(){

function handleRestoreFile(input){
 let file=input.files&&input.files[0];if(!file)return;
 let reader=new FileReader();
 reader.onload=()=>{
  let parsed;
  try{parsed=JSON.parse(reader.result)}catch(e){alert("Could not read this file — it may not be a valid backup.");input.value="";return}
  if(!parsed||typeof parsed!=="object"){alert("This doesn't look like a valid ProCoach OS backup file.");input.value="";return}
  if(!confirm("Restore this backup? This will replace all current data for this profile. This cannot be undone.")){input.value="";return}
  let licenseFromBackup=parsed._license;
  delete parsed._license;
  ["sessions","reflections","players","assessments","matches","drills","events"].forEach(k=>{parsed[k]=Array.isArray(parsed[k])?parsed[k]:[]});
  parsed.matches.forEach(m=>{if(!m.id)m.id=uid("m")});
  parsed.drills.forEach(d=>{if(!d.id)d.id=uid("drill")});
  db=parsed;
  if(licenseFromBackup&&typeof licenseFromBackup==="object"){
   // Restore the license too, so a fresh device doesn't need the key
   // re-entered by hand. Any staleness (e.g. a plan change since this
   // backup was taken) self-corrects via revalidateLicenseIfNeeded() the
   // next time the app opens, since the server stays the source of truth.
   saveLicenseState(licenseFromBackup);
  }
  idbSet(DB_KEY,db).catch(err=>console.warn("IndexedDB save failed",err)).then(()=>{
   try{localStorage.setItem(DB_KEY,JSON.stringify(db))}catch(e){}
   alert("Backup restored successfully.");
   location.reload();
  });
 };
 reader.readAsText(file);
}

}

function assessmentResultHtml(a){return `<div class="item" style="cursor:pointer" onclick="drillIntoAssessment('${esc(a.player||"")}')"><div><b>${esc(a.player||"Unknown player")}</b><div class="muted">${esc(a.date||"")} · Overall ${assessmentAvg(a)}/10</div></div></div>`}
function matchResultHtml(m){return `<div class="item" style="cursor:pointer" onclick="closeM();matchReportView('${m.id}')"><div><b>vs ${esc(m.opp||"Opposition")}</b><div class="muted">${esc(m.date||"")} · ${esc(m.result||"")}</div></div></div>`}
function eventResultHtml(e){return `<div class="item" style="cursor:pointer" onclick="closeM();go('calendar')"><div><b>${esc(e.title||"")}</b><div class="muted">${esc(e.date||"")} · ${esc(e.type||"Event")}</div></div></div>`}
function globalSearchResultsHtml(){
 let q=globalSearchQuery.trim().toLowerCase();
 if(!q)return `<div class="muted">Start typing to search sessions, players, drills, assessments, matches and calendar events.</div>`;
 let hit=v=>String(v||"").toLowerCase().includes(q);
 let sessionHits=db.sessions.filter(s=>[s.title,s.squad,s.focus,s.venue,s.objectives,...(s.objectiveTags||[]),s.warmup,s.main,s.game,s.cues,s.success,s.attachment&&s.attachment.name,...(s.mainDrillIds||[]).map(id=>{let d=db.drills.find(x=>x.id===id);return d&&d.name}),...(s.gameDrillIds||[]).map(id=>{let d=db.drills.find(x=>x.id===id);return d&&d.name})].some(hit));
 let reflectionHits=db.reflections.filter(r=>reflectionSearchableText(r).some(hit));
 let playerHits=db.players.filter(p=>[p.name,p.team,p.group,p.role,p.strengths,p.areas,p.focus,p.notes].some(hit));
 let drillHits=db.drills.filter(d=>[d.name,d.cat,d.equipment,d.points,d.progressions,d.regressions].some(hit));
 let assessmentHits=db.assessments.filter(a=>[a.player,a.priority,a.comments,...(a.disciplines||[])].some(hit));
 let matchHits=db.matches.filter(m=>[m.team,m.opp,m.venue,m.result,m.conditions,m.teamNotes,m.notes,m.actions,m.battingAssessmentNotes,m.bowlingAssessmentNotes,...(m.battingReview||[]).map(r=>r.name),...(m.bowlingReview||[]).map(r=>r.name)].some(hit));
 let eventHits=db.events.filter(e=>[e.title,e.notes,e.type].some(hit));
 let teamHits=db.teams.filter(t=>[t.name,t.category,t.notes].some(hit));
 let tournamentHits=db.tournaments.filter(t=>[t.name,t.notes].some(hit));
 let seasonHits=db.seasons.filter(s=>[s.name,s.notes].some(hit));
 let sections=[
  {label:"Sessions",items:sessionHits,render:sessionResultHtml},
  {label:"Self Reflections",items:reflectionHits,render:reflectionResultHtml},
  {label:"Players",items:playerHits,render:playerResultHtml},
  {label:"Drills",items:drillHits,render:drillResultHtml},
  {label:"Assessments",items:assessmentHits,render:assessmentResultHtml},
  {label:"Matches",items:matchHits,render:matchResultHtml},
  {label:"Calendar",items:eventHits,render:eventResultHtml},
  {label:"Teams",items:teamHits,render:t=>`<div class="item" style="cursor:pointer" onclick="closeM();go('organisation')"><div><b>${esc(t.name)}</b><div class="muted">${esc(t.category||"Team")}</div></div></div>`},
  {label:"Tournaments",items:tournamentHits,render:t=>`<div class="item" style="cursor:pointer" onclick="closeM();go('organisation')"><div><b>${esc(t.name)}</b><div class="muted">${esc(t.startDate||"")} → ${esc(t.endDate||"")}</div></div></div>`},
  {label:"Seasons",items:seasonHits,render:s=>`<div class="item" style="cursor:pointer" onclick="closeM();go('organisation')"><div><b>${esc(s.name)}</b><div class="muted">${esc(s.startDate||"")} → ${esc(s.endDate||"")}</div></div></div>`}
 ].filter(s=>s.items.length);
 if(!sections.length)return empty(`No matches found for "${esc(globalSearchQuery)}".`);
 return sections.map(s=>`<h2 class="section">${s.label} (${s.items.length})</h2><div class="card">${s.items.slice(0,5).map(s.render).join("")}${s.items.length>5?`<div class="muted" style="padding:10px">+${s.items.length-5} more — refine your search to narrow this down.</div>`:""}</div>`).join("");
}
/* ===== End Global Search ===== */

function quick(){modal(`<div class="sheetHead"><h2>Create</h2><button class="x" onclick="closeM()">×</button></div><div class="grid g2"><button class="btn secondary" onclick="closeM();newSession()">Session Plan</button><button class="btn secondary" onclick="closeM();newReflection()">Self Reflection</button><button class="btn secondary" onclick="closeM();newPlayer()">Player</button><button class="btn secondary" onclick="closeM();newAssessment()">Assessment</button><button class="btn secondary" onclick="closeM();newDrill()">Drill</button><button class="btn secondary" onclick="closeM();newMatch()">Match</button><button class="btn secondary" onclick="closeM();newCalEvent()">Reminder / Event</button></div>`)}
function renderAll(){dashboard();sessions();reflections();players();assessments();drills();matches();analysisTools();reports();calendar();organisation();accountPage()}initApp();
</script></body></html>
