<body>

<script>
"use strict";
/* ProCoach OS — Video Review Studio.
   Videos are NEVER copied or uploaded. Only saved frames, drawings, notes and the clip file name are kept,
   in this tool's own database ("procoachos_video") so the main app's data is never touched. */
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmtDate(d){var p=String(d||"").split("-");return p.length===3?p[2]+"-"+p[1]+"-"+p[0]:d||""}
function vid(){return "vm_"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}

/* ---------- storage ---------- */
var VDB="procoachos_video";
function dbOpen(){return new Promise(function(res,rej){var r=indexedDB.open(VDB,1);r.onupgradeneeded=function(e){var d=e.target.result;if(!d.objectStoreNames.contains("moments"))d.createObjectStore("moments",{keyPath:"id"})};r.onsuccess=function(e){res(e.target.result)};r.onerror=function(){rej(r.error)}})}
function dbAll(){return dbOpen().then(function(d){return new Promise(function(res,rej){var q=d.transaction("moments","readonly").objectStore("moments").getAll();q.onsuccess=function(){res(q.result||[])};q.onerror=function(){rej(q.error)}})})}
function dbPut(m){return dbOpen().then(function(d){return new Promise(function(res,rej){var t=d.transaction("moments","readwrite");t.objectStore("moments").put(m);t.oncomplete=function(){res()};t.onerror=function(){rej(t.error)}})})}
function dbDel(id){return dbOpen().then(function(d){return new Promise(function(res,rej){var t=d.transaction("moments","readwrite");t.objectStore("moments").delete(id);t.oncomplete=function(){res()};t.onerror=function(){rej(t.error)}})})}

/* ---------- roster (read-only from the main app's active profile) ---------- */
function loadRoster(){
  return new Promise(function(resolve){
    var empty=[];
    try{
      var profiles=JSON.parse(localStorage.getItem("coachbook_profiles"));
      if(!Array.isArray(profiles)||!profiles.length){resolve(empty);return}
      var activeId=localStorage.getItem("coachbook_active_profile")||"default";
      var prof=profiles.find(function(p){return p.id===activeId})||profiles[0];
      if(!prof||!prof.key){resolve(empty);return}
      var req=indexedDB.open("coachbook_idb");
      req.onerror=function(){resolve(empty)};
      req.onsuccess=function(){try{
        var idb=req.result;if(!idb.objectStoreNames.contains("profiles")){resolve(empty);return}
        var g=idb.transaction("profiles","readonly").objectStore("profiles").get(prof.key);
        g.onerror=function(){resolve(empty)};
        g.onsuccess=function(){var d=g.result||{};
          var pl=(d.players||[]).filter(function(p){return p&&p.name&&!p.deletedAt}).map(function(p){return{name:p.name,team:p.team||""}});
          pl.sort(function(a,b){return a.name.localeCompare(b.name,undefined,{numeric:true})});resolve(pl)};
      }catch(e){resolve(empty)}};
    }catch(e){resolve(empty)}
  });
}

/* ---------- constants ---------- */
var SKILLS={
 "Batting":["Stance","Grip","Backlift","Head position","Front-foot drive","Back-foot play","Footwork","Cut / pull","Sweep","Shot selection"],
 "Bowling":["Run-up","Load-up","Front-foot landing","Release","Follow-through","Wrist position","Seam / spin"],
 "Fielding":["Catching","Ground fielding","Throwing","Backing up"],
 "Keeping":["Stance","Gathering","Standing up"]
};
var CUES=["Head still through contact","Eyes level at release","Stable base at landing","Soft hands on contact","Front shoulder closed","Full extension through the ball","Balanced finish","Weight transfers to front foot","Bat path straight through the line","Wrist behind the ball"];
var COLORS=["#ffd400","#ff3b30","#34c759","#00c8ff","#ffffff"];
var FPS_LIST=[24,25,30,48,50,60,100,120,240];

/* ---------- state ---------- */
var S={view:"home",roster:[],moments:[],player:"",clip:null,fps:30,speed:1,loopA:null,loopB:null,looping:false,raf:0,fpsDetected:false};
var ED=null; // editor state

/* ---------- shapes: normalized 0..1 coordinates ---------- */
function drawShapes(ctx,w,h,shapes,preview){
  var lw=Math.max(2.5,w/260);
  var all=preview?shapes.concat([preview]):shapes;
  all.forEach(function(s){
    ctx.save();ctx.strokeStyle=s.c;ctx.fillStyle=s.c;ctx.lineWidth=lw;ctx.lineCap="round";ctx.lineJoin="round";
    var P=function(p){return[p[0]*w,p[1]*h]};
    if(s.t==="spot"){
      var a=P(s.p[0]),b=P(s.p[1]),cx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2,rx=Math.abs(b[0]-a[0])/2,ry=Math.abs(b[1]-a[1])/2;
      ctx.beginPath();ctx.rect(0,0,w,h);ctx.ellipse(cx,cy,Math.max(rx,1),Math.max(ry,1),0,0,Math.PI*2);
      ctx.fillStyle="rgba(0,0,0,.62)";ctx.fill("evenodd");ctx.beginPath();ctx.ellipse(cx,cy,Math.max(rx,1),Math.max(ry,1),0,0,Math.PI*2);ctx.strokeStyle="#fff";ctx.setLineDash([lw*2,lw*2]);ctx.stroke();
    }else if(s.t==="line"||s.t==="arrow"){
      var p=P(s.p[0]),q=P(s.p[1]);ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();
      if(s.t==="arrow"){var ang=Math.atan2(q[1]-p[1],q[0]-p[0]),hl=lw*6;ctx.beginPath();ctx.moveTo(q[0],q[1]);ctx.lineTo(q[0]-hl*Math.cos(ang-.45),q[1]-hl*Math.sin(ang-.45));ctx.lineTo(q[0]-hl*Math.cos(ang+.45),q[1]-hl*Math.sin(ang+.45));ctx.closePath();ctx.fill()}
    }else if(s.t==="circle"){
      var a2=P(s.p[0]),b2=P(s.p[1]);var r=Math.hypot(b2[0]-a2[0],b2[1]-a2[1]);ctx.beginPath();ctx.arc(a2[0],a2[1],Math.max(r,1),0,Math.PI*2);ctx.stroke();
    }else if(s.t==="vguide"){ctx.setLineDash([lw*3,lw*2]);ctx.beginPath();ctx.moveTo(s.p[0][0]*w,0);ctx.lineTo(s.p[0][0]*w,h);ctx.stroke()}
    else if(s.t==="hguide"){ctx.setLineDash([lw*3,lw*2]);ctx.beginPath();ctx.moveTo(0,s.p[0][1]*h);ctx.lineTo(w,s.p[0][1]*h);ctx.stroke()}
    else if(s.t==="angle"){
      var pts=s.p.map(P);ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);if(pts[1])ctx.lineTo(pts[1][0],pts[1][1]);if(pts[2])ctx.lineTo(pts[2][0],pts[2][1]);ctx.stroke();
      pts.forEach(function(q){ctx.beginPath();ctx.arc(q[0],q[1],lw*1.6,0,Math.PI*2);ctx.fill()});
      if(pts[2]){
        var v=pts[1],a1=Math.atan2(pts[0][1]-v[1],pts[0][0]-v[0]),a3=Math.atan2(pts[2][1]-v[1],pts[2][0]-v[0]);
        var d=a3-a1;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
        var deg=Math.round(Math.abs(d)*180/Math.PI);ctx.beginPath();ctx.arc(v[0],v[1],lw*9,a1,a1+d,d<0);ctx.stroke();
        var mid=a1+d/2,fs=Math.max(16,w/28);ctx.font="700 "+fs+"px Arial";ctx.lineWidth=lw*1.4;ctx.strokeStyle="rgba(0,0,0,.8)";var tx=v[0]+Math.cos(mid)*lw*17,ty=v[1]+Math.sin(mid)*lw*17;
        ctx.textAlign="center";ctx.textBaseline="middle";ctx.strokeText(deg+"°",tx,ty);ctx.fillText(deg+"°",tx,ty);
      }
    }else if(s.t==="text"){
      var fs2=Math.max(16,w/26);ctx.font="700 "+fs2+"px Arial";var t=P(s.p[0]);ctx.textBaseline="middle";ctx.lineWidth=lw*1.4;ctx.strokeStyle="rgba(0,0,0,.85)";ctx.strokeText(s.txt,t[0],t[1]);ctx.fillText(s.txt,t[0],t[1]);
    }
    ctx.restore();
  });
}
function loadImg(src){return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i)};i.onerror=rej;i.src=src})}
/* images are stored as Blobs (no base64 overhead), webp where the browser can encode it, jpeg otherwise */
var QUAL={small:{max:800,q:.62,label:"Small (~50 KB)"},balanced:{max:1000,q:.72,label:"Balanced (~100 KB)"},high:{max:1280,q:.82,label:"High (~250 KB)"}};
function qualKey(){var k=null;try{k=localStorage.getItem("video_quality")}catch(e){}return QUAL[k]?k:"balanced"}
function dataToBlob(u){var a=u.split(","),mime=a[0].match(/:(.*?);/)[1],b=atob(a[1]),n=b.length,u8=new Uint8Array(n);while(n--)u8[n]=b.charCodeAt(n);return new Blob([u8],{type:mime})}
function asBlob(x){return typeof x==="string"?dataToBlob(x):x}
function blobToData(b){return new Promise(function(res){var r=new FileReader();r.onload=function(){res(r.result)};r.readAsDataURL(b)})}
function canvasBlob(c,q){return new Promise(function(res){c.toBlob(function(b){if(b&&b.type==="image/webp")return res(b);c.toBlob(function(j){res(j)},"image/jpeg",q)},"image/webp",q)})}
function imgOf(x){if(typeof x==="string")return loadImg(x);var u=URL.createObjectURL(x);return loadImg(u).then(function(i){URL.revokeObjectURL(u);return i},function(e){URL.revokeObjectURL(u);throw e})}
function scaled(img,max){var sc=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height)),c=document.createElement("canvas");c.width=Math.round((img.naturalWidth||img.width)*sc);c.height=Math.round((img.naturalHeight||img.height)*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c}
function makeBase(img){var Q=QUAL[qualKey()];return canvasBlob(scaled(img,Q.max),Q.q)}
function makeThumb(img){return canvasBlob(scaled(img,360),.6)}
function composite(base,shapes,q){
  return imgOf(base).then(function(img){var c=document.createElement("canvas");c.width=img.naturalWidth;c.height=img.naturalHeight;var x=c.getContext("2d");x.drawImage(img,0,0);drawShapes(x,c.width,c.height,shapes);return canvasBlob(c,q||.8)});
}
function bytesOf(x){return !x?0:(typeof x==="string"?Math.round(x.length*.75):x.size||0)}
function momBytes(m){return bytesOf(m.base)+bytesOf(m.thumb)+bytesOf(m.composite)}
function fmtB(n){return n>=1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB"}
var URLS={};
function urlOf(key,x){if(!x)return"";if(typeof x==="string")return x;if(!URLS[key]||URLS[key].b!==x)URLS[key]={b:x,u:URL.createObjectURL(x)};return URLS[key].u}
function thumbSrc(m){return urlOf(m.id+"t",m.thumb||m.composite||m.base)}

/* ---------- views ---------- */
function setView(v){S.view=v;render()}
function render(){
  stopLoop();cancelAnimationFrame(C.raf);
  var app=document.getElementById("app");
  if(S.view==="home")return renderHome(app);
  if(S.view==="studio")return renderStudio(app);
  if(S.view==="editor")return renderEditor(app);
  if(S.view==="viewer")return renderViewer(app);
  if(S.view==="comparePick")return renderComparePick(app);
  if(S.view==="compare"&&C.a&&C.b)return renderCompare(app);
  S.view="home";renderHome(app);
}
function hdr(title,back,right){return '<header>'+(back?'<button class="btn sm" onclick="'+back+'">← Back</button>':'<a class="btn sm" href="app.html" style="text-decoration:none">← App</a>')+'<h1>'+esc(title)+'</h1>'+(right||'')+'</header>'}
function refresh(){return dbAll().then(function(m){S.moments=m.sort(function(a,b){return String(b.created).localeCompare(String(a.created))})})}

function renderHome(app){
  var players=S.roster;
  var opts='<option value="">Choose a player…</option>'+players.map(function(p){return '<option value="'+esc(p.name)+'"'+(S.player===p.name?" selected":"")+'>'+esc(p.name)+(p.team?" · "+esc(p.team):"")+'</option>'}).join("")+'<option value="__other"'+(S.player&&!players.some(function(p){return p.name===S.player})?" selected":"")+'>Someone else (type a name)…</option>';
  var mine=S.moments.filter(function(m){return !S.player||m.player===S.player});
  var mb=0;S.moments.forEach(function(m){mb+=momBytes(m)});
  app.innerHTML=hdr("Video Review Studio")+'<main>'+
   '<div class="card"><b>Review a clip</b><div class="muted small" style="margin:4px 0 8px">Pick a video from your phone. It plays here and is never uploaded or copied.</div>'+
   '<label style="margin-top:0">Player</label><select id="plSel" onchange="pickPlayer(this.value)">'+opts+'</select>'+
   '<label class="vlabelOther" style="display:none">Name</label><input type="text" id="plOther" placeholder="Player name" style="display:none" oninput="S.player=this.value.trim()">'+
   '<div style="margin-top:12px"><label class="btn primary full" style="text-align:center;margin:0;cursor:pointer">🎬 Choose video<input type="file" accept="video/*" style="display:none" onchange="openClip(this)"></label></div>'+
   '<button class="btn full" style="margin-top:10px" onclick="setView(\'comparePick\')">⇆ Compare two clips</button><div class="tip">Film side-on for drives and cuts, front-on for bowling actions, with the camera still and the player in full view. Angles you measure are on-screen angles, not exact body angles.</div></div>'+
   '<div class="row" style="margin:6px 0 8px"><b class="grow">Saved moments'+(S.player&&S.player!=="__other"?' — '+esc(S.player):'')+'</b><span class="muted small">'+mine.length+' · '+fmtB(mb)+' total</span></div>'+
   (mine.length?'<div class="grid">'+mine.map(function(m){return '<div class="mom" onclick="openMoment(\''+m.id+'\')"><img src="'+thumbSrc(m)+'" alt=""><div><b>'+esc(m.player)+'</b><br><span class="muted">'+fmtDate(m.date)+' · '+fmtB(momBytes(m))+'</span></div></div>'}).join("")+'</div>':'<div class="card muted">No saved moments yet. Choose a video, freeze a frame, draw, and save.</div>')+
   '<div class="card" style="margin-top:14px"><b>Storage</b><div class="muted small" style="margin:4px 0 8px">Each saved moment is a small compressed image plus the drawing instructions — the video itself is never stored. Lower quality keeps your phone light.</div>'+
   '<label style="margin-top:0">Frame quality for new saves</label><select onchange="try{localStorage.setItem(\'video_quality\',this.value)}catch(e){}">'+Object.keys(QUAL).map(function(k){return '<option value="'+k+'"'+(qualKey()===k?' selected':'')+'>'+QUAL[k].label+'</option>'}).join("")+'</select>'+
   '<button class="btn full" style="margin-top:10px" onclick="compressAll()">Compress saved moments to this quality</button><div class="muted small" id="cmpMsg" style="margin-top:6px"></div></div>'+
   '<div class="row" style="margin-top:14px"><button class="btn sm" onclick="exportAll()">Export moments (.json)</button><label class="btn sm" style="cursor:pointer;margin:0">Import<input type="file" accept="application/json" style="display:none" onchange="importAll(this)"></label></div>'+
   '</main>';

function snapFps(f){var best=null,bd=1e9;FPS_LIST.forEach(function(x){var d=Math.abs(x-f)/x;if(d<bd){bd=d;best=x}});return bd<.04?best:Math.round(f)}

    if(n>=4&&min<1){S.fps=snapFps(1/min);S.fpsDetected=true;var s=document.getElementById("fpsSel");if(s){if(![].some.call(s.options,function(o){return +o.value===S.fps})){var o=document.createElement("option");o.textContent=S.fps;s.appendChild(o)}s.value=S.fps}note.textContent="Frame rate detected: "+S.fps+" fps. Correct it above if steps look wrong (slow-motion clips can differ)."}
    else note.textContent="Using 30 fps for frame stepping — change it above if the clip is different.";

  v.requestVideoFrameCallback(cb);v.playbackRate=1;v.play().catch(fin);setTimeout(fin,1800);
}

/* ---------- freeze -> editor ---------- */
function captureFrame(v){
  var w=v.videoWidth,h=v.videoHeight,Q=QUAL[qualKey()],sc=Math.min(1,Q.max/Math.max(w,h));
  var c=document.createElement("canvas");c.width=Math.round(w*sc);c.height=Math.round(h*sc);c.getContext("2d").drawImage(v,0,0,c.width,c.height);
  return canvasBlob(c,Q.q);
}
function freeze(){
  var v=VEL;v.pause();
  if(!v.videoWidth){alert("The video isn't ready yet.");return}
  var t=v.currentTime;
  captureFrame(v).then(function(base){ED={base:base,shapes:[],tool:"line",color:COLORS[0],pts:[],drag:null,timeSec:t,existing:null};setView("editor")});
}
var TOOLS=[["edit","Edit"],["line","Line"],["angle","Angle"],["vguide","Vertical"],["hguide","Horizontal"],["circle","Circle"],["arrow","Arrow"],["text","Text"],["spot","Spotlight"],["pan","Pan"]];
var TOOL_HELP={edit:"Tap a drawing to select it. Drag it to move, or drag a white dot to reshape it. Pinch to zoom, two fingers to pan.",line:"Drag to draw a line. Pinch to zoom for precision.",angle:"Tap three points: first arm, the joint, second arm.",vguide:"Tap to place a vertical guide line.",hguide:"Tap to place a horizontal guide line.",circle:"Drag from the centre outwards.",arrow:"Drag from the tail to the point.",text:"Tap where the label should go.",spot:"Drag a box — everything outside is darkened.",pan:"Drag to move the zoomed frame."};
function renderEditor(app){
  ED.hist=ED.hist||[];ED.sel=null;ED.z={s:1,x:0,y:0};ED.ptrs={};ED.gesture=null;ED.mv=null;ED.tap=null;
  app.innerHTML=hdr("Draw on frame",ED.existing?"setView('viewer')":"setView('studio')",'<button class="btn primary sm" onclick="saveSheet()">'+(ED.existing?"Save":"Save…")+'</button>')+'<main style="padding-bottom:170px">'+
   '<div class="edWrap" id="edWrap"><div id="edInner" style="transform-origin:0 0"><canvas id="cv"></canvas></div><div class="zoomBtns"><button onclick="zoomBy(1.5)" aria-label="Zoom in">+</button><button onclick="zoomBy(1/1.5)" aria-label="Zoom out">−</button><button onclick="zoomFit()" aria-label="Fit">⤢</button></div></div></main>'+
   '<div class="dock" id="edDock"><button class="dockToggle" onclick="toggleDock()" id="dockT" aria-label="Show or hide tool options">⌄</button>'+
   '<div class="dockHelp" id="toolHelp"></div>'+
   '<div class="dockTools" id="tools">'+TOOLS.map(function(t){return '<button class="chip'+(ED.tool===t[0]?" on":"")+'" data-t="'+t[0]+'" onclick="setTool(\''+t[0]+'\')">'+t[1]+'</button>'}).join("")+'</div>'+
   '<div class="dockRow2"><div class="row" id="cols" style="gap:8px">'+COLORS.map(function(c){return '<button class="sw'+(ED.color===c?" on":"")+'" style="background:'+c+'" onclick="setColor(\''+c+'\')" aria-label="Colour"></button>'}).join("")+'</div><span class="grow"></span><button class="btn sm" onclick="edUndo()">Undo</button><button class="btn sm" id="delSel" onclick="edDelSel()" disabled>Delete</button><button class="btn sm danger" onclick="edClear()">Clear</button></div></div>';
  var cv=document.getElementById("cv"),wr=document.getElementById("edWrap");
  imgOf(ED.base).then(function(img){ED.img=img;cv.width=img.naturalWidth;cv.height=img.naturalHeight;redraw()});
  wr.addEventListener("pointerdown",edDown);wr.addEventListener("pointermove",edMove);wr.addEventListener("pointerup",edUp);wr.addEventListener("pointercancel",edUp);
  wr.addEventListener("wheel",function(e){e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.2:1/1.2)},{passive:false});

function toggleDock(){var d=document.getElementById("edDock"),m=d.classList.toggle("min");document.getElementById("dockT").textContent=m?"⌃":"⌄";document.querySelector("main").style.paddingBottom=m?"70px":"170px"}
function selUI(){var d=document.getElementById("delSel");if(d)d.disabled=ED.sel==null}
function setTool(t){ED.tool=t;ED.pts=[];ED.drag=null;ED.sel=null;ED.mv=null;document.querySelectorAll("#tools .chip").forEach(function(c){c.classList.toggle("on",c.dataset.t===t)});document.getElementById("toolHelp").textContent=TOOL_HELP[t];selUI();redraw()}
function snap(){ED.hist.push(JSON.stringify(ED.shapes));if(ED.hist.length>60)ED.hist.shift()}
function setColor(c){

function hexToRgb(h){var n=parseInt(h.slice(1),16);return"rgb("+(n>>16)+","+((n>>8)&255)+","+(n&255)+")"}
/* zoom / pan */
function zApply(){
  var wr=document.getElementById("edWrap"),inn=document.getElementById("edInner");if(!wr||!inn)return;var z=ED.z;
  z.s=Math.max(1,Math.min(6,z.s));var W=wr.clientWidth,H=wr.clientHeight;
  z.x=Math.min(0,Math.max(W*(1-z.s),z.x));z.y=Math.min(0,Math.max(H*(1-z.s),z.y));
  inn.style.transform="translate("+z.x+"px,"+z.y+"px) scale("+z.s+")";
}
function zoomAt(cx,cy,f){
  var wr=document.getElementById("edWrap"),r=wr.getBoundingClientRect(),z=ED.z,px=cx-r.left,py=cy-r.top,cpx=(px-z.x)/z.s,cpy=(py-z.y)/z.s;
  z.s=Math.max(1,Math.min(6,z.s*f));z.x=px-cpx*z.s;z.y=py-cpy*z.s;zApply();
}
function zoomBy(f){var wr=document.getElementById("edWrap"),r=wr.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,f)}
function zoomFit(){ED.z={s:1,x:0,y:0};zApply()}
/* geometry helpers (normalised coords; x scaled by aspect so distances are isotropic) */
function AR(){var c=document.getElementById("cv");return c.width/c.height}
function nd(a,b){return Math.hypot((a[0]-b[0])*AR(),a[1]-b[1])}
function distSeg(p,a,b){var ar=AR(),ax=a[0]*ar,ay=a[1],bx=b[0]*ar,by=b[1],px=p[0]*ar,py=p[1],dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,t=l?Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/l)):0;return Math.hypot(px-(ax+t*dx),py-(ay+t*dy))}
function shapePts(s){if(s.t==="vguide")return[[s.p[0][0],.5]];if(s.t==="hguide")return[[.5,s.p[0][1]]];return s.p}
function shapeDist(s,p){
  var q=s.p;
  if(s.t==="line"||s.t==="arrow")return distSeg(p,q[0],q[1]);
  if(s.t==="angle"){var d=distSeg(p,q[0],q[1]);if(q[2])d=Math.min(d,distSeg(p,q[1],q[2]));return d}
  if(s.t==="circle")return Math.abs(nd(p,q[0])-nd(q[0],q[1]));
  if(s.t==="vguide")return Math.abs(p[0]-q[0][0])*AR();
  if(s.t==="hguide")return Math.abs(p[1]-q[0][1]);
  if(s.t==="text")return Math.max(0,nd(p,q[0])-.03);
  if(s.t==="spot"){var cx=(q[0][0]+q[1][0])/2,cy=(q[0][1]+q[1][1])/2,rx=Math.abs(q[1][0]-q[0][0])/2*AR(),ry=Math.abs(q[1][1]-q[0][1])/2;if(rx<.001||ry<.001)return 1;var dx=(p[0]-cx)*AR(),dy=p[1]-cy;return Math.abs(Math.hypot(dx/rx,dy/ry)-1)*Math.min(rx,ry)}
  return 1;
}
function redraw(){
  var cv=document.getElementById("cv");if(!cv||!ED.img)return;var x=cv.getContext("2d");x.clearRect(0,0,cv.width,cv.height);x.drawImage(ED.img,0,0);
  var prev=null;
  if(ED.tool==="angle"&&ED.pts.length)prev={t:"angle",c:ED.color,p:ED.pts.concat(ED.cur&&ED.pts.length<3?[ED.cur]:[]).slice(0,3)};
  else if(ED.drag&&ED.tool!=="edit"&&ED.tool!=="pan")prev={t:ED.tool,c:ED.color,p:[ED.drag.a,ED.drag.b]};
  drawShapes(x,cv.width,cv.height,ED.shapes,prev);
  if(ED.tool==="edit"&&ED.sel!=null&&ED.shapes[ED.sel]){
    var r=Math.max(9,cv.width/70)/ED.z.s;x.save();x.lineWidth=Math.max(2,r/4);
    shapePts(ED.shapes[ED.sel]).forEach(function(q){x.beginPath();x.arc(q[0]*cv.width,q[1]*cv.height,r,0,Math.PI*2);x.fillStyle="#fff";x.fill();x.strokeStyle="#000";x.stroke()});x.restore();
  }
}
function evPt(e){var cv=document.getElementById("cv"),r=cv.getBoundingClientRect();return[Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]}
function nPtr(){return Object.keys(ED.ptrs).length}
function startGesture(){
  var k=Object.keys(ED.ptrs),a=ED.ptrs[k[0]],b=ED.ptrs[k[1]],wr=document.getElementById("edWrap").getBoundingClientRect();
  var cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
  ED.gesture={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,s0:ED.z.s,cpx:((cx-wr.left)-ED.z.x)/ED.z.s,cpy:((cy-wr.top)-ED.z.y)/ED.z.s};
}
function doGesture(){
  var k=Object.keys(ED.ptrs),a=ED.ptrs[k[0]],b=ED.ptrs[k[1]],g=ED.gesture,wr=document.getElementById("edWrap").getBoundingClientRect();
  var cx=(a.x+b.x)/2-wr.left,cy=(a.y+b.y)/2-wr.top,d=Math.hypot(a.x-b.x,a.y-b.y);
  ED.z.s=Math.max(1,Math.min(6,g.s0*d/g.d0));ED.z.x=cx-g.cpx*ED.z.s;ED.z.y=cy-g.cpy*ED.z.s;zApply();
}
function edDown(e){
  if(e.target.closest&&e.target.closest(".zoomBtns"))return;
  e.preventDefault();ED.ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  try{document.getElementById("edWrap").setPointerCapture(e.pointerId)}catch(x){}
  if(nPtr()===2){ED.drag=null;ED.mv=null;ED.tap=null;ED.noDraw=true;startGesture();return}
  if(nPtr()>2)return;
  ED.noDraw=false;var p=evPt(e),t=ED.tool;
  if(t==="pan"){ED.pan={x:e.clientX,y:e.clientY,zx:ED.z.x,zy:ED.z.y};return}
  if(t==="vguide"||t==="hguide"||t==="text"||t==="angle"){ED.tap={p:p,x:e.clientX,y:e.clientY};return}
  if(t==="edit"){
    var th=.05/ED.z.s;
    if(ED.sel!=null&&ED.shapes[ED.sel]){var pts=shapePts(ED.shapes[ED.sel]);for(var i=0;i<pts.length;i++){if(nd(pts[i],p)<th*1.3){ED.mv={mode:"handle",i:i,start:p,moved:false};return}}}
    var best=-1,bd=th;for(var j=ED.shapes.length-1;j>=0;j--){var d=shapeDist(ED.shapes[j],p);if(d<bd){bd=d;best=j}}
    if(best>=0){ED.sel=best;ED.mv={mode:"body",start:p,orig:JSON.parse(JSON.stringify(ED.shapes[best].p)),moved:false}}else{ED.sel=null}
    selUI();redraw();return;
  }
  ED.drag={a:p,b:p};redraw();
}
function edMove(e){
  if(ED.ptrs[e.pointerId]){ED.ptrs[e.pointerId]={x:e.clientX,y:e.clientY}}
  if(ED.gesture&&nPtr()>=2){doGesture();return}
  if(ED.noDraw)return;
  var p=evPt(e);
  if(ED.pan&&nPtr()===1){ED.z.x=ED.pan.zx+(e.clientX-ED.pan.x);ED.z.y=ED.pan.zy+(e.clientY-ED.pan.y);zApply();return}
  if(ED.tool==="angle"&&ED.pts.length){ED.cur=p;redraw();return}
  if(ED.mv&&ED.sel!=null){
    var m=ED.mv,s=ED.shapes[ED.sel],dx=p[0]-m.start[0],dy=p[1]-m.start[1];
    if(!m.moved){if(Math.hypot(dx*AR(),dy)<.006)return;snap();m.moved=true}
    if(m.mode==="handle"){if(s.t==="vguide")s.p[0][0]=p[0];else if(s.t==="hguide")s.p[0][1]=p[1];else s.p[m.i]=p}
    else s.p=m.orig.map(function(q){return[Math.max(0,Math.min(1,q[0]+dx)),Math.max(0,Math.min(1,q[1]+dy))]});
    redraw();return;
  }
  if(ED.drag){ED.drag.b=p;redraw()}
}
function edUp(e){
  var wasGesture=!!ED.gesture;delete ED.ptrs[e.pointerId];
  if(nPtr()<2)ED.gesture=null;
  if(nPtr()>0){return}
  if(wasGesture||ED.noDraw){ED.noDraw=false;ED.drag=null;ED.mv=null;ED.tap=null;ED.pan=null;return}
  ED.pan=null;
  if(ED.mv){ED.mv=null;redraw();return}
  if(ED.tap){
    var tp=ED.tap;ED.tap=null;if(Math.hypot(e.clientX-tp.x,e.clientY-tp.y)>10)return;var t=ED.tool,p=tp.p;
    if(t==="vguide"||t==="hguide"){snap();ED.shapes.push({t:t,c:ED.color,p:[p]})}
    else if(t==="text"){var txt=prompt("Label text");if(txt&&txt.trim()){snap();ED.shapes.push({t:"text",c:ED.color,p:[p],txt:txt.trim().slice(0,40)})}}
    else if(t==="angle"){ED.pts.push(p);if(ED.pts.length===3){snap();ED.shapes.push({t:"angle",c:ED.color,p:ED.pts.slice()});ED.pts=[]}ED.cur=null}
    redraw();return;
  }
  if(!ED.drag)return;var d=ED.drag;ED.drag=null;
  if(nd(d.a,d.b)>.012){snap();ED.shapes.push({t:ED.tool,c:ED.color,p:[d.a,d.b]})}
