<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a session — ProCoach OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#10b981;--g2:#34d399;--ink:#eef2f7;--muted:#8a95ab;--line:rgba(255,255,255,.08);--bg:#08121e;--surface:#0f1a2b;--surface2:#16233a;--gold:#f59e0b;--red:#ef5350}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.wrap{max-width:520px;margin:0 auto;padding:28px 18px 60px}
.coachName{font-size:26px;font-weight:800;letter-spacing:-.01em;margin:0 0 4px}
.sub{color:var(--muted);font-size:14.5px;margin:0 0 28px}
.dateGroup{margin-bottom:22px}
.dateLabel{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:10px}
.slotGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.slotBtn{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 6px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.slotBtn:hover{border-color:var(--g)}
.slotBtn.selected{background:linear-gradient(135deg,var(--g),var(--g2));border-color:transparent;color:#04140d}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.formRow{margin-bottom:14px}
.formRow label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.formRow input,.formRow textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--ink);font-family:inherit;font-size:15px}
.formRow textarea{resize:vertical;min-height:64px}
.chosenSlot{background:var(--surface2);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:14.5px}
.btn{width:100%;background:linear-gradient(135deg,var(--g),var(--g2));border:0;color:#04140d;font-weight:700;font-size:15.5px;padding:14px;border-radius:10px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.state{text-align:center;padding:60px 20px;color:var(--muted)}
.state h2{color:var(--ink);font-size:19px;margin-bottom:8px}
.backLink{display:inline-block;margin-top:14px;color:var(--g);font-size:14px;text-decoration:none;cursor:pointer}
.confirmCard{text-align:center;padding:36px 20px}
.confirmCard .tick{width:52px;height:52px;border-radius:50%;background:var(--mint,rgba(16,185,129,.15));display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:26px}
.errMsg{color:var(--red);font-size:13.5px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="state">Loading availability…</div></div>

<script>
const BOOKING_API = "https://procoachos-booking.maildinu25.workers.dev";
const params = new URLSearchParams(location.search);
const token = params.get("t");
const checkId = params.get("check");
const app = document.getElementById("app");

function loadRememberedParentInfo(){
 try{
  return {
   parentName: localStorage.getItem("procoachos_booking_parent_name")||"",
   playerName: localStorage.getItem("procoachos_booking_player_name")||"",
  };
 }catch(e){ return { parentName:"", playerName:"" }; }
}
function rememberParentInfo(parentName, playerName){
 try{
  localStorage.setItem("procoachos_booking_parent_name", parentName);
  localStorage.setItem("procoachos_booking_player_name", playerName);
 }catch(e){}
}
let remembered = loadRememberedParentInfo();
let state = { openSlots: [], selectedSlots: [], step: "pick", submitting: false, submitted: false, submittedIds: [], failedCount: 0, error: null, formValues: { parentName:remembered.parentName, playerName:remembered.playerName, note:"", recurring:false, recurringWeeks:4 }, statusResults: null, statusLoaded: false, rescheduling: false };
const MAX_SLOTS_PER_REQUEST = 6;

function fmtDateLabel(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  const today = new Date(); today.setHours(0,0,0,0);
  const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate()+1);
  if (d.getTime() === today.getTime()) return "Today";
  if (d.getTime() === tomorrow.getTime()) return "Tomorrow";
  return d.toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric" });
}
function fmtTimeLabel(timeStr){
  const [h,m] = timeStr.split(":").map(Number);
  const period = h >= 12 ? "pm" : "am";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return m === 0 ? `${h12}${period}` : `${h12}:${String(m).padStart(2,"0")}${period}`;
}
function groupByDate(slots){
  const groups = {};
  slots.forEach(s => { (groups[s.date] = groups[s.date] || []).push(s); });
  return Object.entries(groups).sort(([a],[b]) => a.localeCompare(b));
}

function render(){
  if (!token){
    app.innerHTML = `<div class="state"><h2>This link isn't valid</h2><p>Ask your coach to resend the booking link.</p></div>`;
    return;
  }
  if (checkId && !state.rescheduling){
    renderStatusView();
    return;
  }
  if (state.submitted){
    const checkLink = `${location.origin}${location.pathname}?t=${encodeURIComponent(token)}&check=${encodeURIComponent(state.submittedIds.join(","))}`;
    const countLabel = state.submittedIds.length === 1 ? "Request sent" : `${state.submittedIds.length} requests sent`;
    app.innerHTML = `<div class="card confirmCard">
      <div class="tick">✓</div>
      <h2 style="margin:0 0 6px">${countLabel}</h2>
      <p style="color:var(--muted);margin:0">Your coach hasn't confirmed ${state.submittedIds.length===1?"it":"them"} yet. Use the link below to check — bookmark it or save it now, since this is the only way to see whether ${state.submittedIds.length===1?"it's":"they're"} confirmed.</p>
      ${state.failedCount>0?`<p style="color:var(--red);font-size:13px;margin-top:10px">${state.failedCount} of the selected times couldn't be sent — please try requesting those again.</p>`:""}
      <a href="${checkLink}" class="btn primary" style="display:block;margin-top:18px;text-decoration:none;box-sizing:border-box">Check Your Request Status</a>
    </div>`;
    return;
  }
  if (state.error === "invalid-link"){
    app.innerHTML = `<div class="state"><h2>This link isn't valid</h2><p>Ask your coach to resend the booking link.</p></div>`;
    return;
  }
  if (!state.loaded){
    app.innerHTML = `<div class="state">Loading availability…</div>`;
    return;
  }
  if (!state.openSlots.length){
    app.innerHTML = `<div class="state"><h2>No open slots right now</h2><p>Check back soon, or message your coach directly.</p></div>`;
    return;
  }

  let html = `<h1 class="coachName">Book a session</h1><p class="sub">Pick one or more times that work, then send your request.</p>`;

  if (state.step === "pick"){
    const atMax = state.selectedSlots.length >= MAX_SLOTS_PER_REQUEST;
    groupByDate(state.openSlots).forEach(([date, slots]) => {
      html += `<div class="dateGroup"><div class="dateLabel">${fmtDateLabel(date)}</div><div class="slotGrid">`;
      slots.forEach(s => {
        const isSelected = state.selectedSlots.some(sel => sel.date===s.date && sel.time===s.time);
        const disabled = !isSelected && atMax;
        html += `<button class="slotBtn${isSelected?" selected":""}" ${disabled?"disabled style=\"opacity:.4\"":""} data-date="${s.date}" data-time="${s.time}" onclick="toggleSlot('${s.date}','${s.time}')">${fmtTimeLabel(s.time)}${s.venue?`<br><small style="opacity:.75;font-weight:400">${esc(s.venue)}</small>`:""}</button>`;
      });
      html += `</div></div>`;
    });
    if (state.selectedSlots.length){
      html += `<div class="chosenSlot">${state.selectedSlots.length} time${state.selectedSlots.length!==1?"s":""} selected${atMax?` (max ${MAX_SLOTS_PER_REQUEST})`:""}</div>
      <button class="btn primary" onclick="goToDetails()" style="margin-top:4px">Continue</button>`;
    }
  } else {
    const canRecur = state.selectedSlots.length === 1;
    html += `<div class="card" style="margin-bottom:14px">
      ${state.selectedSlots.map(s=>`<div class="chosenSlot" style="margin-bottom:6px"><span>${fmtDateLabel(s.date)} at ${fmtTimeLabel(s.time)}${s.venue?" · "+esc(s.venue):""}</span><a class="backLink" onclick="removeSlot('${s.date}','${s.time}')">Remove</a></div>`).join("")}
      <a class="backLink" onclick="state.step='pick';render()">+ Add another time</a>
    </div>
    ${canRecur?`<div class="card" style="margin-bottom:14px">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" ${state.formValues.recurring?"checked":""} onchange="state.formValues.recurring=this.checked;render()" style="width:auto"> <span>Make this a weekly booking</span></label>
      ${state.formValues.recurring?`<div class="formRow" style="margin-top:10px"><label>Repeat for how many weeks?</label><input type="number" min="2" max="12" value="${state.formValues.recurringWeeks}" oninput="state.formValues.recurringWeeks=this.value"></div><p style="color:var(--muted);font-size:12.5px;margin:6px 0 0">Same day and time, every week — your coach can still confirm or decline each week individually.</p>`:""}
    </div>`:""}
    <div class="card">
      <div class="formRow"><label>Your name</label><input id="fParent" placeholder="e.g. Priya Sharma" value="${state.formValues.parentName.replace(/"/g,"&quot;")}" oninput="state.formValues.parentName=this.value"></div>
      <div class="formRow"><label>Player's name</label><input id="fPlayer" placeholder="e.g. Arjun Sharma" value="${state.formValues.playerName.replace(/"/g,"&quot;")}" oninput="state.formValues.playerName=this.value"></div>
      <div class="formRow"><label>Note <span style="color:var(--muted);font-weight:400">(optional)</span></label><textarea id="fNote" placeholder="Anything your coach should know" oninput="state.formValues.note=this.value">${state.formValues.note.replace(/</g,"&lt;")}</textarea></div>
      <button class="btn" id="submitBtn" onclick="submitRequest()" ${state.submitting?"disabled":""}>${state.submitting?"Sending…":(canRecur&&state.formValues.recurring)?`Send Weekly Request (${state.formValues.recurringWeeks} weeks)`:state.selectedSlots.length>1?`Send ${state.selectedSlots.length} Requests`:"Send Request"}</button>
      <p style="color:var(--muted);font-size:12.5px;margin:10px 0 0;text-align:center">You won't get an email — after sending, you'll get a link to check whether it's been confirmed.</p>
      ${state.error==="missing-fields"?`<div class="errMsg">Please fill in your name and the player's name.</div>`:""}
      ${state.error==="submit-failed"?`<div class="errMsg">Something went wrong sending your request. Please try again.</div>`:""}
    </div>`;
  }
  app.innerHTML = html;
}

function toggleSlot(date, time){
  const idx = state.selectedSlots.findIndex(s => s.date===date && s.time===time);
  if (idx>=0) state.selectedSlots.splice(idx,1);
  else if (state.selectedSlots.length < MAX_SLOTS_PER_REQUEST){
    const original = state.openSlots.find(s => s.date===date && s.time===time);
    state.selectedSlots.push({date, time, venue: original ? original.venue : ""});
  }
  state.error = null;
  render();
}
function removeSlot(date, time){
  state.selectedSlots = state.selectedSlots.filter(s => !(s.date===date && s.time===time));
  if (!state.selectedSlots.length) state.step = "pick";
  render();
}
function goToDetails(){ state.step = "details"; state.error=null; render(); }

async function loadSlots(){
  try{
    const res = await fetch(`${BOOKING_API}/api/booking/slots?t=${encodeURIComponent(token)}`);
    if (!res.ok){ state.error = "invalid-link"; state.loaded = true; render(); return; }
    const data = await res.json();
    state.openSlots = data.openSlots || [];
    state.loaded = true;
    render();
  } catch(e){
    state.error = "invalid-link"; state.loaded = true; render();
  }
}

async function submitRequest(){
  const parentName = state.formValues.parentName.trim();
  const playerName = state.formValues.playerName.trim();
  const note = state.formValues.note.trim();
  if (!parentName || !playerName){ state.error = "missing-fields"; render(); return; }
  state.submitting = true; state.error = null; render();
  const successIds = [];
  let failedCount = 0;
  const isRecurring = state.selectedSlots.length === 1 && state.formValues.recurring;
  if (isRecurring){
    try{
      const slot = state.selectedSlots[0];
      const res = await fetch(`${BOOKING_API}/api/booking/request?t=${encodeURIComponent(token)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ parentName, playerName, note, date: slot.date, time: slot.time, recurringWeeks: state.formValues.recurringWeeks })
      });
      if (!res.ok) throw new Error("failed");
      const data = await res.json();
      successIds.push(...(data.ids || [data.id]));
    } catch(e){
      failedCount = 1;
    }
  } else {
    for (const slot of state.selectedSlots){
      try{
        const res = await fetch(`${BOOKING_API}/api/booking/request?t=${encodeURIComponent(token)}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ parentName, playerName, note, date: slot.date, time: slot.time })
        });
        if (!res.ok) throw new Error("failed");
        const data = await res.json();
        successIds.push(data.id);
      } catch(e){
        failedCount++;
      }
    }
  }
  state.submitting = false;
  if (!successIds.length){ state.error = "submit-failed"; render(); return; }
  rememberParentInfo(parentName, playerName);
  state.submitted = true; state.submittedIds = successIds; state.failedCount = failedCount; render();
}

function renderStatusView(){
  if (!state.statusLoaded){
    app.innerHTML = `<div class="state">Checking your request…</div>`;
    loadStatus();
    return;
  }
  if (!state.statusResults || !state.statusResults.length){
    app.innerHTML = `<div class="state"><h2>Couldn't find that request</h2><p>The link may be out of date. Ask your coach directly if you're unsure.</p></div>`;
    return;
  }
  const oneCard = (r) => {
    const when = `${fmtDateLabel(r.date)} at ${fmtTimeLabel(r.time)}`;
    const statusLabel = r.status === "approved" ? "Confirmed" : r.status === "declined" ? "Not confirmed" : r.status === "cancelled" ? "Cancelled" : "Still pending";
    const statusColor = r.status === "approved" ? "#10b981" : r.status === "declined" ? "#ef5350" : r.status === "cancelled" ? "#8a94a6" : "#f59e0b";
    const canManage = r.status === "approved" || r.status === "pending";
    const actionsHtml = canManage ? `<div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn secondary" style="flex:1;padding:8px" onclick="handleRescheduleBooking('${r.id}')">Reschedule</button>
      <button class="btn secondary" style="flex:1;padding:8px;color:#ef5350" onclick="handleCancelBooking('${r.id}')">Cancel</button>
    </div>` : "";
    return `<div class="card" style="margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="tick" style="background:${statusColor}22;color:${statusColor};width:38px;height:38px;font-size:17px;margin:0">${r.status==="approved"?"✓":r.status==="declined"||r.status==="cancelled"?"✕":"…"}</div>
        <div>
          <div style="font-weight:700">${statusLabel}</div>
          <div style="color:var(--muted);font-size:13px">${esc(r.playerName)} — ${esc(when)}${r.venue?" · "+esc(r.venue):""}</div>
        </div>
      </div>
      ${actionsHtml}
    </div>`;
  };
  const headerLabel = state.statusResults.length === 1 ? "Your Request" : `Your ${state.statusResults.length} Requests`;
  app.innerHTML = `<h1 class="coachName" style="font-size:20px">${headerLabel}</h1>${state.statusResults.map(oneCard).join("")}`;
}
function esc(s){
  const d = document.createElement("div"); d.textContent = String(s); return d.innerHTML;
}
async function loadStatus(){
  try{
    const res = await fetch(`${BOOKING_API}/api/booking/status?t=${encodeURIComponent(token)}&check=${encodeURIComponent(checkId)}`);
    if (!res.ok){ state.statusResults = null; state.statusLoaded = true; render(); return; }
    const data = await res.json();
    state.statusResults = data.results || null;
    state.statusLoaded = true;
    render();
  } catch(e){
    state.statusResults = null; state.statusLoaded = true; render();
  }
}

async function handleCancelBooking(bookingId){
  if (!confirm("Cancel this request? Your coach will be notified.")) return;
  try{
    const res = await fetch(`${BOOKING_API}/api/booking/cancel?t=${encodeURIComponent(token)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ bookingId })
    });
    if (!res.ok) throw new Error("failed");
    const match = state.statusResults.find(r => r.id === bookingId);
    if (match) match.status = "cancelled";
    render();
  } catch(e){
    alert("Couldn't cancel that right now. Please try again.");
  }
}
async function handleRescheduleBooking(bookingId){
  if (!confirm("This will cancel your current request so you can pick a new time. Continue?")) return;
  try{
    const res = await fetch(`${BOOKING_API}/api/booking/cancel?t=${encodeURIComponent(token)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ bookingId })
    });
    if (!res.ok) throw new Error("failed");
  } catch(e){
    alert("Couldn't cancel that right now. Please try again.");
    return;
  }
  // Breaks out of the permanent status-view gate below, back into the
  // normal slot-picking flow, with the parent's name already remembered
  // from last time so they aren't retyping it.
  state.rescheduling = true;
  state.step = "pick";
  state.selectedSlots = [];
  state.submitted = false;
  state.submittedIds = [];
  state.error = null;
  state.loaded = false;
  loadSlots();
}

if (checkId) render(); else loadSlots();
</script>
</body>
</html>
