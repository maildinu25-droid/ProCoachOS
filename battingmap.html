<script>// ===== Shared player roster bridge (reads the main ProCoach OS app's =====
// ===== active coach profile — read-only, fails silently if anything =====
// ===== is missing so these tools keep working exactly as before.    =====
var _mainAppPlayerNamesCache=null;
function loadMainAppPlayerNames(){
 return new Promise(function(resolve){
  try{
   var profiles=null;
   try{profiles=JSON.parse(localStorage.getItem("coachbook_profiles"))}catch(e){}
   if(!Array.isArray(profiles)||!profiles.length){resolve([]);return}
   var activeId=localStorage.getItem("coachbook_active_profile")||"default";
   var profile=profiles.find(function(p){return p.id===activeId})||profiles[0];
   if(!profile||!profile.key){resolve([]);return}
   var req=indexedDB.open("coachbook_idb");
   req.onerror=function(){resolve([])};
   req.onsuccess=function(){
    try{
     var idb=req.result;
     if(!idb.objectStoreNames.contains("profiles")){resolve([]);return}
     var tx=idb.transaction("profiles","readonly");
     var getReq=tx.objectStore("profiles").get(profile.key);
     getReq.onerror=function(){resolve([])};
     getReq.onsuccess=function(){
      var db=getReq.result;
      var names=(db&&Array.isArray(db.players))?db.players.map(function(p){return p.name}).filter(Boolean):[];
      resolve(Array.from(new Set(names)).sort());
     };
    }catch(e){resolve([])}
   };
  }catch(e){resolve([])}
 });
}
// Call once on page load, passing whichever input id(s) this page currently
// has on screen — loads and caches the roster, populates the datalist, and
// (since this resolves after the very first render already happened) also
// attaches the input(s) itself once the data is actually ready.
function initPlayerAutocomplete(inputIds){
 loadMainAppPlayerNames().then(function(names){
  _mainAppPlayerNamesCache=names;
  if(!names.length)return;
  var dl=document.getElementById("mainAppPlayerList");
  if(!dl){dl=document.createElement("datalist");dl.id="mainAppPlayerList";document.body.appendChild(dl)}
  dl.innerHTML=names.map(function(n){return '<option value="'+n.replace(/&/g,"&amp;").replace(/"/g,"&quot;")+'">'}).join("");
  if(inputIds&&inputIds.length)attachPlayerAutocomplete(inputIds);
 });
}
// Call after every render — cheap, synchronous, no IndexedDB access.
// Safe to call even before initPlayerAutocomplete resolves (does nothing yet).
function attachPlayerAutocomplete(inputIds){
 if(!_mainAppPlayerNamesCache||!_mainAppPlayerNamesCache.length)return;
 inputIds.forEach(function(id){
  var el=document.getElementById(id);
  if(el&&!el.hasAttribute("list"))el.setAttribute("list","mainAppPlayerList");
 });
}
</script>
<script>// ===== Premium gate — Analysis Tools are a Premium-only feature.     =====
// ===== Reads the same coachbook_license value app.html already uses =====
// ===== so the rule is defined in exactly one place, not duplicated   =====
// ===== with different logic per file.                                =====
function isPremiumUser(){
  // Checks production AND both isolated testing-build keys, since a
  // testing-premium build of app.html never writes to the production
  // key at all — checking only that key would wrongly block a real
  // premium-testing session.
  var keys = ["coachbook_license", "coachbook_license_testing_premium", "coachbook_license_testing_basic"];
  for (var i=0; i<keys.length; i++){
    try{
      var raw = JSON.parse(localStorage.getItem(keys[i]));
      if (raw && (raw.status === "premium" || raw.status === "trial")) return true;
    }catch(e){}
  }
  return false;
}

    '<a href="app.html" style="display:inline-block;background:linear-gradient(135deg,#22c58b,#1fae7a);color:#062016;font-weight:800;padding:12px 24px;border-radius:11px;text-decoration:none">Go to ProCoach OS &rarr;</a>' +

<script>
(function(){
  var OUTCOMES = [
    { id:"dot", label:"Dot", runs:0, color:"#7d93a3" },
    { id:"1", label:"1 run", runs:1, color:"#4fb87a" },
    { id:"2", label:"2 runs", runs:2, color:"#2ec4c4" },
    { id:"3", label:"3 runs", runs:3, color:"#c9793d" },
    { id:"4", label:"FOUR", runs:4, color:"#3d8bd6" },
    { id:"6", label:"SIX", runs:6, color:"#e0ab2c" },
    { id:"W", label:"Out", runs:0, color:"#ff6b52" },
    { id:"wd", label:"Wide", runs:0, color:"#b98ce0" },
    { id:"nb", label:"No ball", runs:0, color:"#b98ce0" },
  ];
  var outcomeMap = {}; OUTCOMES.forEach(function(o){ outcomeMap[o.id] = o; });
  outcomeMap["_none"] = { id:"_none", label:"Pitched (no outcome)", runs:0, color:"#eef2f6" };
  // Rainbow progression (red -> purple) so "1st ball" through "6th ball"
  // reads intuitively at a glance, without needing to check a legend.
  var BALL_POSITION_COLORS = ["#ff6b52","#e0ab2c","#4fb87a","#2ec4c4","#3d8bd6","#b98ce0"];
  function ballPositionColor(ballNo){
    var idx = ((ballNo||1)-1) % BALL_POSITION_COLORS.length;
    return BALL_POSITION_COLORS[idx];
  }

  var DISMISSAL_TYPES = ["Bowled","Caught","LBW","Stumped","Run out","Hit wicket","Other"];
  var SHOT_TYPES = ["Leave","Defend","Drive","Cut","Pull/Hook","Sweep","Flick","Loft","Edge","Other"];
  var SPIN_TYPES = ["Off-spin","Leg-spin"];
  var BATTING_DRILL_PRESETS = [
    { id:"leave-off", name:"Leave outside off", lengthZoneId:null, lineLabel:"Outside off", shotType:"Leave" },
    { id:"drive-full", name:"Drive the full ball", lengthZoneId:"full", lineLabel:null, shotType:"Drive" },
    { id:"cut-short", name:"Cut the short ball", lengthZoneId:"short", lineLabel:null, shotType:"Cut" },
    { id:"defend-good", name:"Defend the good-length ball", lengthZoneId:"good", lineLabel:null, shotType:"Defend" },
    { id:"sweep-spin", name:"Sweep anything full or good-length", lengthZoneId:null, lineLabel:null, shotType:"Sweep" },
  ];
  var FILTERABLE = OUTCOMES.map(function(o){return o.id;}).concat(["_none"]);

  var PITCH_LENGTH_M = 20.12;
  var LENGTH_ZONES = [
    { id:"yorker", label:"Yorker", from:0, to:1 },
    { id:"full", label:"Full", from:1, to:3 },
    { id:"good", label:"Good length", from:3, to:6 },
    { id:"short", label:"Short", from:6, to:9 },
    { id:"bouncer", label:"Bouncer", from:9, to:PITCH_LENGTH_M },
  ];
  var LINE_ZONES = [
    { from:0,   to:58  },
    { from:58,  to:79  },
    { from:79,  to:93  },
    { from:93,  to:107 },
    { from:107, to:121 },
    { from:121, to:142 },
    { from:142, to:200 },
  ];
  var LINE_LABELS_RHB = ["Outside off","Just outside off","Off","Middle","Leg","Just outside leg","Outside leg"];
  var LINE_LABELS_LHB = ["Outside leg","Just outside leg","Leg","Middle","Off","Just outside off","Outside off"];
  var VB_W = 200, VB_H = 600, RULER_W = 36, VB_W_TOTAL = VB_W + RULER_W;
  var POPPING_CREASE_M = 1.22, CREASE_HALF_W = 23;
  var GW_SIZE = 320, GW_CX = 160, GW_CY = 160, GW_R = 144, GW_INNER_R = 61;
  var MINI_PITCH_LEN = 50, MINI_PITCH_W = 15;
  var BAT_Y = GW_CY - MINI_PITCH_LEN/2; // batter sits at the top of a pitch centered in the ground

  function lengthZoneFor(yPct){
    var d = (yPct/100)*PITCH_LENGTH_M;
    for (var i=0;i<LENGTH_ZONES.length;i++){ var z=LENGTH_ZONES[i]; if (d>=z.from && d<z.to) return z; }
    return LENGTH_ZONES[LENGTH_ZONES.length-1];
  }
  function lineZoneIndex(xPct){
    var x = (xPct/100)*VB_W;
    for (var i=0;i<LINE_ZONES.length;i++){ if (x>=LINE_ZONES[i].from && x<LINE_ZONES[i].to) return i; }
    return LINE_ZONES.length-1;
  }

  function clamp(n,lo,hi){ return Math.max(lo, Math.min(hi, n)); }
  function hexToRgba(hex, alpha){
    var h = hex.replace("#","");
    var r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
    return "rgba("+r+","+g+","+b+","+alpha+")";

  function uid(){ return Math.random().toString(36).slice(2,10); }
  function freshPendingDelivery(){

  function hasWagon(b){ return b.wagonX!==null && b.wagonX!==undefined; }
  function bowlTypeText(b){
    if (b.bowlPace==="Spin" && b.bowlSpin && b.bowlArm==="LA"){
      return b.bowlSpin==="Off-spin" ? "Left-arm spin" : "Chinaman";
    }
    return b.bowlArm+" "+(b.bowlPace==="Spin"&&b.bowlSpin ? b.bowlSpin : b.bowlPace);
  }
  function bowlTypeLabel(b){ return bowlTypeText(b)+" &middot; "+b.bowlSide; }

  function declutterPitch(balls){
    var pts = balls.map(function(b){ return Object.assign({}, b, { x:(b.xPct/100)*VB_W, y:(b.yPct/100)*VB_H }); });
    var buckets = {};
    pts.forEach(function(b){
      var key = Math.round(b.x/13)+"_"+Math.round(b.y/13);
      (buckets[key] = buckets[key] || []).push(b);
    });
    var out = [];
    Object.keys(buckets).forEach(function(key){
      var group = buckets[key], n = group.length;
      var cx = group.reduce(function(s,g){return s+g.x;},0)/n;
      var cy = group.reduce(function(s,g){return s+g.y;},0)/n;
      group.forEach(function(b,i){
        if (n===1){ out.push(Object.assign({}, b, { dx:b.x, dy:b.y })); return; }
        var ring = Math.floor(i/7)+1;
        var posInRing = i%7;
        var countInRing = Math.min(7, n-Math.floor(i/7)*7);
        var angle = (2*Math.PI*posInRing)/countInRing - Math.PI/2;
        var r = 7.5*ring;
        out.push(Object.assign({}, b, {
          dx: clamp(cx + r*Math.cos(angle)*0.55, 5, VB_W-5),
          dy: clamp(cy + r*Math.sin(angle), 14, VB_H-14),
        }));
      });
    });
    return out;
  }
  function withOvers(balls){
    var legit = 0;
    return balls.map(function(b){
      var over = Math.floor(legit/6), ballNo = (legit%6)+1;
      if (b.outcome!=="wd" && b.outcome!=="nb") legit++;
      return Object.assign({}, b, { over:over, ballNo:ballNo });
    });
  }
  function statsFor(balls){
    var legit = balls.filter(function(b){return b.outcome!=="wd" && b.outcome!=="nb";});
    var totalRuns = balls.reduce(function(s,b){return s+outcomeMap[b.outcome].runs;},0);
    var dismissals = balls.filter(function(b){return b.outcome==="W";}).length;
    var dots = balls.filter(function(b){return b.outcome==="dot";}).length;
    var boundaries = balls.filter(function(b){return b.outcome==="4"||b.outcome==="6";}).length;
    var strikeRate = legit.length ? (totalRuns/legit.length)*100 : 0;
    var dotPct = legit.length ? (dots/legit.length)*100 : 0;
    return { legit:legit, totalRuns:totalRuns, dismissals:dismissals, dots:dots, boundaries:boundaries, strikeRate:strikeRate, dotPct:dotPct };
  }
  function popoverStyle(p, POP_W, POP_H){
    var left = p.px+12, top = p.py+12;
    if (left+POP_W > p.wrapW-6) left = p.px-POP_W-12;
    if (top+POP_H > p.wrapH-6) top = p.py-POP_H-12;
    left = clamp(left, 4, Math.max(4, p.wrapW-POP_W-4));
    top = clamp(top, 4, Math.max(4, p.wrapH-POP_H-4));
    return { left:left, top:top };
  }

    [0, 1].forEach(function(idx){

            heatGrid.push({ ci:ci, count:count, lz:lz, colFrom:col.from, colTo:col.to });

        var maxHeat = Math.max.apply(null, [1].concat(heatGrid.map(function(c){return c.count;})));
        heatGrid.forEach(function(cell){

          if (cell.count>0) html += '<text x="'+((cell.colFrom+cell.colTo)/2)+'" y="'+((y1+y2)/2+4)+'" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, monospace" fill="#f4f1e8" font-weight="600">'+cell.count+'</text>';

  // ---------- IndexedDB (shared "procoachos" database across pitchmap / battingmap / insights) ----------
  var DB_STORE = "battingsessions", LEGACY_PREFIX = "battingsession:";
  function dbOpen(){
    return new Promise(function(resolve, reject){
      var req = indexedDB.open("procoachos", 4);
      req.onupgradeneeded = function(e){
        var db = e.target.result;
        if (!db.objectStoreNames.contains("pitchsessions")) db.createObjectStore("pitchsessions", { keyPath:"key" });
        if (!db.objectStoreNames.contains("battingsessions")) db.createObjectStore("battingsessions", { keyPath:"key" });
        if (!db.objectStoreNames.contains("bowlerprofiles")) db.createObjectStore("bowlerprofiles", { keyPath:"key" });
        if (!db.objectStoreNames.contains("livesessions")) db.createObjectStore("livesessions", { keyPath:"key" });
        if (!db.objectStoreNames.contains("playerphotos")) db.createObjectStore("playerphotos", { keyPath:"key" });
        if (!db.objectStoreNames.contains("scenarios")) db.createObjectStore("scenarios", { keyPath:"key" });
      };
      req.onsuccess = function(e){ resolve(e.target.result); };
      req.onerror = function(){ reject(req.error); };
    });
  }
  function dbGetAll(storeName){
    storeName = storeName || DB_STORE;
    return dbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(storeName, "readonly");
        var req = tx.objectStore(storeName).getAll();
        req.onsuccess = function(){ resolve(req.result || []); };
        req.onerror = function(){ reject(req.error); };
      });
    });
  }
  function dbPut(key, data, storeName){
    storeName = storeName || DB_STORE;
    return dbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(storeName, "readwrite");
        tx.objectStore(storeName).put({ key:key, data:data });
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }

    storeName = storeName || DB_STORE;
    return dbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(storeName, "readwrite");
        tx.objectStore(storeName).delete(key);

    });
  }
  function migrateLegacyLocalStorage(){
    var oldKeys = [];
    for (var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if (k && k.indexOf(LEGACY_PREFIX)===0) oldKeys.push(k);
    }
    if (!oldKeys.length) return Promise.resolve();
    return Promise.all(oldKeys.map(function(k){
      try {
        var data = JSON.parse(localStorage.getItem(k));
        return dbPut(k, data).then(function(){ localStorage.removeItem(k); });
      } catch(e){ return Promise.resolve(); }
    }));
  }

            canvas.width = Math.round(img.naturalWidth*scale);
            canvas.height = Math.round(img.naturalHeight*scale);
            var ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        if (svgUnitX < 0) return;
        var xPct = clamp((svgUnitX/VB_W)*100, 0, 100);
        var yPct = clamp(((e.clientY-svgRect.top)/svgRect.height)*100, 0, 100);

      else { state.outcomeFilter[f] = !state.outcomeFilter[f]; if (!FILTERABLE.some(function(id){return state.outcomeFilter[id];})) state.outcomeFilter[f] = true; }
      var filterRowScrollLeft = document.getElementById("outcome-filter-row") ? document.getElementById("outcome-filter-row").scrollLeft : 0;
      render();

    }
    else if (action==="start-delivery"){ state.pendingDelivery = { xPct:null, yPct:null, wagonX:null, wagonY:null, shotType:null, dismissal:null, footwork:null, beaten:false, ballCondition:state.conditions.ballCondition||"", stage:"mark-pitch" }; render(); }
    else if (action==="repeat-last-ball"){

      render();
    }
    else if (action==="cancel-delivery"){ state.pendingDelivery = null; render(); }
    else if (action==="go-back"){
      if (!state.pendingDelivery) return;
      var stageOrder = ["mark-pitch","awaiting-shot","shot-type","outcome","dismissal"];

        var r = wrapEl.getBoundingClientRect();
        state.pendingDelivery.stage = "outcome";
        state.pendingDelivery.px = window.innerWidth/2 - 98; state.pendingDelivery.py = window.innerHeight/2 - 63;
        state.pendingDelivery.wrapW = window.innerWidth; state.pendingDelivery.wrapH = window.innerHeight;

    }
    else if (action==="skip-shottype"){
      var pdSk = state.pendingDelivery;
      if (pdSk && pdSk.stage==="shot-type"){
        pdSk.shotType = null;
        pdSk.stage = "outcome";
        render();
      }
    }
    else if (action==="set-footwork"){
      if (state.pendingDelivery){ state.pendingDelivery.footwork = state.pendingDelivery.footwork===el.getAttribute("data-footwork") ? null : el.getAttribute("data-footwork"); render(); }
    }
    else if (action==="toggle-beaten"){

    }
    else if (action==="commit-shottype"){
      var pdS = state.pendingDelivery;
      if (pdS && pdS.stage==="shot-type"){
        pdS.shotType = el.getAttribute("data-shottype");
        pdS.stage = "outcome";
        render();

    }
    else if (action==="commit-delivery"){
      var pd = state.pendingDelivery;
      if (pd && pd.stage==="outcome"){
        var outcomeId = el.getAttribute("data-outcome");
        if (outcomeId==="W"){
          pd.outcome = "W";
          pd.stage = "dismissal";
          render();
        } else {
          var bp1 = currentBowlerProfile();
          var drillHit1 = evaluateDrillHit(pd);
          cb().balls.push({ id:uid(), xPct:pd.xPct, yPct:pd.yPct, wagonX:pd.wagonX, wagonY:pd.wagonY, shotType:pd.shotType, outcome:outcomeId, dismissal:null, footwork:pd.footwork, beaten:!!pd.beaten, ballCondition:pd.ballCondition||"", drillHit:drillHit1, bowlArm:bp1.bowlArm, bowlPace:bp1.bowlPace, bowlSpin:bp1.bowlSpin, bowlSide:bp1.bowlSide, t:Date.now() });
          state.pendingDelivery = freshPendingDelivery(); autoSaveSession(); render();
        }
      }
    }
    else if (action==="commit-dismissal"){
      var pd2 = state.pendingDelivery;
      if (pd2 && pd2.stage==="dismissal"){

        var drillHit2 = evaluateDrillHit(pd2);
        cb().balls.push({ id:uid(), xPct:pd2.xPct, yPct:pd2.yPct, wagonX:pd2.wagonX, wagonY:pd2.wagonY, shotType:pd2.shotType, outcome:"W", dismissal:el.getAttribute("data-dismissal"), footwork:pd2.footwork, beaten:!!pd2.beaten, ballCondition:pd2.ballCondition||"", drillHit:drillHit2, bowlArm:bp2.bowlArm, bowlPace:bp2.bowlPace, bowlSpin:bp2.bowlSpin, bowlSide:bp2.bowlSide, t:Date.now() });
        state.pendingDelivery = freshPendingDelivery(); autoSaveSession(); render();

    else if (action==="remove-ball"){ var id = el.getAttribute("data-id"); cb().balls = cb().balls.filter(function(b){return b.id!==id;}); render(); }
    else if (action==="undo"){ cb().balls = cb().balls.slice(0,-1); render(); }
    else if (action==="clear"){ if (cb().balls.length && confirm("Clear all balls for "+(cb().name||"this batter")+"?")){ cb().balls = []; render(); } }
    else if (action==="save"){
      var anyNamed = Object.values(state.batters).some(function(b){return b.name && b.name.trim();});
      if (!anyNamed){ state.status = "Add at least one batter name before saving."; render(); setTimeout(function(){ state.status=""; render(); }, 2500); return; }
      if (!state.sessionKey) state.sessionKey = "battingsession:"+state.sessionDate+":"+Date.now();
      var payload = { date: state.sessionDate, batters: state.batters, bowlerRoster: state.bowlerRoster, conditions: state.conditions, savedAt: Date.now() };
      state.status = "Saving…"; render();
      dbPut(state.sessionKey, payload).then(function(){
        state.status = "Session saved."; render(); setTimeout(function(){ state.status=""; render(); }, 2500);
      }).catch(function(){
        state.status = "Couldn't save — try again."; render(); setTimeout(function(){ state.status=""; render(); }, 2500);
      });
    }
    else if (action==="load-open"){
      state.showLoad = true; render();

    }
    else if (action==="load-close"){ state.showLoad = false; render(); }
    else if (action==="load-session"){
      var key = el.getAttribute("data-key");
      var rec = savedSessionsCache.find(function(r){ return r.key===key; });
      try {
        var data = rec ? rec.data : null;
        if (!data) throw new Error("not found");
        state.sessionDate = data.date || state.sessionDate;
        if (data.batters) {
          state.batters = data.batters;
          Object.values(state.batters).forEach(function(b){
            if (!b.balls) b.balls = [];
            b.balls.forEach(function(ball){ if (ball.wagonX===undefined) ball.wagonX=null; if (ball.wagonY===undefined) ball.wagonY=null; if (ball.shotType===undefined) ball.shotType=null; if (ball.bowlSpin===undefined) ball.bowlSpin=null; });
          });

        state.bowlerRoster = data.bowlerRoster || {};
        state.conditions = data.conditions || { weather:"", pitch:"" };
        state.currentBowlerId = Object.keys(state.bowlerRoster)[0] || null;

    else if (action==="export"){
      var payload = { date: state.sessionDate, batters: state.batters, exportedAt: new Date().toISOString() };

    else if (action==="share-all"){ shareAllBatters(); }

  function loadSvgAsImage(svgString){
    return new Promise(function(resolve, reject){
      var blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function(){ resolve({ img:img, url:url }); };
      img.onerror = function(err){ reject(err); };
      img.src = url;
    });
  }

  function shareBlob(blob, fname){
    var file;
    try { file = new File([blob], fname, { type: "image/png" }); } catch (e) { file = null; }
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: "Batting Impact Map", text: fname }).catch(function(){});
    } else {
      var dlUrl = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = dlUrl; a.download = fname;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(dlUrl);
    }
  }

  function shareCurrentChart(){
    var batter = cb();
    var isCombined = state.idleView!=="pitch";
    var svgString = isCombined
      ? groundSvgMarkup(batter, batter.balls, null, null, true)
      : pitchSvgMarkup(batter, state.viewMode, batter.balls, null, null, true);
    var chartW = isCombined ? GW_SIZE : VB_W_TOTAL;
    var chartH = isCombined ? GW_SIZE : VB_H;

    loadSvgAsImage(svgString).then(function(res){
      var scale = 2.5, padTop = 96, padSide = 20, padBottom = 24;
      var canvas = document.createElement("canvas");
      canvas.width = (chartW + padSide*2) * scale;
      canvas.height = (chartH + padTop + padBottom) * scale;
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#0a1420";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.scale(scale, scale);
      ctx.fillStyle = "#e0ab2c";
      ctx.font = "700 19px Poppins, sans-serif";
      ctx.fillText((batter.name || "Batter") + " — " + (isCombined ? "Outcomes & Wagon Wheel" : "Pitch Map"), padSide, 30);
      ctx.fillStyle = "#8b96a5";
      ctx.font = "500 11.5px Inter, sans-serif";
      ctx.fillText(state.sessionDate + "  ·  " + batter.hand + "  ·  ProCoach OS", padSide, 48);

      ctx.fillStyle = "#eef2f6";
      ctx.font = "600 12.5px Inter, sans-serif";
      var st = statsFor(batter.balls);
      ctx.fillText(batter.balls.length + " balls  ·  " + st.totalRuns + " runs  ·  SR " + st.strikeRate.toFixed(0) + "  ·  " + st.dismissals + " out", padSide, 70);

      ctx.drawImage(res.img, padSide, padTop, chartW, chartH);
      URL.revokeObjectURL(res.url);
      canvas.toBlob(function(blob){
        var fname = "battingmap-" + (isCombined?"wagon-":"") + (batter.name || "batter").trim().toLowerCase().replace(/\s+/g, "-") + "-" + state.sessionDate + ".png";
        shareBlob(blob, fname);
      }, "image/png");
    }).catch(function(){ state.status = "Couldn't generate image."; render(); setTimeout(function(){ state.status=""; render(); }, 2500); });

  function shareAllBatters(){
    var ids = Object.keys(state.batters);
    if (!ids.length) return;
    var aspect = VB_W_TOTAL / VB_H;
    var cellChartW = 168, cellChartH = Math.round(cellChartW / aspect);
    var headerH = 30, colGap = 16, rowGap = 22, padSide = 20, padTop = 64, padBottom = 24;
    var columns = ids.length > 1 ? 2 : 1;
    var rows = Math.ceil(ids.length / columns);
    var scale = 2.2;
    var canvasW = padSide*2 + columns*cellChartW + (columns-1)*colGap;
    var canvasH = padTop + rows*(headerH+cellChartH) + (rows-1)*rowGap + padBottom;

    Promise.all(ids.map(function(id){
      var b = state.batters[id];
      return loadSvgAsImage(pitchSvgMarkup(b, state.viewMode, b.balls, null, null, true)).then(function(res){ return { id:id, batter:b, res:res }; });
    })).then(function(results){
      var canvas = document.createElement("canvas");
      canvas.width = canvasW * scale; canvas.height = canvasH * scale;
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#0a1420"; ctx.fillRect(0,0,canvas.width, canvas.height);
      ctx.scale(scale, scale);
      ctx.fillStyle = "#e0ab2c";
      ctx.font = "700 20px Poppins, sans-serif";
      ctx.fillText("Full Session — Batting Impact Maps", padSide, 28);
      ctx.fillStyle = "#8b96a5";
      ctx.font = "500 11.5px Inter, sans-serif";
      ctx.fillText(state.sessionDate + "  ·  " + ids.length + " batters  ·  ProCoach OS", padSide, 46);

      results.forEach(function(r, i){
        var col = i % columns, row = Math.floor(i / columns);
        var x = padSide + col*(cellChartW+colGap);
        var y = padTop + row*(headerH+cellChartH+rowGap);
        var st = statsFor(r.batter.balls);
        ctx.fillStyle = "#eef2f6";
        ctx.font = "700 12.5px Poppins, sans-serif";
        ctx.fillText(r.batter.name || "Batter", x, y+12);
        ctx.fillStyle = "#8b96a5";
        ctx.font = "500 9.5px Inter, sans-serif";
        ctx.fillText(r.batter.balls.length+"b · "+st.totalRuns+"r · SR "+st.strikeRate.toFixed(0)+" · "+st.dismissals+" out", x, y+24);
        ctx.drawImage(r.res.img, x, y+headerH, cellChartW, cellChartH);
        URL.revokeObjectURL(r.res.url);
      });

      canvas.toBlob(function(blob){
        shareBlob(blob, "battingmap-session-" + state.sessionDate + ".png");
      }, "image/png");
    }).catch(function(){ state.status = "Couldn't generate the combined image."; render(); setTimeout(function(){ state.status=""; render(); }, 2500); });
  }

  function shareSimpleSummary(){
    var batter = cb();
    var st = statsFor(batter.balls);
    var W = 400, H = 460, scale = 2.5;
    var canvas = document.createElement("canvas");
    canvas.width = W*scale; canvas.height = H*scale;
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#0a1420"; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.scale(scale, scale);

    ctx.fillStyle = "#e0ab2c"; ctx.font = "800 24px Poppins, sans-serif";
    ctx.fillText(batter.name || "Batter", 24, 42);
    ctx.fillStyle = "#8b96a5"; ctx.font = "500 12px Inter, sans-serif";
    var metaBits = [state.sessionDate, batter.hand];
    if (state.conditions.weather) metaBits.push(state.conditions.weather);
    if (state.conditions.pitch) metaBits.push(state.conditions.pitch);
    ctx.fillText(metaBits.join("  ·  "), 24, 60);

    var stats = [["Balls",batter.balls.length],["Runs",st.totalRuns],["Strike rate",st.strikeRate.toFixed(0)],["Dismissals",st.dismissals],["Boundaries",st.boundaries],["Dot ball %",st.dotPct.toFixed(0)+"%"]];
    var colW = (W-48)/2, rowH = 74, startY = 92;
    stats.forEach(function(s, i){
      var col = i%2, row = Math.floor(i/2);
      var x = 24 + col*colW, y = startY + row*rowH;
      ctx.strokeStyle = "rgba(255,255,255,0.08)"; ctx.lineWidth = 1;
      ctx.strokeRect(x, y, colW-10, rowH-10);
      ctx.fillStyle = "#eef2f6"; ctx.font = "800 26px Poppins, sans-serif";
      ctx.fillText(String(s[1]), x+14, y+38);
      ctx.fillStyle = "#8b96a5"; ctx.font = "600 10px Inter, sans-serif";
      ctx.fillText(s[0].toUpperCase(), x+14, y+56);
    });

    var insightY = startY + 3*rowH + 14;
    ctx.fillStyle = "#e0ab2c"; ctx.font = "700 12px Poppins, sans-serif";
    ctx.fillText("KEY TAKEAWAYS", 24, insightY);
    ctx.fillStyle = "#eef2f6"; ctx.font = "400 12.5px Inter, sans-serif";
    var lines = [];
    var dismissals = batter.balls.filter(function(b){return b.outcome==="W";});
    if (dismissals.length){
      var shotAtOut = {}; dismissals.forEach(function(b){ var s=b.shotType||"unclear shot"; shotAtOut[s]=(shotAtOut[s]||0)+1; });
      var topShot = Object.keys(shotAtOut).sort(function(a,b){return shotAtOut[b]-shotAtOut[a];})[0];
      lines.push("Most dismissals came playing the "+topShot.toLowerCase()+".");
    } else {
      lines.push("No dismissals this session.");
    }
    var beatenCount = batter.balls.filter(function(b){return b.beaten;}).length;
    if (beatenCount>0) lines.push("Beaten "+beatenCount+" time"+(beatenCount===1?"":"s")+" (" + Math.round((beatenCount/batter.balls.length)*100) + "% of balls faced).");
    if (state.activeDrill && batter.balls.some(function(b){return b.drillHit!==null && b.drillHit!==undefined;})){
      var db = batter.balls.filter(function(b){return b.drillHit!==null && b.drillHit!==undefined;});
      var dh = db.filter(function(b){return b.drillHit;}).length;
      lines.push('"'+state.activeDrill.name+'" drill: '+dh+'/'+db.length+' ('+Math.round((dh/db.length)*100)+'%).');
    }
    var ly = insightY + 20;
    lines.slice(0,4).forEach(function(line){
      var wrapped = wrapCanvasText(ctx, line, W-48);
      wrapped.forEach(function(wl){ ctx.fillText(wl, 24, ly); ly += 17; });
      ly += 4;
    });

    canvas.toBlob(function(blob){
      shareBlob(blob, "summary-" + (batter.name||"batter").trim().toLowerCase().replace(/\s+/g,"-") + "-" + state.sessionDate + ".png");
    }, "image/png");
  }
  function wrapCanvasText(ctx, text, maxWidth){
    var words = text.split(" "), lines = [], line = "";
    words.forEach(function(w){
      var test = line ? line+" "+w : w;
      if (ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w; }
      else line = test;
    });
    if (line) lines.push(line);
    return lines;
  }

  // ===== All-time player report — reads every saved session, combines =====
  // ===== this player's balls, and reuses the exact same statsFor/SVG   =====
  // ===== drawing functions as the normal single-session print report. =====
  function loadAllTimeBallsForBatter(playerName){
    return new Promise(function(resolve){
      var target = String(playerName||"").trim().toLowerCase();
      if (!target){ resolve(null); return; }
      try{
        var req = indexedDB.open("procoachos", 4);
        req.onerror = function(){ resolve(null); };
        req.onsuccess = function(){
          try{
            var idb = req.result;
            if (!idb.objectStoreNames.contains("battingsessions")){ resolve(null); return; }
            var tx = idb.transaction("battingsessions", "readonly");
            var getAllReq = tx.objectStore("battingsessions").getAll();
            getAllReq.onerror = function(){ resolve(null); };
            getAllReq.onsuccess = function(){
              var records = getAllReq.result || [];
              var allBalls = [];
              var profile = null;
              records.forEach(function(rec){
                var data = rec && rec.data;
                if (!data || !data.batters) return;
                Object.keys(data.batters).forEach(function(bid){
                  var b = data.batters[bid];
                  if (!b || !b.name || b.name.trim().toLowerCase() !== target) return;
                  allBalls = allBalls.concat(b.balls || []);
                  profile = b;
                });
              });
              if (!allBalls.length){ resolve(null); return; }
              resolve({ name: profile.name, hand: profile.hand, balls: allBalls });
            };
          }catch(e){ resolve(null); }
        };
      }catch(e){ resolve(null); }
    });
  }

        { label:"Left-arm spin", balls: b.balls.filter(function(ball){return ball.bowlArm==="LA" && ball.bowlSpin==="Off-spin";}) },
        { label:"Right-arm leg-spin", balls: b.balls.filter(function(ball){return ball.bowlArm==="RA" && ball.bowlSpin==="Leg-spin";}) },
        { label:"Chinaman", balls: b.balls.filter(function(ball){return ball.bowlArm==="LA" && ball.bowlSpin==="Leg-spin";}) },
      ].filter(function(r){return r.balls.length>0;}));
      html += '<div class="pr-section-title">Ball condition</div>';
      html += printOutcomeColumnsTable(["New","Semi","Old"].map(function(bc){ return { label:bc, balls: b.balls.filter(function(ball){return ball.ballCondition===bc;}) }; }).filter(function(r){return r.balls.length>0;}));
      var ballsWithOversAT = withOvers(b.balls);
      html += '<div class="pr-section-title">By ball in over</div>';
      html += printOutcomeColumnsTable([1,2,3,4,5,6].map(function(n){ return { label:"Ball "+n, balls: ballsWithOversAT.filter(function(ball){return ball.ballNo===n;}) }; }).filter(function(r){return r.balls.length>0;}));
      var dismissalsList = b.balls.filter(function(ball){return ball.outcome==="W";});
      html += '<div class="pr-section-title">Dismissal map (all sessions combined)</div><table class="pr-table"><tr><th>Dismissal</th><th>Shot</th><th>Length</th><th>Line</th><th>Bowling faced</th></tr>';
      dismissalsList.forEach(function(ball){
        var lz = lengthZoneFor(ball.yPct), ln = lineLabel(ball.xPct, b.hand);
        html += '<tr><td>'+esc(ball.dismissal||"Out")+'</td><td>'+esc(ball.shotType||"\u2014")+'</td><td>'+lz.label+'</td><td>'+ln+'</td><td>'+bowlTypeLabel(ball)+'</td></tr>';
      });
      if (dismissalsList.length===0) html += '<tr><td colspan="5">No dismissals logged.</td></tr>';
      html += '</table>';
      html += '<div class="pr-section-title">Delivery log (all sessions combined)</div><table class="pr-table"><tr><th>Outcome</th><th>Shot</th><th>Length</th><th>Line</th><th>Bowling faced</th></tr>';
      b.balls.forEach(function(ball){
        var o = outcomeMap[ball.outcome], lz = lengthZoneFor(ball.yPct), ln = lineLabel(ball.xPct, b.hand);
        var outcomeTxt = o.label + (ball.outcome==="W" && ball.dismissal ? " ("+ball.dismissal+")" : "");
        html += '<tr><td>'+esc(outcomeTxt)+'</td><td>'+esc(ball.shotType||"\u2014")+'</td><td>'+lz.label+'</td><td>'+ln+'</td><td>'+bowlTypeLabel(ball)+'</td></tr>';
      });
      html += '</table></div>';
      container.innerHTML = html;
    });
  }
  function printReport(){
    var ids = Object.keys(state.batters);
    var container = document.getElementById("print-report");
    var html = "";
    dbGetAll("playerphotos").catch(function(){ return []; }).then(function(photoRecords){
      var photosByKey = {};
      photoRecords.forEach(function(r){ photosByKey[r.key] = r.data; });

      ids.forEach(function(id){
      var b = state.batters[id];
      var st = statsFor(b.balls);
      var pitchSvg = pitchSvgMarkup(b, "dots", b.balls, null, null, true);
      var groundSvg = groundSvgMarkup(b, b.balls, null, null, true);

      html += '<div class="pr-batter">';
      html += '<div class="pr-head"><h1>'+esc(b.name||"Batter")+' — Batting Report</h1><div class="pr-meta">'+esc(state.sessionDate)+' &middot; '+b.hand+(state.conditions.weather||state.conditions.pitch?(' &middot; '+esc([state.conditions.weather,state.conditions.pitch].filter(Boolean).join(", "))):'')+' &middot; ProCoach OS</div></div>';

      html += '<div class="pr-stats">';
      var beatenCountP = b.balls.filter(function(ball){return ball.beaten;}).length;
      var beatenPctP = b.balls.length ? Math.round((beatenCountP/b.balls.length)*100) : 0;
      [["Total balls",b.balls.length],["Runs",st.totalRuns],["Strike rate",st.strikeRate.toFixed(0)],["Dismissals",st.dismissals],["Dot ball %",st.dotPct.toFixed(0)+"%"],["Boundaries",st.boundaries],["Beaten %",beatenPctP+"%"]].forEach(function(s){
        html += '<div class="pr-stat"><b>'+s[1]+'</b>'+s[0]+'</div>';
      });
      html += '</div>';

      html += '<div class="pr-charts">'+pitchSvg+groundSvg+'</div>';

      html += '<div class="pr-section-title">Length faced</div>';
      html += printOutcomeColumnsTable(LENGTH_ZONES.map(function(z){ return { label:z.label, balls: b.balls.filter(function(ball){return lengthZoneFor(ball.yPct).id===z.id;}) }; }));

      var lineLabels = b.hand==="LHB" ? LINE_LABELS_LHB : LINE_LABELS_RHB;
      html += '<div class="pr-section-title">Line faced ('+(b.hand==="LHB"?"left-hand":"right-hand")+" batter's view)</div>";
      html += printOutcomeColumnsTable(lineLabels.map(function(label,i){ return { label:label, balls: b.balls.filter(function(ball){return lineZoneIndex(ball.xPct)===i;}) }; }));

      html += '<div class="pr-section-title">Footwork</div>';
      html += printOutcomeColumnsTable([
        { label:"Front-foot", balls: b.balls.filter(function(ball){return ball.footwork==="Front-foot";}) },
        { label:"Back-foot", balls: b.balls.filter(function(ball){return ball.footwork==="Back-foot";}) },
        { label:"Step down", balls: b.balls.filter(function(ball){return ball.footwork==="Step down";}) },
        { label:"No movement", balls: b.balls.filter(function(ball){return ball.footwork==="No movement";}) },
      ].filter(function(r){return r.balls.length>0;}));

      html += '<div class="pr-section-title">Shot type</div>';
      html += printOutcomeColumnsTable(SHOT_TYPES.map(function(s){ return { label:s, balls: b.balls.filter(function(ball){return ball.shotType===s;}) }; }).filter(function(r){return r.balls.length>0;}));

      html += '<div class="pr-section-title">Bowling type faced</div>';
      html += printOutcomeColumnsTable([
        { label:"Right-arm pace", balls: b.balls.filter(function(ball){return ball.bowlArm==="RA" && ball.bowlPace==="Pace";}) },
        { label:"Left-arm pace", balls: b.balls.filter(function(ball){return ball.bowlArm==="LA" && ball.bowlPace==="Pace";}) },
        { label:"Right-arm off-spin", balls: b.balls.filter(function(ball){return ball.bowlArm==="RA" && ball.bowlSpin==="Off-spin";}) },
        { label:"Left-arm spin", balls: b.balls.filter(function(ball){return ball.bowlArm==="LA" && ball.bowlSpin==="Off-spin";}) },
        { label:"Right-arm leg-spin", balls: b.balls.filter(function(ball){return ball.bowlArm==="RA" && ball.bowlSpin==="Leg-spin";}) },
        { label:"Chinaman", balls: b.balls.filter(function(ball){return ball.bowlArm==="LA" && ball.bowlSpin==="Leg-spin";}) },
      ].filter(function(r){return r.balls.length>0;}));

      html += '<div class="pr-section-title">Ball condition</div>';
      html += printOutcomeColumnsTable(["New","Semi","Old"].map(function(bc){ return { label:bc, balls: b.balls.filter(function(ball){return ball.ballCondition===bc;}) }; }).filter(function(r){return r.balls.length>0;}));

      var ballsWithOversPrint = withOvers(b.balls);
      html += '<div class="pr-section-title">By ball in over</div>';
      html += printOutcomeColumnsTable([1,2,3,4,5,6].map(function(n){ return { label:"Ball "+n, balls: ballsWithOversPrint.filter(function(ball){return ball.ballNo===n;}) }; }).filter(function(r){return r.balls.length>0;}));

      var dismissals = withOvers(b.balls).filter(function(ball){return ball.outcome==="W";});
      html += '<div class="pr-section-title">Dismissal map</div><table class="pr-table"><tr><th>Ball</th><th>Dismissal</th><th>Shot</th><th>Length</th><th>Line</th><th>Bowling faced</th></tr>';
      dismissals.forEach(function(ball){
        var lz = lengthZoneFor(ball.yPct), ln = lineLabel(ball.xPct, b.hand);
        html += '<tr><td>'+ball.over+'.'+ball.ballNo+'</td><td>'+esc(ball.dismissal||"Out")+'</td><td>'+esc(ball.shotType||"—")+'</td><td>'+lz.label+'</td><td>'+ln+'</td><td>'+bowlTypeLabel(ball)+'</td></tr>';
      });
      if (dismissals.length===0) html += '<tr><td colspan="6">No dismissals logged.</td></tr>';
      html += '</table>';

      html += '<div class="pr-section-title">Delivery log</div><table class="pr-table"><tr><th>Ball</th><th>Outcome</th><th>Shot</th><th>Length</th><th>Line</th><th>Bowling faced</th></tr>';
      withOvers(b.balls).forEach(function(ball){
        var o = outcomeMap[ball.outcome], lz = lengthZoneFor(ball.yPct), ln = lineLabel(ball.xPct, b.hand);
        var outcomeTxt = o.label + (ball.outcome==="W" && ball.dismissal ? " ("+ball.dismissal+")" : "");
        html += '<tr><td>'+ball.over+'.'+ball.ballNo+'</td><td>'+esc(outcomeTxt)+'</td><td>'+esc(ball.shotType||"—")+'</td><td>'+lz.label+'</td><td>'+ln+'</td><td>'+bowlTypeLabel(ball)+'</td></tr>';
      });
      html += '</table>';

      var batterPhotos = photosByKey[keyName(b.name)] || [];
      if (batterPhotos.length > 0){
        html += '<div class="pr-section-title">Stance &amp; grip log</div><div class="pr-photo-grid">';
        batterPhotos.forEach(function(p){
          html += '<img class="pr-photo" src="'+p.dataUrl+'">';
        });
        html += '</div>';
      }

      html += '</div>';
    });
    container.innerHTML = html;
    setTimeout(function(){ window.print(); }, 60);
    });
  }

  if (!isPremiumUser()){
    showPremiumLockedMessage();
  } else {
    var urlParams = new URLSearchParams(window.location.search);
    var reportPlayer = urlParams.get("player");
    if (reportPlayer){
      renderAllTimePlayerReport(reportPlayer);
    } else {
      render();
    }
    migrateLegacyLocalStorage().catch(function(){});
    dbGetAll("bowlerprofiles").then(function(records){
      records.forEach(function(r){ globalBowlerDirectory[r.key] = r.data; });
    }).catch(function(){});
    initPlayerAutocomplete(["input-batter"]);
  }
})();
</script>
