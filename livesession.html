<html lang="en">

  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  html, body { margin: 0; height: 100%; background: #0a1420; }
  #app {
    --bg:#0a1420; --card:#111d30; --card-border:rgba(255,255,255,0.07);

  .pm-title{font-size:19px;font-weight:800;color:var(--accent);letter-spacing:-0.01em;font-family:'Poppins',sans-serif;}
  .pm-subtitle{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-dim);font-weight:600;}

  .pm-callout{background:var(--accent-dim);border:1px solid var(--accent);border-radius:14px;padding:10px 13px;font-size:12.5px;line-height:1.5;color:var(--text);margin-top:8px;}

  .pm-bowler-editor-row{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}

  #print-report{display:none;}

    html, body { background: #fff !important; }
    body * { visibility: hidden; }
    #print-report, #print-report * { visibility: visible; }
    #print-report{ display:block; position:absolute; left:0; top:0; width:100%; background:#fff; color:#141414; font-family:Arial,Helvetica,sans-serif; }

    .pr-charts{ display:flex; gap:18px; align-items:flex-start; margin-bottom:14px; }

    .pr-table th{ background:#eef2f6; }
    .pr-title{ font-size:20px; font-weight:800; color:#24507a; margin-bottom:2px; }
    .pr-sub{ font-size:11px; color:#555; margin-bottom:14px; }
  }
</style>
<script>// ===== Shared player roster bridge (reads the main ProCoach OS app's =====
// ===== active coach profile — read-only, fails silently if anything =====
// ===== is missing so these tools keep working exactly as before.    =====
var _mainAppPlayerNamesCache=null;
function loadMainAppPlayerNames(){
 return new Promise(function(resolve){
  try{
   var profiles=null;
   try{profiles=JSON.parse(localStorage.getItem("coachbook_profiles"))}catch(e){}
   if(!Array.isArray(profiles)||!profiles.length){resolve([]);return}
   var activeId=localStorage.getItem("coachbook_active_profile")||"default";
   var profile=profiles.find(function(p){return p.id===activeId})||profiles[0];
   if(!profile||!profile.key){resolve([]);return}
   var req=indexedDB.open("coachbook_idb");
   req.onerror=function(){resolve([])};
   req.onsuccess=function(){
    try{
     var idb=req.result;
     if(!idb.objectStoreNames.contains("profiles")){resolve([]);return}
     var tx=idb.transaction("profiles","readonly");
     var getReq=tx.objectStore("profiles").get(profile.key);
     getReq.onerror=function(){resolve([])};
     getReq.onsuccess=function(){
      var db=getReq.result;
      var names=(db&&Array.isArray(db.players))?db.players.map(function(p){return p.name}).filter(Boolean):[];
      resolve(Array.from(new Set(names)).sort());
     };
    }catch(e){resolve([])}
   };
  }catch(e){resolve([])}
 });
}
// Call once on page load, passing whichever input id(s) this page currently
// has on screen — loads and caches the roster, populates the datalist, and
// (since this resolves after the very first render already happened) also
// attaches the input(s) itself once the data is actually ready.
function initPlayerAutocomplete(inputIds){
 loadMainAppPlayerNames().then(function(names){
  _mainAppPlayerNamesCache=names;
  if(!names.length)return;
  var dl=document.getElementById("mainAppPlayerList");
  if(!dl){dl=document.createElement("datalist");dl.id="mainAppPlayerList";document.body.appendChild(dl)}
  dl.innerHTML=names.map(function(n){return '<option value="'+n.replace(/&/g,"&amp;").replace(/"/g,"&quot;")+'">'}).join("");
  if(inputIds&&inputIds.length)attachPlayerAutocomplete(inputIds);
 });
}
// Call after every render — cheap, synchronous, no IndexedDB access.
// Safe to call even before initPlayerAutocomplete resolves (does nothing yet).
function attachPlayerAutocomplete(inputIds){
 if(!_mainAppPlayerNamesCache||!_mainAppPlayerNamesCache.length)return;
 inputIds.forEach(function(id){
  var el=document.getElementById(id);
  if(el&&!el.hasAttribute("list"))el.setAttribute("list","mainAppPlayerList");
 });
}
</script>
<script>// ===== Premium gate — Analysis Tools are a Premium-only feature.     =====
// ===== Reads the same coachbook_license value app.html already uses =====
// ===== so the rule is defined in exactly one place, not duplicated   =====
// ===== with different logic per file.                                =====
function isPremiumUser(){
  // Checks production AND both isolated testing-build keys, since a
  // testing-premium build of app.html never writes to the production
  // key at all — checking only that key would wrongly block a real
  // premium-testing session.
  var keys = ["coachbook_license", "coachbook_license_testing_premium", "coachbook_license_testing_basic"];
  for (var i=0; i<keys.length; i++){
    try{
      var raw = JSON.parse(localStorage.getItem(keys[i]));
      if (raw && (raw.status === "premium" || raw.status === "trial")) return true;
    }catch(e){}
  }
  return false;
}

    '<div style="max-width:420px">' +
    '<div style="font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:#e0ab2c;margin-bottom:14px">ANALYSIS TOOLS &middot; PREMIUM FEATURE</div>' +
    '<h1 style="font-size:24px;margin:0 0 14px;font-weight:800">This tool requires a Premium plan</h1>' +
    '<p style="color:#a7b0bc;font-size:14px;line-height:1.6;margin:0 0 22px">Pitch Map, Batting Map, Live Session and Insights are part of the Premium plan. Start a free trial or upgrade in ProCoach OS to unlock them.</p>' +
    '<a href="app.html" style="display:inline-block;background:linear-gradient(135deg,#22c58b,#1fae7a);color:#062016;font-weight:800;padding:12px 24px;border-radius:11px;text-decoration:none">Go to ProCoach OS &rarr;</a>' +
    '</div></div>';
}
</script>

<script>
(function(){
  var OUTCOMES = [
    { id:"dot", label:"Dot", runs:0, color:"#7d93a3" },
    { id:"1", label:"1 run", runs:1, color:"#4fb87a" },
    { id:"2", label:"2 runs", runs:2, color:"#2ec4c4" },
    { id:"3", label:"3 runs", runs:3, color:"#c9793d" },
    { id:"4", label:"FOUR", runs:4, color:"#3d8bd6" },
    { id:"6", label:"SIX", runs:6, color:"#e0ab2c" },
    { id:"W", label:"Wicket", runs:0, color:"#ff6b52" },
    { id:"wd", label:"Wide", runs:1, color:"#b98ce0" },
    { id:"nb", label:"No ball", runs:1, color:"#b98ce0" },
  ];
  var outcomeMap = {}; OUTCOMES.forEach(function(o){ outcomeMap[o.id] = o; });
  outcomeMap["_none"] = { id:"_none", label:"Pitched (no outcome)", runs:0, color:"#eef2f6" };
  var BALL_POSITION_COLORS = ["#ff6b52","#e0ab2c","#4fb87a","#2ec4c4","#3d8bd6","#b98ce0"];
  function ballPositionColor(ballNo){
    var idx = ((ballNo||1)-1) % BALL_POSITION_COLORS.length;
    return BALL_POSITION_COLORS[idx];
  }

  var DISMISSAL_TYPES = ["Bowled","Caught","LBW","Stumped","Run out","Hit wicket","Other"];
  var SHOT_TYPES = ["Leave","Defend","Drive","Cut","Pull/Hook","Sweep","Flick","Loft","Edge","Other"];
  var SPIN_TYPES = ["Off-spin","Leg-spin"];

  var PITCH_LENGTH_M = 20.12;
  var LENGTH_ZONES = [
    { id:"yorker", label:"Yorker", from:0, to:1 },
    { id:"full", label:"Full", from:1, to:3 },
    { id:"good", label:"Good length", from:3, to:6 },
    { id:"short", label:"Short", from:6, to:9 },
    { id:"bouncer", label:"Bouncer", from:9, to:PITCH_LENGTH_M },
  ];
  var VB_W = 200, VB_H = 600, RULER_W = 36, VB_W_TOTAL = VB_W + RULER_W;
  var LINE_ZONES = [
    { from:0,   to:58  },{ from:58,  to:79  },{ from:79,  to:93  },
    { from:93,  to:107 },{ from:107, to:121 },{ from:121, to:142 },{ from:142, to:200 },
  ];
  var LINE_LABELS_RHB = ["Outside off","Just outside off","Off","Middle","Leg","Just outside leg","Outside leg"];
  var LINE_LABELS_LHB = ["Outside leg","Just outside leg","Leg","Middle","Off","Just outside off","Outside off"];
  var POPPING_CREASE_M = 1.22, CREASE_HALF_W = 23;
  var GW_SIZE = 320, GW_CX = 160, GW_CY = 160, GW_R = 144, GW_INNER_R = 61;
  var MINI_PITCH_LEN = 50, MINI_PITCH_W = 15;
  var BAT_Y = GW_CY - MINI_PITCH_LEN/2;

  function lengthZoneFor(yPct){
    var d = (yPct/100)*PITCH_LENGTH_M;
    for (var i=0;i<LENGTH_ZONES.length;i++){ var z=LENGTH_ZONES[i]; if (d>=z.from && d<z.to) return z; }
    return LENGTH_ZONES[LENGTH_ZONES.length-1];
  }
  function lineZoneIndex(xPct){
    var x = (xPct/100)*VB_W;
    for (var i=0;i<LINE_ZONES.length;i++){ if (x>=LINE_ZONES[i].from && x<LINE_ZONES[i].to) return i; }
    return LINE_ZONES.length-1;
  }
  function lineLabel(xPct, hand){ return (hand==="LHB"?LINE_LABELS_LHB:LINE_LABELS_RHB)[lineZoneIndex(xPct)]; }
  function clamp(n,lo,hi){ return Math.max(lo, Math.min(hi, n)); }
  function uid(){ return Math.random().toString(36).slice(2,10); }
  function freshPendingDelivery(){
    return { xPct:null, yPct:null, wagonX:null, wagonY:null, shotType:null, footwork:null, dismissal:null, ballCondition:state.conditions.ballCondition||"", stage:"mark-pitch" };
  }
  function hasWagon(b){ return b.wagonX!==null && b.wagonX!==undefined; }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
  function keyName(n){ return (n||"").trim().toLowerCase(); }
  function bowlTypeText(b){
    if (b.bowlPace==="Spin" && b.bowlSpin && b.bowlArm==="LA"){
      return b.bowlSpin==="Off-spin" ? "Left-arm spin" : "Chinaman";
    }
    return b.bowlArm+" "+(b.bowlPace==="Spin"&&b.bowlSpin ? b.bowlSpin : b.bowlPace);

  function declutterPitch(balls){
    var pts = balls.map(function(b){ return Object.assign({}, b, { x:(b.xPct/100)*VB_W, y:(b.yPct/100)*VB_H }); });
    var buckets = {};
    pts.forEach(function(b){
      var key = Math.round(b.x/13)+"_"+Math.round(b.y/13);
      (buckets[key] = buckets[key] || []).push(b);
    });
    var out = [];
    Object.keys(buckets).forEach(function(key){
      var group = buckets[key], n = group.length;
      var cx = group.reduce(function(s,g){return s+g.x;},0)/n;
      var cy = group.reduce(function(s,g){return s+g.y;},0)/n;
      group.forEach(function(b,i){
        if (n===1){ out.push(Object.assign({}, b, { dx:b.x, dy:b.y })); return; }
        var ring = Math.floor(i/7)+1;
        var posInRing = i%7;
        var countInRing = Math.min(7, n-Math.floor(i/7)*7);
        var angle = (2*Math.PI*posInRing)/countInRing - Math.PI/2;
        var r = 7.5*ring;
        out.push(Object.assign({}, b, {
          dx: clamp(cx + r*Math.cos(angle)*0.55, 5, VB_W-5),
          dy: clamp(cy + r*Math.sin(angle), 14, VB_H-14),
        }));
      });
    });
    return out;
  }
  function withOvers(balls){
    var legit = 0;
    return balls.map(function(b){
      var over = Math.floor(legit/6), ballNo = (legit%6)+1;
      if (b.outcome!=="wd" && b.outcome!=="nb") legit++;
      return Object.assign({}, b, { over:over, ballNo:ballNo });
    });
  }
  function statsFor(balls){
    var legit = balls.filter(function(b){return b.outcome!=="wd" && b.outcome!=="nb";});
    var totalRuns = balls.reduce(function(s,b){return s+outcomeMap[b.outcome].runs;},0);
    var wickets = balls.filter(function(b){return b.outcome==="W";}).length;
    var dots = balls.filter(function(b){return b.outcome==="dot";}).length;
    var boundaries = balls.filter(function(b){return b.outcome==="4"||b.outcome==="6";}).length;
    var economy = legit.length ? (totalRuns/legit.length)*6 : 0;
    var strikeRate = legit.length ? (totalRuns/legit.length)*100 : 0;
    var dotPct = legit.length ? (dots/legit.length)*100 : 0;
    return { legit:legit, totalRuns:totalRuns, wickets:wickets, dismissals:wickets, dots:dots, boundaries:boundaries, economy:economy, strikeRate:strikeRate, dotPct:dotPct };
  }
  function popoverStyle(p, POP_W, POP_H){
    var left = p.px+12, top = p.py+12;
    if (left+POP_W > p.wrapW-6) left = p.px-POP_W-12;
    if (top+POP_H > p.wrapH-6) top = p.py-POP_H-12;
    left = clamp(left, 4, Math.max(4, p.wrapW-POP_W-4));
    top = clamp(top, 4, Math.max(4, p.wrapH-POP_H-4));
    return { left:left, top:top };
  }

  function maybeRotateStrike(runsThisBall, isLegit){
    if (!state.nonStrikerBatterId) return; // only rotate when batting in a pair

  // ---------- IndexedDB (shared "procoachos" database) ----------
  function dbOpen(){
    return new Promise(function(resolve, reject){
      var req = indexedDB.open("procoachos", 4);
      req.onupgradeneeded = function(e){
        var db = e.target.result;
        if (!db.objectStoreNames.contains("pitchsessions")) db.createObjectStore("pitchsessions", { keyPath:"key" });
        if (!db.objectStoreNames.contains("battingsessions")) db.createObjectStore("battingsessions", { keyPath:"key" });
        if (!db.objectStoreNames.contains("bowlerprofiles")) db.createObjectStore("bowlerprofiles", { keyPath:"key" });
        if (!db.objectStoreNames.contains("livesessions")) db.createObjectStore("livesessions", { keyPath:"key" });
        if (!db.objectStoreNames.contains("playerphotos")) db.createObjectStore("playerphotos", { keyPath:"key" });
        if (!db.objectStoreNames.contains("scenarios")) db.createObjectStore("scenarios", { keyPath:"key" });
      };
      req.onsuccess = function(e){ resolve(e.target.result); };
      req.onerror = function(){ reject(req.error); };
    });
  }
  function dbGetAll(storeName){
    return dbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(storeName, "readonly");
        var req = tx.objectStore(storeName).getAll();
        req.onsuccess = function(){ resolve(req.result || []); };
        req.onerror = function(){ reject(req.error); };
      });
    });
  }
  function dbPut(key, data, storeName){
    return dbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(storeName, "readwrite");
        tx.objectStore(storeName).put({ key:key, data:data });
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }
  function dbDelete(key, storeName){
    return dbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(storeName, "readwrite");
        tx.objectStore(storeName).delete(key);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }
  var savedSessionsCache = [];
  function refreshSavedSessions(){
    return dbGetAll("livesessions").then(function(records){
      records.sort(function(a,b){ return b.key.localeCompare(a.key); });

      return records;
    });
  }
  function autoSaveSession(){
    if (!Object.keys(state.bowlerRoster).length && !Object.keys(state.batterRoster).length) return;

    if (!state.sessionKey) state.sessionKey = "livesession:"+state.sessionDate+":"+Date.now();
    var payload = { date: state.sessionDate, bowlerRoster: state.bowlerRoster, batterRoster: state.batterRoster, deliveries: state.deliveries, fieldPlacements: state.fieldPlacements, format: state.format, conditions: state.conditions, chase: state.chase, loadedScenarioName: state.loadedScenarioName, savedAt: Date.now() };

  function visibleDeliveries(){

    else if (state.viewFilter==="batter" && state.currentBatterId) out = state.deliveries.filter(function(d){return d.batterId===state.currentBatterId;});
    else if (state.viewFilter==="all") out = state.deliveries.slice();
    else out = state.deliveries.filter(function(d){return d.bowlerId===state.currentBowlerId && d.batterId===state.currentBatterId;});
    if (state.phaseFilter!=="all") out = out.filter(function(d){return d.phase===state.phaseFilter;});
    return out;

      });
      html += '<div class="pm-seam"></div>';
      html += '<div class="pm-bowler-editor-row"><div class="pm-label">Save current setup as</div><input class="pm-input" id="scenario-name-input" placeholder="e.g. Death overs pressure" value="'+esc(state.scenarioNameDraft)+'"></div>';
      html += '<div class="pm-btn-row"><button class="pm-btn" data-action="save-scenario">Save current setup</button><button class="pm-btn secondary" data-action="close-scenario-picker">Close</button></div>';
      html += '</div></div>';

    if (state.showLoad){
      var keys = savedSessionsCache;
      html += '<div class="pm-modal-backdrop"><div class="pm-modal"><div class="pm-panel-title">Saved sessions</div><div class="pm-load-list">';
      if (keys.length===0) html += '<div style="font-size:12px;color:var(--text-dim)">Nothing saved yet.</div>';
      keys.forEach(function(rec){
        var d3 = rec.data || {};
        html += '<div class="pm-load-row"><span>'+esc(d3.date||"")+' &middot; '+(d3.deliveries||[]).length+' balls</span><span style="display:flex;gap:6px;"><button class="pm-btn secondary" style="padding:8px 12px" data-action="load-session" data-key="'+esc(rec.key)+'">Load</button><button class="pm-x-btn" data-action="delete-session" data-key="'+esc(rec.key)+'">&#128465;</button></span></div>';
      });

    app.innerHTML = html;

    var popoverEl = document.querySelector(".pm-popover");
    if (popoverEl){
      var pr = popoverEl.getBoundingClientRect();
      var margin = 4, vw = window.innerWidth, vh = window.innerHeight;
      var newLeft = pr.left, newTop = pr.top;
      if (pr.right > vw-margin) newLeft = pr.left - (pr.right-(vw-margin));
      if (pr.bottom > vh-margin) newTop = pr.top - (pr.bottom-(vh-margin));
      if (newLeft < margin) newLeft = margin;
      if (newTop < margin) newTop = margin;
      if (newLeft !== pr.left) popoverEl.style.left = newLeft+"px";
      if (newTop !== pr.top) popoverEl.style.top = newTop+"px";
    }

    var dateInput = document.getElementById("input-date");
    dateInput.addEventListener("input", function(){ state.sessionDate = dateInput.value; state.sessionKey = null; });

    }

        if (remembered && !state.editingBowlerId){
          state.bowlerDraft.bowlArm = remembered.bowlArm;
          state.bowlerDraft.bowlPace = remembered.bowlPace;
          state.bowlerDraft.bowlSpin = remembered.bowlSpin || "Off-spin";

          if (reInput){ reInput.focus(); reInput.setSelectionRange(reInput.value.length, reInput.value.length); }

    attachPlayerAutocomplete(["batter-adder-input"]);

    if (canStart && pd && pd.stage==="mark-pitch"){
      var svg2 = document.getElementById("pitch-svg2");
      svg2.addEventListener("click", function(e){
        var svgRect = svg2.getBoundingClientRect();
        var svgUnitX = ((e.clientX-svgRect.left)/svgRect.width)*VB_W_TOTAL - RULER_W;
        if (svgUnitX < 0) return;
        var xPct = clamp((svgUnitX/VB_W)*100, 0, 100);
        var yPct = clamp(((e.clientY-svgRect.top)/svgRect.height)*100, 0, 100);
        state.pendingDelivery.xPct = xPct; state.pendingDelivery.yPct = yPct;
        state.pendingDelivery.stage = "awaiting-shot";
        render();
      });
    } else if (canStart && pd && pd.stage==="awaiting-shot"){
      var gsvg = document.getElementById("ground-svg");
      gsvg.addEventListener("click", function(e){
        var wrap = document.getElementById("combo-wrap");
        var svgRect = gsvg.getBoundingClientRect();
        var wrapRect = wrap.getBoundingClientRect();
        var gx = ((e.clientX-svgRect.left)/svgRect.width)*GW_SIZE;
        var gy = ((e.clientY-svgRect.top)/svgRect.height)*GW_SIZE;
        var dx = gx-GW_CX, dy = gy-GW_CY;
        var dist = Math.sqrt(dx*dx+dy*dy);
        if (dist > GW_R){ var k = GW_R/dist; gx = GW_CX+dx*k; gy = GW_CY+dy*k; }
        state.pendingDelivery.wagonX = gx; state.pendingDelivery.wagonY = gy;
        state.pendingDelivery.stage = state.pendingDelivery.repeatingContext ? "outcome" : "shot-type";
        state.pendingDelivery.px = e.clientX; state.pendingDelivery.py = e.clientY;
        state.pendingDelivery.wrapW = window.innerWidth; state.pendingDelivery.wrapH = window.innerHeight;
        render();
      });
    } else if (state.mode==="field"){
      var fsvg = document.getElementById("field-svg");
      if (fsvg){
        fsvg.style.touchAction = "none";
        var dragIndex = -1, dragMoved = false;
        function fieldPoint(e){
          var svgRect = fsvg.getBoundingClientRect();
          var fx = ((e.clientX-svgRect.left)/svgRect.width)*GW_SIZE;
          var fy = ((e.clientY-svgRect.top)/svgRect.height)*GW_SIZE;
          var dx = fx-GW_CX, dy = fy-GW_CY;
          var dist = Math.sqrt(dx*dx+dy*dy);
          if (dist > GW_R){ var k = GW_R/dist; fx = GW_CX+dx*k; fy = GW_CY+dy*k; }
          return { x:fx, y:fy };
        }
        fsvg.addEventListener("pointerdown", function(e){
          var p = fieldPoint(e);
          var nearest = -1, nearestDist = 17;
          state.pendingField.forEach(function(f, idx){
            var d = Math.sqrt((f.x-p.x)*(f.x-p.x) + (f.y-p.y)*(f.y-p.y));
            if (d < nearestDist){ nearestDist = d; nearest = idx; }
          });
          dragMoved = false;
          if (nearest>=0){
            dragIndex = nearest;
            fsvg.setPointerCapture(e.pointerId);
          } else if (state.pendingField.length < 9){
            state.pendingField.push({ x:p.x, y:p.y });
            dragIndex = state.pendingField.length-1;
            state.loadedFieldId = null;
            fsvg.setPointerCapture(e.pointerId);
            render();
          }
        });
        fsvg.addEventListener("pointermove", function(e){
          if (dragIndex < 0) return;
          dragMoved = true;
          state.loadedFieldId = null;
          var p = fieldPoint(e);
          state.pendingField[dragIndex].x = p.x;
          state.pendingField[dragIndex].y = p.y;
          var marker = document.getElementById("field-marker-"+dragIndex);
          if (marker){ marker.setAttribute("cx", p.x); marker.setAttribute("cy", p.y); }
        });
        function endDrag(e){
          if (dragIndex >= 0){
            try { fsvg.releasePointerCapture(e.pointerId); } catch(err){}
            dragIndex = -1;
            if (dragMoved) render();
          }
        }
        fsvg.addEventListener("pointerup", endDrag);
        fsvg.addEventListener("pointercancel", endDrag);
      }
    }
  }

  function commitFullDelivery(pd, outcomeId, dismissalType){
    var bowler = curBowler(), batter = curBatter();
    state.deliveries.push({
      id: uid(), xPct:pd.xPct, yPct:pd.yPct, wagonX:pd.wagonX, wagonY:pd.wagonY, shotType:pd.shotType, footwork:pd.footwork||null, outcome:outcomeId, dismissal:dismissalType||null, ballCondition:pd.ballCondition||"",
      bowlerId: state.currentBowlerId, bowlerName: bowler?bowler.name:"Unknown", bowlArm: bowler?bowler.bowlArm:"RA", bowlPace: bowler?bowler.bowlPace:"Pace", bowlSpin: bowler?bowler.bowlSpin:null, bowlSide: bowler?bowler.bowlSide:"Over",
      batterId: state.currentBatterId, batterName: batter?batter.name:"Unknown", batterHand: batter?batter.hand:"RHB",
      format: state.format, phase: state.currentPhase,
      t: Date.now()
    });
    var isLegit = outcomeId!=="wd" && outcomeId!=="nb";
    maybeRotateStrike(outcomeMap[outcomeId].runs, isLegit);
  }

  app.addEventListener("click", function(e){
    if (e.target.classList && e.target.classList.contains("pm-modal-backdrop")){
      state.showLoad = false; state.showBowlerEditor = false; render(); return;
    }
    var el = e.target.closest("[data-action]");
    if (!el){
      if (state.openDetailChip && !e.target.closest(".pm-detail-chip-wrap")){ state.openDetailChip = null; render(); }
      return;
    }
    var action = el.getAttribute("data-action");
    if (state.openDetailChip && action!=="toggle-detail-chip"){ state.openDetailChip = null; }

    if (action==="select-bowler"){ state.currentBowlerId = el.getAttribute("data-id"); render(); }
    else if (action==="select-batter"){ state.currentBatterId = el.getAttribute("data-id"); render(); }
    else if (action==="toggle-detail-chip"){
      var chipId = el.getAttribute("data-chip");
      state.openDetailChip = state.openDetailChip===chipId ? null : chipId;
      render();
    }
    else if (action==="set-footwork"){
      if (state.pendingDelivery){ state.pendingDelivery.footwork = state.pendingDelivery.footwork===el.getAttribute("data-footwork") ? null : el.getAttribute("data-footwork"); render(); }
    }
    else if (action==="add-batter"){
      state.batterAdderDraft = "";
      state.showBatterAdder = true; render();
    }
    else if (action==="save-batter-adder"){
      var inputEl = document.getElementById("batter-adder-input");
      var rawName = inputEl ? inputEl.value : "";
      var names = rawName.split(",").map(function(n){return n.trim();}).filter(function(n){return n;});
      if (names.length===0){ state.showBatterAdder = false; render(); return; }
      var lastId = null;
      names.forEach(function(n){ var id = uid(); state.batterRoster[id] = { name:n, hand:"RHB" }; lastId = id; });
      state.currentBatterId = lastId;
      state.showBatterAdder = false; render();
    }
    else if (action==="close-batter-adder"){ state.showBatterAdder = false; render(); }
    else if (action==="set-hand"){ if (curBatter()) curBatter().hand = el.getAttribute("data-hand"); render(); }
    else if (action==="open-bowler-editor"){
      var editId = el.getAttribute("data-id") || null;
      state.editingBowlerId = editId;
      if (editId && state.bowlerRoster[editId]){
        var existing = state.bowlerRoster[editId];
        state.bowlerDraft = { name:existing.name, bowlArm:existing.bowlArm, bowlPace:existing.bowlPace, bowlSpin:existing.bowlSpin||"Off-spin", bowlSide:existing.bowlSide };
      } else {
        state.bowlerDraft = { name:"", bowlArm:"RA", bowlPace:"Pace", bowlSpin:"Off-spin", bowlSide:"Over" };
      }
      state.showBowlerEditor = true; render();
    }
    else if (action==="close-bowler-editor"){ state.showBowlerEditor = false; state.bowlerDraft = null; render(); }
    else if (action==="open-chase-setup"){ state.showChaseSetup = true; render(); }
    else if (action==="close-chase-setup"){ state.showChaseSetup = false; render(); }
    else if (action==="start-chase"){
      var runsInput = document.getElementById("chase-runs"), oversInput = document.getElementById("chase-overs");
      var targetRuns = parseInt(runsInput ? runsInput.value : 20, 10) || 20;
      var targetOvers = parseInt(oversInput ? oversInput.value : 4, 10) || 4;
      state.chase = { targetRuns:targetRuns, targetOvers:targetOvers };
      state.showChaseSetup = false; render();
    }
    else if (action==="end-chase"){ state.chase = null; render(); }
    else if (action==="open-conditions"){ state.showConditions = true; render(); }
    else if (action==="close-conditions"){ state.showConditions = false; render(); }
    else if (action==="set-weather"){ var wv = el.getAttribute("data-val"); state.conditions.weather = state.conditions.weather===wv?"":wv; render(); }
    else if (action==="set-pitchtype"){ var pv = el.getAttribute("data-val"); state.conditions.pitch = state.conditions.pitch===pv?"":pv; render(); }
    else if (action==="set-ballcondition"){
      var bcv = el.getAttribute("data-val");
      // Sticky, same as PitchMap/BattingMap -- a re-tap of the same value
      // must not silently clear tagging for every subsequent delivery.
      state.conditions.ballCondition = bcv;

      var id = state.editingBowlerId || uid();

        state.currentPhase = FORMAT_PHASES[state.format][0];
        state.phaseFilter = "all"; state.pendingField = []; state.loadedFieldId = null;
        state.currentBowlerId = Object.keys(state.bowlerRoster)[0] || null;
        state.currentBatterId = Object.keys(state.batterRoster)[0] || null;
        state.nonStrikerBatterId = null; state.chase = data.chase || null;
        state.loadedScenarioName = data.loadedScenarioName || null;

        state.showSetup = false; state.showMoreActions = false;

    }
    else if (action==="export"){
      var payload = { date: state.sessionDate, bowlerRoster: state.bowlerRoster, batterRoster: state.batterRoster, deliveries: state.deliveries, fieldPlacements: state.fieldPlacements, format: state.format, conditions: state.conditions, chase: state.chase, loadedScenarioName: state.loadedScenarioName, exportedAt: new Date().toISOString() };

  });

  function loadSvgAsImage(svgString){
    return new Promise(function(resolve, reject){
      var blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function(){ resolve({ img:img, url:url }); };
      img.onerror = function(err){ reject(err); };
      img.src = url;
    });
  }
  function shareBlob(blob, fname){
    var file;
    try { file = new File([blob], fname, { type: "image/png" }); } catch (e) { file = null; }
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: "Live Session", text: fname }).catch(function(){});
    } else {
      var dlUrl = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = dlUrl; a.download = fname;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(dlUrl);
    }
  }
  function shareCurrentChart(){
    var visible = visibleDeliveries();
    var isCombined = !(state.mode==="combined" && state.idleView==="pitch" && !state.pendingDelivery);
    var hand = curBatter() ? curBatter().hand : "RHB";
    var svgString = isCombined ? groundSvgMarkup(hand, visible, null, null, true) : pitchSvgMarkup(state.viewMode, visible, null, null, true);
    var chartW = isCombined ? GW_SIZE : VB_W_TOTAL;
    var chartH = isCombined ? GW_SIZE : VB_H;
    loadSvgAsImage(svgString).then(function(res){
      var scale = 2.5, padTop = 96, padSide = 20, padBottom = 24;
      var canvas = document.createElement("canvas");
      canvas.width = (chartW + padSide*2) * scale; canvas.height = (chartH + padTop + padBottom) * scale;
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#0a1420"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.scale(scale, scale);
      ctx.fillStyle = "#9b6bd6"; ctx.font = "700 19px Poppins, sans-serif";
      var bn = curBowler()?curBowler().name:"—", btn = curBatter()?curBatter().name:"—";
      ctx.fillText(bn+" vs "+btn, padSide, 30);
      ctx.fillStyle = "#8b96a5"; ctx.font = "500 11.5px Inter, sans-serif";
      ctx.fillText(state.sessionDate + "  ·  ProCoach OS Live Session", padSide, 48);
      var st = statsFor(visible);
      ctx.fillStyle = "#eef2f6"; ctx.font = "600 12.5px Inter, sans-serif";
      ctx.fillText(visible.length + " balls  ·  " + st.totalRuns + " runs  ·  econ " + st.economy.toFixed(1) + "  ·  " + st.dismissals + " out", padSide, 70);
      ctx.drawImage(res.img, padSide, padTop, chartW, chartH);
      URL.revokeObjectURL(res.url);
      canvas.toBlob(function(blob){ shareBlob(blob, "livesession-"+state.sessionDate+".png"); }, "image/png");
    }).catch(function(){ state.status = "Couldn't generate image."; render(); setTimeout(function(){ state.status=""; render(); }, 2500); });
  }
  // ===== All-time player report — reads every saved session, combines =====
  // ===== this player's deliveries (as bowler AND/OR batter), and      =====
  // ===== reuses the same statsFor/SVG drawing functions as the        =====
  // ===== normal single-session print report. Phase breakdown is       =====
  // ===== skipped here since phases are format-specific and different =====
  // ===== sessions could use different formats.                       =====
  function loadAllTimeDeliveriesFor(playerName){
    return new Promise(function(resolve){
      var target = String(playerName||"").trim().toLowerCase();
      if (!target){ resolve({bowling:null,batting:null}); return; }
      try{
        var req = indexedDB.open("procoachos", 4);
        req.onerror = function(){ resolve({bowling:null,batting:null}); };
        req.onsuccess = function(){
          try{
            var idb = req.result;
            if (!idb.objectStoreNames.contains("livesessions")){ resolve({bowling:null,batting:null}); return; }
            var tx = idb.transaction("livesessions", "readonly");
            var getAllReq = tx.objectStore("livesessions").getAll();
            getAllReq.onerror = function(){ resolve({bowling:null,batting:null}); };
            getAllReq.onsuccess = function(){
              var records = getAllReq.result || [];
              var bowlBalls = [], batBalls = [], bowlName = null, batName = null;
              records.forEach(function(rec){
                var data = rec && rec.data;
                if (!data || !Array.isArray(data.deliveries)) return;
                data.deliveries.forEach(function(d){
                  if (!d) return;
                  if (d.bowlerName && d.bowlerName.trim().toLowerCase()===target){ bowlBalls.push(d); bowlName = d.bowlerName; }
                  if (d.batterName && d.batterName.trim().toLowerCase()===target){ batBalls.push(d); batName = d.batterName; }
                });
              });
              resolve({
                bowling: bowlBalls.length ? { name: bowlName, balls: bowlBalls } : null,
                batting: batBalls.length ? { name: batName, hand: batBalls[0].batterHand, balls: batBalls } : null
              });
            };
          }catch(e){ resolve({bowling:null,batting:null}); }
        };
      }catch(e){ resolve({bowling:null,batting:null}); }
    });
  }

        var batBallsWithOversAT = withOvers(bballs);

        html += printOutcomeColumnsTable([1,2,3,4,5,6].map(function(n){ return { label:"Ball "+n, balls: batBallsWithOversAT.filter(function(d){return d.ballNo===n;}) }; }).filter(function(r){return r.balls.length>0;}));
        html += '<div class="pr-section-title">Footwork</div>';
        html += printOutcomeColumnsTable([
          { label:"Front-foot", balls: bballs.filter(function(d){return d.footwork==="Front-foot";}) },
          { label:"Back-foot", balls: bballs.filter(function(d){return d.footwork==="Back-foot";}) },
          { label:"Step down", balls: bballs.filter(function(d){return d.footwork==="Step down";}) },
          { label:"No movement", balls: bballs.filter(function(d){return d.footwork==="No movement";}) },
        ].filter(function(r){return r.balls.length>0;}));
        html += '<table class="pr-table"><tr><th>Bowler</th><th>Outcome</th><th>Length</th><th>Line</th></tr>';
        bballs.forEach(function(d){
          var o = outcomeMap[d.outcome], lz = lengthZoneFor(d.yPct), ln = lineLabel(d.xPct, bb.hand);
          var ot = o.label + (d.outcome==="W"&&d.dismissal?" ("+d.dismissal+")":"");
          html += '<tr><td>'+esc(d.bowlerName||"\u2014")+'</td><td>'+esc(ot)+'</td><td>'+lz.label+'</td><td>'+ln+'</td></tr>';
        });
        html += '</table></div>';
      }
      container.innerHTML = html;
    });
  }
  function printReport(){
    var bowlerIds = Object.keys(state.bowlerRoster);
    var batterIds = Object.keys(state.batterRoster);
    var container = document.getElementById("print-report");
    var html = "";
    var scoreP = sessionScore();
    var condBits = [state.conditions.weather, state.conditions.pitch].filter(Boolean).join(", ");
    html += '<div class="pr-player"><div class="pr-title">Live Session Summary</div><div class="pr-sub">'+esc(state.sessionDate)+(condBits?(' &middot; '+esc(condBits)):'')+' &middot; ProCoach OS</div>';
    html += '<div class="pr-stats"><div class="pr-stat"><b>'+scoreP.runs+'/'+scoreP.wickets+'</b>Score</div><div class="pr-stat"><b>'+scoreP.overs+'.'+scoreP.ballsIntoOver+'</b>Overs</div><div class="pr-stat"><b>'+state.deliveries.length+'</b>Total balls</div></div>';
    if (state.loadedScenarioName) html += '<div style="font-size:11px;color:#555;margin-top:6px;">Scenario: '+esc(state.loadedScenarioName)+'</div>';
    if (state.chase){
      var scRep = sessionScore();
      var ballsRemRep = Math.max(0, state.chase.targetOvers*6 - (scRep.overs*6+scRep.ballsIntoOver));
      var runsNeedRep = Math.max(0, state.chase.targetRuns - scRep.runs);
      var doneRep = runsNeedRep<=0, failedRep = !doneRep && ballsRemRep<=0;
      var chaseResultTxt = doneRep ? ('Chased it down! '+scRep.runs+'/'+state.chase.targetRuns+' with '+ballsRemRep+' ball'+(ballsRemRep===1?"":"s")+' to spare.')
        : failedRep ? ('Fell short. Finished '+scRep.runs+'/'+state.chase.targetRuns+' — needed '+runsNeedRep+' more.')
        : ('Chasing '+state.chase.targetRuns+' off '+state.chase.targetOvers+' overs — currently '+scRep.runs+', needs '+runsNeedRep+' off '+ballsRemRep+' ball'+(ballsRemRep===1?"":"s")+'.');
      html += '<div style="font-size:11px;color:'+(doneRep?"#1a7a4a":failedRep?"#a02020":"#555")+';margin-top:6px;font-weight:'+(doneRep||failedRep?"700":"400")+';">Target chase: '+chaseResultTxt+'</div>';
    }
    html += '</div>';
    bowlerIds.forEach(function(id){
      var b = state.bowlerRoster[id];
      var balls = state.deliveries.filter(function(d){return d.bowlerId===id;});
      var st = statsFor(balls);
      html += '<div class="pr-player"><div class="pr-title">'+esc(b.name)+' — Bowling</div><div class="pr-sub">'+esc(state.sessionDate)+' &middot; '+bowlTypeLabel(b)+' &middot; ProCoach OS Live Session</div>';
      html += '<div class="pr-stats">';
      [["Total balls",balls.length],["Runs",st.totalRuns],["Economy",st.economy.toFixed(1)],["Strike rate",st.strikeRate.toFixed(0)],["Dismissals",st.dismissals],["Boundaries",st.boundaries]].forEach(function(s){ html += '<div class="pr-stat"><b>'+s[1]+'</b>'+s[0]+'</div>'; });
      html += '</div>';
      var bowlHandCounts = {}; balls.forEach(function(d){ bowlHandCounts[d.batterHand] = (bowlHandCounts[d.batterHand]||0)+1; });
      var bowlChartHand = (bowlHandCounts.LHB||0) > (bowlHandCounts.RHB||0) ? "LHB" : "RHB";
      var bowlPitchSvg = pitchSvgMarkup("dots", balls, null, null, true);
      var bowlGroundSvg = groundSvgMarkup(bowlChartHand, balls, null, null, true);
      html += '<div class="pr-charts">'+bowlPitchSvg+bowlGroundSvg+'</div>';
      html += '<div class="pr-section-title">Length</div>';
      html += printOutcomeColumnsTable(LENGTH_ZONES.map(function(z){ return { label:z.label, balls: balls.filter(function(d){return lengthZoneFor(d.yPct).id===z.id;}) }; }));
      var bowlLineLabels = bowlChartHand==="LHB" ? LINE_LABELS_LHB : LINE_LABELS_RHB;
      html += '<div class="pr-section-title">Line</div>';
      html += printOutcomeColumnsTable(bowlLineLabels.map(function(label,i){ return { label:label, balls: balls.filter(function(d){return lineZoneIndex(d.xPct)===i;}) }; }));
      html += '<div class="pr-section-title">By phase</div>';
      html += printOutcomeColumnsTable(FORMAT_PHASES[state.format].map(function(p){ return { label:p, balls: balls.filter(function(d){return d.phase===p;}) }; }));
      html += '<div class="pr-section-title">Ball condition</div>';
      html += printOutcomeColumnsTable(["New","Semi","Old"].map(function(bc){ return { label:bc, balls: balls.filter(function(d){return d.ballCondition===bc;}) }; }).filter(function(r){return r.balls.length>0;}));
      var bowlBallsWithOversP = withOvers(balls);
      html += '<div class="pr-section-title">By ball in over</div>';
      html += printOutcomeColumnsTable([1,2,3,4,5,6].map(function(n){ return { label:"Ball "+n, balls: bowlBallsWithOversP.filter(function(d){return d.ballNo===n;}) }; }).filter(function(r){return r.balls.length>0;}));
      html += '<table class="pr-table"><tr><th>Ball</th><th>vs</th><th>Outcome</th><th>Length</th><th>Line</th><th>Phase</th></tr>';
      withOvers(balls).forEach(function(d){
        var o = outcomeMap[d.outcome], lz = lengthZoneFor(d.yPct), ln = lineLabel(d.xPct, d.batterHand);
        var ot = o.label + (d.outcome==="W"&&d.dismissal?" ("+d.dismissal+")":"");
        html += '<tr><td>'+d.over+'.'+d.ballNo+'</td><td>'+esc(d.batterName)+'</td><td>'+esc(ot)+'</td><td>'+lz.label+'</td><td>'+ln+'</td><td>'+esc(d.phase||"—")+'</td></tr>';
      });
      html += '</table></div>';
    });
    batterIds.forEach(function(id){
      var b = state.batterRoster[id];
      var balls = state.deliveries.filter(function(d){return d.batterId===id;});
      var st = statsFor(balls);
      html += '<div class="pr-player"><div class="pr-title">'+esc(b.name)+' — Batting</div><div class="pr-sub">'+esc(state.sessionDate)+' &middot; '+b.hand+' &middot; ProCoach OS Live Session</div>';
      html += '<div class="pr-stats">';
      [["Total balls",balls.length],["Runs",st.totalRuns],["Economy",st.economy.toFixed(1)],["Strike rate",st.strikeRate.toFixed(0)],["Dismissals",st.dismissals],["Boundaries",st.boundaries]].forEach(function(s){ html += '<div class="pr-stat"><b>'+s[1]+'</b>'+s[0]+'</div>'; });
      html += '</div>';
      var batPitchSvg = pitchSvgMarkup("dots", balls, null, null, true);
      var batGroundSvg = groundSvgMarkup(b.hand, balls, null, null, true);
      html += '<div class="pr-charts">'+batPitchSvg+batGroundSvg+'</div>';
      html += '<div class="pr-section-title">Length faced</div>';
      html += printOutcomeColumnsTable(LENGTH_ZONES.map(function(z){ return { label:z.label, balls: balls.filter(function(d){return lengthZoneFor(d.yPct).id===z.id;}) }; }));
      var batLineLabels = b.hand==="LHB" ? LINE_LABELS_LHB : LINE_LABELS_RHB;
      html += '<div class="pr-section-title">Line faced</div>';
      html += printOutcomeColumnsTable(batLineLabels.map(function(label,i){ return { label:label, balls: balls.filter(function(d){return lineZoneIndex(d.xPct)===i;}) }; }));
      html += '<div class="pr-section-title">Shot type</div>';
      html += printOutcomeColumnsTable(SHOT_TYPES.map(function(s){ return { label:s, balls: balls.filter(function(d){return d.shotType===s;}) }; }).filter(function(r){return r.balls.length>0;}));
      html += '<div class="pr-section-title">Bowling type faced</div>';
      html += printOutcomeColumnsTable([
        { label:"Right-arm pace", balls: balls.filter(function(d){return d.bowlArm==="RA" && d.bowlPace==="Pace";}) },
        { label:"Left-arm pace", balls: balls.filter(function(d){return d.bowlArm==="LA" && d.bowlPace==="Pace";}) },
        { label:"Right-arm off-spin", balls: balls.filter(function(d){return d.bowlArm==="RA" && d.bowlSpin==="Off-spin";}) },
        { label:"Left-arm spin", balls: balls.filter(function(d){return d.bowlArm==="LA" && d.bowlSpin==="Off-spin";}) },
        { label:"Right-arm leg-spin", balls: balls.filter(function(d){return d.bowlArm==="RA" && d.bowlSpin==="Leg-spin";}) },
        { label:"Chinaman", balls: balls.filter(function(d){return d.bowlArm==="LA" && d.bowlSpin==="Leg-spin";}) },
      ].filter(function(r){return r.balls.length>0;}));
      html += '<div class="pr-section-title">By phase</div>';
      html += printOutcomeColumnsTable(FORMAT_PHASES[state.format].map(function(p){ return { label:p, balls: balls.filter(function(d){return d.phase===p;}) }; }));
      html += '<div class="pr-section-title">Ball condition</div>';
      html += printOutcomeColumnsTable(["New","Semi","Old"].map(function(bc){ return { label:bc, balls: balls.filter(function(d){return d.ballCondition===bc;}) }; }).filter(function(r){return r.balls.length>0;}));
      var batBallsWithOversP = withOvers(balls);
      html += '<div class="pr-section-title">By ball in over</div>';
      html += printOutcomeColumnsTable([1,2,3,4,5,6].map(function(n){ return { label:"Ball "+n, balls: batBallsWithOversP.filter(function(d){return d.ballNo===n;}) }; }).filter(function(r){return r.balls.length>0;}));
      html += '<div class="pr-section-title">Footwork</div>';
      html += printOutcomeColumnsTable([
        { label:"Front-foot", balls: balls.filter(function(d){return d.footwork==="Front-foot";}) },
        { label:"Back-foot", balls: balls.filter(function(d){return d.footwork==="Back-foot";}) },
        { label:"Step down", balls: balls.filter(function(d){return d.footwork==="Step down";}) },
        { label:"No movement", balls: balls.filter(function(d){return d.footwork==="No movement";}) },
      ].filter(function(r){return r.balls.length>0;}));
      html += '<table class="pr-table"><tr><th>Ball</th><th>Bowler</th><th>Outcome</th><th>Shot</th><th>Length</th><th>Line</th><th>Phase</th></tr>';
      withOvers(balls).forEach(function(d){
        var o = outcomeMap[d.outcome], lz = lengthZoneFor(d.yPct), ln = lineLabel(d.xPct, b.hand);
        var ot = o.label + (d.outcome==="W"&&d.dismissal?" ("+d.dismissal+")":"");
        html += '<tr><td>'+d.over+'.'+d.ballNo+'</td><td>'+esc(d.bowlerName)+'</td><td>'+esc(ot)+'</td><td>'+esc(d.shotType||"—")+'</td><td>'+lz.label+'</td><td>'+ln+'</td><td>'+esc(d.phase||"—")+'</td></tr>';
      });
      html += '</table></div>';
    });
    container.innerHTML = html;
    setTimeout(function(){ window.print(); }, 60);
  }

  if (!isPremiumUser()){
    showPremiumLockedMessage();
  } else {
    var urlParams = new URLSearchParams(window.location.search);
    var reportPlayer = urlParams.get("player");
    if (reportPlayer){
      renderAllTimePlayerReport(reportPlayer);
    } else {
      render();
    }
    dbGetAll("bowlerprofiles").then(function(records){
      records.forEach(function(r){ globalBowlerDirectory[r.key] = r.data; });
    }).catch(function(){});
    dbGetAll("scenarios").then(function(records){
      globalScenarios = records.map(function(r){ return r.data; });
      if (state.showScenarioPicker) render();
    }).catch(function(){});
    initPlayerAutocomplete(["bowler-draft-name"]);
  }
})();
</script>
