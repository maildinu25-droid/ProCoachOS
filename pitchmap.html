<script>// ===== Shared player roster bridge (reads the main ProCoach OS app's =====
// ===== active coach profile — read-only, fails silently if anything =====
// ===== is missing so these tools keep working exactly as before.    =====
var _mainAppPlayerNamesCache=null;
function loadMainAppPlayerNames(){
 return new Promise(function(resolve){
  try{
   var profiles=null;
   try{profiles=JSON.parse(localStorage.getItem("coachbook_profiles"))}catch(e){}
   if(!Array.isArray(profiles)||!profiles.length){resolve([]);return}
   var activeId=localStorage.getItem("coachbook_active_profile")||"default";
   var profile=profiles.find(function(p){return p.id===activeId})||profiles[0];
   if(!profile||!profile.key){resolve([]);return}
   var req=indexedDB.open("coachbook_idb");
   req.onerror=function(){resolve([])};
   req.onsuccess=function(){
    try{
     var idb=req.result;
     if(!idb.objectStoreNames.contains("profiles")){resolve([]);return}
     var tx=idb.transaction("profiles","readonly");
     var getReq=tx.objectStore("profiles").get(profile.key);
     getReq.onerror=function(){resolve([])};
     getReq.onsuccess=function(){
      var db=getReq.result;
      var names=(db&&Array.isArray(db.players))?db.players.map(function(p){return p.name}).filter(Boolean):[];
      resolve(Array.from(new Set(names)).sort());
     };
    }catch(e){resolve([])}
   };
  }catch(e){resolve([])}
 });
}
// Call once on page load, passing whichever input id(s) this page currently
// has on screen — loads and caches the roster, populates the datalist, and
// (since this resolves after the very first render already happened) also
// attaches the input(s) itself once the data is actually ready.
function initPlayerAutocomplete(inputIds){
 loadMainAppPlayerNames().then(function(names){
  _mainAppPlayerNamesCache=names;
  if(!names.length)return;
  var dl=document.getElementById("mainAppPlayerList");
  if(!dl){dl=document.createElement("datalist");dl.id="mainAppPlayerList";document.body.appendChild(dl)}
  dl.innerHTML=names.map(function(n){return '<option value="'+n.replace(/&/g,"&amp;").replace(/"/g,"&quot;")+'">'}).join("");
  if(inputIds&&inputIds.length)attachPlayerAutocomplete(inputIds);
 });
}
// Call after every render — cheap, synchronous, no IndexedDB access.
// Safe to call even before initPlayerAutocomplete resolves (does nothing yet).
function attachPlayerAutocomplete(inputIds){
 if(!_mainAppPlayerNamesCache||!_mainAppPlayerNamesCache.length)return;
 inputIds.forEach(function(id){
  var el=document.getElementById(id);
  if(el&&!el.hasAttribute("list"))el.setAttribute("list","mainAppPlayerList");
 });
}
</script>
<script>// ===== Premium gate — Analysis Tools are a Premium-only feature.     =====
// ===== Reads the same coachbook_license value app.html already uses =====
// ===== so the rule is defined in exactly one place, not duplicated   =====
// ===== with different logic per file.                                =====
function isPremiumUser(){
  // Checks production AND both isolated testing-build keys, since a
  // testing-premium build of app.html never writes to the production
  // key at all — checking only that key would wrongly block a real
  // premium-testing session.
  var keys = ["coachbook_license", "coachbook_license_testing_premium", "coachbook_license_testing_basic"];
  for (var i=0; i<keys.length; i++){
    try{
      var raw = JSON.parse(localStorage.getItem(keys[i]));
      if (raw && (raw.status === "premium" || raw.status === "trial")) return true;
    }catch(e){}
  }
  return false;
}

    '<div style="max-width:420px">' +

    '<h1 style="font-size:24px;margin:0 0 14px;font-weight:800">This tool requires a Premium plan</h1>' +
    '<p style="color:#a7b0bc;font-size:14px;line-height:1.6;margin:0 0 22px">Pitch Map, Batting Map, Live Session and Insights are part of the Premium plan. Start a free trial or upgrade in ProCoach OS to unlock them.</p>' +
    '<a href="app.html" style="display:inline-block;background:linear-gradient(135deg,#22c58b,#1fae7a);color:#062016;font-weight:800;padding:12px 24px;border-radius:11px;text-decoration:none">Go to ProCoach OS &rarr;</a>' +
    '</div></div>';
}
</script>

<script>
(function(){
  var OUTCOMES = [
    { id:"dot", label:"Dot", runs:0, color:"#7d93a3" },
    { id:"1", label:"1 run", runs:1, color:"#4fb87a" },
    { id:"2", label:"2 runs", runs:2, color:"#2ec4c4" },
    { id:"3", label:"3 runs", runs:3, color:"#c9793d" },
    { id:"4", label:"FOUR", runs:4, color:"#3d8bd6" },
    { id:"6", label:"SIX", runs:6, color:"#e0ab2c" },
    { id:"W", label:"Wicket", runs:0, color:"#ff6b52" },
    { id:"wd", label:"Wide", runs:1, color:"#b98ce0" },
    { id:"nb", label:"No ball", runs:1, color:"#b98ce0" },
  ];
  var outcomeMap = {}; OUTCOMES.forEach(function(o){ outcomeMap[o.id] = o; });
  outcomeMap["_none"] = { id:"_none", label:"Pitched (no outcome)", runs:0, color:"#eef2f6" };
  // Rainbow progression (red -> purple) so "1st ball" through "6th ball"
  // reads intuitively at a glance, without needing to check a legend.
  var BALL_POSITION_COLORS = ["#ff6b52","#e0ab2c","#4fb87a","#2ec4c4","#3d8bd6","#b98ce0"];
  function ballPositionColor(ballNo){
    var idx = ((ballNo||1)-1) % BALL_POSITION_COLORS.length;
    return BALL_POSITION_COLORS[idx];
  }
  var DISMISSAL_TYPES = ["Bowled","Caught","LBW","Stumped","Run out","Hit wicket","Other"];
  var DELIVERY_TYPES = ["Stock ball","Slower ball","Yorker","Bouncer","Wide yorker","Arm ball","Googly","Topspin","Doosra"];
  var PACE_VARIATIONS = ["Slower ball","Yorker","Bouncer","Wide yorker"];
  var SPIN_VARIATIONS = ["Arm ball","Googly","Topspin","Doosra"];
  var SPIN_TYPES = ["Off-spin","Leg-spin"];
  var BOWLING_DRILL_PRESETS = [
    { id:"yorker-off", name:"Yorker at the stumps", lengthZoneId:"yorker", lineLabel:"Off", deliveryType:null },
    { id:"good-off-corridor", name:"Good length, off-stump corridor", lengthZoneId:"good", lineLabel:"Just outside off", deliveryType:null },
    { id:"bouncer-practice", name:"Bouncer practice", lengthZoneId:"bouncer", lineLabel:null, deliveryType:"Bouncer" },
    { id:"full-and-straight", name:"Full and straight", lengthZoneId:"full", lineLabel:"Middle", deliveryType:null },
    { id:"death-wide-yorker", name:"Death-overs wide yorker", lengthZoneId:"yorker", lineLabel:"Outside off", deliveryType:"Wide yorker" },
  ];
  var FILTERABLE = OUTCOMES.map(function(o){return o.id;}).concat(["_none"]);

  var PITCH_LENGTH_M = 20.12;
  var LENGTH_ZONES = [
    { id:"yorker", label:"Yorker", from:0, to:1 },
    { id:"full", label:"Full", from:1, to:3 },
    { id:"good", label:"Good length", from:3, to:6 },
    { id:"short", label:"Short", from:6, to:9 },
    { id:"bouncer", label:"Bouncer", from:9, to:PITCH_LENGTH_M },
  ];
  // stump-anchored line zones (stumps drawn at x=86/100/114 in the SVG); left=off, right=leg for RHB
  var LINE_ZONES = [
    { from:0,   to:58  },
    { from:58,  to:79  },
    { from:79,  to:93  },
    { from:93,  to:107 },
    { from:107, to:121 },
    { from:121, to:142 },
    { from:142, to:200 },
  ];
  var LINE_LABELS_RHB = ["Outside off","Just outside off","Off","Middle","Leg","Just outside leg","Outside leg"];
  var LINE_LABELS_LHB = ["Outside leg","Just outside leg","Leg","Middle","Off","Just outside off","Outside off"];
  var VB_W = 200, VB_H = 600, RULER_W = 36, VB_W_TOTAL = VB_W + RULER_W;
  var POPPING_CREASE_M = 1.22, CREASE_HALF_W = 23;
  // ground (full field) for the combined outcomes + wagon wheel view — representational, not to scale
  var GW_SIZE = 320, GW_CX = 160, GW_CY = 160, GW_R = 144, GW_INNER_R = 61;
  var MINI_PITCH_LEN = 50, MINI_PITCH_W = 15;
  var BAT_Y = GW_CY - MINI_PITCH_LEN/2; // batter sits at the top of a pitch centered in the ground

  function lengthMeters(yPct){ return (yPct/100)*PITCH_LENGTH_M; }
  function lengthZoneFor(yPct){
    var d = lengthMeters(yPct);
    for (var i=0;i<LENGTH_ZONES.length;i++){ var z=LENGTH_ZONES[i]; if (d>=z.from && d<z.to) return z; }
    return LENGTH_ZONES[LENGTH_ZONES.length-1];
  }
  function lineZoneIndex(xPct){
    var x = (xPct/100)*VB_W;
    for (var i=0;i<LINE_ZONES.length;i++){ if (x>=LINE_ZONES[i].from && x<LINE_ZONES[i].to) return i; }
    return LINE_ZONES.length-1;
  }
  function lineLabel(xPct, hand){ return (hand==="LHB"?LINE_LABELS_LHB:LINE_LABELS_RHB)[lineZoneIndex(xPct)]; }
  function bowlTypeText(b){
    if (b.bowlPace==="Spin" && b.bowlSpin && b.bowlArm==="LA"){
      return b.bowlSpin==="Off-spin" ? "Left-arm spin" : "Chinaman";
    }
    return b.bowlArm+" "+(b.bowlPace==="Spin"&&b.bowlSpin ? b.bowlSpin : b.bowlPace);
  }
  function bowlTypeLabel(b){ return bowlTypeText(b)+" &middot; "+(b.bowlSide==="Around"?"Around the wkt":"Over the wkt"); }
  function clamp(n,lo,hi){ return Math.max(lo, Math.min(hi, n)); }
  function uid(){ return Math.random().toString(36).slice(2,10); }
  // Shared shape for a fresh, ready-to-mark delivery — used both when
  // first entering the marking view and immediately after committing a
  // ball, so the pitch is always ready for the next tap without a
  // separate "start" action in between.
  function freshPendingDelivery(){
    return { xPct:null, yPct:null, wagonX:null, wagonY:null, dismissal:null, deliveryType:null, beaten:false, ballCondition:state.conditions.ballCondition||"", stage:"mark-pitch" };
  }
  function hasWagon(b){ return b.wagonX!==null && b.wagonX!==undefined; }

  function declutterPitch(balls){
    var pts = balls.map(function(b){ return Object.assign({}, b, { x:(b.xPct/100)*VB_W, y:(b.yPct/100)*VB_H }); });
    var buckets = {};
    pts.forEach(function(b){
      var key = Math.round(b.x/13)+"_"+Math.round(b.y/13);
      (buckets[key] = buckets[key] || []).push(b);
    });
    var out = [];
    Object.keys(buckets).forEach(function(key){
      var group = buckets[key], n = group.length;
      var cx = group.reduce(function(s,g){return s+g.x;},0)/n;
      var cy = group.reduce(function(s,g){return s+g.y;},0)/n;
      group.forEach(function(b,i){
        if (n===1){ out.push(Object.assign({}, b, { dx:b.x, dy:b.y })); return; }
        var ring = Math.floor(i/7)+1;
        var posInRing = i%7;
        var countInRing = Math.min(7, n-Math.floor(i/7)*7);
        var angle = (2*Math.PI*posInRing)/countInRing - Math.PI/2;
        var r = 7.5*ring;
        out.push(Object.assign({}, b, {
          dx: clamp(cx + r*Math.cos(angle)*0.55, 5, VB_W-5),
          dy: clamp(cy + r*Math.sin(angle), 14, VB_H-14),
        }));
      });
    });
    return out;
  }
  function withOvers(balls){
    var legit = 0;
    return balls.map(function(b){
      var over = Math.floor(legit/6), ballNo = (legit%6)+1;
      if (b.outcome!=="wd" && b.outcome!=="nb") legit++;
      return Object.assign({}, b, { over:over, ballNo:ballNo });
    });
  }
  function statsFor(balls){
    var legit = balls.filter(function(b){return b.outcome!=="wd" && b.outcome!=="nb";});
    var totalRuns = balls.reduce(function(s,b){return s+outcomeMap[b.outcome].runs;},0);
    var wickets = balls.filter(function(b){return b.outcome==="W";}).length;
    var dots = balls.filter(function(b){return b.outcome==="dot";}).length;
    var boundaries = balls.filter(function(b){return b.outcome==="4"||b.outcome==="6";}).length;
    var economy = legit.length ? (totalRuns/legit.length)*6 : 0;
    var dotPct = legit.length ? (dots/legit.length)*100 : 0;
    return { legit:legit, totalRuns:totalRuns, wickets:wickets, dots:dots, boundaries:boundaries, economy:economy, dotPct:dotPct };
  }

  function popoverStyle(p, POP_W, POP_H){
    var left = p.px+12, top = p.py+12;
    if (left+POP_W > p.wrapW-6) left = p.px-POP_W-12;
    if (top+POP_H > p.wrapH-6) top = p.py-POP_H-12;
    left = clamp(left, 4, Math.max(4, p.wrapW-POP_W-4));
    top = clamp(top, 4, Math.max(4, p.wrapH-POP_H-4));
    return { left:left, top:top };
  }

  function cb(){ return state.bowlers[state.currentBowlerId]; }
  function evaluateDrillHit(pd){
    if (!state.activeDrill || pd.xPct===null || pd.yPct===null) return null;
    var d = state.activeDrill;
    var lengthOk = !d.lengthZoneId || lengthZoneFor(pd.yPct).id===d.lengthZoneId;
    var lineOk = !d.lineLabel || lineLabel(pd.xPct, cb().hand)===d.lineLabel;
    var typeOk = !d.deliveryType || pd.deliveryType===d.deliveryType;
    return lengthOk && lineOk && typeOk;
  }
  function consistencyStats(balls){
    if (!balls.length) return null;
    var lengthCounts = {}; balls.forEach(function(b){ var z=lengthZoneFor(b.yPct).id; lengthCounts[z]=(lengthCounts[z]||0)+1; });
    var modalLength = Object.keys(lengthCounts).sort(function(a,b){return lengthCounts[b]-lengthCounts[a];})[0];
    var lengthPct = Math.round((lengthCounts[modalLength]/balls.length)*100);
    var lineCounts = {}; balls.forEach(function(b){ var idx=lineZoneIndex(b.xPct); lineCounts[idx]=(lineCounts[idx]||0)+1; });
    var modalLine = Object.keys(lineCounts).sort(function(a,b){return lineCounts[b]-lineCounts[a];})[0];
    var linePct = Math.round((lineCounts[modalLine]/balls.length)*100);
    var corridorCount = balls.filter(function(b){ return lengthZoneFor(b.yPct).id===modalLength && String(lineZoneIndex(b.xPct))===modalLine; }).length;
    var corridorPct = Math.round((corridorCount/balls.length)*100);
    var modalLengthLabel = LENGTH_ZONES.find(function(z){return z.id===modalLength;}).label;
    var modalLineLabel = (cb().hand==="LHB"?LINE_LABELS_LHB:LINE_LABELS_RHB)[modalLine];
    return { lengthPct:lengthPct, linePct:linePct, corridorPct:corridorPct, modalLengthLabel:modalLengthLabel, modalLineLabel:modalLineLabel };
  }

  // ---------- IndexedDB (shared "procoachos" database across pitchmap / battingmap / insights) ----------
  var DB_STORE = "pitchsessions", LEGACY_PREFIX = "pitchsession:";
  function dbOpen(){
    return new Promise(function(resolve, reject){
      var req = indexedDB.open("procoachos", 4);
      req.onupgradeneeded = function(e){
        var db = e.target.result;
        if (!db.objectStoreNames.contains("pitchsessions")) db.createObjectStore("pitchsessions", { keyPath:"key" });
        if (!db.objectStoreNames.contains("battingsessions")) db.createObjectStore("battingsessions", { keyPath:"key" });
        if (!db.objectStoreNames.contains("bowlerprofiles")) db.createObjectStore("bowlerprofiles", { keyPath:"key" });
        if (!db.objectStoreNames.contains("livesessions")) db.createObjectStore("livesessions", { keyPath:"key" });
        if (!db.objectStoreNames.contains("playerphotos")) db.createObjectStore("playerphotos", { keyPath:"key" });
        if (!db.objectStoreNames.contains("scenarios")) db.createObjectStore("scenarios", { keyPath:"key" });
      };
      req.onsuccess = function(e){ resolve(e.target.result); };
      req.onerror = function(){ reject(req.error); };
    });
  }
  function dbGetAll(){
    return dbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(DB_STORE, "readonly");
        var req = tx.objectStore(DB_STORE).getAll();
        req.onsuccess = function(){ resolve(req.result || []); };
        req.onerror = function(){ reject(req.error); };
      });
    });
  }
  function dbPut(key, data){
    return dbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).put({ key:key, data:data });
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }
  function dbDelete(key){
    return dbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).delete(key);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }
  function migrateLegacyLocalStorage(){
    var oldKeys = [];
    for (var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if (k && k.indexOf(LEGACY_PREFIX)===0) oldKeys.push(k);
    }
    if (!oldKeys.length) return Promise.resolve();
    return Promise.all(oldKeys.map(function(k){
      try {
        var data = JSON.parse(localStorage.getItem(k));
        return dbPut(k, data).then(function(){ localStorage.removeItem(k); });

      var cd2 = state.customDrillDraft;
      cd2.name = (nameInput?nameInput.value:"").trim() || "Custom plan";
      state.activeDrill = { name:cd2.name, lengthZoneId:cd2.lengthZoneId, lineLabel:cd2.lineLabel, deliveryType:cd2.deliveryType };
      state.showDrillPicker = false; state.customDrillDraft = null; render();
    }
    else if (action==="open-conditions"){ state.showConditions = true; render(); }
    else if (action==="close-conditions"){ state.showConditions = false; render(); }
    else if (action==="set-weather"){ var wv = el.getAttribute("data-val"); state.conditions.weather = state.conditions.weather===wv?"":wv; render(); }
    else if (action==="set-pitchtype"){ var pv = el.getAttribute("data-val"); state.conditions.pitch = state.conditions.pitch===pv?"":pv; render(); }
    else if (action==="set-ballcondition"){
      var bcv = el.getAttribute("data-val");
      // Deliberately does NOT toggle off when the same value is tapped
      // again, unlike weather/pitch type. Ball condition is meant to
      // stay tagged on every subsequent delivery until changed to a
      // DIFFERENT value — a stray double-tap silently clearing it would
      // mean later balls quietly stop being tagged at all.
      state.conditions.ballCondition = bcv;
      if (state.pendingDelivery) state.pendingDelivery.ballCondition = state.conditions.ballCondition;
      state.openDetailChip = null;
      render();
    }
    else if (action==="load-session"){
      var key = el.getAttribute("data-key");
      var rec = savedSessionsCache.find(function(r){ return r.key===key; });
      try {
        var data = rec ? rec.data : null;
        if (!data) throw new Error("not found");
        state.sessionDate = data.date || state.sessionDate;
        if (data.bowlers) {
          state.bowlers = data.bowlers;
          Object.values(state.bowlers).forEach(function(b){
            if (!b.balls) b.balls = [];
            if (!b.bowlArm) b.bowlArm = "RA";
            if (!b.bowlPace) b.bowlPace = "Pace";
            if (b.bowlSpin===undefined) b.bowlSpin = null;
            if (!b.bowlSide) b.bowlSide = "Over";
            b.balls.forEach(function(ball){ if (ball.wagonX===undefined) ball.wagonX=null; if (ball.wagonY===undefined) ball.wagonY=null; });
          });
        }
        else if (data.balls) { var id2 = uid(); state.bowlers = {}; state.bowlers[id2] = { name:data.bowler||"Bowler 1", hand:data.hand||"RHB", bowlArm:"RA", bowlPace:"Pace", bowlSpin:null, bowlSide:"Over", balls:data.balls }; }
        state.currentBowlerId = Object.keys(state.bowlers)[0];
        state.conditions = data.conditions || { weather:"", pitch:"" };
        state.sessionKey = key; // continue updating this same record on future saves
        state.pendingDelivery = null; state.mode = "pitch";
        state.showLoad = false;
      } catch(err){ state.status = "Couldn't load that session."; }
      render();
    }
    else if (action==="delete-session"){
      var delKey = el.getAttribute("data-key");
      dbDelete(delKey).then(function(){ return refreshSavedSessions(); }).then(function(){ render(); });
    }
    else if (action==="export"){
      var payload = { date: state.sessionDate, bowlers: state.bowlers, exportedAt: new Date().toISOString() };
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "pitchmap-session-"+state.sessionDate+".json";
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    }
    else if (action==="share-image"){ shareCurrentChart(); }
    else if (action==="share-all"){ shareAllBowlers(); }
    else if (action==="share-summary"){ shareSimpleSummary(); }
    else if (action==="print-report"){ printReport(); }
  });

  function loadSvgAsImage(svgString){
    return new Promise(function(resolve, reject){
      var blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function(){ resolve({ img:img, url:url }); };
      img.onerror = function(err){ reject(err); };
      img.src = url;
    });
  }

  function shareBlob(blob, fname){
    var file;
    try { file = new File([blob], fname, { type: "image/png" }); } catch (e) { file = null; }
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: "Pitch Map", text: fname }).catch(function(){});
    } else {
      var dlUrl = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = dlUrl; a.download = fname;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(dlUrl);
    }
  }

  function wrapCanvasText(ctx, text, maxWidth){
    var words = text.split(" "), lines = [], line = "";
    words.forEach(function(w){
      var test = line ? line+" "+w : w;
      if (ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w; }
      else line = test;
    });
    if (line) lines.push(line);
    return lines;
  }

    var ly = insightY + 20;

      ly += 4;

    canvas.toBlob(function(blob){

  // ===== All-time player report — reads every saved session, combines =====
  // ===== this player's balls, and reuses the exact same statsFor/SVG   =====
  // ===== drawing functions as the normal single-session print report. =====
  function loadAllTimeBallsForBowler(playerName){
    return new Promise(function(resolve){
      var target = String(playerName||"").trim().toLowerCase();
      if (!target){ resolve(null); return; }
      try{
        var req = indexedDB.open("procoachos", 4);
        req.onerror = function(){ resolve(null); };
        req.onsuccess = function(){
          try{
            var idb = req.result;
            if (!idb.objectStoreNames.contains("pitchsessions")){ resolve(null); return; }
            var tx = idb.transaction("pitchsessions", "readonly");
            var getAllReq = tx.objectStore("pitchsessions").getAll();
            getAllReq.onerror = function(){ resolve(null); };
            getAllReq.onsuccess = function(){
              var records = getAllReq.result || [];
              var allBalls = [];
              var profile = null;
              records.forEach(function(rec){
                var data = rec && rec.data;
                if (!data || !data.bowlers) return;
                Object.keys(data.bowlers).forEach(function(bid){
                  var b = data.bowlers[bid];
                  if (!b || !b.name || b.name.trim().toLowerCase() !== target) return;
                  allBalls = allBalls.concat(b.balls || []);
                  profile = b;
                });
              });
              if (!allBalls.length){ resolve(null); return; }
              resolve({ name: profile.name, hand: profile.hand, bowlArm: profile.bowlArm, bowlPace: profile.bowlPace, bowlSpin: profile.bowlSpin, bowlSide: profile.bowlSide, balls: allBalls });
            };
          }catch(e){ resolve(null); }
        };
      }catch(e){ resolve(null); }
    });
  }

      b.balls.forEach(function(ball){
        var o = outcomeMap[ball.outcome], lz = lengthZoneFor(ball.yPct), ln = lineLabel(ball.xPct, b.hand);

      html += '<div style="font-size:10.5px;color:#5a6472;margin:4px 0 14px;">'+BALL_POSITION_COLORS.map(function(c,i){ return '<span style="display:inline-block;margin-right:10px"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+c+';margin-right:4px"></span>Ball '+(i+1)+'</span>'; }).join('')+'</div>';

      html += '<div class="pr-section-title">Length breakdown</div>';
      html += printOutcomeColumnsTable(LENGTH_ZONES.map(function(z){ return { label:z.label, balls: b.balls.filter(function(ball){return lengthZoneFor(ball.yPct).id===z.id;}) }; }));

      var lineLabels = b.hand==="LHB" ? LINE_LABELS_LHB : LINE_LABELS_RHB;
      html += '<div class="pr-section-title">Line breakdown ('+(b.hand==="LHB"?"left-hand":"right-hand")+" batter's view)</div>";
      html += printOutcomeColumnsTable(lineLabels.map(function(label,i){ return { label:label, balls: b.balls.filter(function(ball){return lineZoneIndex(ball.xPct)===i;}) }; }));

      html += '<div class="pr-section-title">Delivery type</div>';
      html += printOutcomeColumnsTable(DELIVERY_TYPES.map(function(dt){ return { label:dt, balls: b.balls.filter(function(ball){return ball.deliveryType===dt;}) }; }).filter(function(r){return r.balls.length>0;}));

      html += '<div class="pr-section-title">Ball condition</div>';
      html += printOutcomeColumnsTable(["New","Semi","Old"].map(function(bc){ return { label:bc, balls: b.balls.filter(function(ball){return ball.ballCondition===bc;}) }; }).filter(function(r){return r.balls.length>0;}));

      html += '<div class="pr-section-title">By ball in over</div>';
      html += printOutcomeColumnsTable([1,2,3,4,5,6].map(function(n){ return { label:"Ball "+n, balls: ballsWithOversForReport.filter(function(ball){return ball.ballNo===n;}) }; }).filter(function(r){return r.balls.length>0;}));

      var csP = consistencyStats(b.balls);
      if (csP){
        html += '<div class="pr-section-title">Consistency</div><div class="pr-stats"><div class="pr-stat"><b>'+csP.lengthPct+'%</b>Length %</div><div class="pr-stat"><b>'+csP.linePct+'%</b>Line %</div><div class="pr-stat"><b>'+csP.corridorPct+'%</b>Corridor %</div></div>';
      }

      html += '<div class="pr-section-title">Delivery log</div><table class="pr-table"><tr><th>Ball</th><th>Outcome</th><th>Length</th><th>Line</th><th>Shot</th></tr>';
      withOvers(b.balls).forEach(function(ball){
        var o = outcomeMap[ball.outcome], lz = lengthZoneFor(ball.yPct), ln = lineLabel(ball.xPct, b.hand);
        var outcomeTxt = o.label + (ball.outcome==="W" && ball.dismissal ? " ("+ball.dismissal+")" : "");
        var shotTxt = hasWagon(ball) ? ((b.hand==="LHB" ? ball.wagonX>=GW_CX : ball.wagonX<GW_CX) ? "Off side" : "Leg side") : "—";
        html += '<tr><td>'+ball.over+'.'+ball.ballNo+'</td><td>'+esc(outcomeTxt)+'</td><td>'+lz.label+'</td><td>'+ln+'</td><td>'+shotTxt+'</td></tr>';
      });
      html += '</table>';
      html += '</div>';
    });
    container.innerHTML = html;
    setTimeout(function(){ window.print(); }, 60);
  }

  if (!isPremiumUser()){
    showPremiumLockedMessage();
  } else {
    var urlParams = new URLSearchParams(window.location.search);
    var reportPlayer = urlParams.get("player");
    if (reportPlayer){
      renderAllTimePlayerReport(reportPlayer);
    } else {
      render();
    }
    migrateLegacyLocalStorage().catch(function(){});
    initPlayerAutocomplete(["input-bowler"]);
  }
})();
</script>
</body>
</html>
